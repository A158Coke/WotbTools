# K7B originally introduced this as the first production workload owned
# declaratively by Komodo. K7C keeps the Stack metadata for visibility, while the
# running TX2 frontend image is reconciled by the Frontend Replica workflow from
# TX1's exact immutable digest. Komodo must therefore never auto-deploy or
# auto-update this Stack behind that workflow's back. `auto_pull` remains enabled
# as part of the reviewed declarative Stack contract; by itself it does not enable
# polling, webhook deployment, or automatic workload updates.
#
# GitHub remains the source authority. Gitee is the domestic source transport for TX
# workers so the Komodo view can still resolve the reviewed stack definition.
[[stack]]
name = "wotbtools-frontend-shadow"
description = "K7C TX2 frontend replica; runtime image is owned by Frontend Replica workflow"
tags = []
template = false
deploy = false

[stack.config]
server = "tx2"
project_name = "wotbtools-frontend-shadow"
auto_pull = true
run_build = false
poll_for_updates = false
auto_update = false
auto_update_all_services = false
destroy_before_deploy = false
skip_secret_interp = false
git_provider = "gitee.com"
git_https = true
repo = "A158Coke/Wotbtools"
branch = "main"
commit = ""
clone_path = ""
reclone = false
webhook_enabled = false
webhook_force_deploy = false
files_on_host = false
run_directory = "deploy/tx"
file_paths = ["frontend-shadow.compose.yml"]
env_file_path = ".env"
send_alerts = true
registry_provider = ""
registry_account = ""
extra_args = []
build_extra_args = []
compose_cmd_wrapper = ""
compose_cmd_wrapper_include = []
ignore_services = []
file_contents = ""
environment = ""
links = []
