name: deploy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  health-probe:
    image: curlimages/curl:8.12.1
    entrypoint:
      - /bin/sh
      - -c
      - |
        for arg in "$$@"; do
          if [ "$$arg" = "http://10.20.0.2:3100/ready" ]; then
            exec curl --retry 30 --retry-delay 2 --retry-max-time 60 --retry-all-errors "$$@"
          fi
        done
        exec curl "$$@"
      - --
    restart: "no"
    logging: *default-logging


networks:
  default:
    name: wotb_tx_internal
    ipam:
      config:
        - subnet: 172.29.0.0/16
