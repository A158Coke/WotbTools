name: deploy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  health-probe:
    image: curlimages/curl:8.12.1
    entrypoint: ["curl"]
    restart: "no"
    volumes:
      # The runtime E2E check uploads a staged replay and reads MinIO objects
      # through this deployment-owned probe container. The directory is optional
      # runtime content created by deploy.sh / the Deploy workflow.
      - ${TX_RUNTIME_ROOT:?TX_RUNTIME_ROOT is required}/e2e:/e2e:ro
    logging: *default-logging


networks:
  default:
    name: wotb_tx_internal
    ipam:
      config:
        - subnet: 172.29.0.0/16
