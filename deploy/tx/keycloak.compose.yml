name: deploy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  keycloak:
    image: ${TX_IMAGE_REGISTRY_PREFIX:-ccr.ccs.tencentyun.com/wotbtools}/wotbtools-keycloak:latest
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is required}
      KC_DB: postgres
      # K6B logical endpoint: keep Docker-local by default, allow the reviewed
      # TX WireGuard PostgreSQL endpoint during later placement cutovers.
      KC_DB_URL: jdbc:postgresql://${TX_KEYCLOAK_DB_HOST:-keycloak-postgres}:${TX_KEYCLOAK_DB_PORT:-5432}/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:?KC_DB_USERNAME is required}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
      WG_APPLICATION_ID: ${WG_APPLICATION_ID:?WG_APPLICATION_ID is required}
    command: start --optimized --hostname=https://auth.wotbtools.com --hostname-strict=true --http-enabled=true --http-port=8080 --proxy-headers=xforwarded
    ports:
      # OpenTofu runs on TX and manages Keycloak through this loopback-only port.
      - "127.0.0.1:18080:8080"
      - "10.20.0.1:8080:8080"
    restart: unless-stopped
    logging: *default-logging


networks:
  default:
    name: wotb_tx_internal
    ipam:
      config:
        - subnet: 172.29.0.0/16
