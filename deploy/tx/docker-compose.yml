x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

# TX public edge only.  The existing deploy/docker-compose.prod.yml remains the
# Yecao runtime and must not be used to deploy this target.
services:
  health-probe:
    image: curlimages/curl:8.12.1
    entrypoint: ["curl"]
    restart: "no"
    logging: *default-logging

  keycloak-postgres:
    image: postgres:18-alpine
    environment:
      # OpenTofu, running locally on TX, owns the application database, role,
      # and grants after this PostgreSQL runtime is available.
      POSTGRES_USER: ${KC_POSTGRES_ADMIN_USER:?KC_POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${KC_POSTGRES_ADMIN_PASSWORD:?KC_POSTGRES_ADMIN_PASSWORD is required}
    ports:
      # TX-local OpenTofu administration only. Never publish PostgreSQL to a
      # public or WireGuard interface.
      - "127.0.0.1:15432:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  business-postgres:
    image: postgres:18-alpine
    environment:
      # Compose owns only the runtime and its bootstrap administrator. OpenTofu
      # on TX owns the wotb database, the control_api application role, and its
      # grants; Flyway owns every application table. The application credential
      # is deliberately absent here: this runtime never receives it, and the
      # `business-api` service is its only consumer.
      #
      # POSTGRES_DB pins the entrypoint's initial database to the maintenance
      # database. Without it the image would auto-create a database named after
      # POSTGRES_USER, which would collide with the OpenTofu-owned wotb database
      # whenever the bootstrap administrator is also named wotb.
      POSTGRES_DB: postgres
      POSTGRES_USER: ${TX_BUSINESS_POSTGRES_ADMIN_USER:?TX_BUSINESS_POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${TX_BUSINESS_POSTGRES_ADMIN_PASSWORD:?TX_BUSINESS_POSTGRES_ADMIN_PASSWORD is required}
    ports:
      # TX-local OpenTofu administration only. Business PostgreSQL is
      # authoritative state and must never be published publicly or over
      # WireGuard. Keep this independent from keycloak-postgres.
      - "127.0.0.1:25432:5432"
    volumes:
      - business_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      # The bootstrap administrator is strictly separate from application
      # identities. Fallbacks avoid guest/guest if Compose is rendered for an
      # unrelated TX deployment; deploy.sh requires real values before the
      # RabbitMQ service may start.
      RABBITMQ_DEFAULT_USER: ${TX_RABBITMQ_ADMIN_USER:-not-configured}
      RABBITMQ_DEFAULT_PASS: ${TX_RABBITMQ_ADMIN_PASSWORD:-not-configured}
    ports:
      # AMQP is reachable only across the existing TX<->Yecao WireGuard link.
      - "10.20.0.1:5672:5672"
      # Management UI/API stays TX-local and is never published publicly.
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m

  keycloak:
    image: ghcr.io/a158coke/wotbtools-keycloak:${TAG:?TAG is required}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:?KC_DB_USERNAME is required}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
      WG_APPLICATION_ID: ${WG_APPLICATION_ID:?WG_APPLICATION_ID is required}
    command: start --optimized --hostname=auth.wotbtools.com --hostname-strict=false --http-enabled=true --http-port=8080 --proxy-headers=xforwarded
    ports:
      # OpenTofu runs on TX and manages Keycloak through this loopback-only port.
      - "127.0.0.1:18080:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  wotb-frontend:
    image: ghcr.io/a158coke/wotbtools-frontend:${TAG:?TAG is required}
    environment:
      # nginx's official template entrypoint expands this value before nginx
      # starts. It is the TX-internal business runtime: public API traffic is
      # terminated inside wotb_tx_internal and never crosses WireGuard.
      BACKEND_UPSTREAM: ${TX_BACKEND_UPSTREAM:-http://business-api:8087}
      NGINX_ENVSUBST_FILTER: ^BACKEND_UPSTREAM$$
    volumes:
      - ./nginx/frontend.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TX_RUNTIME_ROOT:?TX_RUNTIME_ROOT is required}/config/sponsor-config.json:/usr/share/nginx/html/sponsor-config.json:ro
      - ${TX_RUNTIME_ROOT:?TX_RUNTIME_ROOT is required}/config/sponsor:/usr/share/nginx/html/sponsor-assets:ro
      - ${TX_RUNTIME_ROOT:?TX_RUNTIME_ROOT is required}/android-release:/usr/share/nginx/html/download/android:ro
    depends_on:
      - keycloak
      - business-api
      # nginx resolves the trusted Caddy peer by Docker service DNS at startup.
      - caddy
    restart: unless-stopped
    logging: *default-logging

  # TX business runtime: one Spring Boot process that serves every public
  # business endpoint and owns the distributed replay control plane (the
  # single-runtime decision). It publishes no port at all; only TX-internal
  # peers (frontend nginx, the Caddy readiness surface, the deployment
  # health-probe) may reach it on wotb_tx_internal.
  business-api:
    # Same immutable backend image the Yecao runtime used; the TX service name is
    # intentionally distinct so a release manifest can never confuse the retired
    # Yecao deployment with the authoritative TX one.
    image: ghcr.io/a158coke/wotbtools-backend:${TAG:?TAG is required}
    environment:
      # Flyway owns every application table in the OpenTofu-provisioned business
      # database; the application role is separate from the PostgreSQL bootstrap
      # administrator.
      POSTGRES_HOST: business-postgres
      POSTGRES_DB: ${TX_BUSINESS_DB_NAME:?TX_BUSINESS_DB_NAME is required}
      POSTGRES_USER: ${TX_BUSINESS_DB_USERNAME:?TX_BUSINESS_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${TX_BUSINESS_DB_PASSWORD:?TX_BUSINESS_DB_PASSWORD is required}
      # The public issuer must stay the public URL: Keycloak mints the `iss`
      # claim from its configured hostname, and the JWT decoder fetches the JWKS
      # from whichever deployment currently owns that public name.
      KEYCLOAK_ISSUER_URI: https://auth.wotbtools.com/realms/wotbtools
      # The Admin API is TX-internal on purpose: a public round trip would answer
      # from the Yecao Keycloak until the separately approved DNS cutover, and
      # this service must never administer that realm.
      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: wotbtools
      KEYCLOAK_ADMIN_CLIENT_ID: wotbtools-admin-api
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is required}
      # Distributed replay execution: never parse in this process, never keep a
      # local job authority, always dispatch through RabbitMQ, always read and
      # write datasets through MinIO. An unknown mode fails the context at start.
      WOTB_REPLAY_EXECUTION_MODE: distributed
      WOTB_REPLAY_PROCESSING_JOB_REPOSITORY: jdbc
      # MinIO stays on Yecao and is reached over the existing WireGuard link with
      # the dedicated control_api identity (temp/jobs/* only).
      YECAO_MINIO_ENDPOINT: ${YECAO_MINIO_ENDPOINT:-10.20.0.2:9000}
      YECAO_MINIO_BUCKET: ${YECAO_MINIO_BUCKET:-wotbtools-temp}
      YECAO_MINIO_CONTROL_API_ACCESS_KEY: ${YECAO_MINIO_CONTROL_API_ACCESS_KEY:?YECAO_MINIO_CONTROL_API_ACCESS_KEY is required}
      YECAO_MINIO_CONTROL_API_SECRET_KEY: ${YECAO_MINIO_CONTROL_API_SECRET_KEY:?YECAO_MINIO_CONTROL_API_SECRET_KEY is required}
      YECAO_MINIO_CONNECT_TIMEOUT_SECONDS: "${YECAO_MINIO_CONNECT_TIMEOUT_SECONDS:-10}"
      YECAO_MINIO_WRITE_TIMEOUT_SECONDS: "${YECAO_MINIO_WRITE_TIMEOUT_SECONDS:-60}"
      # RabbitMQ runs in this same Compose project. The topology itself stays
      # owned by infra/tofu/rabbitmq and is never declared by the application.
      TX_RABBITMQ_HOST: rabbitmq
      TX_RABBITMQ_PORT: "${TX_RABBITMQ_PORT:-5672}"
      TX_RABBITMQ_VHOST: "${TX_RABBITMQ_VHOST:-/wotbtools}"
      TX_RABBITMQ_CONTROL_API_USER: "${TX_RABBITMQ_CONTROL_API_USER:-control-api}"
      TX_RABBITMQ_CONTROL_API_PASSWORD: ${TX_RABBITMQ_CONTROL_API_PASSWORD:?TX_RABBITMQ_CONTROL_API_PASSWORD is required}
      TX_RABBITMQ_CONTROL_API_PREFETCH: "${TX_RABBITMQ_CONTROL_API_PREFETCH:-1}"
      TX_RABBITMQ_CONFIRM_TIMEOUT_SECONDS: "${TX_RABBITMQ_CONFIRM_TIMEOUT_SECONDS:-10}"
      # Control-plane-owned logical retry budget (the worker never nacks into a
      # broker retry loop).
      REPLAY_PARSER_MAX_ATTEMPTS: "${REPLAY_PARSER_MAX_ATTEMPTS:-3}"
      # AI Review runs on TX: the Yecao secret must be injected here too.
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY is required}
      AI_BASE_URL: "${AI_BASE_URL:-https://api.deepseek.com}"
      AI_MODEL: "${AI_MODEL:-deepseek-v4-flash}"
      AI_CONNECT_TIMEOUT_SEC: "${AI_CONNECT_TIMEOUT_SEC:-10}"
      AI_TIMEOUT_SEC: "${AI_TIMEOUT_SEC:-300}"
      AI_CALL_TIMEOUT_SEC: "${AI_CALL_TIMEOUT_SEC:-315}"
      AI_RETRY_MAX_ATTEMPTS: "${AI_RETRY_MAX_ATTEMPTS:-3}"
      AI_RETRY_INITIAL_BACKOFF_MS: "${AI_RETRY_INITIAL_BACKOFF_MS:-1000}"
      AI_RETRY_MAX_BACKOFF_MS: "${AI_RETRY_MAX_BACKOFF_MS:-8000}"
      AI_RETRY_BACKOFF_MULTIPLIER: "${AI_RETRY_BACKOFF_MULTIPLIER:-2.0}"
      AI_CONTEXT_WINDOW_TOKENS: "${AI_CONTEXT_WINDOW_TOKENS:-1000000}"
      AI_SINGLE_REPLAY_MAX_INPUT_TOKENS: "${AI_SINGLE_REPLAY_MAX_INPUT_TOKENS:-940000}"
      AI_MAX_OUTPUT_TOKENS: "${AI_MAX_OUTPUT_TOKENS:-32768}"
      AI_PROMPT_SAFETY_MARGIN_TOKENS: "${AI_PROMPT_SAFETY_MARGIN_TOKENS:-16384}"
      AI_THINKING_ENABLED: "${AI_THINKING_ENABLED:-true}"
      AI_THINKING_ENABLED_CALL2: "${AI_THINKING_ENABLED_CALL2:-false}"
      AI_REASONING_EFFORT: "${AI_REASONING_EFFORT:-max}"
      AI_REVIEW_WORKER_MAX_CONCURRENT: "${AI_REVIEW_WORKER_MAX_CONCURRENT:-4}"
      AI_REVIEW_WORKER_QUEUE_CAPACITY: "${AI_REVIEW_WORKER_QUEUE_CAPACITY:-4}"
      AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC: "${AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC:-1100}"
      REPLAY_COORDINATE_HALF_EXTENT: "${REPLAY_COORDINATE_HALF_EXTENT:-250}"
      REPLAY_COORDINATE_CLAMP_TOLERANCE: "${REPLAY_COORDINATE_CLAMP_TOLERANCE:-12.5}"
      REPLAY_PARSE_MAX_CONCURRENT: "${REPLAY_PARSE_MAX_CONCURRENT:-2}"
      REPLAY_PARSE_QUEUE_CAPACITY: "${REPLAY_PARSE_QUEUE_CAPACITY:-200}"
      REPLAY_ARTIFACT_MAX_CONCURRENT: "${REPLAY_ARTIFACT_MAX_CONCURRENT:-1}"
      # Export artifacts are single-container temporary data: the generating
      # process and /download live in this same container, so no object storage
      # is involved.
      REPLAY_EXPORT_JOB_DIR: "${REPLAY_EXPORT_JOB_DIR:-/tmp/wotb-export-jobs}"
      REPLAY_EXPORT_JOB_TTL_MINUTES: "${REPLAY_EXPORT_JOB_TTL_MINUTES:-30}"
      REPLAY_EXPORT_JOB_MAX_CONCURRENT: "${REPLAY_EXPORT_JOB_MAX_CONCURRENT:-2}"
      REPLAY_EXPORT_JOB_QUEUE_CAPACITY: "${REPLAY_EXPORT_JOB_QUEUE_CAPACITY:-4}"
      # The processing-job directory is only a distributed-mode scratch path;
      # PostgreSQL remains the job/source authority.
      REPLAY_PROCESSING_JOB_DIR: "${REPLAY_PROCESSING_JOB_DIR:-/tmp/wotb-replay-processing-jobs}"
      REPLAY_PROCESSING_JOB_TTL_MINUTES: "${REPLAY_PROCESSING_JOB_TTL_MINUTES:-30}"
      # HoF replay originals are permanent content-addressed files migrated onto
      # this TX volume by the operator. They are deliberately not part of the
      # MinIO dataset workspace.
      HOF_REPLAY_DIR: "${HOF_REPLAY_DIR:-/data/replays}"
      HOF_REPLAY_MIN_FREE_BYTES: "${HOF_REPLAY_MIN_FREE_BYTES:-536870912}"
      BOOST_AUTO_CONFIRM_HOURS: "${BOOST_AUTO_CONFIRM_HOURS:-72}"
      BOOST_AUTO_CONFIRM_SCAN_MS: "${BOOST_AUTO_CONFIRM_SCAN_MS:-300000}"
    volumes:
      - replay_data:/data/replays
    depends_on:
      - business-postgres
      - rabbitmq
      - keycloak
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2.10.2-alpine
    ports:
      # Stage I is loopback-only. An operator changes these runtime values only
      # after the separately approved DNS cutover; the repository never does it.
      - "${CADDY_HTTP_BIND:-127.0.0.1}:80:80"
      - "${CADDY_HTTPS_BIND:-127.0.0.1}:443:443"
      - "${CADDY_HTTPS_BIND:-127.0.0.1}:443:443/udp"
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./assets/auth/.well-known/assetlinks.json:/srv/.well-known/assetlinks.json:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - keycloak
    restart: unless-stopped
    logging: *default-logging

volumes:
  keycloak_postgres_data:
  business_postgres_data:
  rabbitmq_data:
  # HoF replay originals (permanent, content-addressed); migrated from Yecao by
  # the operator and deliberately separate from the MinIO dataset workspace.
  replay_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: wotb_tx_internal
    ipam:
      config:
        - subnet: 172.29.0.0/16
