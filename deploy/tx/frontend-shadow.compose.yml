name: wotbtools-frontend-shadow

# K7B shadow promoted to the TX2 production replica for K7C. The production
# Frontend Replica workflow resolves the immutable frontend artifact published by
# TX1 to TCR and supplies that exact digest to TX2; this file never pins a
# historical build in source control.
services:
  frontend:
    image: ${TX_FRONTEND_IMAGE_REF:?TX_FRONTEND_IMAGE_REF is required}
    ports:
      - "10.20.0.3:8081:80"
    extra_hosts:
      - "caddy:10.20.0.1"
    environment:
      BACKEND_UPSTREAM: http://10.20.0.1:8087
      AI_UPSTREAM: http://10.20.0.2:8089
      NGINX_ENVSUBST_FILTER: ^(BACKEND_UPSTREAM|AI_UPSTREAM)$$
    volumes:
      - ./nginx/frontend.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /opt/wotb-tx2/runtime-content/android-release:/usr/share/nginx/html/download/android:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
