name: deploy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "${CADDY_HTTP_BIND:-0.0.0.0}:80:80"
      - "${CADDY_HTTPS_BIND:-0.0.0.0}:443:443"
      - "${CADDY_HTTPS_BIND:-0.0.0.0}:443:443/udp"
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}
      CADDY_FRONTEND_UPSTREAM: ${CADDY_FRONTEND_UPSTREAM:-wotb-frontend:80}
      CADDY_FRONTEND_PEER: ${CADDY_FRONTEND_PEER:-wotb-frontend:80}
      CADDY_KEYCLOAK_UPSTREAM: ${CADDY_KEYCLOAK_UPSTREAM:-keycloak:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./assets/auth/.well-known/assetlinks.json:/srv/.well-known/assetlinks.json:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *default-logging


volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    name: wotb_tx_internal
    ipam:
      config:
        - subnet: 172.29.0.0/16
