name: deploy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  wotb-frontend:
    image: ${TX_FRONTEND_IMAGE_REF:?TX_FRONTEND_IMAGE_REF is required}
    environment:
      # nginx's official template entrypoint expands this value before nginx
      # starts. It is the TX-internal business runtime: the generic /api/ traffic is
      # terminated inside wotb_tx_internal and never crosses WireGuard.
      BACKEND_UPSTREAM: ${TX_BACKEND_UPSTREAM:-http://business-api:8087}
      # The standalone AI service is pre-deployed on Yecao and published only on its
      # WireGuard address, so /api/ai/ is proxied over WireGuard instead of to the TX
      # business runtime. Same fail-closed treatment as BACKEND_UPSTREAM.
      AI_UPSTREAM: ${TX_AI_UPSTREAM:-http://10.20.0.2:8089}
      NGINX_ENVSUBST_FILTER: ^(BACKEND_UPSTREAM|AI_UPSTREAM)$$
    volumes:
      - ./nginx/frontend.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TX_RUNTIME_ROOT:?TX_RUNTIME_ROOT is required}/config/sponsor-config.json:/usr/share/nginx/html/sponsor-config.json:ro
      - ${TX_RUNTIME_ROOT:?TX_RUNTIME_ROOT is required}/config/sponsor:/usr/share/nginx/html/sponsor-assets:ro
      - ${TX_RUNTIME_ROOT:?TX_RUNTIME_ROOT is required}/android-release:/usr/share/nginx/html/download/android:ro
    restart: unless-stopped
    logging: *default-logging

  # TX business runtime: one Spring Boot process that serves every public
  # business endpoint and owns the distributed replay control plane (the
  # single-runtime decision). It publishes no port at all; only TX-internal
  # peers (frontend nginx, the Caddy readiness surface, the deployment
  # health-probe) may reach it on wotb_tx_internal.

networks:
  default:
    name: wotb_tx_internal
    ipam:
      config:
        - subnet: 172.29.0.0/16
