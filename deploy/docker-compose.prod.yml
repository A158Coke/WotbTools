# Yecao runtime. After the production cutover this host owns exactly two responsibilities: the
# parser execution plane (`parser-worker`) and the shared observability stack. The business runtime
# (`business-api`), its PostgreSQL, Keycloak, its PostgreSQL, and the public frontend run on TX and
# are deployed by deploy/tx/deploy.sh; none of them is declared here any more.
# MinIO is a separate standalone deployment (deploy/docker-compose.minio.yml + deploy/minio-deploy.sh).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"
services:
  ai-service:
    image: ghcr.io/a158coke/ai-service:latest
    container_name: ai-service
    environment:
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      OTEL_SERVICE_NAME: ai-service
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-https://auth.wotbtools.com/realms/wotbtools}
      AI_REVIEW_WORKER_MAX_CONCURRENT: ${AI_REVIEW_WORKER_MAX_CONCURRENT:-2}
      AI_REVIEW_WORKER_QUEUE_CAPACITY: ${AI_REVIEW_WORKER_QUEUE_CAPACITY:-2}
      AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC: ${AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC:-1100}
    ports:
      - "10.20.0.2:8089:8080"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1536m
    cpus: 1.5
  # Yecao execution plane: consumes wotb.parser, reads/writes MinIO temp/jobs/*, publishes the
  # outcome. No public port, no database credentials, no mounted job directory — PostgreSQL stays
  # the job authority on TX and RabbitMQ remains the delivery path.
  parser-worker:
    image: ghcr.io/a158coke/wotbtools-parser-worker:latest
    environment:
      RABBITMQ_HOST: "${PARSER_WORKER_RABBITMQ_HOST:-10.20.0.1}"
      RABBITMQ_PORT: "${PARSER_WORKER_RABBITMQ_PORT:-5672}"
      RABBITMQ_VHOST: "${PARSER_WORKER_RABBITMQ_VHOST:-/wotbtools}"
      RABBITMQ_USERNAME: "${PARSER_WORKER_RABBITMQ_USERNAME:-parser-worker}"
      # Credentials default to empty so that a deploy which does not select this service keeps
      # working; deploy.sh fails closed on them whenever parser-worker is selected.
      RABBITMQ_PASSWORD: "${TX_RABBITMQ_PARSER_WORKER_PASSWORD:-}"
      # Endpoint ownership: this container shares the `wotb_internal` network with the MinIO
      # runtime, so it resolves MinIO through Docker service discovery. `10.20.0.2:9000` is the
      # TX control plane's endpoint (WireGuard → published port); reaching it from here would
      # require a container → host → published-port hairpin that does not exist.
      MINIO_ENDPOINT: "${PARSER_WORKER_MINIO_ENDPOINT:-minio:9000}"
      MINIO_BUCKET: "${PARSER_WORKER_MINIO_BUCKET:-wotbtools-temp}"
      MINIO_ACCESS_KEY: "${YECAO_MINIO_WORKER_ACCESS_KEY:-}"
      MINIO_SECRET_KEY: "${YECAO_MINIO_WORKER_SECRET_KEY:-}"
      # Concurrency is the number of consumers (parallel parses); prefetch is the per-consumer
      # unacked backlog. Retry policy is control-plane owned: the worker never nacks into a broker
      # retry loop, so there is no worker-side retry budget setting.
      PARSER_WORKER_CONCURRENCY: "${PARSER_WORKER_CONCURRENCY:-2}"
      PARSER_WORKER_PREFETCH: "${PARSER_WORKER_PREFETCH:-1}"
      PARSER_WORKER_CONFIRM_TIMEOUT_SEC: "${PARSER_WORKER_CONFIRM_TIMEOUT_SEC:-10}"
      PARSER_WORKER_SHUTDOWN_TIMEOUT_SEC: "${PARSER_WORKER_SHUTDOWN_TIMEOUT_SEC:-30}"
    restart: unless-stopped
    logging: *default-logging
  # Observability stack: Prometheus / Loki / Alloy / Grafana / node-exporter (docker-internal only)
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=168h
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./deploy/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      # WireGuard-only ingestion endpoint for the TX-side alloy-tx log shipper.
      # Never published publicly; same class as the MinIO 10.20.0.2:9000 bind.
      - "10.20.0.2:3100:3100"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
  alloy:
    image: grafana/alloy:v1.4.2
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - loki
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
  grafana:
    image: grafana/grafana:11.6.16
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-https://monitor.wotbtools.com}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wotbtools-production-overview.json
      OBSERVABILITY_ENVIRONMENT: "${OBSERVABILITY_ENVIRONMENT:-production}"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # WireGuard-only bind consumed by the TX Caddy gateway (monitor.wotbtools.com
      # reverse proxy) and by the host-local Grafana Tofu root. Never public.
      - "10.20.0.2:3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
volumes:
  prometheus_data:
  loki_data:
  grafana_data:
networks:
  default:
    name: wotb_internal
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
