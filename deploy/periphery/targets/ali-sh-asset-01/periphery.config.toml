# Komodo Periphery configuration for the Alibaba Shanghai asset origin
# (target: ali-sh-asset-01).
#
# Repository-owned: `.github/workflows/komodo-periphery.yml` copies this file
# verbatim to /etc/komodo/periphery.config.toml on every reconcile, so the host
# file is never hand-edited and never carries a bootstrap credential.
#
# This host is not on the WotBTools WireGuard mesh. It dials the existing public
# Komodo HTTPS endpoint outbound; no Periphery inbound port is exposed.

root_directory = "/etc/komodo"
core_addresses = ["https://komodo.wotbtools.com"]
connect_as = "ali-sh-asset-01"
server_enabled = false

# Keep the manually onboarded identity/trust files as the durable reviewed paths.
# The adoption bridge accepts the current file's implicit defaults only when they
# resolve to these exact paths under the reviewed root_directory.
private_key = "file:/etc/komodo/keys/periphery.key"
core_public_keys = ["file:/etc/komodo/keys/core.pub"]

disable_terminals = false
disable_container_terminals = false
