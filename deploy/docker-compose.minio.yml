# Dedicated Yecao MinIO runtime. This is intentionally separate from the
# application compose file: ordinary Yecao releases must not require MinIO
# credentials or start this service.
name: wotb-yecao-minio

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  minio:
    image: ghcr.io/a158coke/wotbtools-minio:${TAG:?TAG is required}
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${YECAO_MINIO_ROOT_USER:?YECAO_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${YECAO_MINIO_ROOT_PASSWORD:?YECAO_MINIO_ROOT_PASSWORD is required}
    ports:
      # The S3 API is reachable only on Yecao and from TX through WireGuard.
      - "10.20.0.2:9000:9000"
      # The console has no remote listener; it is for an operator on Yecao only.
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    networks:
      default:
        aliases:
          - minio

volumes:
  minio_data:
    name: wotb_yecao_minio_data

networks:
  default:
    external: true
    name: wotb_internal
