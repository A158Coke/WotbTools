# Prometheus 配置 — WotBTools 观测栈
# 抓取 Backend 的 /actuator/prometheus、Keycloak 的管理端口 /metrics，以及 node-exporter。
# 数据保留 7 天，磁盘上限 2GiB（见 docker-compose 的 storage.tsdb.* 参数）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: wotb-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - wotb-backend:8088
        labels:
          service: wotb-backend

  # Keycloak metrics use the Keycloak management interface, not Backend Actuator.
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets:
          - keycloak:9000
        labels:
          service: keycloak

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node-exporter
