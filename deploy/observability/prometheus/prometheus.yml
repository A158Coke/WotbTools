global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dev-metrics
    static_configs:
      - targets:
          - dev-metrics-exporter:9108
        labels:
          service: dev-metrics-exporter

  - job_name: wotb-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 10.20.0.1:8088
        labels:
          service: wotb-backend

  - job_name: ai-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ai-service:8080
        labels:
          service: ai-service

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node-exporter

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets:
          - loki:3100
        labels:
          service: loki

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000
        labels:
          service: grafana
