# Prometheus 配置 — WotBTools 观测栈
# 抓取业务服务、主机 exporter 以及观测栈自身；所有 target 都保持低基数 job 名称。
# 数据保留 7 天，磁盘上限 2GiB（见 docker-compose 的 storage.tsdb.* 参数）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The business runtime (business-api) runs on TX and publishes its management
  # port on the TX WireGuard address only; Prometheus dials it across the
  # existing TX<->Yecao WireGuard link. The job name stays `wotb-backend` so all
  # dashboard PromQL and the verification contract keep their stable identity.
  - job_name: wotb-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 10.20.0.1:8088
        labels:
          service: business-api

  # AI Review executes as an independent Yecao runtime. Scrape it over the
  # shared wotb_internal Docker network; do not route local telemetry through
  # the host WireGuard-published port.
  - job_name: ai-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ai-service:8080
        labels:
          service: ai-service

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node-exporter

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets:
          - loki:3100
        labels:
          service: loki

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000
        labels:
          service: grafana

  # Actual public endpoints, including trusted TLS; never infer worker health.
  - job_name: public-endpoints
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [https://wotbtools.com/]
        labels:
          service: web
      - targets: [https://wotbtools.com/api/health]
        labels:
          service: business-api
      - targets: [https://auth.wotbtools.com/realms/wotbtools/.well-known/openid-configuration]
        labels:
          service: keycloak
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
