# Prometheus 配置 — WotBTools 观测栈
# 抓取业务服务、主机 exporter 以及观测栈自身；所有 target 都保持低基数 job 名称。
# 数据保留 7 天，磁盘上限 2GiB（见 docker-compose 的 storage.tsdb.* 参数）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The business runtime (business-api) runs on TX and publishes its management
  # port on the TX WireGuard address only; Prometheus dials it across the
  # existing TX<->Yecao WireGuard link. The job name stays `wotb-backend` so all
  # dashboard PromQL and the verification contract keep their stable identity.
  - job_name: wotb-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 10.20.0.1:8088
        labels:
          service: wotb-backend

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node-exporter

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets:
          - loki:3100
        labels:
          service: loki

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000
        labels:
          service: grafana
