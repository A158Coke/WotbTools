limit_req_zone $binary_remote_addr zone=replay_api:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=replay_api_conn:10m;

server {
    listen 80;
    server_name monitor.wotbtools.com;

    # Grafana 反代：host 级 Caddy/nginx 将 HTTPS 流量转到本容器 80 端口，
    # 此处按 Host 分发到 grafana:3000（仅 Docker 内部网络，不直接暴露 3000）。
    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name auth.wotbtools.com;

    location / {
        proxy_pass http://keycloak:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name wotbtools.com www.wotbtools.com;
    client_max_body_size 200m;
    charset utf-8;
    # 真实客户端 IP：host 级 Caddy 经 127.0.0.1:8088（Docker published port）访问本容器，
    # 容器观察到的来源是 Compose 固定网络的 gateway 172.28.0.1（见 docker-compose.prod.yml
    # networks.default.ipam）。仅信任该确定的 Docker host 来源的 X-Forwarded-For；
    # 其它来源（含同网段容器）的 XFF 不被采纳，无法伪造限流桶。
    set_real_ip_from 172.28.0.1;
    real_ip_header X-Forwarded-For;

    root /usr/share/nginx/html;
    index index.html;

    location = /sponsor-config.json {
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location ^~ /sponsor-assets/ {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location = /extended {
        try_files /extended.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI Review 长耗时接口：全链路超时对齐——后端 AI_CALL_TIMEOUT_SEC=315s（connect+read+重试+backoff+解析）
    # 加回放解析余量后，代理上限 420s 留足余量避免 504；前端 400s 安全超时在代理之前给出干净 AI_TIMEOUT
    # （其他 /api/ 保持 120s）。
    # SSE 流式：关闭响应缓冲（proxy_buffering off + X-Accel-Buffering）让阶段事件/token 实时到达；
    # HTTP/1.1 + 清空 Connection 头是 chunked 流式反代的必需项。本 location 同时覆盖
    # /api/replay/analyze/cancel（即时 204，不受 buffering 影响）。
    # ^~ 前缀匹配优先于普通前缀 location，避免被下方 location /api/ 覆盖。
    location ^~ /api/replay/analyze {
        proxy_pass http://wotb-backend:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header X-Accel-Buffering no always;
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
    }

    # ?????????/api/preview|export|rating????429????/503?????
    # burst=10 ???????????????
    location = /api/preview {
        limit_req zone=replay_api burst=10 nodelay;
        limit_conn replay_api_conn 5;
        limit_req_status 429;
        limit_conn_status 503;
        proxy_pass http://wotb-backend:8087/api/preview;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /api/export {
        limit_req zone=replay_api burst=10 nodelay;
        limit_conn replay_api_conn 5;
        limit_req_status 429;
        limit_conn_status 503;
        proxy_pass http://wotb-backend:8087/api/export;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /api/rating {
        limit_req zone=replay_api burst=10 nodelay;
        limit_conn replay_api_conn 5;
        limit_req_status 429;
        limit_conn_status 503;
        proxy_pass http://wotb-backend:8087/api/rating;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://wotb-backend:8087/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
