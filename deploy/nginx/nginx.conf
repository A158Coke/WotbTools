server {
    listen 80;
    server_name monitor.wotbtools.com;

    # Grafana 反代：host 级 Caddy/nginx 将 HTTPS 流量转到本容器 80 端口，
    # 此处按 Host 分发到 grafana:3000（仅 Docker 内部网络，不直接暴露 3000）。
    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name auth.wotbtools.com;

    location / {
        proxy_pass http://keycloak:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name wotbtools.com www.wotbtools.com;
    client_max_body_size 200m;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    location = /sponsor-config.json {
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location ^~ /sponsor-assets/ {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location = /extended {
        try_files /extended.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI Review 长耗时接口：全链路超时对齐——后端 AI_CALL_TIMEOUT_SEC=315s（connect+read+重试+backoff+解析）
    # 加回放解析余量后，代理上限 420s 留足余量避免 504；前端 400s 安全超时在代理之前给出干净 AI_TIMEOUT
    # （其他 /api/ 保持 120s）。
    # ^~ 前缀匹配优先于普通前缀 location，避免被下方 location /api/ 覆盖。
    location ^~ /api/replay/analyze {
        proxy_pass http://wotb-backend:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
    }

    location /api/ {
        proxy_pass http://wotb-backend:8087/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
