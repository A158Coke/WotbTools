# 按真实客户端 IP 限流：单 IP 1r/s + burst 10，超频 429 / 超并发 503。
# 仅 nginx 层生效；后端 100 文件 / 20MiB / 200MiB 上传额度契约不变。
limit_req_zone $binary_remote_addr zone=replay_api:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=replay_api_conn:10m;

server {
    listen 80;
    server_name monitor.wotbtools.com;

    # Grafana 反代：host 级 Caddy/nginx 将 HTTPS 流量转到本容器 80 端口，
    # 此处按 Host 分发到 grafana:3000（仅 Docker 内部网络，不直接暴露 3000）。
    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name auth.wotbtools.com;

    location / {
        proxy_pass http://keycloak:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name wotbtools.com www.wotbtools.com;
    client_max_body_size 200m;
    charset utf-8;
    # 真实客户端 IP：host 级 Caddy 经 127.0.0.1:8088（Docker published port）访问本容器，
    # 容器观察到的来源是 Compose 固定网络的 gateway 172.28.0.1（见 docker-compose.prod.yml
    # networks.default.ipam）。仅信任该确定的 Docker host 来源的 X-Forwarded-For；
    # 其它来源（含同网段容器）的 XFF 不被采纳，无法伪造限流桶。
    set_real_ip_from 172.28.0.1;
    real_ip_header X-Forwarded-For;

    root /usr/share/nginx/html;
    index index.html;

    location = /sponsor-config.json {
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location ^~ /sponsor-assets/ {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # SPA 缓存策略：index.html 永不缓存（每次部署后新 bundle hash 立即生效，
    # 避免用户浏览器继续加载旧 index.html 引用的旧 hash JS）；
    # /assets/ 下 Vite 产物文件名带内容 hash，可 immutable 长缓存。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Android 客户端 release metadata（App 启动必读 + 下载页读取；no-store 保证总能拿到最新）。
    location = /download/android/version.json {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # Android APK 静态托管：不能 fallback 到 SPA index.html，否则 App 会下载到 HTML。
    # 文件名带版本号，可短缓存；版本号变更即新文件名，天然缓存失效（规格 §92）。
    location /download/android/ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI Review 长耗时接口：全链路超时对齐——后端整体 deadline=1100s
    # （团队 Call#1+Call#2+Autopsy 各 ≤315s + 余量）；代理上限 1120s 留足余量避免 504；
    # 前端 1100s 安全超时在代理之前给出干净 AI_TIMEOUT
    # （其他 /api/ 保持 120s）。
    # SSE 流式：关闭响应缓冲（proxy_buffering off + X-Accel-Buffering）让阶段事件/token 实时到达；
    # HTTP/1.1 + 清空 Connection 头是 chunked 流式反代的必需项。本 location 同时覆盖
    # /api/replay/analyze/cancel（即时 204，不受 buffering 影响）。
    # ^~ 前缀匹配优先于普通前缀 location，避免被下方 location /api/ 覆盖。
    location ^~ /api/replay/analyze {
        proxy_pass http://wotb-backend:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header X-Accel-Buffering no always;
        proxy_read_timeout 1120s;
        proxy_send_timeout 1120s;
    }

    # 三个公开回放接口（/api/preview|export|rating）应用限流：
    # 超频 429 / 超并发 503；burst=10 放宽瞬时突发，避免误伤正常请求。
    location = /api/preview {
        limit_req zone=replay_api burst=10 nodelay;
        limit_conn replay_api_conn 5;
        limit_req_status 429;
        limit_conn_status 503;
        proxy_pass http://wotb-backend:8087/api/preview;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /api/export {
        limit_req zone=replay_api burst=10 nodelay;
        limit_conn replay_api_conn 5;
        limit_req_status 429;
        limit_conn_status 503;
        proxy_pass http://wotb-backend:8087/api/export;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location = /api/performance {
        limit_req zone=replay_api burst=10 nodelay;
        limit_conn replay_api_conn 5;
        limit_req_status 429;
        limit_conn_status 503;
        proxy_pass http://wotb-backend:8087/api/performance;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # 百场 WG 自动认证会调用外部 Wargaming API；沿用回放 API 的单 IP 限流，
    # 防止脚本重复提交消耗官方 application_id 配额。
    location = /api/hof/hundred/submissions/wargaming {
        limit_req zone=replay_api burst=10 nodelay;
        limit_conn replay_api_conn 5;
        limit_req_status 429;
        limit_conn_status 503;
        proxy_pass http://wotb-backend:8087/api/hof/hundred/submissions/wargaming;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://wotb-backend:8087/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
