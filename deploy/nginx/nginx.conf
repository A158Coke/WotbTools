server {
    listen 80;
    server_name monitor.wotbtools.com;

    # Grafana 反代：host 级 Caddy/nginx 将 HTTPS 流量转到本容器 80 端口。
    # 使用 Docker embedded DNS 的运行时解析：Grafana 暂时不存在时，nginx
    # 仍可启动，只有 monitor 请求返回 502，不会拖垮主站 nginx。
    resolver 127.0.0.11 valid=1s ipv6=off;
    set $grafana_upstream grafana:3000;
    location / {
        proxy_pass http://$grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name auth.wotbtools.com;

    # Android Verified App Link domain association（仅 QQ broker callback 的 return bridge）。
    # 必须由本 nginx 直接返回 application/json，绝不代理给 Keycloak。
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://keycloak:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name wotbtools.com www.wotbtools.com;
    client_max_body_size 200m;
    charset utf-8;
    # 真实客户端 IP：host 级 Caddy 经 127.0.0.1:8088（Docker published port）访问本容器，
    # 容器观察到的来源是 Compose 固定网络的 gateway 172.28.0.1（见 docker-compose.prod.yml
    # networks.default.ipam）。仅信任该确定的 Docker host 来源的 X-Forwarded-For；
    # 其它来源（含同网段容器）的 XFF 不被采纳，无法伪造限流桶。
    set_real_ip_from 172.28.0.1;
    real_ip_header X-Forwarded-For;

    root /usr/share/nginx/html;
    index index.html;

    location = /sponsor-config.json {
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location ^~ /sponsor-assets/ {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # SPA 缓存策略：index.html 永不缓存（每次部署后新 bundle hash 立即生效，
    # 避免用户浏览器继续加载旧 index.html 引用的旧 hash JS）；
    # /assets/ 下 Vite 产物文件名带内容 hash，可 immutable 长缓存。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Agent WASM 产物：commit-addressed 目录（`/wasm/<40 位 upstream commit>/`）。
    # 目录名就是内容身份——同一个 frontend build 只引用自己 pin 的 commit，新 Agent
    # → 新 URL，旧 URL 永不覆盖，因此长期 immutable 缓存是**正确**行为（刷新即拿到
    # 新 build 对应的产物，不需要 Ctrl+F5 / 清站点数据）。只锁 40 位 hex 目录，不给
    # `/wasm/` 根目录统一 immutable（根目录不得再放 stable 产物）。
    # 正则含 `{}`：必须加引号，否则 nginx 在 `{` 处提前结束 location 头
    #（`nginx: [emerg] unknown directive "40}/"`）。
    location ~ "^/wasm/[0-9a-f]{40}/" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Android 下载页与静态产物必须共存，不得互相抢占：
    #   - /download/android 与 /download/android/ 都进入 SPA index.html（渲染 AndroidDownloadPage）。
    #   - version.json 与 *.apk 仍是真实静态文件，绝不 fallback 到 index.html。
    #     APK 文件名带版本号可短缓存；版本号变更即新文件名，天然缓存失效（规格 §92）。
    # 注意：exact location（location =）优先于前缀 location，因此下方的
    #   location /download/android/ （静态 APK/未知资源）不会截获 SPA 页面路由，
    #   而 /download/android、/download/android/、/download/android/version.json 由各自 exact 指向正确目标。
    location = /download/android {
        try_files /index.html =404;
    }

    location = /download/android/ {
        try_files /index.html =404;
    }

    # Android 客户端 release metadata（App 启动必读 + 下载页读取；no-store 保证总能拿到最新）。
    location = /download/android/version.json {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    # Android APK 静态托管：不存在时返回真正 404，绝不能 fallback 到 SPA index.html，
    # 否则 App 会下载到 HTML。文件名带版本号，可短缓存。
    location /download/android/ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://wotb-backend:8087/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
