<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>wasm browser smoke</title>
  </head>
  <body>
    <pre id="log"></pre>
    <script type="module">
      // Browser/WASM gate: instantiate the engine in Chromium (same engine family as the Android
      // WebView), parse a real replay, and prove a module Web Worker can load the same module.
      const failures = []
      const notes = []

      const publish = () => {
        const json = JSON.stringify({ failures, notes })
        const bytes = new TextEncoder().encode(json)
        let binary = ''
        for (const byte of bytes) binary += String.fromCharCode(byte)
        document.body.dataset.result = btoa(binary)
        document.getElementById('log').textContent = json
      }

      try {
        const engine = await import('../crates/replay-wasm/pkg-web/replay_wasm.js')
        await engine.default()

        const response = await fetch('../../common/fixtures/replays/random-battle-example.wotbreplay')
        if (!response.ok) throw new Error(`fixture fetch failed: ${response.status}`)
        const bytes = new Uint8Array(await response.arrayBuffer())

        const result = JSON.parse(engine.parse_result(bytes))
        if (typeof result.arena_id !== 'string') failures.push('arena_id must be a string')
        if (result.participants.length !== 14) failures.push(`participants=${result.participants.length}`)
        if (![1, 2].includes(result.winner_team)) failures.push(`winner_team=${result.winner_team}`)
        for (const participant of result.participants) {
          if (typeof participant.game_account_id !== 'string') failures.push('game_account_id not string')
        }
        notes.push(`main: arena=${result.arena_id} players=${result.participants.length}`)

        const worker = new Worker('./wasm-worker.mjs', { type: 'module' })
        const workerResult = await new Promise((resolve) => {
          const timer = setTimeout(() => resolve({ ok: false, error: 'worker timeout' }), 20000)
          worker.onmessage = (event) => {
            clearTimeout(timer)
            resolve(event.data)
          }
          worker.onerror = (event) => {
            clearTimeout(timer)
            resolve({ ok: false, error: event.message || 'worker error' })
          }
          worker.postMessage(bytes, [bytes.buffer])
        })
        worker.terminate()
        if (!workerResult.ok) failures.push(`worker: ${workerResult.error}`)
        else notes.push(`worker: arena=${workerResult.arenaId} players=${workerResult.participants}`)
      } catch (error) {
        failures.push(String((error && error.stack) || error))
      }

      publish()
    </script>
  </body>
</html>
