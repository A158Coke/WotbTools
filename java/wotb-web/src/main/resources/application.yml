server:
  port: 8087

spring:
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: ${WOTB_VIRTUAL_THREADS_ENABLED:true}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  web:
    resources:
      static-locations: classpath:/static/
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:wotb}
    username: ${POSTGRES_USER:wotb}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.wotbtools.com/realms/wotbtools}

# observability: dedicated management port (8088), Docker-network only.
management:
  server:
    port: 8088
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: wotb-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests:
          - 10ms
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 1s
          - 2500ms
          - 5s
          - 10s
    web:
      server:
        request:
          ignore-trailing-slash: true

logging:
  structured:
    format:
      console: logstash

keycloak:
  admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:https://auth.wotbtools.com}
    realm: ${KEYCLOAK_ADMIN_REALM:wotbtools}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:wotbtools-admin-api}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

wotb:
  replay:
    # 回放证据上传（名人堂 / 百场 / 三环）的全局并发许可（ReplayCapacityLimiter）；服务器没有 parser
    max-concurrent-jobs: ${REPLAY_MAX_CONCURRENT_JOBS:2}
  hof:
    # 名人堂回放文件内容寻址存储目录（生产挂 volume /data/replays）
    replay-dir: ${HOF_REPLAY_DIR:data/replays}
    # 磁盘保留阈值（字节，含本次写入大小）；低于则拒绝存储 REPLAY_STORAGE_FULL(507)
    replay-min-free-bytes: ${HOF_REPLAY_MIN_FREE_BYTES:536870912}
