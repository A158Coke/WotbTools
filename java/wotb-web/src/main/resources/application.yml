server:
  port: 8087

spring:
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: ${WOTB_VIRTUAL_THREADS_ENABLED:true}
  autoconfigure:
    exclude:
      # Spring AI OpenAI auto-configurations create SDK model beans even without
      # an API key and would fail startup. AiGatewayConfig builds the single
      # SpringAiChatGateway / OpenAiChatModel explicitly instead.
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  web:
    resources:
      static-locations: classpath:/static/
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:wotb}
    username: ${POSTGRES_USER:wotb}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.wotbtools.com/realms/wotbtools}

# observability: dedicated management port (8088), Docker-network only.
management:
  server:
    port: 8088
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: wotb-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests:
          - 10ms
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 1s
          - 2500ms
          - 5s
          - 10s
    web:
      server:
        request:
          ignore-trailing-slash: true

logging:
  level:
    org.apache.poi: WARN
    # Spring AI logs the full prompt at WARN when the provider returns empty
    # choices; suppress prompt/completion output while keeping the rest of the
    # application logs at their default levels.
    org.springframework.ai.openai.OpenAiChatModel: ERROR
  structured:
    format:
      console: logstash

keycloak:
  admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:https://auth.wotbtools.com}
    realm: ${KEYCLOAK_ADMIN_REALM:wotbtools}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:wotbtools-admin-api}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

wotb:
  ai:
    # empty default: app still starts without a key; /api/replay/analyze returns AI_NOT_CONFIGURED
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    model: ${AI_MODEL:deepseek-v4-flash}
    connect-timeout-sec: ${AI_CONNECT_TIMEOUT_SEC:10}
    timeout-sec: ${AI_TIMEOUT_SEC:300}
    # total budget for one AiChatGateway.chat() lifecycle (attempts + retries + backoff)
    call-timeout-sec: ${AI_CALL_TIMEOUT_SEC:315}
    retry-max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
    retry-initial-backoff-millis: ${AI_RETRY_INITIAL_BACKOFF_MS:1000}
    retry-max-backoff-millis: ${AI_RETRY_MAX_BACKOFF_MS:8000}
    retry-backoff-multiplier: ${AI_RETRY_BACKOFF_MULTIPLIER:2.0}
    context-window-tokens: ${AI_CONTEXT_WINDOW_TOKENS:1000000}
    single-replay-max-input-tokens: ${AI_SINGLE_REPLAY_MAX_INPUT_TOKENS:940000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:32768}
    # Team Call #2 专用输出上限（effective = min(global, team-review)）；为选择性完整复盘保留展开空间
    team-review-max-output-tokens: ${AI_TEAM_REVIEW_MAX_OUTPUT_TOKENS:8192}
    prompt-safety-margin-tokens: ${AI_PROMPT_SAFETY_MARGIN_TOKENS:16384}
    # Call #2 自由文本复盘默认关闭 thinking（DeepSeek 推理模式会让 content 末尾一次性到达，
    # 破坏 SSE 流式体验）；Call #1/Autopsy 结构化调用恒为 false。开启时用独立开关。
    call2-thinking-enabled: ${AI_THINKING_ENABLED_CALL2:false}
    # legacy：全局 thinking 开关，Call #2 已改由 call2-thinking-enabled 控制（保留兼容部署变量）
    thinking-enabled: ${AI_THINKING_ENABLED:true}
    reasoning-effort: ${AI_REASONING_EFFORT:max}
    review-worker:
      # AI Review SSE worker pool: fixed workers + bounded queue.
      # V1 (2C4G VPS): 4 concurrent + 4 queued = 8 max active/pending;
      # the 9th request is rejected with 503 AI_REVIEW_BUSY.
      max-concurrent: ${AI_REVIEW_WORKER_MAX_CONCURRENT:4}
      queue-capacity: ${AI_REVIEW_WORKER_QUEUE_CAPACITY:4}
      # Each admitted blocking call gets its own VT; independent permits keep
      # active work and active+parked admission bounded.
      virtual-threads: ${AI_REVIEW_WORKER_VIRTUAL_THREADS:true}
      # Request overall deadline (queue wait included): 1100s covers the team
      # flow (Call #1 + Call #2 + Autopsy, each <=315s) plus margin; aligns with
      # the frontend timeout; nginx keeps a 1120s proxy margin.
      overall-deadline-sec: ${AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC:1100}
  replay:
    max-concurrent-jobs: ${REPLAY_MAX_CONCURRENT_JOBS:2}
    # 回放执行模式（单一正向枚举，见 docs/DEVELOPER_GUIDE.md「Replay 执行模式」）：
    #   local       = 本进程内解析（缺省；既有部署行为逐字不变）
    #   distributed = TX 控制面：输入/产物走 MinIO，派发走 RabbitMQ，job/source 权威状态走 PostgreSQL
    # 未知值（含显式空值）启动即失败（ReplayProcessingConfig 构造器 fail-fast），绝不静默降级为 local。
    execution:
      mode: ${WOTB_REPLAY_EXECUTION_MODE:local}
    # distributed 专用：MinIO 工作区（桶内 temp/jobs/<jobId>/{input,artifacts,result}/，
    # 前缀生命周期与身份策略由 infra/tofu/minio 拥有）。
    object-storage:
      endpoint: ${YECAO_MINIO_ENDPOINT:10.20.0.2:9000}
      bucket: ${YECAO_MINIO_BUCKET:wotbtools-temp}
      access-key: ${YECAO_MINIO_CONTROL_API_ACCESS_KEY:}
      secret-key: ${YECAO_MINIO_CONTROL_API_SECRET_KEY:}
      connect-timeout-seconds: ${YECAO_MINIO_CONNECT_TIMEOUT_SECONDS:10}
      write-timeout-seconds: ${YECAO_MINIO_WRITE_TIMEOUT_SECONDS:60}
    # distributed 专用：RabbitMQ 连接与确认超时（exchange/queue/binding 由 infra/tofu/rabbitmq 拥有，
    # 应用只发布/消费，绝不声明拓扑）。
    broker:
      host: ${TX_RABBITMQ_HOST:}
      port: ${TX_RABBITMQ_PORT:5672}
      vhost: ${TX_RABBITMQ_VHOST:/}
      username: ${TX_RABBITMQ_CONTROL_API_USER:}
      password: ${TX_RABBITMQ_CONTROL_API_PASSWORD:}
      # 结果消费的 prefetch 与消费者数（控制面固定单消费者：权威投影是全量替换）
      prefetch: ${TX_RABBITMQ_CONTROL_API_PREFETCH:1}
      # parser.request 等待 broker confirm 的超时；超时即 create 失败（绝不留下无绑定的 job）
      confirm-timeout-seconds: ${TX_RABBITMQ_CONFIRM_TIMEOUT_SECONDS:10}
    # distributed 专用：控制面所有的逻辑重试预算（含首次）。
    # worker 基础设施失败只报告 parser.failed(retryable=true)（从不 nack、从不走 broker 重试队列），
    # 由控制面按 PG 权威状态决定：attempt < max-attempts ⇒ 立即重派 attempt+1；用尽 ⇒ 终态 FAILED。
    retry:
      max-attempts: ${REPLAY_PARSER_MAX_ATTEMPTS:3}
    parse:
      # Replay Full Processing 唯一 CPU 预算（2C4G VPS 默认 2；禁止超过核心数）
      max-concurrent: ${REPLAY_PARSE_MAX_CONCURRENT:2}
      # 全部 job 的 pending source 总数上限；满载 503 PROCESSING_QUEUE_FULL
      queue-capacity: ${REPLAY_PARSE_QUEUE_CAPACITY:200}
    artifact:
      # Excel/ZIP artifact 构建并发（与 parse 分离，2C 默认 1）
      max-concurrent: ${REPLAY_ARTIFACT_MAX_CONCURRENT:1}
    export-job:
      # 导出 Job 临时目录（上传输入 + 最终 artifact；TTL 自动清理，见 ExportJobStore）
      dir: ${REPLAY_EXPORT_JOB_DIR:${java.io.tmpdir}/wotb-export-jobs}
      ttl-minutes: ${REPLAY_EXPORT_JOB_TTL_MINUTES:30}
      # worker 线程数（与全局 replay 容量同值，job 不绕过 max-concurrent-jobs）
      max-concurrent: ${REPLAY_EXPORT_JOB_MAX_CONCURRENT:2}
      # 有界等待队列；满载 503 EXPORT_QUEUE_FULL（不建无限队列）
      queue-capacity: ${REPLAY_EXPORT_JOB_QUEUE_CAPACITY:4}
    processing-job:
      # Replay Processing Job 临时输入目录（上传持久化；result 为内存态 dataset，TTL 自动清理）
      dir: ${REPLAY_PROCESSING_JOB_DIR:${java.io.tmpdir}/wotb-replay-processing-jobs}
      ttl-minutes: ${REPLAY_PROCESSING_JOB_TTL_MINUTES:30}
      # job/source/operationId 权威状态后端：
      #   memory = 单实例内存注册表（默认；Yecao 过渡期与本地开发，行为与引入权威状态前一致）
      #   jdbc   = PostgreSQL 权威投影（重启后状态仍可读；TX 运行时使用）
      # 缺省保持 memory，使本 PR 不改变任何既有部署的运行时行为。
      repository: ${WOTB_REPLAY_PROCESSING_JOB_REPOSITORY:memory}
      # 说明：jdbc 模式要求业务库 schema 至少到 V23（replay_processing_* 三表），
      # Flyway 启动迁移即满足；内存模式忽略这三表。
      # 与 export-job 共用同一有界 worker 池（max-concurrent/queue-capacity 见上；不复制两套 executor）
    coordinate:
      half-extent: ${REPLAY_COORDINATE_HALF_EXTENT:250}
      clamp-tolerance: ${REPLAY_COORDINATE_CLAMP_TOLERANCE:12.5}
  hof:
    # 名人堂回放文件内容寻址存储目录（生产挂 volume /data/replays）
    replay-dir: ${HOF_REPLAY_DIR:data/replays}
    # 磁盘保留阈值（字节，含本次写入大小）；低于则拒绝存储 REPLAY_STORAGE_FULL(507)
    replay-min-free-bytes: ${HOF_REPLAY_MIN_FREE_BYTES:536870912}
  boost:
    auto-confirm-hours: ${BOOST_AUTO_CONFIRM_HOURS:72}
    auto-confirm-scan-ms: ${BOOST_AUTO_CONFIRM_SCAN_MS:300000}
