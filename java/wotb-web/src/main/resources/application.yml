server:
  port: 8087

battle-data:
  enabled: ${BATTLE_DATA_ENABLED:true}
  per-source-per-minute: ${BATTLE_DATA_PER_SOURCE_PER_MINUTE:60}
  per-instance-per-minute: ${BATTLE_DATA_PER_INSTANCE_PER_MINUTE:3000}
  max-source-keys: ${BATTLE_DATA_MAX_SOURCE_KEYS:4096}
  trusted-proxies: ${BATTLE_DATA_TRUSTED_PROXIES:${WOTB_OBSERVABILITY_TRUSTED_PROXIES:}}

spring:
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: ${WOTB_VIRTUAL_THREADS_ENABLED:true}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  web:
    resources:
      static-locations: classpath:/static/
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:wotb}
    username: ${POSTGRES_USER:wotb}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.wotbtools.com/realms/wotbtools}

management:
  server:
    port: 8088
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  observations:
    annotations:
      enabled: true
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: wotb-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
        wotb.creator.avatar.upload: true
      slo:
        http.server.requests:
          - 10ms
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 1s
          - 2500ms
          - 5s
          - 10s
    web:
      server:
        request:
          ignore-trailing-slash: true

logging:
  level:
    com.qcloud.cos: "OFF"
    com.aliyun.sdk.service.oss2: "OFF"
    org.apache.http.wire: "OFF"
    org.apache.http.headers: "OFF"
  structured:
    format:
      console: logstash

keycloak:
  admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:https://auth.wotbtools.com}
    realm: ${KEYCLOAK_ADMIN_REALM:wotbtools}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:wotbtools-admin-api}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

wotb:
  images:
    provider: ${BUSINESS_IMAGE_PROVIDER:cos}
    cover-prefix: ${wotb.broadcast.cos.prefix:league-broadcasts/covers/}
    avatar-prefix: ${wotb.creator.cos.prefix:creator-avatars/}
    oss:
      bucket: ${BUSINESS_OSS_BUCKET:}
      region: ${BUSINESS_OSS_REGION:}
      key-id: ${BUSINESS_OSS_ACCESS_KEY_ID:}
      key-secret: ${BUSINESS_OSS_ACCESS_KEY_SECRET:}
      security-token: ${BUSINESS_OSS_SECURITY_TOKEN:}
  creator:
    cos:
      prefix: ${CREATOR_AVATAR_COS_PREFIX:creator-avatars/}
  broadcast:
    cos:
      bucket: ${BROADCAST_COS_BUCKET:}
      region: ${BROADCAST_COS_REGION:}
      secret-id: ${BROADCAST_COS_SECRET_ID:}
      secret-key: ${BROADCAST_COS_SECRET_KEY:}
      prefix: ${BROADCAST_COS_PREFIX:league-broadcasts/covers/}
  tournament:
    recognition-signing-key: ${TOURNAMENT_RECOGNITION_SIGNING_KEY:}
    evidence-dir: ${HOF_REPLAY_DIR:data/replays}/tournament
    min-free-bytes: ${HOF_REPLAY_MIN_FREE_BYTES:536870912}
  replay:
    max-concurrent-jobs: ${REPLAY_MAX_CONCURRENT_JOBS:2}
  hof:
    replay-dir: ${HOF_REPLAY_DIR:data/replays}
    replay-min-free-bytes: ${HOF_REPLAY_MIN_FREE_BYTES:536870912}
