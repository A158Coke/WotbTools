business_api:
  - '.github/workflows/business-api.yml'
  - '.dockerignore'
  - 'docker/Dockerfile.business-api'
  - 'common/tankopedia-tier*.json'
  - 'common/map_names.json'
  - 'common/tank_tactical_profiles.json'
  - 'common/map-semantics/**'
  # 测试期实读的共享夹具/数据（issue #828 逐项核实）：wotb-web CsvDecoderTest 与
  # TournamentCsvConverterTest 读 tabular、tournament/csv；WebApiTest 无夹具时跳过的
  # 真实回放路径；wotb-core/wotb-web 的 replay-facts 冻结投影；wotb-core 的名称
  # 别名与乘员技能数据。改这些输入必须重跑 java 测试。
  - 'common/fixtures/replays/**'
  - 'common/fixtures/replay-facts/**'
  - 'common/fixtures/tabular/**'
  - 'common/fixtures/tournament/**'
  - 'common/tank-name-aliases.json'
  - 'java/pom.xml'
  - 'java/**/pom.xml'
  - 'java/settings-docker.xml'
  - 'java/settings-ci.xml'
  - 'java/wotb-core/**'
  - 'java/wotb-ai/**'
  - 'java/wotb-web/**'
  - 'contracts/http/**'
  - 'deploy/dependency-readiness.sh'
  - 'deploy/dependency-readiness.py'
  - 'deploy/check-latest-main.sh'
  - 'deploy/tofu-local-state-backup.sh'
  - 'deploy/list-image-tags.sh'
  - 'deploy/tx/business-api.compose.yml'
  - 'deploy/tx/build-business-api-from-gitee.sh'
  - 'deploy/tx/deploy.sh'
  - 'deploy/tx/common.compose.yml'
  - 'deploy/tx/docker-compose.yml'
  - '.github/workflows/ci-business-api.yml'
ai_service:
  - '.github/workflows/ai-service.yml'
  - '.github/workflows/ci-ai-service.yml'
  - '.dockerignore'
  - 'docker/Dockerfile.ai-service'
  - 'java/pom.xml'
  - 'java/**/pom.xml'
  - 'java/settings-docker.xml'
  - 'java/settings-ci.xml'
  - 'java/wotb-core/**'
  - 'java/wotb-ai/**'
  - 'contracts/http/**'
  - 'common/fixtures/ai-projection/**'
  - 'common/fixtures/replay-facts/**'
  - 'common/tank-name-aliases.json'
  - 'common/tankopedia-tier*.json'
  - 'common/map_names.json'
  - 'common/tank_tactical_profiles.json'
  - 'common/map-semantics/**'
frontend:
  - '.github/workflows/frontend.yml'
  - '.github/workflows/frontend-replica.yml'
  - '.dockerignore'
  - 'docker/Dockerfile.frontend'
  - 'frontend/**'
  - 'common/map_names.json'
  # 前端 golden / 纯函数测试实读的共享回放与表格夹具（issue #828 核实）：
  # agentWasmNode golden 读 replays + hall-of-fame，spawnResolver.test 读 replays，
  # tabular/csv encode.test 与 tournamentPointsExport.test 各读同名夹具。
  - 'common/fixtures/replays/**'
  - 'common/fixtures/hall-of-fame/**'
  - 'common/fixtures/tabular/**'
  - 'common/fixtures/tournament/**'
  - 'common/tankopedia-tier*.json'
  # Tankopedia 搜索别名（构建期 import 进前端包）：改它必须重跑 frontend 测试
  - 'common/tank_aliases.json'
  - 'common/assets/**'
  - 'deploy/agent/source.json'
  - 'scripts/fetch-agent-wasm.sh'
  # Agent 产物 ingest 校验与源码自建后备：改它们必须重跑 frontend CI（dist 契约 smoke）
  - 'scripts/agent-wasm-artifact.py'
  - 'scripts/build-agent-wasm.sh'
  - 'HISTORY.md'
  - 'docs/architecture/TECHNICAL_EVOLUTION.md'
  - 'docs/WotBTools_League_Rating_V6.md'
  - 'deploy/nginx/nginx.conf'
  - 'deploy/tx/nginx/**'
  - 'deploy/check-production-freshness.sh'
  - 'deploy/tx/build-frontend-from-gitee.sh'
  - 'deploy/tx/sponsor-fingerprint.sh'
  - 'deploy/sponsor/**'
  - 'deploy/test_frontend_builder.py'
  - 'deploy/tx/frontend.compose.yml'
  - 'deploy/tx/frontend-shadow.compose.yml'
  - 'deploy/tx/k7c-sync-runtime-content.sh'
  - 'deploy/tx/deploy.sh'
  - 'deploy/tx/runtime-check-lib.sh'
  - 'deploy/tx/with-deploy-lock.sh'
  - 'deploy/tx/common.compose.yml'
  - 'deploy/tx/docker-compose.yml'
  - '.github/workflows/ci-frontend.yml'
  - 'contracts/http/**'
keycloak:
  - '.github/workflows/keycloak.yml'
  - '.dockerignore'
  - 'docker/Dockerfile.keycloak'
  - 'docker/keycloak/**'
  - 'java/settings-docker.xml'
  - 'java/settings-ci.xml'
  - 'keycloak-qq-provider/**'
  - 'keycloak-wargaming-provider/**'
  - 'keycloak-session-provider/**'
  - 'infra/tofu/keycloak/**'
  - 'deploy/test-keycloak-runtime.sh'
  - 'deploy/test-keycloak-tofu.sh'
  - 'deploy/dependency-readiness.sh'
  - 'deploy/dependency-readiness.py'
  - 'deploy/check-latest-main.sh'
  - 'deploy/tx/keycloak.compose.yml'
  - 'deploy/tx/deploy.sh'
  - 'deploy/tx/common.compose.yml'
  - 'deploy/tx/docker-compose.yml'
  - '.github/workflows/ci-keycloak.yml'
android:
  - '.github/workflows/ci-android.yml'
  - '.github/workflows/android-release.yml'
  - '.github/workflows/android-auto-publish.yml'
  - 'android/**'
  - 'contracts/android-native-bridge.json'
  - 'frontend/src/platform/nativeBridgeContract.js'
  # Agent WASM pin 是 Android runtime 输入（Android Version-as-Code 规则）：
  # ci-android 的 bundle→APK 装配链真实消费它，是 PR 级唯一验证「新 pin 能进 APK」
  # 的地方（issue #828）。frontend/src/** 不路由（frontend owner 已构建同一 bundle，
  # 全量路由让每个前端 PR 付 gradle/SDK 成本）。
  - 'deploy/agent/source.json'
  - 'scripts/android-release/**'
observability:
  - 'deploy/list-image-tags.sh'
  - '.github/workflows/observability.yml'
  # The runtime smoke that proves the Docker -> Alloy -> Loki compliance split:
  # editing it must re-run it, not only the deployment contract job.
  - 'deploy/test-observability-e2e.sh'
  - 'deploy/deploy.sh'
  - 'deploy/docker-compose.prod.yml'
  - 'deploy/grafana-api-request.sh'
  - 'deploy/tofu-local-state-backup.sh'
  - 'deploy/validate-alloy-config.sh'
  - 'deploy/verify-observability.sh'
  - 'deploy/observability/**'
  - 'infra/tofu/grafana/**'
  - '.github/workflows/ci-observability.yml'
deployment:
  - '.github/workflows/ai-service.yml'
  - '.github/workflows/gitee-mirror.yml'
  - '.github/workflows/tx-runtime-check.yml'
  - '.github/workflows/android-offload-probe.yml'
  - '.github/workflows/frontend-replica.yml'
  - '.github/workflows/asset-origin.yml'
  - 'docker/Dockerfile.ai-service'
  - '.github/workflows/ci-deployment.yml'
  - '.github/workflows/ci-gate.yml'
  - '.github/workflows/codeql.yml'
  - '.github/ci-owner-paths.yml'
  - 'scripts/ci/**'
  - 'deploy/test-*.sh'
  - 'deploy/test_*.py'
  - 'deploy/check-*.sh'
  - 'deploy/assets/**'
  - 'deploy/tx/deploy.sh'
  - 'deploy/tx/runtime-check-lib.sh'
  - 'deploy/tx/with-deploy-lock.sh'
  - 'deploy/tx/nginx/**'
  - 'deploy/list-image-tags.sh'
  - 'deploy/tx/publish-loaded-image-to-tcr.sh'
  - 'deploy/tx/validate-caddy-config.sh'
  - 'deploy/deploy.sh'
  - 'deploy/tx/docker-compose.yml'
  - 'deploy/docker-compose.prod.yml'
  # Declarative Komodo resources: reviewed data validated by a contract test, never
  # applied from CI, and deliberately NOT part of the Komodo controller owner (whose
  # production workflow owns deploy/komodo/** + infra/tofu/komodo/** only).
  - 'infra/komodo/resources/**'
python:
  - '.github/workflows/ci-python.yml'
  - 'common/python/**'
  # 人工维护的别名数据集 + 其 tank_id 校验源（完整车辆名册）：
  # 由 validate_tank_aliases 的 unittest fail closed 守卫，名册与 tier 文件的一致性由
  # test_update_tankopedia 的 RosterTest 守卫
  - 'common/tank_aliases.json'
  - 'common/tank_ids.json'
  - 'common/tankopedia-tier*.json'
  # update_crew_skills.py 的数据输入（issue #828）
  - 'common/crew-skills.json'
  # 原本只由维护者手动运行的两个 stdlib unittest 面，随 ci-python 的 discover 接入：
  # map-semanticizer 校验 common/map-semantics/** + map_names.json（review R1 P2：数据
  # 单独改动必须触发 python owner，否则新接入的逐图完整性测试漏触发）；tools/tests
  # 校验 cleanup-hundred-wargaming-api.py
  - 'common/map_names.json'
  - 'common/map-semantics/**'
  - 'map-semanticizer/**'
  - 'tools/**'
business_postgres:
  - '.github/workflows/business-postgres.yml'
  - 'deploy/tx/deploy.sh'
  - 'deploy/tx/docker-compose.yml'
  - 'deploy/tx/common.compose.yml'
  - 'deploy/tx/business-postgres.compose.yml'
  - 'deploy/tx/business-postgres.tofurc'
  - 'infra/tofu/postgres-business/**'
  - '.github/workflows/ci-business-postgres.yml'
keycloak_postgres:
  - '.github/workflows/keycloak-postgres.yml'
  - 'deploy/tx/keycloak-postgres.compose.yml'
  - 'deploy/tx/runtime-check-lib.sh'
  - 'infra/tofu/postgres-keycloak/**'
  - '.github/workflows/ci-keycloak-postgres.yml'
  # Backup smoke single owner: the smoke script and its direct production
  # dependency are routed here so touching them re-runs the smoke exactly once.
  - 'deploy/test-keycloak-postgres-backup.sh'
  - 'deploy/tx/keycloak-postgres-backup.sh'
caddy:
  - '.github/workflows/caddy.yml'
  # The gateway's own fixture suite: a Caddyfile change must re-run the runtime
  # proof of the compliance access log, not only the staged text/JSON assertions.
  - 'deploy/test-caddy-route-inventory.sh'
  - 'deploy/tx/deploy.sh'
  - 'deploy/tx/docker-compose.yml'
  - 'deploy/tx/common.compose.yml'
  - 'deploy/tx/caddy.compose.yml'
  - 'deploy/tx/Caddyfile'
  - 'deploy/tx/validate-caddy-config.sh'
  - 'deploy/tx/assets/**'
  - '.github/workflows/ci-caddy.yml'
alloy_tx:
  - '.github/workflows/alloy-tx.yml'
  # The compliance selector's retained event list must stay identical to the
  # declared Keycloak event list, so that declaration is a production input here.
  - 'infra/tofu/keycloak/events.tf'
  - 'deploy/tx/alloy/**'
  - 'deploy/tx/docker-compose.yml'
  - 'deploy/tx/common.compose.yml'
  - 'deploy/tx/alloy-tx.compose.yml'
  - 'deploy/tx/deploy.sh'
  - 'deploy/validate-alloy-config.sh'
  - '.github/workflows/ci-alloy-tx.yml'
komodo_controller:
  - '.github/workflows/komodo-controller.yml'
  - '.github/workflows/ci-komodo-controller.yml'
  - 'deploy/check-production-freshness.sh'
  - 'deploy/komodo/**'
  - 'infra/tofu/komodo/**'
komodo_periphery:
  - '.github/workflows/komodo-periphery.yml'
  - '.github/workflows/ci-komodo-periphery.yml'
  - 'deploy/check-production-freshness.sh'
  - 'deploy/periphery/**'
production_worker:
  # The TX2 production-worker prerequisites (K7A) are their own owner: host
  # packages, the Docker daemon mirror and the root registry credential. Touching
  # them must validate this owner only, and must never reach the Komodo, Periphery,
  # Caddy, frontend, business-api, keycloak or PostgreSQL owners.
  - '.github/workflows/production-worker.yml'
  - '.github/workflows/ci-production-worker.yml'
  - 'deploy/check-production-freshness.sh'
  - 'deploy/production-worker/**'
