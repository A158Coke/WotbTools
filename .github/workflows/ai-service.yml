name: AI Service

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ai-service.yml
      - .dockerignore
      - docker/Dockerfile.ai-service
      - java/pom.xml
      - java/**/pom.xml
      - java/settings-docker.xml
      - java/wotb-contracts/**
      - java/wotb-core/**
      - java/wotb-result/**
      - java/wotb-playback/**
      - java/wotb-ai/**
      - contracts/http/**
      - deploy/deploy.sh
      - deploy/docker-compose.prod.yml
      - deploy/check-latest-main.sh
  workflow_dispatch:

permissions:
  contents: read


env:
  PRODUCTION_INPUT_PATHS: |
    .github/workflows/ai-service.yml
    .dockerignore
    docker/Dockerfile.ai-service
    java/pom.xml
    java/**/pom.xml
    java/settings-docker.xml
    java/wotb-contracts/**
    java/wotb-core/**
    java/wotb-result/**
    java/wotb-playback/**
    java/wotb-ai/**
    contracts/http/**
    deploy/deploy.sh
    deploy/docker-compose.prod.yml
    deploy/check-latest-main.sh
concurrency:
  group: deploy-ai-service
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Freeze current main and image identity
        id: identity
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [ "$REF_NAME" = refs/heads/main ] || { echo 'Manual deployment must dispatch from main.' >&2; exit 1; }
          fi
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
          image="ghcr.io/a158coke/ai-service:sha-${SOURCE_SHA:0:12}"
          {
            echo "commit_sha=$SOURCE_SHA"
            echo "image=$image"
            echo "repository=${image%:*}"
            echo "tag=sha-${SOURCE_SHA:0:12}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-crane@v0.7
      - name: Reuse only an existing immutable image with this source identity
        id: immutable
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          REPOSITORY: ${{ steps.identity.outputs.repository }}
          TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_SHA: ${{ steps.identity.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tags="$(bash "$GITHUB_WORKSPACE/deploy/list-image-tags.sh" "$REPOSITORY")"
          if grep -Fxq "$TAG" <<< "$tags"; then
            docker pull "$IMAGE"
            revision="$(docker image inspect --format='{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE" | sed -n 's/^BUILD_COMMIT=//p' | head -n 1)"
            [ "$revision" = "$SOURCE_SHA" ] || { echo 'Existing immutable tag has a different BUILD_COMMIT.' >&2; exit 1; }
            digest="$(crane digest "$IMAGE")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "existing_digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo 'existing_digest=' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish this frozen image
        id: build_image
        if: steps.immutable.outputs.existing_digest == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ai-service
          push: true
          tags: ${{ steps.identity.outputs.image }}
          build-args: BUILD_COMMIT=${{ steps.identity.outputs.commit_sha }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service
          provenance: false
          sbom: false
      - name: Verify registry digest and source identity
        id: verify
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          SOURCE_SHA: ${{ steps.identity.outputs.commit_sha }}
          EXISTING_DIGEST: ${{ steps.immutable.outputs.existing_digest }}
          BUILD_DIGEST: ${{ steps.build_image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-$BUILD_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Missing or invalid image digest.' >&2; exit 1; }
          [ "$(crane digest "$IMAGE")" = "$digest" ] || { echo 'Registry digest changed after build.' >&2; exit 1; }
          docker pull "$IMAGE@$digest" >/dev/null
          revision="$(docker image inspect --format='{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE@$digest" | sed -n 's/^BUILD_COMMIT=//p' | head -n 1)"
          [ "$revision" = "$SOURCE_SHA" ] || { echo 'Published image does not contain the frozen BUILD_COMMIT.' >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Publish latest only from current main
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.commit_sha }}
          IMAGE: ${{ steps.identity.outputs.image }}
          REPOSITORY: ${{ steps.identity.outputs.repository }}
          DIGEST: ${{ steps.verify.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-latest-main.sh" "$SOURCE_SHA"
          crane cp "$IMAGE@$DIGEST" "$REPOSITORY:latest"


  deploy:
    concurrency:
      group: production-maintenance
      cancel-in-progress: false
      queue: max
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit_sha }}
      - name: Reject stale main before staging production inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.build.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
      - name: Prepare complete Yecao deployment input tree
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            root=/opt/wotb
            mkdir -p "$root/deploy.incoming"
            rm -rf -- "$root/deploy.incoming/deploy"
            mkdir -p "$root/deploy.incoming/deploy"
      - name: Stage the complete Compose rendering input tree
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy
          target: /opt/wotb/deploy.incoming
          overwrite: true
      - name: Reject stale main before Yecao mutation
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.build.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
      - name: Deploy AI Service under one host lock
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 35m
          envs: WOTB_DEPLOY_SERVICE,WOTB_DEPLOY_CONFIG_SHA,AI_API_KEY,AI_BASE_URL,AI_MODEL,KEYCLOAK_ISSUER_URI,AI_REVIEW_WORKER_MAX_CONCURRENT,AI_REVIEW_WORKER_QUEUE_CAPACITY
          script: |
            set -euo pipefail
            exec 9>/opt/wotb/.deploy.lock
            flock -n 9 || { echo 'Another Yecao production deployment is running.' >&2; exit 1; }
            export WOTB_DEPLOY_LOCK_FD=9
            export WOTB_DEPLOY_SERVICE=ai-service
            export WOTB_DEPLOY_CONFIG_SHA='${{ needs.build.outputs.commit_sha }}'
            bash /opt/wotb/deploy.incoming/deploy/deploy.sh
        env:
          WOTB_DEPLOY_SERVICE: ai-service
          WOTB_DEPLOY_CONFIG_SHA: ${{ needs.build.outputs.commit_sha }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-v4-flash' }}
          KEYCLOAK_ISSUER_URI: ${{ vars.KEYCLOAK_ISSUER_URI || 'https://auth.wotbtools.com/realms/wotbtools' }}
          AI_REVIEW_WORKER_MAX_CONCURRENT: ${{ vars.AI_REVIEW_WORKER_MAX_CONCURRENT || '2' }}
          AI_REVIEW_WORKER_QUEUE_CAPACITY: ${{ vars.AI_REVIEW_WORKER_QUEUE_CAPACITY || '2' }}
