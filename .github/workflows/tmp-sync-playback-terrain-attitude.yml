name: Temporary sync terrain attitude with main

on:
  push:
    branches:
      - feat/playback-terrain-attitude
    paths:
      - .github/workflows/tmp-sync-playback-terrain-attitude.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/playback-terrain-attitude
          fetch-depth: 0

      - name: Merge latest main and preserve terrain-attitude docs
        run: |
          git config user.name 'WotbTools AI'
          git config user.email 'wotbtools-ai@local'
          git fetch origin main
          set +e
          git merge origin/main --no-commit --no-ff
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            git checkout --theirs docs/current-plan.md docs/CHANGELOG.md
            git add docs/current-plan.md docs/CHANGELOG.md
          fi
          python tmp/sync-playback-terrain-attitude.py
          git add docs/current-plan.md docs/CHANGELOG.md
          test -z "$(git diff --name-only --diff-filter=U)"
          git rm .github/workflows/tmp-sync-playback-terrain-attitude.yml tmp/sync-playback-terrain-attitude.py
          git commit -m 'chore: 同步main并保留车辆地形姿态变更' -m 'Co-Authored-By: OpenAI <noreply@openai.com>'
          git push origin HEAD:feat/playback-terrain-attitude
