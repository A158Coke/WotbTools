name: TX SSH Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: TX SSH Smoke
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 308
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate TX preflight inputs
        env:
          TX_KC_POSTGRES_ADMIN_PASSWORD: ${{ secrets.TX_KC_POSTGRES_ADMIN_PASSWORD }}
          TX_KC_DB_PASSWORD: ${{ secrets.TX_KC_DB_PASSWORD }}
          TX_KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.TX_KC_BOOTSTRAP_ADMIN_PASSWORD }}
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          CADDY_ACME_EMAIL: ${{ vars.CADDY_ACME_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          for required in TX_KC_POSTGRES_ADMIN_PASSWORD TX_KC_DB_PASSWORD \
            TX_KC_BOOTSTRAP_ADMIN_PASSWORD WG_APPLICATION_ID \
            TENCENTCLOUD_SECRET_ID TENCENTCLOUD_SECRET_KEY CADDY_ACME_EMAIL; do
            [ -n "${!required:-}" ] || {
              echo "$required is required for TX preflight" >&2
              exit 1
            }
          done
      - name: Verify GitHub Actions can reach TX over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            # Mirrors deploy/tx/preflight.sh; keep this SSH-only check read-only.
            command -v docker >/dev/null
            docker compose version >/dev/null
            command -v tofu >/dev/null
            ip link show wg0 >/dev/null
            ip -4 addr show dev wg0 | grep -Eq 'inet 10\.20\.0\.1/24([[:space:]]|$)'
            ip route get 10.20.0.2 >/dev/null
            timeout 3 bash -c 'cat </dev/null >/dev/tcp/10.20.0.2/8087'
            echo TX_PREFLIGHT_OK
