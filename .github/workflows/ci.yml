name: CI / PR
run-name: "CI / PR for ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      http_contract: ${{ steps.plan.outputs.http_contract }}
      keycloak: ${{ steps.plan.outputs.keycloak }}
      keycloak_provider: ${{ steps.plan.outputs.keycloak_provider }}
      keycloak_runtime: ${{ steps.plan.outputs.keycloak_runtime }}
      data: ${{ steps.plan.outputs.data }}
      android: ${{ steps.plan.outputs.android }}
      deploy: ${{ steps.plan.outputs.deploy }}
      observability: ${{ steps.plan.outputs.observability }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - name: Detect changed paths
        if: github.event_name == 'pull_request'
        id: path_filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'java/**'
              - 'docker/Dockerfile.backend'
              - 'docker/online/docker-compose.yml'
              - 'java/settings-docker.xml'
              - 'common/**'
              - '!common/python/**'
              - 'contracts/http/**'
            frontend:
              - 'frontend/**'
              - 'docker/Dockerfile.frontend'
              - 'docker/online/docker-compose.yml'
              - 'common/**'
              - '!common/python/**'
              - 'contracts/http/**'
              - 'contracts/android-native-bridge.json'
              - 'docs/WotBTools_League_Rating_V6.md'
            http_contract:
              - 'contracts/http/**'
              - 'frontend/src/api/**'
              - 'frontend/scripts/*contract*'
              - 'java/wotb-web/**'
            android:
              - 'android/**'
              - 'contracts/android-native-bridge.json'
              - 'frontend/src/platform/nativeBridgeContract.js'
              - 'scripts/android-release/**'
            keycloak:
              - 'keycloak-wargaming-provider/**'
              - 'keycloak-juhe-qq-provider/**'
              - 'deploy/keycloak/**'
              - 'docker/Dockerfile.keycloak'
              - 'docker/keycloak/**'
              - 'docker/online/docker-compose.yml'
              - 'java/settings-docker.xml'
            keycloak_provider:
              - 'keycloak-wargaming-provider/src/main/java/**'
              - 'keycloak-wargaming-provider/src/test/**'
              - 'keycloak-juhe-qq-provider/src/main/java/**'
              - 'keycloak-juhe-qq-provider/src/test/**'
            keycloak_runtime:
              - 'keycloak-wargaming-provider/pom.xml'
              - 'keycloak-wargaming-provider/src/main/resources/**'
              - 'keycloak-juhe-qq-provider/pom.xml'
              - 'keycloak-juhe-qq-provider/src/main/resources/**'
              - 'deploy/keycloak/**'
              - 'docker/Dockerfile.keycloak'
              - 'docker/keycloak/**'
              - 'docker/online/docker-compose.yml'
              - 'java/settings-docker.xml'
            data:
              - 'common/**'
              - 'map-semanticizer/**'
            deploy:
              - 'deploy/**'
              - '!deploy/observability/**'
              - 'docker/**'
              - '.github/workflows/deploy*.yml'
              - 'java/wotb-web/src/main/resources/db/migration/**'
              - 'java/settings-docker.xml'
            observability:
              - 'deploy/observability/**'
              - 'infra/tofu/grafana/**'
              - 'docker/online/docker-compose.yml'
              - 'deploy/nginx/**'
            full:
              - '.github/workflows/**'
              - 'java/pom.xml'
              - 'java/**/pom.xml'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/vite.config.js'
              - 'frontend/vitest.config.js'
              - 'frontend/tsconfig.json'
              - 'frontend/tsconfig.app.json'
              - 'android/build.gradle.kts'
              - 'android/settings.gradle.kts'
              - 'android/gradle.properties'
              - '.dockerignore'
              - 'Makefile'
              - 'scripts/build/**'
      - name: Export affected CI surfaces
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_BACKEND: ${{ steps.path_filter.outputs.backend }}
          FILTER_FRONTEND: ${{ steps.path_filter.outputs.frontend }}
          FILTER_HTTP_CONTRACT: ${{ steps.path_filter.outputs.http_contract }}
          FILTER_ANDROID: ${{ steps.path_filter.outputs.android }}
          FILTER_KEYCLOAK: ${{ steps.path_filter.outputs.keycloak }}
          FILTER_KEYCLOAK_PROVIDER: ${{ steps.path_filter.outputs.keycloak_provider }}
          FILTER_KEYCLOAK_RUNTIME: ${{ steps.path_filter.outputs.keycloak_runtime }}
          FILTER_DATA: ${{ steps.path_filter.outputs.data }}
          FILTER_DEPLOY: ${{ steps.path_filter.outputs.deploy }}
          FILTER_OBSERVABILITY: ${{ steps.path_filter.outputs.observability }}
          FILTER_FULL: ${{ steps.path_filter.outputs.full }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            for name in backend frontend http_contract android keycloak keycloak_provider keycloak_runtime data deploy observability full; do
              echo "$name=true" >> "$GITHUB_OUTPUT"
            done
          else
            for name in backend frontend http_contract android keycloak keycloak_provider keycloak_runtime data deploy observability full; do
              env_name="FILTER_$(echo "$name" | tr '[:lower:]' '[:upper:]')"
              value="${!env_name:-false}"
              echo "$name=${value:-false}" >> "$GITHUB_OUTPUT"
            done
          fi

  python_unit:
    needs: [changes]
    if: needs.changes.outputs.data == 'true' || needs.changes.outputs.full == 'true'
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Python unit tests
        run: python3 -m unittest discover -s common/python/tests -p 'test_*.py'

  live_data_contracts:
    needs: [changes]
    if: needs.changes.outputs.data == 'true' || needs.changes.outputs.full == 'true'
    name: Live data contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate live BlitzKit equipment contract
        run: |
          set -euo pipefail
          cp common/wotb-item-catalog-json/equipment.json /tmp/equipment.json
          python3 common/python/sync_equipment_snapshot.py --catalog /tmp/equipment.json
          diff -u common/wotb-item-catalog-json/equipment.json /tmp/equipment.json
      - name: Validate live BlitzKit Tankopedia contract
        run: |
          set -euo pipefail
          rm -rf /tmp/tankopedia-ci
          mkdir -p /tmp/tankopedia-ci
          python3 common/python/sync_tankopedia_snapshot.py \
            --existing-dir common \
            --output-dir /tmp/tankopedia-ci
          for tier in 7 8 9 10; do
            python3 -m json.tool "/tmp/tankopedia-ci/tankopedia-tier${tier}.json" >/dev/null
          done
      - name: Validate live BlitzKit crew skill contract
        run: |
          set -euo pipefail
          python3 common/python/update_crew_skills.py \
            --existing common/crew-skills.json \
            --output /tmp/crew-skills.json
          python3 -m json.tool /tmp/crew-skills.json >/dev/null
          diff -u common/crew-skills.json /tmp/crew-skills.json

  backend:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.full == 'true'
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v4
        with:
          path: java/.m2repo
          key: ${{ runner.os }}-maven-${{ hashFiles('java/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Maven test
        working-directory: java
        run: mvn --batch-mode --no-transfer-progress -s settings.xml -Dmaven.repo.local=.m2repo test
      - name: Production backend Docker build
        run: docker build -f docker/Dockerfile.backend -t wotbtools-backend:pr .

  keycloak_providers:
    needs: [changes]
    if: needs.changes.outputs.keycloak_provider == 'true' || needs.changes.outputs.full == 'true'
    name: Keycloak providers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Juhe QQ provider
        working-directory: keycloak-juhe-qq-provider
        run: mvn --batch-mode --no-transfer-progress -s ../java/settings.xml -Dmaven.repo.local=../java/.m2repo test
      - name: Wargaming provider
        working-directory: keycloak-wargaming-provider
        run: mvn --batch-mode --no-transfer-progress -s ../java/settings.xml -Dmaven.repo.local=../java/.m2repo test

  keycloak_runtime:
    needs: [changes]
    if: needs.changes.outputs.keycloak_runtime == 'true' || needs.changes.outputs.full == 'true'
    name: Keycloak runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Real Keycloak image runtime smoke
        run: bash deploy/test-keycloak-runtime.sh

  frontend:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.full == 'true'
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Real-browser Playback layout regression
        working-directory: frontend
        run: npm run test:browser-layout
      - name: Real-browser Playback/Workspace interaction regression
        working-directory: frontend
        run: npm run test:browser-interaction
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Bundle separation check
        working-directory: frontend
        run: node scripts/check-bundle-separation.mjs
      - name: Alpine Docker build
        run: docker build --build-arg BUILD_COMMIT=ci-${{ github.sha }} -f docker/Dockerfile.frontend -t wotbtools-frontend:pr .

  http_contract:
    needs: [changes]
    if: needs.changes.outputs.http_contract == 'true' || needs.changes.outputs.full == 'true'
    name: HTTP contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend contract tooling
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Validate OpenAPI and local refs
        working-directory: frontend
        run: npm run api:lint
      - name: Verify generated frontend contract is current
        working-directory: frontend
        run: npm run api:check
      - name: Validate shared Playback fixture
        working-directory: frontend
        run: npm run api:fixture
      - name: Runtime contract tests
        working-directory: frontend
        run: npx vitest run src/api/contract-runtime.test.ts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Backend Playback serialization contract tests
        working-directory: java
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -s settings.xml -Dmaven.repo.local=.m2repo -pl wotb-web -am -DskipTests install
          mvn --batch-mode --no-transfer-progress -s settings.xml -Dmaven.repo.local=.m2repo -pl wotb-web -Dtest=BattlePlaybackDatasetTest,BattlePlaybackProjectorTest,ReplayArtifactWriterTest -Dsurefire.failIfNoSpecifiedTests=true test

  android:
    needs: [changes]
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.full == 'true'
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Accept Android SDK licenses (best-effort)
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Run Android JVM unit tests (AuthNavigationPolicy)
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android_release_helpers:
    needs: [changes]
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.full == 'true'
    name: Android release helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax check
        run: |
          set -euo pipefail
          bash -n scripts/android-release/resolve-version.sh
          bash -n scripts/android-release/check-release-guards.sh
          bash -n scripts/android-release/test-release.sh
      - name: Release helper unit tests
        run: bash scripts/android-release/test-release.sh

  android_contract:
    needs: [changes]
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.full == 'true'
    name: Android contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate committed Android contract
        run: |
          set -euo pipefail
          python3 scripts/android-release/android_contract.py validate \
            --contract contracts/android-native-bridge.json \
            --gradle-properties android/gradle.properties \
            --frontend frontend/src/platform/nativeBridgeContract.js \
            --native-source android/app/src/main/java/com/wotbtools/app/NativeBridge.kt \
            --native-source android/app/src/main/java/com/wotbtools/app/MainActivity.kt \
            --native-source android/app/src/main/java/com/wotbtools/app/ReplayIntentHandler.kt
          bash scripts/android-release/test-android-contract.sh
      - name: Enforce version and bridge compatibility against base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git show "$BASE_SHA:android/gradle.properties" > /tmp/base-gradle.properties
          if git cat-file -e "$BASE_SHA:contracts/android-native-bridge.json" 2>/dev/null; then
            git show "$BASE_SHA:contracts/android-native-bridge.json" > /tmp/base-android-native-bridge.json
          else
            # First introduction of the contract has no historical JSON baseline;
            # validate the committed head contract now and start breaking diffs
            # from this SSOT on the next PR.
            cp contracts/android-native-bridge.json /tmp/base-android-native-bridge.json
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/android-changed-paths.txt
          BASE_VERSION="$(sed -n 's/^wotbVersion=//p' /tmp/base-gradle.properties | head -n1)"
          HEAD_VERSION="$(sed -n 's/^wotbVersion=//p' android/gradle.properties | head -n1)"
          INITIAL_VERSION_BASELINE=false
          if [ -z "$BASE_VERSION" ]; then
            # First introduction of Version-as-Code has no historical version;
            # use the committed head as the initial baseline.
            BASE_VERSION="$HEAD_VERSION"
            INITIAL_VERSION_BASELINE=true
          fi
          FE_VERSIONS="$(python3 - <<'PY'
          import re
          text = open('frontend/src/platform/nativeBridgeContract.js', encoding='utf-8').read()
          match = re.search(r'SUPPORTED_NATIVE_BRIDGE_VERSIONS\s*=\s*Object\.freeze\(\[([^\]]*)\]\)', text)
          if not match:
              raise SystemExit('frontend supported Native Bridge versions declaration is missing')
          print(','.join(re.findall(r'\b[0-9]+\b', match.group(1))))
          PY
          )"
          python3 scripts/android-release/android_contract.py gate \
            --base-contract /tmp/base-android-native-bridge.json \
            --head-contract contracts/android-native-bridge.json \
            --base-version "$BASE_VERSION" \
            --head-version "$HEAD_VERSION" \
            --paths /tmp/android-changed-paths.txt \
            --frontend-versions "$FE_VERSIONS" \
            $([ "$INITIAL_VERSION_BASELINE" = true ] && echo --initial-version-baseline)

  observability_config:
    needs: [changes]
    if: needs.changes.outputs.observability == 'true' || needs.changes.outputs.full == 'true'
    name: Observability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: docker compose config
        working-directory: docker/online
        env:
          GRAFANA_ADMIN_USER: ci-test-user
          GRAFANA_ADMIN_PASSWORD: ci-test-password
        run: docker compose config --quiet
      - name: Prometheus config validation
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
      - name: Loki config validation
        run: >-
          docker run --rm --entrypoint loki
          -v "$PWD/deploy/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro"
          grafana/loki:3.3.2 --config.file=/etc/loki/loki-config.yml --verify-config
      - name: Alloy config format check
        run: >-
          docker run --rm --entrypoint alloy
          -v "$PWD/deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro"
          grafana/alloy:v1.4.2 fmt -t /etc/alloy/config.alloy
      - name: Alloy production selector contract
        run: bash deploy/test-alloy-config.sh
      - name: Runtime Docker emitter to Alloy to Loki smoke
        run: bash deploy/test-observability-e2e.sh
      - name: Grafana runtime provisioning smoke
        run: bash deploy/test-grafana-runtime.sh
      - name: Validate Grafana provisioning and dashboards
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os, yaml

          # Panel links of type=dashboard + uid without a valid url crash the Grafana
          # frontend (TypeError: Cannot read properties of undefined (reading 'replace')).
          # Forbid this structure so the dashboard runtime stays stable.
          required = {
              "wotbtools-production-overview.json",
              "wotbtools-backend-overview.json",
              "wotbtools-ai-review.json",
              "wotbtools-keycloak.json",
              "wotbtools-error-explorer.json",
              "wotbtools-usage.json",
          }
          paths = glob.glob("deploy/observability/grafana/dashboards/*.json")
          assert {p.replace("\\", "/").rsplit("/", 1)[-1] for p in paths} == required, "dashboard inventory drift"
          dashboard_uids = {}
          dashboard_link_uids = []
          production_health_contract = {
              "后端服务": 'up{job="wotb-backend"}',
              "主机": 'up{job="node-exporter"}',
              "Prometheus": 'up{job="prometheus"}',
              "Loki": 'up{job="loki"}',
              "Grafana": 'up{job="grafana"}',
          }

          def validate_datasource(value, where):
              if not isinstance(value, dict):
                  return
              uid = value.get("uid")
              if uid is not None:
                  assert uid in {"prometheus", "loki"}, f"{where}: unknown datasource uid {uid}"

          def walk_dashboard_panels(node, where):
              if not isinstance(node, dict):
                  return
              validate_datasource(node.get("datasource"), where)
              for target_index, target in enumerate(node.get("targets") or []):
                  if isinstance(target, dict):
                      validate_datasource(target.get("datasource"), f"{where}.targets[{target_index}]")
                      expr = target.get("expr") or target.get("query") or ""
                      if "or vector(0)" in expr:
                          assert not any(token in expr for token in ("up(", "queue_depth", "in_flight", "node_")), \
                              f"{where}: health/gauge query must not mask no-data with vector(0): {expr}"
              for link in node.get("links") or []:
                  if isinstance(link, dict) and link.get("type") == "dashboard" and isinstance(link.get("uid"), str):
                      dashboard_link_uids.append(link["uid"])
                      url = link.get("url")
                      if not isinstance(url, str) or not url.strip():
                          raise SystemExit(
                              f"{where}: panel link type=dashboard with uid but no valid url: {link}"
                          )
              for key in ("panels", "rows"):
                  for i, child in enumerate(node.get(key) or []):
                      walk_dashboard_panels(child, f"{where}.{key}[{i}]")

          def collect_production_panels(node, found):
              if not isinstance(node, dict):
                  return
              title = node.get("title")
              if isinstance(title, str):
                  found.setdefault(title, []).extend(
                      target.get("expr", "")
                      for target in node.get("targets") or []
                      if isinstance(target, dict) and isinstance(target.get("expr"), str)
                  )
              for key in ("panels", "rows"):
                  for child in node.get(key) or []:
                      collect_production_panels(child, found)

          for p in glob.glob("deploy/observability/grafana/provisioning/**/*.yml", recursive=True):
              yaml.safe_load(open(p, encoding="utf-8"))
          assert not os.path.exists("deploy/observability/grafana/provisioning/dashboards/dashboards.yml"), \
              "dashboard file-provisioning controller must remain disabled after OpenTofu adoption"
          for p in paths:
              d = json.load(open(p, encoding="utf-8"))
              assert d.get("panels"), "empty dashboard " + p
              uid = d.get("uid")
              assert isinstance(uid, str) and uid, "dashboard uid missing: " + p
              assert uid not in dashboard_uids.values(), "duplicate dashboard uid: " + uid
              dashboard_uids[p] = uid
              if p.replace("\\", "/").endswith("wotbtools-production-overview.json"):
                  production_panels = {}
                  collect_production_panels(d, production_panels)
                  for title, expected_expr in production_health_contract.items():
                      actual_exprs = {"".join(expr.split()) for expr in production_panels.get(title, [])}
                      assert expected_expr in actual_exprs, \
                          f"production overview health panel {title} must query {expected_expr}"
                      assert all("orvector(0)" not in expr for expr in actual_exprs), \
                          f"production overview health panel {title} must not mask no-data"
                  overall_exprs = [
                      expr for title, exprs in production_panels.items()
                      if title.startswith("生产状态")
                      for expr in exprs
                  ]
                  assert overall_exprs, "production overview overall health panel missing"
                  overall_expr = "".join(overall_exprs[0].split())
                  required_jobs = "wotb-backend|node-exporter|prometheus|loki|grafana"
                  expected_overall = (
                      f'min(up{{job=~"{required_jobs}"}})and('
                      f'count(up{{job=~"{required_jobs}"}})==5)'
                  )
                  assert overall_expr == expected_overall, \
                      "production overview overall health must use min(up) as the value and count(up)==5 as the presence guard"
                  assert "orvector(0)" not in overall_expr, \
                      "production overview overall health must not mask no-data"
              for i, panel in enumerate(d.get("panels", [])):
                  walk_dashboard_panels(panel, f"{p}::panels[{i}]")
          uid_set = set(dashboard_uids.values())
          assert len(uid_set) == len(paths), "dashboard UIDs must be unique"
          assert set(dashboard_link_uids) <= uid_set, "dashboard link points to an unknown uid"
          print("provisioning yml + dashboards json OK")
          PY
      - name: No host port mappings for observability/backend management
        working-directory: docker/online
        env:
          GRAFANA_ADMIN_USER: ci-test-user
          GRAFANA_ADMIN_PASSWORD: ci-test-password
        run: |
          set -euo pipefail
          docker compose config --format json > /tmp/compose.json
          python - <<'PY'
          import json
          with open('/tmp/compose.json', encoding='utf-8') as f:
              svc = json.load(f)["services"]
          no_host_ports = {"prometheus", "loki", "alloy", "grafana", "node-exporter", "wotb-backend"}
          for name, s in svc.items():
              if name in no_host_ports:
                  assert not s.get("ports"), f"service {name} must not expose host ports: {s.get('ports')}"
          keycloak_ports = [str(p) for p in svc["keycloak"].get("ports", [])]
          assert not any(":9000" in p or p.endswith("9000") for p in keycloak_ports), \
              f"Keycloak management port must stay internal: {keycloak_ports}"
          assert not svc["node-exporter"].get("ports"), \
              f"node-exporter must stay internal: {svc['node-exporter'].get('ports')}"
          print("no host exposure of observability/backend-management ports")
          PY

  deploy_smoke:
    needs: [changes]
    if: needs.changes.outputs.deploy == 'true' || needs.changes.outputs.full == 'true'
    name: Deploy smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Flyway migration immutability guard
        env:
          FLYWAY_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: bash deploy/check-flyway-immutability.sh "$FLYWAY_BASE_REF"
      - name: Flyway migration guard fixture
        run: bash deploy/test-flyway-immutability.sh
      - name: bash -n deploy.sh
        run: bash -n deploy/deploy.sh
      - name: bash -n observability verification scripts
        run: bash -n deploy/deploy.sh deploy/verify-observability.sh deploy/test-keycloak-runtime.sh deploy/test-observability-e2e.sh deploy/test-grafana-runtime.sh deploy/test-deploy-rollback.sh deploy/test-nginx-grafana-recreate.sh deploy/test-build-workflow.sh deploy/test-release-plan.sh
      - name: Build workflow frozen-commit contract
        run: bash deploy/test-build-workflow.sh
      - name: Build/Deploy changed-target and manifest contract
        run: bash deploy/test-release-plan.sh
      - name: CI path filter contract
        run: python3 scripts/ci/test-path-filters.py
      - name: CI workflow aggregation contract
        run: bash scripts/ci/test-workflow-contract.sh
      - name: Production compose config validation
        env:
          TAG: sha-ci
          DB_PASSWORD: ci
          KC_ADMIN_PASSWORD: ci
          WG_APPLICATION_ID: ci
          KEYCLOAK_ADMIN_CLIENT_SECRET: ci
          AI_API_KEY: ci
          GRAFANA_ADMIN_USER: ci
          GRAFANA_ADMIN_PASSWORD: ci
        run: docker compose -f deploy/docker-compose.prod.yml config --quiet
      - name: Production compose must not expose Grafana MCP
        env:
          TAG: sha-ci
          DB_PASSWORD: ci
          KC_ADMIN_PASSWORD: ci
          WG_APPLICATION_ID: ci
          KEYCLOAK_ADMIN_CLIENT_SECRET: ci
          AI_API_KEY: ci
          GRAFANA_ADMIN_USER: ci
          GRAFANA_ADMIN_PASSWORD: ci
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.prod.yml config --format json > /tmp/compose.json
          python - <<'PY'
          import json
          with open('/tmp/compose.json', encoding='utf-8') as f:
              svc = json.load(f)["services"]
          assert "mcp-grafana" not in svc, "mcp-grafana must be removed from production compose"
          assert not svc["node-exporter"].get("ports"), "node-exporter must stay internal"
          keycloak_ports = [str(p) for p in svc["keycloak"].get("ports", [])]
          assert not any(":9000" in p or p.endswith("9000") for p in keycloak_ports), \
              f"Keycloak management port must stay internal: {keycloak_ports}"
          for name, s in svc.items():
              for p in s.get("ports", []):
                  assert "8000" not in str(p), f"service {name} must not publish port 8000: {p}"
          print("no Grafana MCP service / port 8000 in production compose")
          PY
      - name: Deploy/rollback smoke
        run: bash deploy/test-deploy-rollback.sh
      - name: nginx rate-limit real-IP smoke
        run: bash deploy/test-nginx-ratelimit.sh
      - name: nginx Android download route smoke (SPA/version.json/APK/404)
        run: bash deploy/test-nginx-android-route.sh
      - name: nginx Grafana recreate smoke
        run: bash deploy/test-nginx-grafana-recreate.sh

  required:
    needs:
      - changes
      - python_unit
      - live_data_contracts
      - backend
      - keycloak_providers
      - keycloak_runtime
      - frontend
      - http_contract
      - android
      - android_release_helpers
      - android_contract
      - observability_config
      - deploy_smoke
    if: always()
    name: CI / Required Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected job to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          PYTHON_UNIT: ${{ needs.python_unit.result }}
          DATA_CHANGED: ${{ needs.changes.outputs.data }}
          LIVE_DATA_CONTRACTS: ${{ needs.live_data_contracts.result }}
          BACKEND: ${{ needs.backend.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          KEYCLOAK_PROVIDERS: ${{ needs.keycloak_providers.result }}
          KEYCLOAK_PROVIDER_CHANGED: ${{ needs.changes.outputs.keycloak_provider }}
          KEYCLOAK_RUNTIME: ${{ needs.keycloak_runtime.result }}
          KEYCLOAK_RUNTIME_CHANGED: ${{ needs.changes.outputs.keycloak_runtime }}
          FRONTEND: ${{ needs.frontend.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          HTTP_CONTRACT: ${{ needs.http_contract.result }}
          HTTP_CONTRACT_CHANGED: ${{ needs.changes.outputs.http_contract }}
          ANDROID: ${{ needs.android.result }}
          ANDROID_CHANGED: ${{ needs.changes.outputs.android }}
          ANDROID_RELEASE_HELPERS: ${{ needs.android_release_helpers.result }}
          ANDROID_CONTRACT: ${{ needs.android_contract.result }}
          OBSERVABILITY: ${{ needs.observability_config.result }}
          OBSERVABILITY_CHANGED: ${{ needs.changes.outputs.observability }}
          DEPLOY_SMOKE: ${{ needs.deploy_smoke.result }}
          DEPLOY_CHANGED: ${{ needs.changes.outputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS='|' read -r job expected result; do
            case "$expected:$result" in
              true:success) ;;
              false:skipped) ;;
              *) echo "::error::$job expected=$expected ended with $result"; failed=1 ;;
            esac
          done <<EOF
          changes|true|$CHANGES
          python_unit|$([ "$DATA_CHANGED" = true ] || [ "$FULL" = true ] && echo true || echo false)|$PYTHON_UNIT
          live_data_contracts|$([ "$DATA_CHANGED" = true ] || [ "$FULL" = true ] && echo true || echo false)|$LIVE_DATA_CONTRACTS
          backend|$([ "$BACKEND_CHANGED" = true ] || [ "$FULL" = true ] && echo true || echo false)|$BACKEND
          keycloak_providers|$([ "$KEYCLOAK_PROVIDER_CHANGED" = true ] || [ "$FULL" = true ] && echo true || echo false)|$KEYCLOAK_PROVIDERS
          keycloak_runtime|$([ "$KEYCLOAK_RUNTIME_CHANGED" = true ] || [ "$FULL" = true ] && echo true || echo false)|$KEYCLOAK_RUNTIME
          frontend|$([ "$FRONTEND_CHANGED" = true ] || [ "$FULL" = true ] && echo true || echo false)|$FRONTEND
          http_contract|$([ "$HTTP_CONTRACT_CHANGED" = true ] || [ "$FULL" = true ] && echo true || echo false)|$HTTP_CONTRACT
          android|$([ "$ANDROID_CHANGED" = true ] || [ "$FULL" = true ] && echo true || echo false)|$ANDROID
          android_release_helpers|$([ "$ANDROID_CHANGED" = true ] || [ "$FULL" = true ] && echo true || echo false)|$ANDROID_RELEASE_HELPERS
          android_contract|$([ "$ANDROID_CHANGED" = true ] || [ "$FULL" = true ] && echo true || echo false)|$ANDROID_CONTRACT
          observability|$([ "$OBSERVABILITY_CHANGED" = true ] || [ "$FULL" = true ] && echo true || echo false)|$OBSERVABILITY
          deploy_smoke|$([ "$DEPLOY_CHANGED" = true ] || [ "$FULL" = true ] && echo true || echo false)|$DEPLOY_SMOKE
          EOF
          [ "$failed" -eq 0 ]
