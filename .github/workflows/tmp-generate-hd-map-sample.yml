name: Temporary generate HD map sample

on:
  push:
    branches:
      - feat/playback-3d-prototype
    paths:
      - common/python/enhance_map_assets.py
      - .github/workflows/tmp-generate-hd-map-sample.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/playback-3d-prototype
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install one-time enhancement tooling
        run: python -m pip install --disable-pip-version-check opencv-contrib-python-headless==4.10.0.84 pillow==11.3.0
      - name: Fetch FSRCNN x2 weights
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/Saafke/FSRCNN_Tensorflow/master/models/FSRCNN_x2.pb \
            --output /tmp/FSRCNN_x2.pb
      - name: Generate Black Goldville HD sample
        run: python common/python/enhance_map_assets.py /tmp/FSRCNN_x2.pb black-goldville --quality 92
      - name: Verify originals were not modified
        run: |
          git diff --exit-code -- frontend/src/assets/maps/
          test -f frontend/src/assets/maps-hd/black-goldville.webp
          test -f frontend/src/assets/maps-hd/manifest.json
      - name: Commit sample and remove temporary workflow
        run: |
          git config user.name 'WotbTools AI'
          git config user.email 'wotbtools-ai@local'
          git add frontend/src/assets/maps-hd/black-goldville.webp frontend/src/assets/maps-hd/manifest.json
          git rm .github/workflows/tmp-generate-hd-map-sample.yml
          git commit -m 'feat(maps): add AI-enhanced Black Goldville HD sample'
          git push origin HEAD:feat/playback-3d-prototype
