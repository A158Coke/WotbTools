name: Temporary fix PR 656 observability docs

on:
  push:
    branches: [chore/remove-tx-production-environment]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[pr656-observability-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/remove-tx-production-environment
          fetch-depth: 0
      - name: Apply exact documentation fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'docs/operations/observability-runbook.md': [
                  ('Provision the GitHub protected-environment secret and deploy the owner normally.',
                   'Provision the repository-level Actions secret and deploy the owner normally.'),
              ],
              'docs/operations/observability.md': [
                  ('Provision it in the protected TX deployment environment before relying on user counts.',
                   'Provision it as a repository-level Actions secret before relying on user counts.'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {filename}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

      - name: Verify no observability environment guidance remains
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'protected[- ]environment|protected TX deployment environment' \
            docs/operations/observability-runbook.md docs/operations/observability.md

      - name: Commit review fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/operations/observability-runbook.md docs/operations/observability.md
          git commit -m 'docs(observability): use repository-level secret guidance [pr656-observability-fix]'
          git push origin HEAD:chore/remove-tx-production-environment
