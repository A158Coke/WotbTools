name: COS infrastructure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cos.yml
      - infra/tofu/environments/prod/**
      - scripts/ci/validate-tofu-prod-plan.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  apply:
    name: Apply exact COS production plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: 'true'
      CHECKPOINT_DISABLE: '1'
      AWS_ACCESS_KEY_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Freeze current main
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == refs/heads/main ]] || { echo 'COS workflow requires main.' >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'The event SHA must be a full lowercase commit SHA.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo 'Checkout SHA differs from the event SHA.' >&2; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$SOURCE_SHA" ]] || {
            echo 'This run is stale; dispatch COS again from current main.' >&2
            exit 1
          }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Plan, guard, apply the same plan, and verify clean state
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == refs/heads/main ]] || { echo 'COS workflow requires main.' >&2; exit 1; }
          [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]] || { echo 'Tencent COS credentials are missing.' >&2; exit 1; }
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$current_main" == "$SOURCE_SHA" ]] || { echo 'Main advanced before the COS plan.' >&2; exit 1; }
          cd infra/tofu/environments/prod
          umask 077
          trap 'rm -f -- plan.tfplan second-plan.tfplan' EXIT
          tofu fmt -check -recursive
          tofu init -reconfigure -input=false
          tofu validate
          tofu plan -input=false -no-color -out=plan.tfplan
          bash "$GITHUB_WORKSPACE/scripts/ci/validate-tofu-prod-plan.sh" plan.tfplan
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$current_main" == "$SOURCE_SHA" ]] || { echo 'Main advanced before the COS apply.' >&2; exit 1; }
          tofu apply -input=false -auto-approve plan.tfplan
          tofu plan -input=false -no-color -out=second-plan.tfplan
          second_json="$(tofu show -json second-plan.tfplan)"
          if ! jq -e 'type == "object" and (.resource_changes | type == "array") and all(.resource_changes[]; ((.change.actions // []) == ["no-op"]))' <<< "$second_json" >/dev/null; then
            echo 'COS second plan is malformed or not clean.' >&2
            exit 1
          fi
