name: Export full map assets

on:
  push:
    branches:
      - feat/maps-hd-assets
    paths:
      - .github/workflows/maps-preview-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-artifact@v4
        with:
          name: maps-full-assets
          path: frontend/src/assets/maps
          retention-days: 1
