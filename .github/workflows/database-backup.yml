name: Ops / Database Backup
run-name: Ops / Backup production PostgreSQL by @${{ github.actor }}

on:
  schedule:
    # 03:15 Asia/Hong_Kong (UTC+8).
    - cron: "15 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: tx-production
    steps:
      - uses: actions/checkout@v5

      - name: Stage TX database backup scripts
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tx/business-postgres-backup.sh,deploy/tx/keycloak-postgres-backup.sh
          target: /opt/wotb-tx/ops
          overwrite: true

      - name: Back up authoritative TX databases
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 20m
          envs: TX_BUSINESS_POSTGRES_ADMIN_USER,TX_BUSINESS_DB_NAME,KC_POSTGRES_ADMIN_USER,KC_DB_NAME
          script: |
            set -Eeuo pipefail
            business_script=/opt/wotb-tx/ops/deploy/tx/business-postgres-backup.sh
            keycloak_script=/opt/wotb-tx/ops/deploy/tx/keycloak-postgres-backup.sh
            chmod 700 "$business_script" "$keycloak_script"

            exec 9>/opt/wotb-tx/.deploy.lock
            flock -n 9 || { echo 'Another TX production mutation is running.' >&2; exit 1; }

            WOTB_TX_BUSINESS_POSTGRES_COMPOSE_PROJECT=deploy \
              "$business_script"
            WOTB_TX_KEYCLOAK_POSTGRES_COMPOSE_PROJECT=deploy \
              "$keycloak_script"
        env:
          TX_BUSINESS_POSTGRES_ADMIN_USER: ${{ vars.TX_BUSINESS_POSTGRES_ADMIN_USER }}
          TX_BUSINESS_DB_NAME: ${{ vars.TX_BUSINESS_DB_NAME }}
          KC_POSTGRES_ADMIN_USER: kc_admin
          KC_DB_NAME: keycloak

      - name: Stage TX local OpenTofu state backup
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tofu-local-state-backup.sh
          target: /opt/wotb-tx/ops
          overwrite: true

      - name: Back up TX local OpenTofu states
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          script: |
            set -Eeuo pipefail
            script=/opt/wotb-tx/ops/deploy/tofu-local-state-backup.sh
            chmod 700 "$script"
            "$script" tx

      - name: Stage Yecao local OpenTofu state backup
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/tofu-local-state-backup.sh
          target: /opt/wotb/ops
          overwrite: true

      - name: Back up Yecao local OpenTofu state
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -Eeuo pipefail
            script=/opt/wotb/ops/deploy/tofu-local-state-backup.sh
            chmod 700 "$script"
            "$script" yecao
