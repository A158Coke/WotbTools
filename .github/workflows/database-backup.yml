name: Ops / Database Backup
run-name: Ops / Backup production PostgreSQL by @${{ github.actor }}

on:
  schedule:
    # 03:15 Asia/Hong_Kong (UTC+8).
    - cron: "15 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install backup scripts
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/postgres-backup.sh,deploy/postgres-backup-inspect.sh,deploy/postgres-restore.sh"
          target: /opt/wotb
          overwrite: true
      - name: Create and verify backup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            chmod 700 /opt/wotb/deploy/postgres-backup.sh \
              /opt/wotb/deploy/postgres-backup-inspect.sh \
              /opt/wotb/deploy/postgres-restore.sh
            /opt/wotb/deploy/postgres-backup.sh --database wotb
            /opt/wotb/deploy/postgres-backup.sh --database keycloak
      - name: Stage and back up Yecao local OpenTofu state
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/tofu-local-state-backup.sh
          target: /opt/wotb/deploy
          overwrite: true
      - name: Verify Yecao local OpenTofu state backup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            chmod 700 /opt/wotb/deploy/tofu-local-state-backup.sh
            /opt/wotb/deploy/tofu-local-state-backup.sh yecao
      - name: Stage and back up TX local OpenTofu states
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tofu-local-state-backup.sh
          target: /opt/wotb-tx/deploy
          overwrite: true
      - name: Verify TX local OpenTofu state backup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            chmod 700 /opt/wotb-tx/deploy/tofu-local-state-backup.sh
            /opt/wotb-tx/deploy/tofu-local-state-backup.sh tx
