name: Temporary fix PR256 review

on:
  push:
    branches:
      - feat/maps-ai-hd-v2
    paths:
      - .github/workflows/tmp-fix-pr256-review.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/maps-ai-hd-v2
          fetch-depth: 0

      - name: Merge latest main without rewriting published history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WotbTools AI'
          git config user.email 'wotbtools-ai@local'
          git fetch origin main
          set +e
          git merge origin/main --no-commit --no-ff
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts:"
            echo "$conflicts"
            for file in $conflicts; do
              case "$file" in
                docs/current-plan.md|docs/CHANGELOG.md|docs/CHANGELOG-PRODUCT.md)
                  git checkout --theirs -- "$file"
                  git add "$file"
                  ;;
                *)
                  echo "Unexpected merge conflict: $file" >&2
                  exit 1
                  ;;
              esac
            done
          fi
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          test_path = Path('frontend/src/utils/terrainReliefProjection.test.js')
          text = test_path.read_text(encoding='utf-8')
          old = """  function gradientModel(axis, step = 0.5) {\n    const size = 6\n    const heights = []\n    for (let row = 0; row < size; row++) {\n      for (let col = 0; col < size; col++) {\n        heights.push((axis === 'y' ? row : col) * step)\n      }\n    }\n"""
          new = """  function gradientModel(axis, step = 0.5) {\n    const size = 6\n    const heights = []\n    for (let row = 0; row < size; row++) {\n      for (let col = 0; col < size; col++) {\n        const gradient = axis === 'y' ? row : axis === 'x' ? col : row + col\n        heights.push(gradient * step)\n      }\n    }\n"""
          if old in text:
              text = text.replace(old, new, 1)

          marker = "  it('clamps extreme terrain to the presentation safety limit', () => {"
          yaw_tests = """  it('rotates an east-facing X slope into vehicle-local pitch at yaw 90°', () => {\n    const attitude = sampleTerrainAttitude(gradientModel('x'), 0, 0, 90, { length: 8, width: 3.5 })\n    expect(attitude.pitchDeg).toBeGreaterThan(5)\n    expect(Math.abs(attitude.rollDeg)).toBeLessThan(0.01)\n  })\n\n  it('rotates a north/south slope into vehicle-local roll at yaw 90°', () => {\n    const attitude = sampleTerrainAttitude(gradientModel('y'), 0, 0, 90, { length: 8, width: 3.5 })\n    expect(attitude.rollDeg).toBeLessThan(-5)\n    expect(Math.abs(attitude.pitchDeg)).toBeLessThan(0.01)\n  })\n\n  it('flips pitch sign when the hull reverses against the same slope', () => {\n    const attitude = sampleTerrainAttitude(gradientModel('y'), 0, 0, 180, { length: 8, width: 3.5 })\n    expect(attitude.pitchDeg).toBeLessThan(-5)\n    expect(Math.abs(attitude.rollDeg)).toBeLessThan(0.01)\n  })\n\n  it('keeps a 45° diagonal uphill aligned to pitch without spurious roll', () => {\n    const attitude = sampleTerrainAttitude(gradientModel('diag'), 0, 0, 45, { length: 8, width: 3.5 })\n    expect(attitude.pitchDeg).toBeGreaterThan(5)\n    expect(Math.abs(attitude.rollDeg)).toBeLessThan(0.01)\n  })\n\n"""
          if 'east-facing X slope' not in text:
              if marker not in text:
                  raise SystemExit('terrain attitude test insertion marker not found')
              text = text.replace(marker, yaw_tests + marker, 1)
          test_path.write_text(text, encoding='utf-8')

          manifest_path = Path('frontend/src/assets/maps-hd/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['deliveryBudget'] = {
              'maxEnhancedBytes': 5242880,
              'maxGrowthRatio': 4.0,
              'rationale': 'Single-map Playback delivery budget for mobile/mainland links; one map is loaded at a time.'
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          plan_path = Path('docs/current-plan.md')
          plan = plan_path.read_text(encoding='utf-8')
          plan_section = """# Battle Playback HD Basemaps + 2.5D Vehicle Terrain Attitude\n\n## 状态\n\nIMPLEMENTED — REVIEW FIX IN PROGRESS\n\n## 范围\n\n- 29/29 HD basemap 均由对应原图独立生成，原图永久保留为 rollback/source-of-truth。\n- HD 资源增加 deterministic gate：coverage、SHA-256、实际 WebP 尺寸、严格 2× frame、无 crop/aspect drift、mapImages import coverage、单图 5 MiB / 4× growth budget。\n- terrain attitude 继续复用 authoritative heightfield + canonical hull yaw + 真实车辆 footprint；不伪造 replay Z。\n- 新增 yaw=90°、反向 sign、45° diagonal 的局部轴回归测试。\n- 29/29 source ↔ HD 视觉几何仍需人工 QA；`geometryTransform=NONE` 不作为视觉真实性证明。\n\n---\n"""
          if not plan.startswith('# Battle Playback HD Basemaps + 2.5D Vehicle Terrain Attitude'):
              plan_path.write_text(plan_section + plan, encoding='utf-8')

          changelog_path = Path('docs/CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          bullet = '- **Battle Playback HD 地图验证收口**：29 张 HD 底图增加 coverage/hash/真实尺寸/严格 2× frame/map import/5 MiB 单图预算的 deterministic gate；terrain attitude 补齐 yaw=90°、反向与 45° 局部轴测试。视觉几何仍要求人工 29/29 source↔HD QA，manifest 的 `geometryTransform=NONE` 仅描述生成流程，不作为视觉真实性证明。\n'
          if bullet not in changelog:
              changelog = changelog.replace('## [Unreleased]\n\n', '## [Unreleased]\n\n### Battle Playback\n' + bullet + '\n', 1)
              changelog_path.write_text(changelog, encoding='utf-8')

          product_path = Path('docs/CHANGELOG-PRODUCT.md')
          product = product_path.read_text(encoding='utf-8')
          product_bullet = '- **战局回放地图升级增加真实性与流量门禁**：29 张高清底图继续保留原图作为回滚基准，并在合并前校验完整覆盖、文件哈希、严格 2× 画布与单图 5 MiB 上限；高清图是否保持道路、岸线、建筑和地形轮廓仍需逐图人工对照确认。\n'
          if product_bullet not in product:
              product = product.replace('### Changed\n', '### Changed\n' + product_bullet, 1)
              product_path.write_text(product, encoding='utf-8')

          maps_path = Path('docs/reference/maps.md')
          maps = maps_path.read_text(encoding='utf-8')
          section = """\n## HD Playback 底图验证契约\n\n- `frontend/src/assets/maps/` 是原始素材 source-of-truth / rollback；`frontend/src/assets/maps-hd/` 只存增强版本。\n- 每张 HD 图必须对应一张原图，实际 WebP 画布严格为原图 2×（宽高均 2×），不允许 crop 或 aspect-ratio drift。\n- `frontend/src/data/mapHdAssets.test.js` 校验 29/29 coverage、manifest SHA-256、实际 WebP 尺寸、`mapImages.js` HD import coverage，以及 delivery budget。\n- 单张 HD 图预算：不超过 5 MiB，且不超过对应原图 4× 文件大小；这是面向 Android/移动端与大陆链路的硬上限，不代表必须用满。\n- `geometryTransform=NONE` 只说明生成 pipeline 未显式执行 warp/crop；它**不能证明** AI restoration 没有改变局部道路边缘、建筑轮廓、岸线或掩体边界。HD 资源合并前仍需 29/29 source ↔ HD overlay/side-by-side 人工视觉 QA。\n"""
          if '## HD Playback 底图验证契约' not in maps:
              maps_path.write_text(maps.rstrip() + '\n' + section + '\n', encoding='utf-8')
          PY

          cat > frontend/src/data/mapHdAssets.test.js <<'EOF'
          import { createHash } from 'node:crypto'
          import fs from 'node:fs'
          import path from 'node:path'
          import { fileURLToPath } from 'node:url'
          import { describe, expect, it } from 'vitest'

          const here = path.dirname(fileURLToPath(import.meta.url))
          const frontendRoot = path.resolve(here, '..', '..')
          const repoRoot = path.resolve(frontendRoot, '..')
          const manifestPath = path.join(frontendRoot, 'src/assets/maps-hd/manifest.json')
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))

          function absoluteRepoPath(repoRelative) {
            return path.join(repoRoot, repoRelative)
          }

          function sha256(file) {
            return createHash('sha256').update(fs.readFileSync(file)).digest('hex')
          }

          function readWebpDimensions(file) {
            const data = fs.readFileSync(file)
            if (data.length < 20 || data.toString('ascii', 0, 4) !== 'RIFF' || data.toString('ascii', 8, 12) !== 'WEBP') {
              throw new Error(`Not a WebP file: ${file}`)
            }
            let offset = 12
            while (offset + 8 <= data.length) {
              const type = data.toString('ascii', offset, offset + 4)
              const size = data.readUInt32LE(offset + 4)
              const start = offset + 8
              if (start + size > data.length) throw new Error(`Truncated WebP chunk ${type}: ${file}`)
              if (type === 'VP8X') {
                const width = 1 + data.readUIntLE(start + 4, 3)
                const height = 1 + data.readUIntLE(start + 7, 3)
                return { width, height }
              }
              if (type === 'VP8 ') {
                if (size < 10 || data[start + 3] !== 0x9d || data[start + 4] !== 0x01 || data[start + 5] !== 0x2a) {
                  throw new Error(`Invalid VP8 frame header: ${file}`)
                }
                return {
                  width: data.readUInt16LE(start + 6) & 0x3fff,
                  height: data.readUInt16LE(start + 8) & 0x3fff,
                }
              }
              if (type === 'VP8L') {
                if (size < 5 || data[start] !== 0x2f) throw new Error(`Invalid VP8L frame header: ${file}`)
                const b1 = data[start + 1]
                const b2 = data[start + 2]
                const b3 = data[start + 3]
                const b4 = data[start + 4]
                return {
                  width: 1 + b1 + ((b2 & 0x3f) << 8),
                  height: 1 + ((b2 & 0xc0) >> 6) + (b3 << 2) + ((b4 & 0x0f) << 10),
                }
              }
              offset = start + size + (size % 2)
            }
            throw new Error(`No image dimensions found in WebP: ${file}`)
          }

          describe('HD Playback basemap asset contract', () => {
            it('has exactly one deterministic HD entry for every registered map', () => {
              expect(manifest.schemaVersion).toBe(2)
              expect(manifest.expectedMapCount).toBe(29)
              expect(manifest.entries).toHaveLength(29)
              const sources = manifest.entries.map(entry => entry.source)
              const enhanced = manifest.entries.map(entry => entry.enhanced)
              expect(new Set(sources).size).toBe(29)
              expect(new Set(enhanced).size).toBe(29)
            })

            it('preserves hashes, exact 2x frame dimensions, aspect ratio and delivery budget', () => {
              const { maxEnhancedBytes, maxGrowthRatio } = manifest.deliveryBudget
              expect(maxEnhancedBytes).toBe(5 * 1024 * 1024)
              expect(maxGrowthRatio).toBe(4)

              for (const entry of manifest.entries) {
                const source = absoluteRepoPath(entry.source)
                const enhanced = absoluteRepoPath(entry.enhanced)
                expect(fs.existsSync(source), entry.source).toBe(true)
                expect(fs.existsSync(enhanced), entry.enhanced).toBe(true)
                expect(entry.sourceOfTruth, entry.source).toBe('ORIGINAL_ONLY')
                expect(entry.geometryTransform, entry.enhanced).toBe('NONE')
                expect(sha256(source), entry.source).toBe(entry.sourceSha256)
                expect(sha256(enhanced), entry.enhanced).toBe(entry.enhancedSha256)

                const sourceDimensions = readWebpDimensions(source)
                const enhancedDimensions = readWebpDimensions(enhanced)
                expect([sourceDimensions.width, sourceDimensions.height], entry.source).toEqual(entry.sourcePixels)
                expect([enhancedDimensions.width, enhancedDimensions.height], entry.enhanced).toEqual(entry.enhancedPixels)
                expect(enhancedDimensions.width, entry.enhanced).toBe(sourceDimensions.width * 2)
                expect(enhancedDimensions.height, entry.enhanced).toBe(sourceDimensions.height * 2)
                expect(enhancedDimensions.width * sourceDimensions.height, entry.enhanced)
                  .toBe(enhancedDimensions.height * sourceDimensions.width)

                const sourceBytes = fs.statSync(source).size
                const enhancedBytes = fs.statSync(enhanced).size
                expect(enhancedBytes, `${entry.enhanced} exceeds single-map delivery budget`).toBeLessThanOrEqual(maxEnhancedBytes)
                expect(enhancedBytes / sourceBytes, `${entry.enhanced} exceeds growth budget`).toBeLessThanOrEqual(maxGrowthRatio)
              }
            })

            it('keeps mapImages HD imports in exact manifest coverage', () => {
              const mapImages = fs.readFileSync(path.join(frontendRoot, 'src/data/mapImages.js'), 'utf8')
              const imported = [...mapImages.matchAll(/from ['"]\.\.\/assets\/maps-hd\/([^'"]+\.webp)['"]/g)]
                .map(match => match[1])
                .sort()
              const expected = manifest.entries
                .map(entry => path.basename(entry.enhanced))
                .sort()
              expect(imported).toEqual(expected)
            })
          })
          EOF

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Targeted validation for review fixes
        working-directory: frontend
        run: npx vitest run src/utils/terrainReliefProjection.test.js src/components/VehicleMarker.test.js src/utils/playbackVehicleState.test.js src/components/BattlePlayback.integration.test.js src/data/mapHdAssets.test.js

      - name: Commit review fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add docs/current-plan.md docs/CHANGELOG.md docs/CHANGELOG-PRODUCT.md docs/reference/maps.md \
            frontend/src/assets/maps-hd/manifest.json \
            frontend/src/utils/terrainReliefProjection.test.js \
            frontend/src/data/mapHdAssets.test.js
          git rm .github/workflows/tmp-fix-pr256-review.yml
          git commit -m 'fix(playback): 收口PR256验证门禁' -m 'Co-Authored-By: OpenAI <noreply@openai.com>'
          git push origin HEAD:feat/maps-ai-hd-v2
