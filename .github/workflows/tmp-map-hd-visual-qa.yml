name: Temporary finalize PR256 visual QA

on:
  push:
    branches:
      - feat/maps-ai-hd-v2
    paths:
      - .github/workflows/tmp-map-hd-visual-qa.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/maps-ai-hd-v2
          fetch-depth: 0

      - name: Record completed 29/29 visual QA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WotbTools AI'
          git config user.email 'wotbtools-ai@local'
          python - <<'PY'
          from pathlib import Path

          plan = Path('docs/current-plan.md')
          text = plan.read_text(encoding='utf-8')
          text = text.replace(
              'IMPLEMENTED — REVIEW FIX IN PROGRESS',
              'IMPLEMENTED — REVIEW FIX COMPLETE — FINAL PR CI PENDING',
              1,
          )
          text = text.replace(
              '- 29/29 source ↔ HD 视觉几何仍需人工 QA；`geometryTransform=NONE` 不作为视觉真实性证明。',
              '- [x] 29/29 source ↔ HD 已完成 side-by-side + macro-edge overlay 人工 QA：未发现 crop/warp、道路/建筑整体位移、岸线或主要地形轮廓漂移。最低 diagnostic macro-edge F1 为 Faust 0.9312、Desert Sands 0.9318；人工对照确认差异来自纹理/锐化边缘密度，而非战术拓扑重排。`geometryTransform=NONE` 仍只描述 pipeline，不单独作为真实性证明。\n- [x] 资源预算验证：最大单图 Canyon 4,666,308 B < 5 MiB；最大 growth Faust 3.748× < 4×。',
              1,
          )
          plan.write_text(text, encoding='utf-8')

          maps = Path('docs/reference/maps.md')
          text = maps.read_text(encoding='utf-8')
          evidence = '''\n### PR #256 视觉 QA 记录\n\n- 29/29 地图已逐张查看 source / HD side-by-side 与 macro-edge overlay（source=red、HD=cyan、重合=white）。\n- 未发现画布 crop/warp、主道路/建筑整体位移、岸线重绘或主要地形轮廓漂移。\n- diagnostic macro-edge F1 最低为 Faust `0.9312`、Desert Sands `0.9318`；人工对照未见战术拓扑变化，主要差异为 AI restoration 带来的纹理/锐化边缘密度变化。\n- 当前 29 张全部满足 deterministic delivery budget；最大单图 Canyon `4,666,308 B`，最大增长 Faust `3.748×`。\n- macro-edge 指标仅用于发现可疑图，不替代人工视觉判断。\n'''
          if '### PR #256 视觉 QA 记录' not in text:
              maps.write_text(text.rstrip() + '\n' + evidence + '\n', encoding='utf-8')
          PY
          git add docs/current-plan.md docs/reference/maps.md
          git rm .github/workflows/tmp-map-hd-visual-qa.yml
          git commit -m 'docs(playback): 记录29图HD视觉验收' -m 'Co-Authored-By: OpenAI <noreply@openai.com>'
          git push origin HEAD:feat/maps-ai-hd-v2
