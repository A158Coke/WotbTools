name: Ops / Production Diagnostics
run-name: Ops / Production diagnostics by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  runtime-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect Yecao runtime diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            cd /opt/wotb
            echo "== docker compose ps =="
            docker compose ps
            # The Yecao host runs the AI review service plus the shared observability stack; the
            # retired application runtime (backend/frontend/Keycloak/PostgreSQL) has no containers to
            # inspect here any more, and the business runtime's logs live on TX.
            echo "== ai-service inspect =="
            docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' ai-service 2>/dev/null || true
            echo "== ai-service logs =="
            docker compose logs --tail 220 ai-service
            echo "== observability logs =="
            docker compose logs --tail 80 alloy prometheus loki grafana
