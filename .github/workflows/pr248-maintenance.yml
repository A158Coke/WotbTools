name: PR 248 review closure

on:
  push:
    branches:
      - fix/playback-fullscreen-hud-position

permissions:
  contents: write

jobs:
  patch-review-closure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/playback-fullscreen-hud-position
          fetch-depth: 0
      - name: Apply review closure edits
        shell: python
        run: |
          from pathlib import Path
          import json

          # Replace the obsolete side-slot safe-inset assertions without depending
          # on surrounding comment indentation/wording.
          path = Path('frontend/src/components/BattlePlayback.integration.test.js')
          src = path.read_text(encoding='utf-8')
          old_name = "it('stops reserving top/bottom insets once the panels move into the gutters', () => {"
          new_name = "it('keeps the fullscreen HUD inset and delegates bottom inset ownership by form', () => {"
          old_assertions = """    expect(body).toContain('if (sideSlots.value) return { top, bottom }')
              // 判定必须早于 HUD/controls 的高度量取
              expect(body.indexOf('sideSlots.value')).toBeLessThan(body.indexOf('.pb-hud'))"""
          # The source has normal two-space test indentation; normalize the exact two
          # obsolete expectation lines independently so comments cannot break patching.
          if old_name not in src:
              raise SystemExit('obsolete safe-inset test name not found')
          src = src.replace(old_name, new_name, 1)
          old_line = "expect(body).toContain('if (sideSlots.value) return { top, bottom }')"
          old_order = "expect(body.indexOf('sideSlots.value')).toBeLessThan(body.indexOf('.pb-hud'))"
          if old_line not in src or old_order not in src:
              raise SystemExit('obsolete safe-inset assertions not found')
          replacement = """expect(body).toContain('playbackSafeInsetOwnership')
              expect(body).toContain('if (ownership.reserveTop)')
              expect(body).toContain(\"querySelector('.pb-hud')\")
              expect(body).toContain('if (ownership.reserveBottom)')
              expect(body).toContain(\"querySelector('.pb-mobile-overlay-content')\")
              expect(body).not.toContain('if (sideSlots.value) return { top, bottom }')"""
          src = src.replace(old_line, replacement, 1)
          src = src.replace("    // 判定必须早于 HUD/controls 的高度量取\n", '', 1)
          src = src.replace(old_order, "expect(body).toContain('formFactor: formFactor.value')", 1)
          path.write_text(src, encoding='utf-8')

          tech = Path('docs/CHANGELOG.md')
          text = tech.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n\n### Fixed\n'
          bullet = '- **Battle Playback 全屏 HUD / 安全区布局修复**：PC、平板和手机全屏下双方 HP / 点数 / 基地状态固定归属地图顶部 HUD，不再被通用 `pb-side-slots` 优化搬到侧栏；camera fit 按真实 HUD 与可见移动端底部控制条动态保留 safe inset，side-slot 仅作用于非移动端 controls，并按实际 map workspace 宽度判定，避免把 Details 列误算为 gutter；`test:browser-layout` 新增 fullscreen + side-slot 的真实 Chrome 几何回归。\n'
          if marker not in text:
              raise SystemExit('CHANGELOG Unreleased/Fixed marker not found')
          if bullet not in text:
              text = text.replace(marker, marker + bullet, 1)
          tech.write_text(text, encoding='utf-8')

          product = Path('docs/CHANGELOG-PRODUCT.md')
          text = product.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n\n### Fixed\n'
          bullet = '- **战局回放全屏布局修复**：桌面、平板和手机全屏时双方总 HP、点数与基地状态始终固定在地图顶部，不再跑到屏幕右侧；地图会避开顶部战况栏和手机弹出的底部控制条，平板/手机超宽横屏也不会因空白边缘优化导致控件错位。\n'
          if marker not in text:
              raise SystemExit('CHANGELOG-PRODUCT Unreleased/Fixed marker not found')
          if bullet not in text:
              text = text.replace(marker, marker + bullet, 1)
          product.write_text(text, encoding='utf-8')

          versions = Path('frontend/src/data/versions.json')
          data = json.loads(versions.read_text(encoding='utf-8'))
          version = {
              'v': '2.12.71',
              'date': '2026-09-04',
              'tag': 'fix',
              'zh': '修复战局回放全屏布局：桌面、平板和手机的双方总 HP、点数与基地状态始终固定在地图顶部，地图会避开顶部 HUD 与手机弹出的底部控制条，超宽横屏不再把战况或控制条错误搬到侧边。',
              'en': 'Fixed Battle Playback fullscreen layout: team HP, points and base status stay attached to the top of the map on desktop, tablet and mobile; the map now respects the top HUD and visible mobile bottom controls, and ultra-wide landscape no longer misplaces battle status or controls into side gutters.',
              'ru': 'Исправлена полноэкранная компоновка воспроизведения боя: HP команд, очки и состояние баз остаются в верхнем HUD карты на ПК, планшете и телефоне; карта учитывает верхний HUD и видимые нижние мобильные элементы управления, а сверхширокий альбомный режим больше не переносит боевой статус или управление в боковые поля.'
          }
          if not any(item.get('v') == version['v'] for item in data):
              data.insert(0, version)
          versions.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # One-shot transport only; leave no workflow change in the final PR.
          Path('.github/workflows/pr248-maintenance.yml').unlink()
      - name: Commit review closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/components/BattlePlayback.integration.test.js docs/CHANGELOG.md docs/CHANGELOG-PRODUCT.md frontend/src/data/versions.json
          git add -u .github/workflows/pr248-maintenance.yml
          git diff --cached --check
          git commit -m "fix(playback): close fullscreen layout review blockers"
          git push origin HEAD:fix/playback-fullscreen-hud-position
