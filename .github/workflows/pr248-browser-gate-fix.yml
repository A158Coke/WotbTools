name: PR 248 deterministic browser gate fix

on:
  push:
    branches:
      - fix/playback-fullscreen-hud-position

permissions:
  contents: write

jobs:
  patch-browser-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/playback-fullscreen-hud-position
          fetch-depth: 0

      - name: Apply deterministic browser fixture fix
        shell: python
        run: |
          from pathlib import Path

          script = Path('frontend/scripts/browser-playback-layout.mjs')
          src = script.read_text(encoding='utf-8')

          opener = "window.addEventListener('load', () => {\n  requestAnimationFrame(() => {\n"
          closer = "    document.body.dataset.result = btoa(JSON.stringify(result))\n  })\n})\n</script>"
          if src.count(opener) != 1 or src.count(closer) != 1:
              raise SystemExit('browser fixture async wrapper did not match expected head')

          sync_opener = """// This module script is deferred by HTML and `load` waits for its module graph to finish.\n// Publish the geometry result synchronously during module evaluation so Chrome `--dump-dom`\n// cannot serialize the page between `load` and a queued requestAnimationFrame callback.\n{\n"""
          sync_closer = "    document.body.dataset.result = btoa(JSON.stringify(result))\n}\n</script>"
          src = src.replace(opener, sync_opener, 1).replace(closer, sync_closer, 1)
          script.write_text(src, encoding='utf-8')

          docs = Path('docs/features/battle-playback.md')
          text = docs.read_text(encoding='utf-8')
          anchor = '- `BattlePlaybackDataset.baseStates` 是 wrapper12'
          if anchor not in text:
              raise SystemExit('battle-playback responsive-contract anchor not found')
          bullet = (
              '- Fullscreen 几何 ownership 按 form 固定：Universal Battle HUD 在 PC / Tablet / Mobile '
              '始终属于地图顶部，即使存在 `pb-side-slots` 也不会迁移到 gutter；side-slot 只允许复用 PC / '
              'Tablet 的非移动端 controls 空白侧边空间。camera fit 动态量取顶部 `.pb-hud` 的真实高度，并在 '
              'Mobile transient controls 可见时额外量取 `.pb-mobile-overlay-content` 作为 bottom safe inset；'
              'Mobile 本身不启用 side-slot optimization。`test:browser-layout` 用真实 Chrome 几何断言覆盖 '
              'fullscreen + side-slot / mobile bottom-overlay，禁止只靠 CSS 源码正则判断。\n'
          )
          if bullet not in text:
              text = text.replace(anchor, bullet + anchor, 1)
          docs.write_text(text, encoding='utf-8')

          Path('.github/workflows/pr248-browser-gate-fix.yml').unlink()

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/scripts/browser-playback-layout.mjs docs/features/battle-playback.md
          git add -u .github/workflows/pr248-browser-gate-fix.yml
          git diff --cached --check
          git commit -m "test(playback): make browser layout gate deterministic"
          git push origin HEAD:fix/playback-fullscreen-hud-position
