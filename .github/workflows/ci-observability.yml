name: CI / observability
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  observability_config:
    name: Observability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install observability validation dependencies
        run: python -m pip install -r deploy/observability/dev-metrics/requirements.txt PyYAML==6.0.3
      - name: Exporter fixture tests
        run: python -m unittest discover -s deploy/observability/dev-metrics/tests -v
      - name: Build exporter image
        run: docker build -t wotb-dev-metrics:ci deploy/observability/dev-metrics
      - name: Pull Prometheus image with bounded network retry
        run: bash scripts/ci/run-with-network-retry.sh "Pull Prometheus image" docker pull prom/prometheus:v2.55.1
      - name: Pull Loki image with bounded network retry
        run: bash scripts/ci/run-with-network-retry.sh "Pull Loki image" docker pull grafana/loki:3.3.2
      - name: Pull Alloy image with bounded network retry
        run: bash scripts/ci/run-with-network-retry.sh "Pull Alloy image" docker pull grafana/alloy:v1.4.2
      - name: Prometheus config validation
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
      - name: Loki config validation
        run: >-
          docker run --rm --entrypoint loki
          -v "$PWD/deploy/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro"
          grafana/loki:3.3.2 --config.file=/etc/loki/loki-config.yml --verify-config
      - name: Alloy config format check
        run: >-
          docker run --rm --entrypoint alloy
          -v "$PWD/deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro"
          grafana/alloy:v1.4.2 fmt -t /etc/alloy/config.alloy
      - name: Alloy production selector contract
        run: bash deploy/test-alloy-config.sh
      - name: Runtime Docker emitter to Alloy to Loki smoke
        run: bash deploy/test-observability-e2e.sh
      - name: Grafana runtime provisioning smoke
        run: bash deploy/test-grafana-runtime.sh
      - name: Validate Grafana provisioning and dashboards
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os, subprocess, tempfile, yaml

          # Panel links of type=dashboard + uid without a valid url crash the Grafana
          # frontend (TypeError: Cannot read properties of undefined (reading 'replace')).
          # Forbid this structure so the dashboard runtime stays stable.
          required = {
              "wotbtools-active-users.json", "wotbtools-feature-usage.json",
              "wotbtools-android-downloads.json", "wotbtools-ai-token-usage.json",
              "wotbtools-backend-error-logs.json", "wotbtools-engineering-overview.json",
          }
          paths = glob.glob("deploy/observability/grafana/dashboards/*.json")
          assert {p.replace("\\", "/").rsplit("/", 1)[-1] for p in paths} == required, "dashboard inventory drift"
          dashboard_uids = {}
          dashboard_link_uids = []
          prometheus_queries = []
          def validate_datasource(value, where):
              if not isinstance(value, dict):
                  return
              uid = value.get("uid")
              if uid is not None:
                  assert uid in {"prometheus", "loki"}, f"{where}: unknown datasource uid {uid}"

          def walk_dashboard_panels(node, where):
              if not isinstance(node, dict):
                  return
              if "id" in node:
                  assert node["id"] not in panel_ids, f"{where}: duplicate panel id"
                  panel_ids.add(node["id"])
              validate_datasource(node.get("datasource"), where)
              for target_index, target in enumerate(node.get("targets") or []):
                  if isinstance(target, dict):
                      validate_datasource(target.get("datasource"), f"{where}.targets[{target_index}]")
                      expr = target.get("expr") or target.get("query") or ""
                      datasource = target.get("datasource") or node.get("datasource") or {}
                      if datasource.get("uid") == "prometheus" and expr:
                          prometheus_queries.append(expr.replace("$__rate_interval", "5m").replace("$__interval", "1m"))
                      if "or vector(0)" in expr:
                          assert not any(token in expr for token in ("up(", "queue_depth", "in_flight", "node_")), \
                              f"{where}: health/gauge query must not mask no-data with vector(0): {expr}"
              for link in node.get("links") or []:
                  if isinstance(link, dict) and link.get("type") == "dashboard" and isinstance(link.get("uid"), str):
                      dashboard_link_uids.append(link["uid"])
                      url = link.get("url")
                      if not isinstance(url, str) or not url.strip():
                          raise SystemExit(
                              f"{where}: panel link type=dashboard with uid but no valid url: {link}"
                          )
              for key in ("panels", "rows"):
                  for i, child in enumerate(node.get(key) or []):
                      walk_dashboard_panels(child, f"{where}.{key}[{i}]")

          for p in glob.glob("deploy/observability/grafana/provisioning/**/*.yml", recursive=True):
              yaml.safe_load(open(p, encoding="utf-8"))
          assert not os.path.exists("deploy/observability/grafana/provisioning/dashboards/dashboards.yml"), \
              "dashboard file-provisioning controller must remain disabled after OpenTofu adoption"
          for p in paths:
              d = json.load(open(p, encoding="utf-8"))
              panel_ids = set()
              assert d.get("panels"), "empty dashboard " + p
              uid = d.get("uid")
              assert isinstance(uid, str) and uid, "dashboard uid missing: " + p
              assert uid not in dashboard_uids.values(), "duplicate dashboard uid: " + uid
              dashboard_uids[p] = uid
              assert d.get("timezone") == "Asia/Shanghai", p
              assert d.get("time") == {"from": "now-24h", "to": "now"}, p
              for i, panel in enumerate(d.get("panels", [])):
                  walk_dashboard_panels(panel, f"{p}::panels[{i}]")
          uid_set = set(dashboard_uids.values())
          assert len(uid_set) == len(paths), "dashboard UIDs must be unique"
          assert set(dashboard_link_uids) <= uid_set, "dashboard link points to an unknown uid"
          with tempfile.TemporaryDirectory() as rule_dir:
              rule_file = os.path.join(rule_dir, "dashboard-rules.yml")
              with open(rule_file, "w", encoding="utf-8") as output:
                  yaml.safe_dump({"groups": [{"name": "dashboard-query-validation", "rules": [
                      {"record": f"dashboard_validation_{index}", "expr": expr}
                      for index, expr in enumerate(prometheus_queries)
                  ]}]}, output)
              subprocess.run(["docker", "run", "--rm", "--entrypoint", "promtool", "-v",
                              f"{rule_file}:/tmp/dashboard-rules.yml:ro", "prom/prometheus:v2.55.1",
                              "check", "rules", "/tmp/dashboard-rules.yml"], check=True)
              engineering = json.load(open("deploy/observability/grafana/dashboards/wotbtools-engineering-overview.json", encoding="utf-8"))
              daily_expr = next(target["expr"] for panel in engineering["panels"] for target in panel.get("targets", [])
                                if "wotb_dev_pr_created_day" in target.get("expr", ""))
              # Parse checks alone cannot catch regexp replacement ambiguity:
              # $1T is a named group; ${1}T preserves the date before the suffix.
              test_file = os.path.join(rule_dir, "dashboard-query-tests.yml")
              with open(test_file, "w", encoding="utf-8") as output:
                  yaml.safe_dump({"rule_files": [], "tests": [{"input_series": [
                      {"series": "wotb_dev_collector_data_ready", "values": "1"},
                      {"series": 'wotb_dev_pr_created_day{day="2026-10-16"}', "values": "3"},
                      {"series": 'wotb_dev_pr_merged_day{day="2026-10-16"}', "values": "2"},
                  ], "promql_expr_test": [{"expr": daily_expr, "eval_time": "0s", "exp_samples": [
                      {"labels": 'wotb_dev_pr_created_day{activity="Created",day="2026-10-16T00:00:00Z"}', "value": 3},
                      {"labels": 'wotb_dev_pr_merged_day{activity="Merged",day="2026-10-16T00:00:00Z"}', "value": 2},
                  ]}]}]}, output)
              subprocess.run(["docker", "run", "--rm", "--entrypoint", "promtool", "-v",
                              f"{test_file}:/tmp/dashboard-query-tests.yml:ro", "prom/prometheus:v2.55.1",
                              "test", "rules", "/tmp/dashboard-query-tests.yml"], check=True)
          print("provisioning yml + dashboards json OK")
          PY
  tofu_plans:
    name: OpenTofu validation / grafana
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # PR OpenTofu work is local validation only: fmt, init without a backend,
    # validate, and root-specific safety fixtures. No production plan or credentials
    # are available to this workflow.
    env:
      TF_IN_AUTOMATION: "true"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Format, initialize without production state, and validate
        env:
          ROOT_DIR: infra/tofu/grafana
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT_DIR"
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate
