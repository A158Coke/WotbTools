name: CI / python
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  python_unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - name: Python unit tests
        # issue #828：map-semanticizer 与 tools 两个原本手动运行的 stdlib unittest 面一并接入
        run: |
          python3 -m unittest discover -s common/python/tests -p 'test_*.py'
          python3 -m unittest discover -s map-semanticizer/tests -p 'test_*.py'
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
