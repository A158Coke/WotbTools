name: CI / python
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  python_unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.head_sha }}
      - name: Python unit tests
        # issue #828：map-semanticizer 与 tools 两个原本手动运行的 stdlib unittest 面一并接入
        run: |
          python3 -m unittest discover -s common/python/tests -p 'test_*.py'
          python3 -m unittest discover -s map-semanticizer/tests -p 'test_*.py'
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Business image migration fixtures (local PostgreSQL and loopback storage)
        run: |
          python -m pip install -r deploy/business-images/requirements.txt pgserver==0.1.4
          python -m unittest discover -s deploy/business-images -v
