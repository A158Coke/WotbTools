name: CI / alloy-tx
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.head_sha }}
      - name: Validate TX Alloy configuration
        run: bash deploy/validate-alloy-config.sh "$PWD/deploy/tx/alloy/config.alloy"
