name: Temporary generate all Playback HD maps

on:
  push:
    branches:
      - feat/maps-ai-hd-v2
    paths:
      - .github/workflows/tmp-generate-all-maps-hd.yml

permissions:
  contents: write

jobs:
  restore:
    name: restore-${{ matrix.map }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        map:
          - black-goldville
          - canal
          - canyon
          - castilla
          - copperfield
          - dead-rail
          - desert-sands
          - falls-creek
          - faust
          - fort-despair
          - ghost-factory
          - hellas
          - himmelsdorf
          - horrorstadt
          - lagoon
          - mayan-ruins
          - middleburg
          - molendijk
          - naval-frontier
          - new-bay
          - normandy
          - oasis-palms
          - port-bay
          - rockfield
          - vineyards
          - wasteland
          - winter-malinovka
          - yamato-harbor
          - yukon
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/maps-ai-hd-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Real-ESRGAN CPU tooling
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install --disable-pip-version-check realesrgan==0.3.0 pillow==11.3.0 opencv-python-headless==4.10.0.84
          python - <<'PY'
          from pathlib import Path
          import site
          candidates = [Path(p) / 'basicsr' / 'data' / 'degradations.py' for p in site.getsitepackages()]
          p = next((x for x in candidates if x.is_file()), None)
          if p is None:
              raise SystemExit(f'BasicSR degradations.py not found: {candidates}')
          text = p.read_text(encoding='utf-8')
          old = 'from torchvision.transforms.functional_tensor import rgb_to_grayscale'
          new = 'from torchvision.transforms.functional import rgb_to_grayscale'
          if old in text:
              p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Fetch Real-ESRGAN model
        run: |
          curl --fail --location --retry 3 \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth \
            --output /tmp/realesr-general-x4v3.pth

      - name: Restore ${{ matrix.map }} from original source only
        env:
          MAP_NAME: ${{ matrix.map }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import cv2
          import numpy as np
          from PIL import Image
          from basicsr.archs.srvgg_arch import SRVGGNetCompact
          from realesrgan import RealESRGANer

          name = os.environ['MAP_NAME']
          src = Path('frontend/src/assets/maps') / f'{name}.webp'
          out_dir = Path('hd-artifact')
          dst = out_dir / f'{name}.webp'
          if not src.is_file():
              raise SystemExit(f'missing original source {src}')

          model = SRVGGNetCompact(
              num_in_ch=3, num_out_ch=3, num_feat=64,
              num_conv=32, upscale=4, act_type='prelu')
          upsampler = RealESRGANer(
              scale=4,
              model_path='/tmp/realesr-general-x4v3.pth',
              model=model,
              tile=256,
              tile_pad=12,
              pre_pad=0,
              half=False,
              gpu_id=None)

          image = cv2.imread(str(src), cv2.IMREAD_COLOR)
          if image is None:
              raise SystemExit(f'failed to decode {src}')
          restored, _ = upsampler.enhance(image, outscale=2)

          # Stronger perceived-detail finish without any geometric transform.
          lab = cv2.cvtColor(restored, cv2.COLOR_BGR2LAB)
          l, a, b = cv2.split(lab)
          l = cv2.createCLAHE(clipLimit=1.35, tileGridSize=(12, 12)).apply(l)
          finished = cv2.cvtColor(cv2.merge((l, a, b)), cv2.COLOR_LAB2BGR)
          blur = cv2.GaussianBlur(finished, (0, 0), 0.85)
          finished = cv2.addWeighted(finished, 1.12, blur, -0.12, 0)
          finished = np.clip(finished, 0, 255).astype(np.uint8)

          out_dir.mkdir(parents=True, exist_ok=True)
          rgb = cv2.cvtColor(finished, cv2.COLOR_BGR2RGB)
          Image.fromarray(rgb).save(dst, 'WEBP', quality=96, method=6, exact=True)
          with Image.open(src) as s, Image.open(dst) as d:
              if d.size != (s.size[0] * 2, s.size[1] * 2):
                  raise SystemExit(f'bad size {name}: {s.size} -> {d.size}')
              print(f'{name}: {s.size} -> {d.size}; {dst.stat().st_size} bytes')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hd-${{ matrix.map }}
          path: hd-artifact/${{ matrix.map }}.webp
          if-no-files-found: error
          compression-level: 0

  collect:
    name: collect-29-hd-maps
    needs: restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/maps-ai-hd-v2
          fetch-depth: 0

      - name: Replace previous HD experiments with complete artifact set
        run: |
          rm -rf frontend/src/assets/maps-hd
          mkdir -p frontend/src/assets/maps-hd

      - uses: actions/download-artifact@v4
        with:
          pattern: hd-*
          path: frontend/src/assets/maps-hd
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build 29-map manifest and switch Playback registry to HD
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          from PIL import Image

          src_dir = Path('frontend/src/assets/maps')
          dst_dir = Path('frontend/src/assets/maps-hd')
          map_images = Path('frontend/src/data/mapImages.js')
          sources = sorted(src_dir.glob('*.webp'))
          enhanced = sorted(dst_dir.glob('*.webp'))
          if len(sources) != 29:
              raise SystemExit(f'expected 29 originals, found {len(sources)}')
          if len(enhanced) != 29:
              raise SystemExit(f'expected 29 HD outputs, found {len(enhanced)}')
          if [p.name for p in sources] != [p.name for p in enhanced]:
              raise SystemExit('HD filenames do not exactly match original registry')

          def sha256(path: Path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          entries = []
          for src in sources:
              dst = dst_dir / src.name
              with Image.open(src) as s, Image.open(dst) as d:
                  source_size = list(s.size)
                  enhanced_size = list(d.size)
              if enhanced_size != [source_size[0] * 2, source_size[1] * 2]:
                  raise SystemExit(f'bad dimensions for {src.name}')
              entries.append({
                  'source': f'frontend/src/assets/maps/{src.name}',
                  'enhanced': f'frontend/src/assets/maps-hd/{src.name}',
                  'method': 'REAL_ESRGAN_GENERAL_X4V3_X2_PLUS_LOCAL_DETAIL',
                  'sourcePixels': source_size,
                  'enhancedPixels': enhanced_size,
                  'sourceSha256': sha256(src),
                  'enhancedSha256': sha256(dst),
                  'webpQuality': 96,
                  'sourceOfTruth': 'ORIGINAL_ONLY',
                  'geometryTransform': 'NONE'
              })

          manifest = {
              'schemaVersion': 2,
              'policy': 'ORIGINALS_PRESERVED_IN_ASSETS_MAPS',
              'generationRule': 'EVERY_HD_ASSET_GENERATED_DIRECTLY_FROM_ORIGINAL_SOURCE',
              'expectedMapCount': 29,
              'entries': entries
          }
          (dst_dir / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          text = map_images.read_text(encoding='utf-8')
          text = text.replace("from '../assets/maps/", "from '../assets/maps-hd/")
          map_images.write_text(text, encoding='utf-8')
          print('HD coverage 29/29 complete')
          PY

      - name: Verify immutable originals and complete Playback coverage
        run: |
          git diff --exit-code -- frontend/src/assets/maps/
          test "$(find frontend/src/assets/maps-hd -maxdepth 1 -name '*.webp' | wc -l)" -eq 29
          test "$(grep -c "from '../assets/maps-hd/" frontend/src/data/mapImages.js)" -eq 29
          ! grep -q "from '../assets/maps/" frontend/src/data/mapImages.js
          grep -q '"expectedMapCount": 29' frontend/src/assets/maps-hd/manifest.json

      - name: Commit complete all-map HD set
        run: |
          git config user.name 'WotbTools AI'
          git config user.email 'wotbtools-ai@local'
          git add frontend/src/assets/maps-hd frontend/src/data/mapImages.js
          git rm .github/workflows/tmp-generate-all-maps-hd.yml
          git commit -m 'feat(maps): AI-enhance all 29 playback basemaps'
          git push origin HEAD:feat/maps-ai-hd-v2
