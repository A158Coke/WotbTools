name: CI / android
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Test bounded CI network retry helper
        run: bash scripts/ci/test-network-retry.sh
      - name: Accept Android SDK licenses (best-effort)
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
      # PR B §30：APK 里必须真的带着可离线运行的前端 bundle（index + JS/CSS + Agent WASM + 本地资源）。
      # 只断言「能构建」不够 —— 这里构建 bundle、校验 commit-addressed WASM 产物，再把 bundle 复制进
      # assets，最后在 assembleDebug 之后直接检查 APK 内容。
      - name: Build the local-first frontend bundle into APK assets
        run: |
          set -euo pipefail
          bash scripts/fetch-agent-wasm.sh
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run build:android
      - name: Assemble debug APK and run Android JVM unit tests
        working-directory: android
        run: bash ../scripts/ci/run-with-network-retry.sh "Android Gradle dependency resolution" gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Assert the APK carries the offline frontend bundle
        run: |
          set -euo pipefail
          ref="$(python3 -c 'import json;print(json.load(open("deploy/agent/source.json"))["ref"])')"
          manifest_ref="$(python3 -c 'import json;print(json.load(open("android/app/src/main/assets/web/bundle-manifest.json"))["agentWasm"]["commit"])')"
          test "$ref" = "$manifest_ref" || {
            echo "::error::bundle manifest 的 Agent 身份与 deploy/agent/source.json 不一致"
            exit 1
          }
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          # 先落成 listing 文件再断言：`producer | grep -q` 在 `set -o pipefail` 下会因为 grep 提前
          # 退出、producer 收到 SIGPIPE（141）而把「命中」误判成失败（本步骤第一版踩过这个坑）。
          listing_file="$RUNNER_TEMP/debug-apk-listing.txt"
          unzip -Z1 "$apk" > "$listing_file"
          for required in \
            assets/web/index.html \
            assets/web/bundle-manifest.json \
            "assets/web/wasm/$ref/wotb_replay_wasm.js" \
            "assets/web/wasm/$ref/wotb_replay_wasm_bg.wasm"; do
            grep -Fxq "$required" "$listing_file" || {
              echo "::error::APK 缺少离线前端 bundle 文件：$required"
              # 失败要能自解释：把 APK 里实际的 assets/web 前若干项打出来，而不是只留一句结论。
              grep '^assets/web/' "$listing_file" | head -n 10 || true
              echo "assets/web total: $(grep -c '^assets/web/' "$listing_file" || true)"
              exit 1
            }
          done
          echo "APK carries the offline frontend bundle: $(grep -c '^assets/web/' "$listing_file") files"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          python3 scripts/android-release/android_contract.py bundle \
            --apk "$apk" --badging "$RUNNER_TEMP/apk-badging.txt" --contract contracts/android-native-bridge.json \
            --pin deploy/agent/source.json --source "$(git rev-parse HEAD)" \
            --version "$(sed -n 's/^wotbVersion=//p' android/gradle.properties)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  android_release_helpers:
    name: Android release helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - name: Shell syntax check
        run: |
          set -euo pipefail
          bash -n scripts/android-release/resolve-version.sh
          bash -n scripts/android-release/check-release-guards.sh
          bash -n scripts/android-release/test-release.sh
      - name: Release helper unit tests
        run: bash scripts/android-release/test-release.sh
  android_contract:
    name: Android contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
      - name: Validate committed Android contract
        run: |
          set -euo pipefail
          python3 scripts/android-release/android_contract.py validate \
            --contract contracts/android-native-bridge.json \
            --gradle-properties android/gradle.properties \
            --frontend frontend/src/platform/nativeBridgeContract.js \
            --native-source android/app/src/main/java/com/wotbtools/app/NativeBridge.kt \
            --native-source android/app/src/main/java/com/wotbtools/app/MainActivity.kt \
            --native-source android/app/src/main/java/com/wotbtools/app/ReplayIntentHandler.kt \
            --native-source android/app/src/main/java/com/wotbtools/app/ConnectivityMonitor.kt \
            --frontend-source frontend/src/platform/nativeBridgeContract.js \
            --frontend-source frontend/src/platform/androidAuthProvider.js \
            --frontend-source frontend/src/platform/connectivity.js
          bash scripts/android-release/test-android-contract.sh
      - name: Enforce version and bridge compatibility against base
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          git show "$BASE_SHA:android/gradle.properties" > /tmp/base-gradle.properties
          if git cat-file -e "$BASE_SHA:contracts/android-native-bridge.json" 2>/dev/null; then
            git show "$BASE_SHA:contracts/android-native-bridge.json" > /tmp/base-android-native-bridge.json
          else
            # First introduction of the contract has no historical JSON baseline;
            # validate the committed head contract now and start breaking diffs
            # from this SSOT on the next PR.
            cp contracts/android-native-bridge.json /tmp/base-android-native-bridge.json
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/android-changed-paths.txt
          BASE_VERSION="$(sed -n 's/^wotbVersion=//p' /tmp/base-gradle.properties | head -n1)"
          HEAD_VERSION="$(sed -n 's/^wotbVersion=//p' android/gradle.properties | head -n1)"
          INITIAL_VERSION_BASELINE=false
          if [ -z "$BASE_VERSION" ]; then
            # First introduction of Version-as-Code has no historical version;
            # use the committed head as the initial baseline.
            BASE_VERSION="$HEAD_VERSION"
            INITIAL_VERSION_BASELINE=true
          fi
          FE_VERSIONS="$(python3 - <<'PY'
          import re
          text = open('frontend/src/platform/nativeBridgeContract.js', encoding='utf-8').read()
          match = re.search(r'SUPPORTED_NATIVE_BRIDGE_VERSIONS\s*=\s*Object\.freeze\(\[([^\]]*)\]\)', text)
          if not match:
              raise SystemExit('frontend supported Native Bridge versions declaration is missing')
          print(','.join(re.findall(r'\b[0-9]+\b', match.group(1))))
          PY
          )"
          python3 scripts/android-release/android_contract.py gate \
            --base-contract /tmp/base-android-native-bridge.json \
            --head-contract contracts/android-native-bridge.json \
            --base-version "$BASE_VERSION" \
            --head-version "$HEAD_VERSION" \
            --paths /tmp/android-changed-paths.txt \
            --frontend-versions "$FE_VERSIONS" \
            $([ "$INITIAL_VERSION_BASELINE" = true ] && echo --initial-version-baseline)
