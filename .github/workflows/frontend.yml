name: Frontend

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/frontend.yml
      - .dockerignore
      - docker/Dockerfile.frontend
      - frontend/**
      - common/map_names.json
      - common/tankopedia-tier10.json
      - common/shot-tank-data.json
      - common/assets/**
      - deploy/agent/source.json
      - scripts/fetch-agent-wasm.sh
      - HISTORY.md
      - docs/architecture/TECHNICAL_EVOLUTION.md
      - docs/WotBTools_League_Rating_V6.md
      - deploy/nginx/nginx.conf
      - deploy/tx/nginx/**
      - deploy/check-production-freshness.sh
      - deploy/tx/build-frontend-from-gitee.sh
      - deploy/tx/sponsor-fingerprint.sh
      - deploy/sponsor/**
      - deploy/tx/frontend.compose.yml
      - deploy/tx/deploy.sh
      - deploy/tx/with-deploy-lock.sh
      - deploy/tx/common.compose.yml
      - deploy/tx/docker-compose.yml
  workflow_dispatch:

permissions:
  contents: read


env:
  PRODUCTION_INPUT_PATHS: |
    .github/workflows/frontend.yml
    .dockerignore
    docker/Dockerfile.frontend
    frontend/**
    common/map_names.json
    common/tankopedia-tier10.json
    common/shot-tank-data.json
    common/assets/**
    deploy/agent/source.json
    scripts/fetch-agent-wasm.sh
    HISTORY.md
    docs/architecture/TECHNICAL_EVOLUTION.md
    docs/WotBTools_League_Rating_V6.md
    deploy/nginx/nginx.conf
    deploy/tx/nginx/**
    deploy/check-production-freshness.sh
    deploy/tx/build-frontend-from-gitee.sh
    deploy/tx/sponsor-fingerprint.sh
    deploy/sponsor/**
    deploy/tx/frontend.compose.yml
    deploy/tx/deploy.sh
    deploy/tx/with-deploy-lock.sh
    deploy/tx/common.compose.yml
    deploy/tx/docker-compose.yml
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  mirror_gitee:
    name: Mirror exact GitHub source to Gitee
    concurrency:
      group: production-gitee-mirror
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Reject non-main invocation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "Unsupported mirror event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          [ "$EVENT_REF" = refs/heads/main ] || {
            echo "Gitee production mirror must run from main." >&2
            exit 1
          }

      - name: Mirror WotbTools to Gitee
        uses: Yikun/hub-mirror-action@ec47170fa9d126a4bee5a1ab9359845bb1395248
        with:
          src: github/A158Coke
          dst: gitee/A158Coke
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          static_list: WotbTools
          account_type: user
          force_update: true
          timeout: 10m

  build:
    concurrency:
      group: tx-production-build
      cancel-in-progress: false
      queue: max
    needs: [mirror_gitee]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: tx-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate production asset origin
        env:
          ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$ASSET_BASE_URL" ] || { echo 'Repository variable ASSET_BASE_URL is required.' >&2; exit 1; }
          case "$ASSET_BASE_URL" in https://*) ;; *) echo 'ASSET_BASE_URL must be an https:// origin.' >&2; exit 1 ;; esac
          case "$ASSET_BASE_URL" in *[[:space:]]*) echo 'ASSET_BASE_URL must not contain whitespace.' >&2; exit 1 ;; esac
          [ "${ASSET_BASE_URL%/}" = "$ASSET_BASE_URL" ] || { echo 'ASSET_BASE_URL must not end with /.' >&2; exit 1; }

      - name: Freeze current main
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [ "$REF_NAME" = refs/heads/main ] || { echo 'Manual deployment must dispatch from main.' >&2; exit 1; }
          fi
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
          case "$TCR_REGISTRY" in *.tencentyun.com) ;; *) echo 'TCR_REGISTRY must be a Tencent TCR host.' >&2; exit 1 ;; esac
          [[ "$TCR_NAMESPACE" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo 'TCR_NAMESPACE is invalid.' >&2; exit 1; }

      - name: Download pinned Agent WASM release asset
        id: agent
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python3 - "$GITHUB_WORKSPACE/deploy/agent/source.json" <<'PY'
          import json, shlex, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          artifact = data.get("artifact") or {}
          repo = data.get("repo", "")
          release = artifact.get("release", "")
          asset = artifact.get("asset", "")
          sha = artifact.get("sha256", "")
          if not (repo and release and asset and len(sha) == 64):
              raise SystemExit("deploy/agent/source.json has incomplete artifact metadata")
          base = repo if repo.startswith("http") else "https://github.com/" + repo
          values = {
              "AGENT_URL": f"{base}/releases/download/{release}/{asset}",
              "AGENT_ASSET": asset,
              "AGENT_SHA": sha,
          }
          for key, value in values.items():
              print(f"{key}={shlex.quote(value)}")
          PY
          )"
          target="$RUNNER_TEMP/$AGENT_ASSET"
          curl --fail --silent --show-error --location --retry 3 "$AGENT_URL" -o "$target"
          printf '%s  %s\n' "$AGENT_SHA" "$target" | sha256sum -c --quiet
          {
            echo "asset=$AGENT_ASSET"
            echo "sha256=$AGENT_SHA"
            echo "file=$target"
          } >> "$GITHUB_OUTPUT"

      # Sponsor 运行时内容（收款码 + 配置）不进 Git 历史：它作为 GitHub Release 资产发布，
      # 由 deploy/sponsor/content.json 钉住 release/asset/sha256（与 Agent WASM 同一模式）。
      # 这里下载并校验，随后 stage 到 TX：远端把它落进构建上下文（publicDir），并把内容指纹
      # 纳入镜像 identity —— 换码必然换 tag/重建，内容未变则照常复用 immutable tag。
      - name: Download pinned sponsor runtime content
        id: sponsor
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          pin="$GITHUB_WORKSPACE/deploy/sponsor/content.json"
          if [ ! -f "$pin" ]; then
            {
              echo "state=absent"
              echo "bundle="
              echo "fingerprint="
            } >> "$GITHUB_OUTPUT"
            echo "no sponsor content pin: building without sponsor runtime content"
            exit 0
          fi
          eval "$(python3 - "$pin" <<'PY'
          import json, shlex, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          artifact = data.get("artifact") or {}
          repo = data.get("repo", "")
          release = artifact.get("release", "")
          asset = artifact.get("asset", "")
          sha = artifact.get("sha256", "")
          if not (repo and release and asset and len(sha) == 64):
              raise SystemExit("deploy/sponsor/content.json has incomplete artifact metadata")
          base = repo if repo.startswith("http") else "https://github.com/" + repo
          values = {
              "SPONSOR_URL": f"{base}/releases/download/{release}/{asset}",
              "SPONSOR_ASSET": asset,
              "SPONSOR_SHA": sha,
          }
          for key, value in values.items():
              print(f"{key}={shlex.quote(value)}")
          PY
          )"
          bundle="$RUNNER_TEMP/$SPONSOR_ASSET"
          curl --fail --silent --show-error --location --retry 3 "$SPONSOR_URL" -o "$bundle"
          printf '%s  %s\n' "$SPONSOR_SHA" "$bundle" | sha256sum -c --quiet
          {
            echo "state=injected"
            echo "bundle=$bundle"
            echo "fingerprint=$SPONSOR_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "sponsor runtime content pinned: $SPONSOR_ASSET (${SPONSOR_SHA:0:12})"

      - name: Configure TX SSH
        shell: bash
        env:
          TX_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_PORT: ${{ secrets.TX_VPS_PORT }}
          TX_KEY: ${{ secrets.TX_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${TX_HOST:?TX_VPS_HOST is required}"
          : "${TX_PORT:?TX_VPS_PORT is required}"
          : "${TX_KEY:?TX_VPS_SSH_KEY is required}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TX_KEY" | tr -d '\r' > ~/.ssh/tx-frontend-build
          chmod 600 ~/.ssh/tx-frontend-build
          ssh-keyscan -T 15 -p "$TX_PORT" "$TX_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage TX frontend builder and pinned Agent WASM artifact
        shell: bash
        env:
          TX_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_USER: ${{ secrets.TX_VPS_USER }}
          TX_PORT: ${{ secrets.TX_VPS_PORT }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          AGENT_FILE: ${{ steps.agent.outputs.file }}
          AGENT_ASSET: ${{ steps.agent.outputs.asset }}
          SPONSOR_BUNDLE: ${{ steps.sponsor.outputs.bundle }}
        run: |
          set -euo pipefail
          remote_script="/tmp/wotbtools-frontend-build-${RUN_ID}-${RUN_ATTEMPT}.sh"
          remote_agent="/tmp/wotbtools-agent-${RUN_ID}-${RUN_ATTEMPT}-${AGENT_ASSET}"
          remote_sponsor="/tmp/wotbtools-sponsor-${RUN_ID}-${RUN_ATTEMPT}.tar.gz"
          scp -i ~/.ssh/tx-frontend-build -P "$TX_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$GITHUB_WORKSPACE/deploy/tx/build-frontend-from-gitee.sh" "$TX_USER@$TX_HOST:$remote_script"
          scp -i ~/.ssh/tx-frontend-build -P "$TX_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$AGENT_FILE" "$TX_USER@$TX_HOST:$remote_agent"
          chmod_targets="chmod 700 '$remote_script' && chmod 600 '$remote_agent'"
          if [ -n "$SPONSOR_BUNDLE" ]; then
            scp -i ~/.ssh/tx-frontend-build -P "$TX_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
              "$SPONSOR_BUNDLE" "$TX_USER@$TX_HOST:$remote_sponsor"
            chmod_targets="$chmod_targets && chmod 600 '$remote_sponsor'"
          fi
          ssh -i ~/.ssh/tx-frontend-build -p "$TX_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$TX_USER@$TX_HOST" "$chmod_targets"

      - name: Build and publish immutable frontend image on TX
        id: remote_build
        shell: bash
        env:
          TX_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_USER: ${{ secrets.TX_VPS_USER }}
          TX_PORT: ${{ secrets.TX_VPS_PORT }}
          SOURCE_SHA: ${{ github.sha }}
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
          ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          AGENT_ASSET: ${{ steps.agent.outputs.asset }}
          SPONSOR_STATE: ${{ steps.sponsor.outputs.state }}
          SPONSOR_FINGERPRINT: ${{ steps.sponsor.outputs.fingerprint }}
        run: |
          set -euo pipefail
          remote_script="/tmp/wotbtools-frontend-build-${RUN_ID}-${RUN_ATTEMPT}.sh"
          remote_agent="/tmp/wotbtools-agent-${RUN_ID}-${RUN_ATTEMPT}-${AGENT_ASSET}"
          remote_sponsor="/tmp/wotbtools-sponsor-${RUN_ID}-${RUN_ATTEMPT}.tar.gz"
          log="$RUNNER_TEMP/tx-frontend-build.log"

          sponsor_bundle="-"
          sponsor_fingerprint="-"
          if [ "$SPONSOR_STATE" = "injected" ]; then
            sponsor_bundle="$remote_sponsor"
            sponsor_fingerprint="$SPONSOR_FINGERPRINT"
          fi

          ssh \
            -i ~/.ssh/tx-frontend-build \
            -p "$TX_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=6 \
            "$TX_USER@$TX_HOST" \
            "bash '$remote_script' build-publish '$SOURCE_SHA' '$TCR_REGISTRY' '$TCR_NAMESPACE' '$ASSET_BASE_URL' '$remote_agent' '$sponsor_bundle' '$sponsor_fingerprint'" \
            | tee "$log"

          python3 - "$log" >> "$GITHUB_OUTPUT" <<'PY'
          import os
          import pathlib
          import sys

          values = {}
          for line in pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines():
              if not line.startswith("RESULT "):
                  continue
              key, value = line[7:].split("=", 1)
              values[key] = value

          required = {
              "source_sha", "image", "digest", "reused",
              "build_commit_verified", "asset_base_url_verified", "wasm_verified",
              "sponsor_runtime_content",
          }
          missing = required - values.keys()
          if missing:
              raise SystemExit(f"missing remote frontend build outputs: {sorted(missing)}")
          for key in ("build_commit_verified", "asset_base_url_verified", "wasm_verified"):
              if values[key] != "true":
                  raise SystemExit(f"remote frontend verification failed: {key}")
          # 镜像里的 sponsor 状态必须与本次注入结果一致：staged 了却没进镜像（或反之）都是发布故障，
          # 不能只靠"远端说它验过了"。
          expected_sponsor = os.environ.get("SPONSOR_STATE", "")
          if values["sponsor_runtime_content"] != expected_sponsor:
              raise SystemExit(
                  "sponsor runtime content mismatch: runner=%r image=%r"
                  % (expected_sponsor, values["sponsor_runtime_content"])
              )

          for key, value in values.items():
              print(f"{key}={value}")
          PY

      - name: Cleanup staged TX frontend build inputs
        if: always()
        shell: bash
        env:
          TX_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_USER: ${{ secrets.TX_VPS_USER }}
          TX_PORT: ${{ secrets.TX_VPS_PORT }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          AGENT_ASSET: ${{ steps.agent.outputs.asset }}
        run: |
          set -u
          remote_script="/tmp/wotbtools-frontend-build-${RUN_ID}-${RUN_ATTEMPT}.sh"
          remote_agent="/tmp/wotbtools-agent-${RUN_ID}-${RUN_ATTEMPT}-${AGENT_ASSET}"
          remote_sponsor="/tmp/wotbtools-sponsor-${RUN_ID}-${RUN_ATTEMPT}.tar.gz"
          ssh -i ~/.ssh/tx-frontend-build -p "$TX_PORT" -o BatchMode=yes -o ConnectTimeout=10 \
            "$TX_USER@$TX_HOST" "rm -f -- '$remote_script' '$remote_agent' '$remote_sponsor'" || \
            echo "WARNING: failed to clean staged TX frontend build inputs"

  deploy:
    concurrency:
      group: production-maintenance
      cancel-in-progress: false
      queue: max
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: tx-production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Reject stale main before staging production inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"

      - name: Prepare TX staging directories
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          script: |
            set -eu
            root="${WOTB_TX_ROOT:-/opt/wotb-tx}"
            mkdir -p "$root/deploy.incoming/deploy"
            # 本次不再传输的目录必须一并清掉：删除 sponsor pin 后旧 content.json 若残留，
            # 远端会继续按陈旧指纹算 identity（2026-10-10 复审 P2）。`WOTB_TX_ROOT` 只为
            # 本地回归注入（默认路径不变，见 deploy/test_frontend_image_identity.py）。
            rm -rf -- "$root/deploy.incoming/deploy/tx" "$root/deploy.incoming/deploy/sponsor"
            mkdir -p "$root/deploy.incoming/deploy/tx"

      - name: Stage TX runtime files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tx
          target: /opt/wotb-tx/deploy.incoming
          overwrite: true

      - name: Stage sponsor pin when present
        # 可选 staging：pin 被删除时整个 deploy/sponsor 目录不存在，合并进必选 scp 会让步骤失败；
        # 与"无 pin ⇒ 无赞助内容"的发布路径对齐（2026-10-10 复审 P2）。target 与必选步骤一致，
        # 保证远端路径仍是 deploy.incoming/deploy/sponsor/content.json（identity 派生依赖它）。
        if: ${{ hashFiles('deploy/sponsor/content.json') != '' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/sponsor
          target: /opt/wotb-tx/deploy.incoming
          overwrite: true

      - name: Reject stale main before TX mutation
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"

      - name: Reconcile only Frontend under the TX host lock
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 30m
          envs: WOTB_DEPLOY_SERVICE,WOTB_DEPLOY_CONFIG_SHA,TX_IMAGE_REGISTRY_PREFIX,ASSET_BASE_URL,TX_BACKEND_UPSTREAM,TX_AI_UPSTREAM
          script: |
            set -euo pipefail
            bash /opt/wotb-tx/deploy.incoming/deploy/tx/with-deploy-lock.sh bash -s <<'LOCKED'
            set -euo pipefail
            export WOTB_DEPLOY_SERVICE=frontend
            export WOTB_DEPLOY_CONFIG_SHA='${{ github.sha }}'
            export TX_IMAGE_REGISTRY_PREFIX='${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}'
            source_sha='${{ github.sha }}'
            # 不可变 tag 与 TX1 构建脚本**同公式同输入**（公式唯一定义见
            # deploy/tx/build-frontend-from-gitee.sh，三处口径由 deploy/test_frontend_image_identity.py
            # 看护）：sha256(source_sha + ASSET_BASE_URL + sponsor 内容指纹)[0:12]。
            # identity 必须在此就地重算、不得走 job outputs（契约见 scripts/ci/test-workflow-contract.sh：
            # GitHub 会把形似密钥的 SHA/digest 打码）——2026-10-10 事故：此处漏掉 sponsor 指纹
            # ⇒ 每次都 `:sha-<另一枚> : not found`。指纹由随包 stage 的 pin 派生（同 SHA 同值）。
            sponsor_fingerprint="$(bash /opt/wotb-tx/deploy.incoming/deploy/tx/sponsor-fingerprint.sh /opt/wotb-tx/deploy.incoming)"
            identity="$(printf '%s\n%s\n%s' "$source_sha" "$ASSET_BASE_URL" "$sponsor_fingerprint" | sha256sum | cut -c1-12)"
            immutable_ref="$TX_IMAGE_REGISTRY_PREFIX/wotbtools-frontend:sha-$identity"
            digest="$(timeout --kill-after=30s 60s docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$immutable_ref")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Invalid frontend TCR digest for $immutable_ref" >&2
              exit 1
            }
            export TX_FRONTEND_IMAGE_REF="$TX_IMAGE_REGISTRY_PREFIX/wotbtools-frontend@$digest"
            bash /opt/wotb-tx/deploy.incoming/deploy/tx/deploy.sh
            LOCKED
        env:
          WOTB_DEPLOY_SERVICE: frontend
          WOTB_DEPLOY_CONFIG_SHA: ${{ github.sha }}
          TX_IMAGE_REGISTRY_PREFIX: ${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}
          ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}
          # K6B-2A: this consumer is cut over to the reviewed TX1 WireGuard service
          # endpoint for the Business API application port. It is the only consumer
          # moved in K6B-2A; every other private placement stays Docker-local until
          # its own step, and the read-only gate asserts the same placement.
          TX_BACKEND_UPSTREAM: http://10.20.0.1:8087
          TX_AI_UPSTREAM: http://10.20.0.2:8089
