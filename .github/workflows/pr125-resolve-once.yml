name: PR125 one-shot conflict resolver

on:
  push:
    branches:
      - fix/dark-theme-ui-regressions
    paths:
      - .github/workflows/pr125-resolve-once.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dark-theme-ui-regressions
          fetch-depth: 0

      - name: Merge PR125 metadata and documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # User-visible version history: main already owns 2.12.18/2.12.19,
          # so the rebased PR125 entry gets the next monotonic version number.
          versions_path = Path('frontend/src/data/versions.json')
          versions = json.loads(versions_path.read_text(encoding='utf-8'))
          if any(item.get('v') == '2.12.20' for item in versions):
              raise SystemExit('versions.json already contains 2.12.20')
          if not versions or versions[0].get('v') != '2.12.19':
              raise SystemExit(f'unexpected versions.json head: {versions[0].get("v") if versions else None}')
          versions.insert(0, {
              'v': '2.12.20',
              'date': '2026-08-24',
              'tag': 'chg',
              'zh': '界面改为只支持暗色主题（移除亮色/跟随系统切换）；回放上传区新增「战局回放 / AI 复盘」直通按钮——单个回放可直接进入，多个回放需先在下拉中选择目标回放；训练赛/联赛回放的汇总页签显示真实选手人数；赞助页全新深色战场风格设计。',
              'en': 'The site is now dark-only (the light/auto theme switcher is removed); the replay upload area gains direct Battle Replay / AI Review buttons - a single replay can go straight in, while multiple replays require picking the target in the dropdown first; the aggregate tab for training/tournament replays now shows the real player count; the sponsor page gets a new dark battlefield-style design.',
              'ru': 'Сайт теперь только тёмный (переключатель светлой/авто темы убран); в области загрузки реплеев появились кнопки «Повтор боя» / «AI-разбор» — одиночный реплей запускается сразу, а при нескольких нужно сначала выбрать целевой в выпадающем списке; вкладка сводки для тренировочных/турнирных реплеев показывает реальное число игроков; страница поддержки получила новый тёмный дизайн в стиле поля боя.'
          })
          versions_path.write_text(json.dumps(versions, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          product_path = Path('docs/CHANGELOG-PRODUCT.md')
          product = product_path.read_text(encoding='utf-8')
          added = (
              '- **上传区可直接进入「战局回放」或「AI 复盘」**：选择回放文件后即可直接开始（单个回放直接进入；多个回放需在下拉中明确指定目标回放，不再默认指向第一场）。\n'
              '- **全新赞助页**：支持页改为深色战场风格设计（战场背景图 + 卡片式布局），内容与扫码赞助方式不变。\n'
          )
          fixed = (
              '- **训练赛/联赛回放的「汇总」页签显示真实选手数**：此前显示为 0（普通回放聚合行数），现在按联赛选手汇总数量正确显示。\n'
              '- **多文件上传时 AI 复盘/战局回放不再误操作**：现在必须在下拉中明确选择目标回放，已选目标被移除后动作失效，不会悄悄改指第一场。\n'
          )
          if '上传区可直接进入「战局回放」或「AI 复盘」' not in product:
              product = replace_once(product, '### Added\n', '### Added\n' + added, 'product Added')
          if '训练赛/联赛回放的「汇总」页签显示真实选手数' not in product:
              product = replace_once(product, '### Fixed\n', '### Fixed\n' + fixed, 'product Fixed')
          product_path.write_text(product, encoding='utf-8')

          technical_path = Path('docs/CHANGELOG.md')
          technical = technical_path.read_text(encoding='utf-8')
          technical_entry = (
              '- **暗色主题收敛 + Replay Workspace 直通动作 + 赞助页重做（fix/dark-theme-ui-regressions）**：\n'
              '  - **主题收敛为仅暗色**：删除主题切换器与偏好持久化（useTheme / utils/theme.js / wotbtools-theme cookie），index.html 与 sponsor.html 首屏固定 data-theme="dark"；tokens.css :root 成为单一事实源，showcase 背景 veil 删除 light 分支；删除废弃静态主页/个人中心页（homepage/index.html、homepage/profile.html）与废弃 dark-only.css 覆盖层；App.vue 清理遗留 .theme-bar 死样式。\n'
              '  - **Replay Workspace 直通动作**：FileUploader.vue 上传区新增「战局回放 / AI 复盘」一级动作——单文件直接进入、多文件必须显式选择目标 replay（禁止 fallback 第一场，目标被移除则失效）；新增 utils/replayView.js（replayAggregatePlayerCount），League 汇总 tab 展示真实选手数（playerSummaries）。\n'
              '  - **i18n 组合层**：新增 locales/feature-messages.json + locales/messages.js（非破坏性深合并，替代 main.js 运行时 patch imported locale 对象），补齐 replay.processing_job.* 三语与 upload.action_replay_*；sponsor 页新增 sponsor_intro / about_title 文案。\n'
              '  - **Showcase 回归防护**：新增 styles/showcase-regressions.css（HoF admin sticky 层级 / lb-toolbar / analysis-panel-head / replay-task-card 与 modal 叠放），由 main.js 最后加载；Dockerfile.frontend 为赞助页发布战场背景图。\n'
          )
          if '暗色主题收敛 + Replay Workspace 直通动作 + 赞助页重做' not in technical:
              technical = replace_once(technical, '### Added\n', '### Added\n' + technical_entry, 'technical Added')
          technical_path.write_text(technical, encoding='utf-8')

          guide_path = Path('docs/DEVELOPER_GUIDE.md')
          guide = guide_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '仓库按"语言/形态"分层：`common/`(共享资源) + `common/python/`(车辆库更新脚本) + `java/`(Java 主线 wotb-core + wotb-web) + `frontend/`(Vue 3 + 工具集主页) + `docker/`(镜像构建 + 本地开发 compose `docker/online/`)。',
                  '仓库按"语言/形态"分层：`common/`(共享资源) + `common/python/`(车辆库更新脚本) + `java/`(Java 主线 wotb-core + wotb-web) + `frontend/`(Vue 3 SPA + 独立赞助页) + `docker/`(镜像构建 + 本地开发 compose `docker/online/`)。',
                  'guide repo summary'
              ),
              (
                  '│   │   ├── composables/          #   组合式模块（useTheme / useReplay / useColumns / useAuth）\n│   │   ├── utils/                #   API、i18n 显示、竞态控制、主题与通用工具\n│   │   ├── styles/               #   独立入口共享主题变量（theme.css）\n│   │   ├── components/           #   UI 组件\n│   │   └── locales/              #   三语（zh / en / ru）\n│   ├── index.html  package.json  vite.config.js  .npmrc\n│   ├── homepage/                 #   工具集主页与运行时配置赞助页\n│   │   ├── index.html\n│   │   ├── sponsor.html\n│   │   └── sponsor-config.js',
                  '│   │   ├── composables/          #   组合式模块（useReplay / useColumns / useAuth 等）\n│   │   ├── utils/                #   API、i18n 显示、竞态控制与通用工具\n│   │   ├── styles/               #   dark-only design tokens + Showcase 分层样式\n│   │   ├── components/           #   UI 组件\n│   │   └── locales/              #   三语基础 JSON + feature-messages/messages 组合层\n│   ├── index.html  package.json  vite.config.js  .npmrc\n│   ├── homepage/                 #   独立赞助页与运行时配置\n│   │   ├── sponsor.html\n│   │   └── sponsor-config.js',
                  'guide frontend tree'
              ),
              (
                  '│   │   ├── wotbtoolslogo.png  icon.ico  icon.png   #   Dockerfile 构建时 → homepage + frontend/public',
                  '│   │   ├── wotbtoolslogo.png  icon.ico  icon.png   #   Dockerfile 构建时 → frontend image root',
                  'guide asset tree'
              ),
              (
                  '- `App.vue` 顶栏样式为全局样式：桌面端固定在顶部，≤1080px 时切换为 sticky + flex-wrap（导航换行到第二行并自带横向滚动），任意宽度下顶栏自身可横向滚动，保证语言选择、主题切换、反馈入口、版本历史、联系入口和个人中心入口都不会被挤出屏幕。顶栏反馈按钮为外链 `https://github.com/A158Coke/WotbTools/issues/new`（`target="_blank"`，三语文案 `app.feedback`）；版本历史（`version.btn`）与联系页（`contact.nav`）为 SPA 内导航。\n- Vue SPA 主入口视觉变量集中在 `App.vue` 的 `:root` / `[data-theme="dark"]`；`frontend/src/styles/theme.css` 复用同一套变量。首页、上传区、排行榜和表格应优先复用这些变量，避免局部硬编码色板。',
                  '- `App.vue` 顶栏样式为全局样式：桌面端固定在顶部，≤1080px 时切换为 sticky + flex-wrap（导航换行到第二行并自带横向滚动），任意宽度下顶栏自身可横向滚动，保证语言选择、反馈入口、版本历史、联系入口和个人中心入口都不会被挤出屏幕。顶栏反馈按钮为外链 `https://github.com/A158Coke/WotbTools/issues/new`（`target="_blank"`，三语文案 `app.feedback`）；版本历史（`version.btn`）与联系页（`contact.nav`）为 SPA 内导航。\n- **产品只支持暗色主题**：`frontend/index.html` 首屏固定 `data-theme="dark"`；基础视觉变量由 `frontend/src/styles/tokens.css :root` 单一提供，Showcase 样式在其上分层覆盖。不存在运行时 `useTheme` / `utils/theme.js` / `wotbtools-theme` 偏好，也不响应 `prefers-color-scheme`。\n- **i18n 组合层**：基础三语 JSON 为 `frontend/src/locales/{zh,en,ru}.json`；按功能追加的文案放 `feature-messages.json`，由 `messages.js` 非破坏性深合并。禁止在 `main.js` 或组件初始化时动态修改 imported locale 对象。',
                  'guide theme/i18n architecture'
              ),
              (
                  '- `?view=replay`：进入回放提取器。',
                  '- `?view=replay`：进入回放工作台；上传后可选择解析预览、战局回放或 AI 复盘。',
                  'guide replay route'
              ),
              (
                  '- `?view=reconstruction`：进入 AI 复盘页。入口（顶栏按钮 + 首页卡片）随时可见，不做角色门控；`ReconstructionPage` 挂载时检查登录，未登录自动 `login(\'reconstruction\')` 跳转登录页并在登录后回到本页。页面只提供「选择回放文件 → 开始 AI 复盘 → 展示结果」，不再展示重建过程与任意时刻状态查询。',
                  '- `?view=reconstruction`：进入 AI 复盘 / 地图 / 战局回放 workspace。入口随时可见；上传工作台可直接交接单场 replay，不要求先查看赛果。页面挂载时检查登录，未登录自动 `login(\'reconstruction\')`。',
                  'guide reconstruction route'
              ),
              (
                  '  - `composables/useTheme.js` — 主题切换（auto/light/dark），数据持久化调用 `utils/theme.js`\n',
                  '',
                  'guide useTheme removal'
              ),
              (
                  '  - `utils/theme.js` — 纯函数（readTheme / saveTheme / resolveTheme / applyTheme），Cookie `.wotbtools.com` 域共享 + localStorage 回退\n',
                  '',
                  'guide theme util removal'
              ),
              (
                  '- UI 组件在 `components/`：FileUploader / ColumnPicker / AggregateTable / BattleTable / PerformanceTable / RemoveConfirmModal / HoFPage / HoFAdminPage / LoginPage（QQ + Wargaming 登录选择页）/ ProfilePage（含站内通知面板）/ BoostPage / AdminUsersPage / HomePage / ReplayPage\n',
                  '- UI 组件在 `components/`：FileUploader / ColumnPicker / AggregateTable / BattleTable / PerformanceTable / RemoveConfirmModal / HoFPage / HoFAdminPage / LoginPage（QQ + Wargaming 登录选择页）/ ProfilePage（含站内通知面板）/ BoostPage / AdminUsersPage / HomePage / ReplayPage\n- **Replay Workspace**：`FileUploader.vue` 在选中 replay 后提供「解析预览 / 战局回放 / AI 复盘」三个一级能力。单文件 AI/Playback 可直接进入；多文件必须显式选择目标 replay，禁止 fallback 第一场。解析后的 Aggregate/Summary 本身不代表具体 battle，因此结果 toolbar 的 Battle-level action 仍只在具体 battle tab 出现。\n',
                  'guide Replay Workspace'
              ),
              (
                  '- 回放解析上传页由 `FileUploader.vue` 负责交互，`App.vue` 提供全局上传区样式；空态、拖拽态、已选文件态共用 `upload.*` 三语文案。',
                  '- 回放解析上传页由 `FileUploader.vue` 负责交互；空态、拖拽态、已选文件态共用 `upload.*` 三语文案。',
                  'guide uploader ownership'
              ),
              (
                  '- 语言持久化 `localStorage(\'wotb-lang\')`，主题持久化 Cookie `wotbtools-theme`（domain `.wotbtools.com`）+ localStorage 回退。',
                  '- 语言持久化 `localStorage(\'wotb-lang\')`；主题固定暗色，不保存主题 cookie/localStorage。',
                  'guide preference policy'
              ),
              (
                  '- 站内通知由 `user_notification` 保存，boost domain 只调用 `UserNotificationService` 写事件；API 返回 `type + payload` 英文 key，前端 `frontend/src/locales/{zh,en,ru}.json` 负责渲染文案。',
                  '- 站内通知由 `user_notification` 保存，boost domain 只调用 `UserNotificationService` 写事件；API 返回 `type + payload` 英文 key，前端 locale composition 负责渲染文案。',
                  'guide notification i18n'
              ),
          ]
          for old, new, label in replacements:
              guide = replace_once(guide, old, new, label)
          guide_path.write_text(guide, encoding='utf-8')

          # One-shot migration helper must not remain in the PR.
          Path('.github/workflows/pr125-resolve-once.yml').unlink()
          PY

          git diff --check
          git diff -- frontend/src/data/versions.json docs/CHANGELOG-PRODUCT.md docs/CHANGELOG.md docs/DEVELOPER_GUIDE.md

      - name: Commit resolved files and self-delete workflow
        shell: bash
        run: |
          git config user.name "A158Coke"
          git config user.email "114688497+A158Coke@users.noreply.github.com"
          git add -A
          git commit -m "docs(frontend): 合并 PR125 冲突后的版本与文档"
          git push origin HEAD:fix/dark-theme-ui-regressions
