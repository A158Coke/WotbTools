name: Infra / TX Keycloak PostgreSQL

on:
  pull_request:
    paths:
      - "infra/tofu/postgres-keycloak/**"
      - ".github/workflows/postgres-keycloak-tofu.yml"
      - "scripts/ci/test-postgres-keycloak-tofu-contract.sh"
  push:
    branches:
      - main
    paths:
      - "infra/tofu/postgres-keycloak/**"
      - ".github/workflows/postgres-keycloak-tofu.yml"
      - "scripts/ci/test-postgres-keycloak-tofu-contract.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared with deploy.yml: both workflows can mutate the same remote state.
  group: production-maintenance
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra/tofu/postgres-keycloak

jobs:
  validate:
    name: Validate isolated root without database access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Initialize without remote state or database access
        run: tofu init -backend=false -input=false

      - name: Validate configuration
        run: tofu validate

      - name: Verify TX-local execution contract
        working-directory: .
        run: bash scripts/ci/test-postgres-keycloak-tofu-contract.sh

  apply_on_tx:
    name: Plan and apply on TX localhost only
    needs: validate
    # Normal production application releases invoke this same TX-local sequence
    # from Deploy after Compose has made the loopback database available. Keep
    # this path manual-only for operator-led repair; never race two applies.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Prepare immutable TX staging directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          envs: RELEASE_SHA
          script: |
            set -euo pipefail
            install -d -m 0750 "/opt/wotb-tx/tofu.incoming/${RELEASE_SHA}"

      - name: Upload exact root to TX staging
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: infra/tofu/postgres-keycloak
          target: /opt/wotb-tx/tofu.incoming/${{ github.sha }}
          overwrite: true

      - name: Create and apply exact TX-local plan
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 15m
          envs: RELEASE_SHA
          script: |
            set -euo pipefail
            root="/opt/wotb-tx/tofu.incoming/${RELEASE_SHA}/infra/tofu/postgres-keycloak"
            env_file="/etc/wotb/postgres-keycloak-tofu.env"
            test -d "$root"
            test -r "$env_file"
            set -a
            . "$env_file"
            set +a
            cd "$root"
            trap 'rm -f plan.tfplan' EXIT
            tofu init -reconfigure -input=false
            tofu validate
            tofu plan -input=false -no-color -out=plan.tfplan
            bash ./validate-plan.sh plan.tfplan
            tofu apply -input=false -auto-approve plan.tfplan
            install -d -m 700 /opt/wotb-tx
            printf '%s\n' tx-local-opentofu > /opt/wotb-tx/keycloak-postgres.tofu-provisioned
            chmod 600 /opt/wotb-tx/keycloak-postgres.tofu-provisioned
