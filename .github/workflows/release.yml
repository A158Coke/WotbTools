name: Release
run-name: Production Release · main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Last known reconciled main commit for range recovery
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      build_components: ${{ steps.plan.outputs.build_components }}
      deploy_services: ${{ steps.plan.outputs.deploy_services }}
      tofu_roots: ${{ steps.plan.outputs.tofu_roots }}
      reasons: ${{ steps.plan.outputs.reasons }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Validate release range and select affected work
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          INPUT_BASE_SHA: ${{ github.event.inputs.base_sha || '' }}
        run: |
          set -euo pipefail
          git fetch origin main
          head="$EVENT_SHA"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$EVENT_REF" == refs/heads/main ]] || { echo 'Manual Release must run from main.' >&2; exit 1; }
            [[ "$head" == "$(git rev-parse origin/main)" ]] || { echo 'Manual Release head is stale; run it again from current main.' >&2; exit 1; }
            base="$INPUT_BASE_SHA"
          else
            base="$EVENT_BEFORE"
          fi
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo 'Release head must be a full lowercase commit SHA.' >&2; exit 1; }
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$base" =~ ^0+$ ]] || { echo 'Release base must be a non-zero full lowercase commit SHA.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$head" ]] || { echo 'Checked out Release source differs from the event SHA.' >&2; exit 1; }
          git cat-file -e "$base^{commit}" || { echo 'Release base is not an available commit.' >&2; exit 1; }
          git cat-file -e "$head^{commit}" || { echo 'Release head is not an available commit.' >&2; exit 1; }
          git merge-base --is-ancestor "$base" "$head" || { echo 'Release base must be an ancestor of head.' >&2; exit 1; }
          python3 deploy/release_plan.py --base "$base" --head "$head" > release-plan.json
          HEAD_SHA="$head" BASE_SHA="$base" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          plan = json.loads(Path('release-plan.json').read_text(encoding='utf-8'))
          release = plan['release']
          for key, value in (
              ('source_sha', os.environ['HEAD_SHA']),
              ('base_sha', os.environ['BASE_SHA']),
              ('build_components', release['buildComponents']),
              ('deploy_services', release['deployServices']),
              ('tofu_roots', release['tofuRoots']),
              ('reasons', plan['reasons']),
          ):
              if not isinstance(value, str):
                  value = json.dumps(value, separators=(',', ':'))
              print(f'{key}={value}')
          PY
      - name: Render selected work summary
        shell: bash
        env:
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
          HEAD_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 deploy/release_report.py plan-summary --plan-file release-plan.json --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --output release-plan-summary.md
          cat release-plan-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: production-release-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-plan.json
          if-no-files-found: error
          retention-days: 7

  foundation:
    name: Foundation
    needs: [plan]
    if: ${{ needs.plan.result == 'success' && (contains(fromJSON(needs.plan.outputs.build_components), 'minio') || contains(fromJSON(needs.plan.outputs.deploy_services), 'rabbitmq') || contains(fromJSON(needs.plan.outputs.deploy_services), 'business-postgres') || contains(fromJSON(needs.plan.outputs.deploy_services), 'keycloak-postgres') || contains(fromJSON(needs.plan.outputs.deploy_services), 'minio') || contains(fromJSON(needs.plan.outputs.tofu_roots), 'rabbitmq') || contains(fromJSON(needs.plan.outputs.tofu_roots), 'business-postgres') || contains(fromJSON(needs.plan.outputs.tofu_roots), 'keycloak-postgres') || contains(fromJSON(needs.plan.outputs.tofu_roots), 'minio')) }}
    uses: ./.github/workflows/release-foundation.yml
    permissions:
      contents: read
      packages: write
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      build_components: ${{ needs.plan.outputs.build_components }}
      deploy_services: ${{ needs.plan.outputs.deploy_services }}
      tofu_roots: ${{ needs.plan.outputs.tofu_roots }}
    secrets: inherit

  cloud:
    name: Cloud
    needs: [plan]
    if: ${{ needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.tofu_roots), 'cos') }}
    uses: ./.github/workflows/release-cloud.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      build_components: ${{ needs.plan.outputs.build_components }}
      deploy_services: ${{ needs.plan.outputs.deploy_services }}
      tofu_roots: ${{ needs.plan.outputs.tofu_roots }}
    secrets: inherit

  tx:
    name: TX Release
    needs: [plan, foundation, cloud]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && (contains(fromJSON(needs.plan.outputs.build_components), 'business-api') || contains(fromJSON(needs.plan.outputs.build_components), 'frontend') || contains(fromJSON(needs.plan.outputs.build_components), 'keycloak') || contains(fromJSON(needs.plan.outputs.deploy_services), 'business-api') || contains(fromJSON(needs.plan.outputs.deploy_services), 'frontend') || contains(fromJSON(needs.plan.outputs.deploy_services), 'keycloak') || contains(fromJSON(needs.plan.outputs.deploy_services), 'caddy') || contains(fromJSON(needs.plan.outputs.tofu_roots), 'keycloak')) }}
    uses: ./.github/workflows/release-tx.yml
    permissions:
      contents: read
      packages: write
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      build_components: ${{ needs.plan.outputs.build_components }}
      deploy_services: ${{ needs.plan.outputs.deploy_services }}
      tofu_roots: ${{ needs.plan.outputs.tofu_roots }}
    secrets: inherit

  yecao:
    name: Yecao Release
    needs: [plan, foundation]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && (contains(fromJSON(needs.plan.outputs.build_components), 'parser-worker') || contains(fromJSON(needs.plan.outputs.deploy_services), 'parser-worker')) }}
    uses: ./.github/workflows/release-yecao.yml
    permissions:
      contents: read
      packages: write
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      build_components: ${{ needs.plan.outputs.build_components }}
      deploy_services: ${{ needs.plan.outputs.deploy_services }}
      tofu_roots: ${{ needs.plan.outputs.tofu_roots }}
    secrets: inherit

  observability:
    name: Observability
    needs: [plan]
    if: ${{ needs.plan.result == 'success' && (contains(fromJSON(needs.plan.outputs.deploy_services), 'node-exporter') || contains(fromJSON(needs.plan.outputs.deploy_services), 'prometheus') || contains(fromJSON(needs.plan.outputs.deploy_services), 'loki') || contains(fromJSON(needs.plan.outputs.deploy_services), 'alloy') || contains(fromJSON(needs.plan.outputs.deploy_services), 'grafana') || contains(fromJSON(needs.plan.outputs.tofu_roots), 'grafana')) }}
    uses: ./.github/workflows/release-observability.yml
    permissions:
      contents: read
      packages: read
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      build_components: ${{ needs.plan.outputs.build_components }}
      deploy_services: ${{ needs.plan.outputs.deploy_services }}
      tofu_roots: ${{ needs.plan.outputs.tofu_roots }}
    secrets: inherit

  summary:
    name: Summary
    needs: [plan, foundation, cloud, tx, yecao, observability]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: production-release-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/plan
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: production-release-report-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/foundation
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: production-release-report-cloud-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/cloud
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: production-release-report-tx-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/tx
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: production-release-report-yecao-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/yecao
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: production-release-report-observability-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/observability
      - name: Render final production release result
        id: summary
        if: always()
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha || github.event.inputs.base_sha || github.event.before || 'unknown' }}
          HEAD_SHA: ${{ needs.plan.outputs.source_sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          status=0
          python3 deploy/release_report.py summary \
            --plan-file release-artifacts/plan/release-plan.json \
            --needs-json "$NEEDS_JSON" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --reports-dir release-artifacts \
            --output production-release-summary.md || status=$?
          if [ -f production-release-summary.md ]; then cat production-release-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
