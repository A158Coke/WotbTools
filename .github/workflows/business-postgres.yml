name: Business PostgreSQL

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/business-postgres.yml
      - deploy/release-metadata.py
      - deploy/tx/deploy.sh
      - deploy/tx/docker-compose.yml
      - deploy/tx/business-postgres.tofurc
      - infra/tofu/postgres-business/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false
  queue: max

env:
  PRODUCTION_INPUT_PATHS: |
    .github/workflows/business-postgres.yml
    deploy/release-metadata.py
    deploy/tx/deploy.sh
    deploy/tx/docker-compose.yml
    deploy/tx/business-postgres.tofurc
    infra/tofu/postgres-business/**

jobs:
  business_postgres:
    name: Reconcile Business PostgreSQL on TX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tx-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Freeze current main
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == refs/heads/main ]] || { echo 'Business PostgreSQL workflow requires main.' >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'The event SHA must be a full lowercase commit SHA.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo 'Checkout SHA differs from the event SHA.' >&2; exit 1; }
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Stage TX runtime and Business PostgreSQL root
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tx,deploy/release-metadata.py,infra/tofu/postgres-business
          target: /opt/wotb-tx/tofu.incoming/${{ steps.source.outputs.source_sha }}
          overwrite: true

      - name: Stage TX runtime inputs
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tx,deploy/release-metadata.py
          target: /opt/wotb-tx/deploy.incoming
          overwrite: true

      - name: Reject stale main before TX mutation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"

      - name: Reconcile runtime, apply exact Business PostgreSQL plan, and verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 35m
          envs: SOURCE_SHA,WOTB_DEPLOY_SERVICE,WOTB_DEPLOY_CONFIG_SHA,WOTB_DEPLOY_IMAGE_TAG,WOTB_DEPLOY_IMAGE_COMMIT_SHA,TX_IMAGE_REGISTRY_PREFIX,TX_BUSINESS_POSTGRES_ADMIN_USER,TX_BUSINESS_POSTGRES_ADMIN_PASSWORD,TX_BUSINESS_DB_NAME,TX_BUSINESS_DB_USERNAME,TX_BUSINESS_DB_PASSWORD,TX_BUSINESS_DB_PASSWORD_VERSION,TX_TOFU_STATE_PASSWORD,TX_TOFU_STATE_PASSWORD_VERSION
          script: |
            set -Eeuo pipefail
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$WOTB_DEPLOY_CONFIG_SHA" == "$SOURCE_SHA" ]]
            root="/opt/wotb-tx/tofu.incoming/$SOURCE_SHA/infra/tofu/postgres-business"
            test -d "$root"
            test -f /opt/wotb-tx/deploy.incoming/deploy/tx/deploy.sh
            test -f /opt/wotb-tx/deploy.incoming/deploy/tx/business-postgres.tofurc
            command -v flock >/dev/null
            command -v tofu >/dev/null
            command -v python3 >/dev/null
            exec 9>/opt/wotb-tx/.deploy.lock
            flock -n 9 || { echo 'Another TX production mutation is running.' >&2; exit 1; }
            export WOTB_DEPLOY_LOCK_FD=9
            TX_BUSINESS_DB_NAME=not-configured \
              TX_BUSINESS_DB_USERNAME=not-configured \
              TX_BUSINESS_DB_PASSWORD=not-configured \
              TX_BUSINESS_DB_PASSWORD_VERSION=1 \
              TX_RABBITMQ_CONTROL_API_PASSWORD=not-configured \
              bash /opt/wotb-tx/deploy.incoming/deploy/tx/deploy.sh
            test -f /opt/wotb-tx/deploy/business-postgres.tofurc
            export TF_CLI_CONFIG_FILE=/opt/wotb-tx/deploy/business-postgres.tofurc
            export TF_VAR_postgresql_admin_username="$TX_BUSINESS_POSTGRES_ADMIN_USER"
            export TF_VAR_postgresql_admin_password="$TX_BUSINESS_POSTGRES_ADMIN_PASSWORD"
            export TF_VAR_business_database_name="$TX_BUSINESS_DB_NAME"
            export TF_VAR_business_role_name="$TX_BUSINESS_DB_USERNAME"
            export TF_VAR_business_role_password="$TX_BUSINESS_DB_PASSWORD"
            export TF_VAR_business_role_password_version="$TX_BUSINESS_DB_PASSWORD_VERSION"
            export TF_VAR_tofu_state_role_password="$TX_TOFU_STATE_PASSWORD"
            export TF_VAR_tofu_state_role_password_version="$TX_TOFU_STATE_PASSWORD_VERSION"
            umask 077
            install -d -m 700 /opt/wotb-tx/postgres-business-tofu-state
            cd "$root"
            trap 'rm -f -- plan.tfplan second-plan.tfplan' EXIT
            tofu fmt -check -recursive
            tofu init -reconfigure -input=false -lockfile=readonly
            tofu validate
            tofu plan -input=false -no-color -out=plan.tfplan
            bash ./validate-plan.sh plan.tfplan
            tofu apply -input=false -auto-approve plan.tfplan
            tofu plan -input=false -no-color -out=second-plan.tfplan
            bash ./validate-plan.sh second-plan.tfplan --require-no-changes
            docker compose -f /opt/wotb-tx/deploy/docker-compose.yml exec -T business-postgres pg_isready -U "$TX_BUSINESS_POSTGRES_ADMIN_USER" -d postgres
            printf '%s\n' tx-local-opentofu-business-postgres > /opt/wotb-tx/business-postgres.tofu-provisioned
            chmod 600 /opt/wotb-tx/business-postgres.tofu-provisioned
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          WOTB_DEPLOY_SERVICE: business-postgres
          WOTB_DEPLOY_CONFIG_SHA: ${{ steps.source.outputs.source_sha }}
          WOTB_DEPLOY_IMAGE_TAG: ''
          WOTB_DEPLOY_IMAGE_COMMIT_SHA: ''
          TX_IMAGE_REGISTRY_PREFIX: ${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}
          TX_BUSINESS_POSTGRES_ADMIN_USER: ${{ vars.TX_BUSINESS_POSTGRES_ADMIN_USER }}
          TX_BUSINESS_POSTGRES_ADMIN_PASSWORD: ${{ secrets.TX_BUSINESS_POSTGRES_ADMIN_PASSWORD }}
          TX_BUSINESS_DB_NAME: ${{ vars.TX_BUSINESS_DB_NAME }}
          TX_BUSINESS_DB_USERNAME: ${{ vars.TX_BUSINESS_DB_USERNAME }}
          TX_BUSINESS_DB_PASSWORD: ${{ secrets.TX_BUSINESS_DB_PASSWORD }}
          TX_BUSINESS_DB_PASSWORD_VERSION: ${{ vars.TX_BUSINESS_DB_PASSWORD_VERSION || '1' }}
          TX_TOFU_STATE_PASSWORD: ${{ secrets.TX_TOFU_STATE_PASSWORD }}
          TX_TOFU_STATE_PASSWORD_VERSION: ${{ vars.TX_TOFU_STATE_PASSWORD_VERSION || '1' }}
