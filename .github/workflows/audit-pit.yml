name: Audit / PIT probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pit:
    if: github.head_ref == 'audit/740-pit'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        shard: [{"mod":"wotb-core","pkg":"com.wotb.core.ai.*"},{"mod":"wotb-core","pkg":"com.wotb.core.model.*"},{"mod":"wotb-core","pkg":"com.wotb.core.ref.*"},{"mod":"wotb-core","pkg":"com.wotb.core.replay.*"},{"mod":"wotb-core","pkg":"com.wotb.core.util.*"},{"mod":"wotb-web","pkg":"com.wotb.web.admin.*"},{"mod":"wotb-web","pkg":"com.wotb.web.aireviewfeedback.*"},{"mod":"wotb-web","pkg":"com.wotb.web.battledata.*"},{"mod":"wotb-web","pkg":"com.wotb.web.config.*"},{"mod":"wotb-web","pkg":"com.wotb.web.creator.*"},{"mod":"wotb-web","pkg":"com.wotb.web.exceptionhandler.*"},{"mod":"wotb-web","pkg":"com.wotb.web.hof.*"},{"mod":"wotb-web","pkg":"com.wotb.web.hundred.*"},{"mod":"wotb-web","pkg":"com.wotb.web.mark3.*"},{"mod":"wotb-web","pkg":"com.wotb.web.observability.*"},{"mod":"wotb-web","pkg":"com.wotb.web.replay.*"},{"mod":"wotb-web","pkg":"com.wotb.web.replayfile.*"},{"mod":"wotb-web","pkg":"com.wotb.web.tournament.*"},{"mod":"wotb-web","pkg":"com.wotb.web.user.*"},{"mod":"wotb-web","pkg":"com.wotb.web.util.*"},{"mod":"wotb-ai","pkg":"com.wotb.ai.config.*"},{"mod":"wotb-ai","pkg":"com.wotb.ai.gateway.*"},{"mod":"wotb-ai","pkg":"com.wotb.ai.http.*"},{"mod":"wotb-ai","pkg":"com.wotb.ai.prompt.*"},{"mod":"wotb-ai","pkg":"com.wotb.ai.review.*"},{"mod":"wotb-ai","pkg":"com.wotb.ai.tournament.*"}]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v4
        with:
          path: java/.m2repo
          key: pit-${{ hashFiles('java/**/pom.xml') }}
      - name: Install modules
        working-directory: java
        run: mvn -q --batch-mode --no-transfer-progress -s settings-ci.xml -Dmaven.repo.local=.m2repo -DskipTests -Dspotbugs.skip=true install
      - name: PIT shard
        working-directory: java
        timeout-minutes: 60
        run: mvn --batch-mode --no-transfer-progress -s settings-ci.xml -Dmaven.repo.local=.m2repo -pl ${{ matrix.shard.mod }} test-compile org.pitest:pitest-maven:mutationCoverage -DtargetClasses='${{ matrix.shard.pkg }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-${{ matrix.shard.mod }}-${{ strategy.job-index }}
          path: java/${{ matrix.shard.mod }}/target/pit-reports/
          if-no-files-found: warn
