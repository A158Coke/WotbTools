name: Infra / TX Business PostgreSQL

on:
  pull_request:
    paths:
      - "infra/tofu/postgres-business/**"
      - "scripts/ci/test-postgres-business-tofu-contract.sh"
      - ".github/workflows/postgres-business-tofu.yml"
  push:
    branches:
      - main
    paths:
      - "infra/tofu/postgres-business/**"
      - "scripts/ci/test-postgres-business-tofu-contract.sh"
      - ".github/workflows/postgres-business-tofu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared with deploy.yml: both can mutate the same serialized production
  # maintenance surface. No apply happens here.
  group: production-maintenance
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra/tofu/postgres-business

jobs:
  validate:
    name: Validate isolated root without database access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Initialize without remote state or database access
        run: tofu init -backend=false -input=false

      - name: Validate configuration
        run: tofu validate

      - name: Plan safety policy fixtures
        run: bash ./test-validate-plan.sh

      - name: Verify TX-local execution contract
        working-directory: .
        run: bash scripts/ci/test-postgres-business-tofu-contract.sh
