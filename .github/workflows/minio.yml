name: MinIO

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/minio.yml
      - .dockerignore
      - docker/Dockerfile.minio
      - deploy/docker-compose.minio.yml
      - deploy/minio-deploy.sh
      - deploy/minio/**
      - deploy/release-metadata.py
      - infra/tofu/minio/**
  workflow_dispatch:

permissions:
  contents: read


env:
  PRODUCTION_INPUT_PATHS: |
    .github/workflows/minio.yml
    .dockerignore
    docker/Dockerfile.minio
    deploy/docker-compose.minio.yml
    deploy/minio-deploy.sh
    deploy/minio/**
    deploy/release-metadata.py
    infra/tofu/minio/**
    deploy/check-production-freshness.sh

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Freeze current main and image identity
        id: identity
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [ "$REF_NAME" = refs/heads/main ] || { echo 'Manual deployment must dispatch from main.' >&2; exit 1; }
          fi
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
          image="ghcr.io/a158coke/wotbtools-minio:sha-${SOURCE_SHA:0:12}"
          {
            echo "commit_sha=$SOURCE_SHA"
            echo "image=$image"
            echo "repository=${image%:*}"
            echo "tag=sha-${SOURCE_SHA:0:12}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-crane@v0.7
      - name: Reuse only an existing immutable image with this source identity
        id: immutable
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          REPOSITORY: ${{ steps.identity.outputs.repository }}
          TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_SHA: ${{ steps.identity.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tags="$(crane ls "$REPOSITORY")"
          if grep -Fxq "$TAG" <<< "$tags"; then
            docker pull "$IMAGE"
            revision="$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")"
            [ "$revision" = "$SOURCE_SHA" ] || { echo 'Existing immutable tag has a different OCI revision.' >&2; exit 1; }
            digest="$(crane digest "$IMAGE")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "existing_digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo 'existing_digest=' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish this frozen image
        id: build_image
        if: steps.immutable.outputs.existing_digest == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.minio
          push: true
          tags: ${{ steps.identity.outputs.image }}
          build-args: BUILD_COMMIT=${{ steps.identity.outputs.commit_sha }}
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio
          provenance: false
          sbom: false
      - name: Verify registry digest and source identity
        id: verify
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          SOURCE_SHA: ${{ steps.identity.outputs.commit_sha }}
          EXISTING_DIGEST: ${{ steps.immutable.outputs.existing_digest }}
          BUILD_DIGEST: ${{ steps.build_image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-$BUILD_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Missing or invalid image digest.' >&2; exit 1; }
          [ "$(crane digest "$IMAGE")" = "$digest" ] || { echo 'Registry digest changed after build.' >&2; exit 1; }
          docker pull "$IMAGE@$digest" >/dev/null
          revision="$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE@$digest")"
          [ "$revision" = "$SOURCE_SHA" ] || { echo 'Published MinIO image does not contain the frozen OCI revision.' >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  smoke:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      TF_IN_AUTOMATION: 'true'
      CHECKPOINT_DISABLE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the exact published MinIO image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: docker pull "$IMAGE@$DIGEST"
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Apply the MinIO root against a disposable instance of this exact image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          bash infra/tofu/minio/test-validate-plan.sh
          docker run --rm "$IMAGE@$DIGEST" --version | grep -F 'RELEASE.2025-10-15T17-29-55Z'
          name=wotbtools-minio-smoke
          docker rm -f "$name" >/dev/null 2>&1 || true
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --rm --name "$name" \
            -e MINIO_ROOT_USER=ci-root-user \
            -e MINIO_ROOT_PASSWORD=ci-root-password \
            -p 127.0.0.1:19000:9000 \
            "$IMAGE@$DIGEST" server --console-address :9001 /data
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:19000/minio/health/live >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          [ "$ready" = true ] || { docker logs "$name"; exit 1; }

          export TF_VAR_minio_server=127.0.0.1:19000
          export TF_VAR_minio_root_user=ci-root-user
          export TF_VAR_minio_root_password=ci-root-password
          export TF_VAR_worker_access_key=ci-worker-access-key
          export TF_VAR_worker_secret_key=ci-worker-secret-key
          export TF_VAR_control_api_access_key=ci-control-api-access-key
          export TF_VAR_control_api_secret_key=ci-control-api-secret-key
          export MINIO_PROVIDER_MIRROR=/tmp/minio-provider-mirror
          mkdir -p "$MINIO_PROVIDER_MIRROR"
          tofu -chdir=infra/tofu/minio providers mirror "$MINIO_PROVIDER_MIRROR" >/dev/null
          sed "s|/opt/wotb/tofu-provider-mirror|$MINIO_PROVIDER_MIRROR|" deploy/minio/tofurc \
            > /tmp/minio-ci.tfrc
          export TF_CLI_CONFIG_FILE=/tmp/minio-ci.tfrc
          export TF_DATA_DIR=/tmp/minio-ci-tofu-data
          tofu -chdir=infra/tofu/minio init -reconfigure -input=false -lockfile=readonly \
            -backend-config=path=/tmp/minio-ci.tfstate >/dev/null
          tofu -chdir=infra/tofu/minio validate
          tofu -chdir=infra/tofu/minio plan -input=false -out=plan.tfplan
          ( cd infra/tofu/minio && bash validate-plan.sh plan.tfplan )
          tofu -chdir=infra/tofu/minio apply -input=false -auto-approve plan.tfplan
          tofu -chdir=infra/tofu/minio plan -input=false -out=second-plan.tfplan
          ( cd infra/tofu/minio && bash validate-plan.sh second-plan.tfplan --require-no-changes )

  deploy:
    concurrency:
      group: production-maintenance
      cancel-in-progress: false
      queue: max
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit_sha }}
      - name: Reject stale main before staging production inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.build.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
      - name: Prepare one MinIO runtime and Tofu stage
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            stage="/opt/wotb/minio.incoming/${{ needs.build.outputs.commit_sha }}"
            rm -rf -- "$stage"
            mkdir -p "$stage"
      - name: Stage MinIO runtime deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.minio.yml,deploy/minio-deploy.sh,deploy/release-metadata.py,deploy/minio
          target: /opt/wotb/minio.incoming/${{ needs.build.outputs.commit_sha }}
          overwrite: true
      - name: Stage the exact MinIO OpenTofu root and provider mirror config
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: infra/tofu/minio,deploy/minio/tofurc
          target: /opt/wotb/minio.incoming/${{ needs.build.outputs.commit_sha }}
          overwrite: true
      - name: Reject stale main before Yecao mutation
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.build.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
      - name: Reconcile MinIO, apply Tofu, verify, and commit metadata under one host lock
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 55m
          envs: WOTB_DEPLOY_SERVICE,WOTB_DEPLOY_CONFIG_SHA,WOTB_DEPLOY_IMAGE_TAG,WOTB_DEPLOY_IMAGE_COMMIT_SHA,WOTB_DEPLOY_IMAGE_DIGEST,WOTB_DEPLOY_DEFER_METADATA,YECAO_MINIO_ROOT_USER,YECAO_MINIO_ROOT_PASSWORD,YECAO_MINIO_WORKER_ACCESS_KEY,YECAO_MINIO_WORKER_SECRET_KEY,YECAO_MINIO_CONTROL_API_ACCESS_KEY,YECAO_MINIO_CONTROL_API_SECRET_KEY
          script: |
            set -euo pipefail
            exec 9>/opt/wotb/.deploy.lock
            flock -n 9 || { echo 'Another Yecao production deployment is running.' >&2; exit 1; }
            export WOTB_DEPLOY_LOCK_FD=9
            export WOTB_DEPLOY_DEFER_METADATA=1
            export WOTB_DEPLOY_SERVICE=minio
            export WOTB_DEPLOY_CONFIG_SHA='${{ needs.build.outputs.commit_sha }}'
            export WOTB_DEPLOY_IMAGE_TAG='${{ needs.build.outputs.image }}'
            export WOTB_DEPLOY_IMAGE_COMMIT_SHA='${{ needs.build.outputs.commit_sha }}'
            export WOTB_DEPLOY_IMAGE_DIGEST='${{ needs.build.outputs.digest }}'
            stage="/opt/wotb/minio.incoming/${{ needs.build.outputs.commit_sha }}"
            root="$stage/infra/tofu/minio"
            compose="$stage/deploy/docker-compose.minio.yml"
            test -d "$root" && test -f "$stage/deploy/minio/tofurc"
            test -f "$compose" && test -f "$stage/deploy/minio-deploy.sh"
            test -d /opt/wotb/tofu-provider-mirror
            for name in YECAO_MINIO_ROOT_USER YECAO_MINIO_ROOT_PASSWORD \
              YECAO_MINIO_WORKER_ACCESS_KEY YECAO_MINIO_WORKER_SECRET_KEY \
              YECAO_MINIO_CONTROL_API_ACCESS_KEY YECAO_MINIO_CONTROL_API_SECRET_KEY; do
              test -n "${!name:-}" || { echo "$name is required." >&2; exit 2; }
            done

            command -v tofu >/dev/null 2>&1 || { echo 'OpenTofu is required on Yecao.' >&2; exit 2; }
            command -v python3 >/dev/null 2>&1 || { echo 'python3 is required on Yecao.' >&2; exit 2; }
            install -d -m 700 /opt/wotb/minio-tofu-state
            test -w /opt/wotb/minio-tofu-state || { echo 'MinIO OpenTofu state directory is not writable.' >&2; exit 2; }

            WOTB_DIR=/opt/wotb bash "$stage/deploy/minio-deploy.sh" "$stage"

            export TF_CLI_CONFIG_FILE="$stage/deploy/minio/tofurc"
            export TF_VAR_minio_server=10.20.0.2:9000
            export TF_VAR_minio_root_user="$YECAO_MINIO_ROOT_USER"
            export TF_VAR_minio_root_password="$YECAO_MINIO_ROOT_PASSWORD"
            export TF_VAR_worker_access_key="$YECAO_MINIO_WORKER_ACCESS_KEY"
            export TF_VAR_worker_secret_key="$YECAO_MINIO_WORKER_SECRET_KEY"
            export TF_VAR_control_api_access_key="$YECAO_MINIO_CONTROL_API_ACCESS_KEY"
            export TF_VAR_control_api_secret_key="$YECAO_MINIO_CONTROL_API_SECRET_KEY"
            umask 077
            cd "$root"
            trap 'rm -f -- plan.tfplan second-plan.tfplan' EXIT
            tofu fmt -check -recursive
            tofu init -reconfigure -input=false -lockfile=readonly
            tofu validate
            tofu plan -input=false -no-color -out=plan.tfplan
            bash ./validate-plan.sh plan.tfplan
            tofu apply -input=false -auto-approve plan.tfplan
            tofu plan -input=false -no-color -out=second-plan.tfplan
            bash ./validate-plan.sh second-plan.tfplan --require-no-changes

            health=false
            for attempt in $(seq 1 60); do
              if docker run --rm --network host curlimages/curl:8.12.1 --fail --silent --show-error \
                  --connect-timeout 2 --max-time 5 http://10.20.0.2:9000/minio/health/live >/dev/null; then
                health=true
                break
              fi
              [ "$attempt" -lt 60 ] && sleep 2
            done
            [ "$health" = true ] || { echo 'MinIO final readiness verification failed after OpenTofu.' >&2; exit 1; }

            python3 "$stage/deploy/release-metadata.py" update \
              --host yecao --file /opt/wotb/production-release.json \
              --service minio --config-sha "$WOTB_DEPLOY_CONFIG_SHA" \
              --image-tag "$WOTB_DEPLOY_IMAGE_TAG" \
              --image-commit-sha "$WOTB_DEPLOY_IMAGE_COMMIT_SHA"
        env:
          WOTB_DEPLOY_SERVICE: minio
          WOTB_DEPLOY_CONFIG_SHA: ${{ needs.build.outputs.commit_sha }}
          WOTB_DEPLOY_IMAGE_TAG: ${{ needs.build.outputs.image }}
          WOTB_DEPLOY_IMAGE_COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
          WOTB_DEPLOY_IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          WOTB_DEPLOY_DEFER_METADATA: '1'
          YECAO_MINIO_ROOT_USER: ${{ secrets.YECAO_MINIO_ROOT_USER }}
          YECAO_MINIO_ROOT_PASSWORD: ${{ secrets.YECAO_MINIO_ROOT_PASSWORD }}
          YECAO_MINIO_WORKER_ACCESS_KEY: ${{ secrets.YECAO_MINIO_WORKER_ACCESS_KEY }}
          YECAO_MINIO_WORKER_SECRET_KEY: ${{ secrets.YECAO_MINIO_WORKER_SECRET_KEY }}
          YECAO_MINIO_CONTROL_API_ACCESS_KEY: ${{ secrets.YECAO_MINIO_CONTROL_API_ACCESS_KEY }}
          YECAO_MINIO_CONTROL_API_SECRET_KEY: ${{ secrets.YECAO_MINIO_CONTROL_API_SECRET_KEY }}
