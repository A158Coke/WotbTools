name: Komodo Periphery / Alibaba Asset Host

# Reusable transport implementation for the Alibaba Shanghai host. It is invoked
# only by the final dependent job in `.github/workflows/komodo-periphery.yml` so
# Yecao -> TX1 -> TX2 must all succeed before Alibaba can mutate. The shared
# install/reconcile/verify implementation remains under deploy/periphery/**.
on:
  workflow_call:
    # Explicit, job-scoped credential interface. The caller maps ONLY these five
    # secrets, so this transport cannot read Yecao/TX1/TX2, database, registry, or
    # any other repository secret.
    secrets:
      ALI_ASSET_VPS_HOST:
        required: true
      ALI_ASSET_VPS_USER:
        required: true
      ALI_ASSET_VPS_PORT:
        required: true
      ALI_ASSET_VPS_SSH_KEY:
        required: true
      KOMODO_ALI_ASSET_ONBOARDING_KEY:
        required: false

permissions:
  contents: read

env:
  PRODUCTION_INPUT_PATHS: |
    .github/workflows/komodo-periphery.yml
    .github/workflows/komodo-periphery-ali.yml
    deploy/check-production-freshness.sh
    deploy/periphery/**

jobs:
  reconcile:
    name: Reconcile Komodo Periphery on Alibaba asset host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Freeze current main
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == refs/heads/main ]] || { echo 'Alibaba Periphery workflow requires main.' >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'The event SHA must be a full lowercase commit SHA.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo 'Checkout SHA differs from the event SHA.' >&2; exit 1; }
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Read the pinned Periphery release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source deploy/periphery/periphery.release
          [[ "$PERIPHERY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid PERIPHERY_VERSION.' >&2; exit 1; }
          [[ "$PERIPHERY_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid PERIPHERY_SHA256.' >&2; exit 1; }
          [[ "$PERIPHERY_ASSET" == periphery-x86_64 ]] || { echo "Unsupported PERIPHERY_ASSET: $PERIPHERY_ASSET" >&2; exit 1; }
          [[ "$PERIPHERY_RELEASE_TAG" == "v$PERIPHERY_VERSION" ]] || { echo 'PERIPHERY_RELEASE_TAG must match the pinned version.' >&2; exit 1; }
          [[ "$PERIPHERY_URL" == "https://github.com/moghtech/komodo/releases/download/$PERIPHERY_RELEASE_TAG/$PERIPHERY_ASSET" ]] \
            || { echo 'PERIPHERY_URL does not match the pinned tag and asset.' >&2; exit 1; }
          {
            echo "asset=$PERIPHERY_ASSET"
            echo "sha256=$PERIPHERY_SHA256"
            echo "url=$PERIPHERY_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify the pinned Periphery artifact
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.release.outputs.url }}
          ARTIFACT_SHA256: ${{ steps.release.outputs.sha256 }}
          ARTIFACT_NAME: ${{ steps.release.outputs.asset }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 5 \
            --connect-timeout 15 --max-time 180 \
            --output "$ARTIFACT_NAME" "$ARTIFACT_URL"
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$ARTIFACT_NAME" | sha256sum --check --strict -

      - name: Read the Alibaba asset target profile
        id: target
        shell: bash
        env:
          TARGET: ali-sh-asset-01
        run: |
          set -euo pipefail
          bash deploy/periphery/read-target-profile.sh "$TARGET" "$GITHUB_OUTPUT"

      - name: Prepare safe Alibaba asset staging root
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ALI_ASSET_VPS_HOST }}
          username: ${{ secrets.ALI_ASSET_VPS_USER }}
          port: ${{ secrets.ALI_ASSET_VPS_PORT }}
          key: ${{ secrets.ALI_ASSET_VPS_SSH_KEY }}
          command_timeout: 2m
          script_path: deploy/periphery/staging-root.sh
          envs: SOURCE_SHA,PERIPHERY_STAGING_ACTION,PERIPHERY_STAGING_ROOT
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          PERIPHERY_STAGING_ACTION: prepare
          PERIPHERY_STAGING_ROOT: ${{ steps.target.outputs.staging_root }}

      - name: Stage exact Periphery inputs on Alibaba asset host
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ALI_ASSET_VPS_HOST }}
          username: ${{ secrets.ALI_ASSET_VPS_USER }}
          port: ${{ secrets.ALI_ASSET_VPS_PORT }}
          key: ${{ secrets.ALI_ASSET_VPS_SSH_KEY }}
          source: >-
            deploy/periphery/lib.sh,deploy/periphery/staging-root.sh,
            deploy/periphery/adopt-existing.sh,deploy/periphery/validate-adoption-config.py,
            deploy/periphery/install.sh,deploy/periphery/verify.sh,
            deploy/periphery/reconcile.sh,deploy/periphery/periphery.release,
            deploy/periphery/periphery.service,
            deploy/periphery/targets/ali-sh-asset-01/target.env,
            deploy/periphery/targets/ali-sh-asset-01/periphery.config.toml,
            periphery-x86_64
          target: ${{ steps.target.outputs.staging_root }}/incoming/${{ steps.source.outputs.source_sha }}
          overwrite: true

      - name: Reject stale main before Alibaba asset mutation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"

      - name: Adopt already-onboarded Alibaba agent if present
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ALI_ASSET_VPS_HOST }}
          username: ${{ secrets.ALI_ASSET_VPS_USER }}
          port: ${{ secrets.ALI_ASSET_VPS_PORT }}
          key: ${{ secrets.ALI_ASSET_VPS_SSH_KEY }}
          command_timeout: 5m
          envs: SOURCE_SHA,PERIPHERY_TARGET
          script: |
            set -Eeuo pipefail
            stage="${{ steps.target.outputs.staging_root }}/incoming/$SOURCE_SHA"
            chmod 700 "$stage/deploy/periphery/"*.sh
            sudo -n bash "$stage/deploy/periphery/adopt-existing.sh" "$PERIPHERY_TARGET"
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          PERIPHERY_TARGET: ali-sh-asset-01

      # Adoption can take minutes (bounded SSH + host proofs). Re-run the shared
      # production freshness gate immediately before the second, independent host
      # mutation: if deploy/periphery/** changed on main while adoption ran, the run
      # must fail closed instead of reconciling obsolete lifecycle inputs. The gate
      # uses the SAME frozen SOURCE_SHA; it never switches to newer main.
      - name: Reject stale main again immediately before the Alibaba reconcile
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"

      - name: Reconcile Alibaba asset Periphery under the host lock
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ALI_ASSET_VPS_HOST }}
          username: ${{ secrets.ALI_ASSET_VPS_USER }}
          port: ${{ secrets.ALI_ASSET_VPS_PORT }}
          key: ${{ secrets.ALI_ASSET_VPS_SSH_KEY }}
          command_timeout: 15m
          envs: SOURCE_SHA,PERIPHERY_TARGET,KOMODO_PERIPHERY_ONBOARDING_KEY
          script: |
            set -Eeuo pipefail
            stage="${{ steps.target.outputs.staging_root }}/incoming/$SOURCE_SHA"
            chmod 700 "$stage/deploy/periphery/"*.sh
            bash "$stage/deploy/periphery/reconcile.sh" "$PERIPHERY_TARGET" "$SOURCE_SHA" "$stage"
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          PERIPHERY_TARGET: ali-sh-asset-01
          KOMODO_PERIPHERY_ONBOARDING_KEY: ${{ secrets.KOMODO_ALI_ASSET_ONBOARDING_KEY }}

      - name: Cleanup staged Alibaba asset inputs
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ALI_ASSET_VPS_HOST }}
          username: ${{ secrets.ALI_ASSET_VPS_USER }}
          port: ${{ secrets.ALI_ASSET_VPS_PORT }}
          key: ${{ secrets.ALI_ASSET_VPS_SSH_KEY }}
          command_timeout: 2m
          script_path: deploy/periphery/staging-root.sh
          envs: SOURCE_SHA,PERIPHERY_STAGING_ACTION,PERIPHERY_STAGING_ROOT
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          PERIPHERY_STAGING_ACTION: cleanup
          PERIPHERY_STAGING_ROOT: ${{ steps.target.outputs.staging_root }}
