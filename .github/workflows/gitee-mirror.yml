name: Gitee Mirror

# 独立源码 transport owner；应用自行等待 exact SHA，不依赖此 workflow 的 job graph。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror_gitee:
    name: Sync exact GitHub main to Gitee
    concurrency:
      group: production-gitee-main-sync
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject non-main invocation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "Unsupported mirror event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          [ "$EVENT_REF" = refs/heads/main ] || {
            echo "Gitee production sync must run from main." >&2
            exit 1
          }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Sync and verify only Gitee main
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          GITEE_USERNAME: A158Coke
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO_URL: https://gitee.com/A158Coke/Wotbtools.git
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          [ -n "$GITEE_TOKEN" ]
          started=$SECONDS
          askpass="$RUNNER_TEMP/gitee-main-askpass.sh"
          cleanup() { rm -f -- "$askpass"; }
          trap cleanup EXIT
          umask 077
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$GITEE_USERNAME" ;;
            *Password*) printf '%s\n' "$GITEE_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0

          # 仅对网络/超时类失败做有限次重试（ls-remote 与普通 push 均幂等，push 从不强推）。
          # 每次尝试仍有 120s 超时；3 次 + 退避 ≤ 约 7 分钟，低于 job 的 10 分钟上限，超出后 fail-closed。
          retry_network() {
            local attempt=1 rc delay
            local -a backoff=(10 30)
            while true; do
              "$@" && return 0
              rc=$?
              if [ "$attempt" -ge 3 ]; then
                echo "gitee_main_sync: '$1' failed after $attempt attempts (exit $rc); refusing sync." >&2
                return "$rc"
              fi
              delay=${backoff[$((attempt - 1))]}
              echo "gitee_main_sync: attempt $attempt failed (exit $rc); retrying in ${delay}s." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          observed="$(retry_network timeout --kill-after=10s 120s git -c credential.helper= \
            ls-remote --refs "$GITEE_REPO_URL" refs/heads/main)"
          if [ -n "$observed" ]; then
            [[ "$observed" =~ ^[0-9a-f]{40}$'\t'refs/heads/main$ ]]
          fi
          # 排队旧事件不能倒退 main；普通 push 只允许创建或 fast-forward，分叉需人工恢复。
          current="$(retry_network timeout --kill-after=10s 120s git ls-remote --refs origin refs/heads/main)"
          [ "$current" = "$SOURCE_SHA"$'\t'refs/heads/main ] || {
            echo "Source event is no longer current GitHub main; refusing sync." >&2
            exit 1
          }
          retry_network timeout --kill-after=10s 120s git -c credential.helper= -c push.followTags=false push \
            "$GITEE_REPO_URL" "$SOURCE_SHA:refs/heads/main"
          actual="$(retry_network timeout --kill-after=10s 120s git -c credential.helper= \
            ls-remote --refs "$GITEE_REPO_URL" refs/heads/main)"
          [ "$actual" = "$SOURCE_SHA"$'\t'refs/heads/main ] || {
            echo "Gitee main does not equal the reviewed event SHA." >&2
            exit 1
          }
          echo "gitee_main_sync result=PASS source_sha=$SOURCE_SHA sync_seconds=$((SECONDS - started))"
