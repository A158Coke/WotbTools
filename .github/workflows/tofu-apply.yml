name: Infra / Tofu Apply

on:
  workflow_call:
    inputs:
      root:
        required: true
        type: string
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      root:
        required: true
        type: choice
        options:
          - keycloak
          - rabbitmq
          - business-postgres
          - keycloak-postgres
          - minio
          - cos
          - grafana

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.select.outputs.root }}
      root_path: ${{ steps.select.outputs.root_path }}
      source_sha: ${{ steps.select.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: select
        name: Require one root at current main HEAD
        shell: bash
        env:
          ROOT: ${{ inputs.root }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == refs/heads/main ]] || { echo 'Tofu Apply requires main.' >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be a full lowercase SHA.' >&2; exit 1; }
          [[ "$SOURCE_SHA" == "$EVENT_SHA" ]] || { echo 'source_sha must equal the trusted event SHA.' >&2; exit 1; }
          case "$ROOT" in
            keycloak|rabbitmq|business-postgres|keycloak-postgres|minio|cos|grafana) ;;
            *) echo "Unknown OpenTofu root: $ROOT" >&2; exit 1 ;;
          esac
          case "$ROOT" in
            business-postgres) root_path=infra/tofu/postgres-business ;;
            keycloak-postgres) root_path=infra/tofu/postgres-keycloak ;;
            cos) root_path=infra/tofu/environments/prod ;;
            *) root_path="infra/tofu/$ROOT" ;;
          esac
          actual_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$actual_main" == "$SOURCE_SHA" ]] || {
            echo "Stale Tofu run: selected $SOURCE_SHA; current main $actual_main. Use a new single-root run." >&2
            exit 1
          }
          [[ -d "$root_path" ]] || { echo "Root directory is missing: $root_path" >&2; exit 1; }
          {
            echo "root=$ROOT"
            echo "root_path=$root_path"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

  cloud:
    needs: preflight
    if: contains(fromJSON('["cos","grafana"]'), needs.preflight.outputs.root)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: "true"
      CHECKPOINT_DISABLE: "1"
      AWS_ACCESS_KEY_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
      TF_VAR_grafana_auth: ${{ needs.preflight.outputs.root == 'grafana' && secrets.GRAFANA_PAT || '' }}
      GRAFANA_URL: https://monitor.wotbtools.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Apply exact cloud plan
        shell: bash
        env:
          ROOT: ${{ needs.preflight.outputs.root }}
          ROOT_PATH: ${{ needs.preflight.outputs.root_path }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]] || { echo 'COS credentials missing.' >&2; exit 1; }
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$SOURCE_SHA" ]] || { echo 'Main advanced before production plan.' >&2; exit 1; }
          [[ "$ROOT" != grafana || -n "$TF_VAR_grafana_auth" ]] || { echo 'Grafana credential missing.' >&2; exit 1; }
          cd "$ROOT_PATH"
          trap 'rm -f -- plan.tfplan second-plan.tfplan' EXIT
          tofu fmt -check -recursive
          tofu init -reconfigure -input=false
          tofu validate
          tofu plan -input=false -no-color -out=plan.tfplan
          case "$ROOT" in
            cos) bash "$GITHUB_WORKSPACE/scripts/ci/validate-tofu-prod-plan.sh" plan.tfplan ;;
            grafana) bash ./validate-plan.sh plan.tfplan ;;
          esac
          tofu apply -input=false -auto-approve plan.tfplan
          tofu plan -input=false -no-color -out=second-plan.tfplan
          second_json="$(tofu show -json second-plan.tfplan)"
          if jq -e 'any(.resource_changes[]?; ((.change.actions // []) | any(. != "no-op")))' <<< "$second_json" >/dev/null; then
            echo 'Second production plan is not clean.' >&2
            exit 1
          fi
      - name: Verify Grafana API readiness
        if: needs.preflight.outputs.root == 'grafana'
        shell: bash
        env:
          GRAFANA_AUTH: ${{ secrets.GRAFANA_PAT }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            "$GRAFANA_URL/api/health" | jq -e '.database == "ok"' >/dev/null
          for uid in wotbtools-production-overview wotbtools-backend-overview \
            wotbtools-error-explorer wotbtools-ai-review wotbtools-usage wotbtools-keycloak; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
              -H "Authorization: Bearer ${GRAFANA_AUTH}" \
              "$GRAFANA_URL/api/dashboards/uid/$uid" \
              | jq -e --arg uid "$uid" '.dashboard.uid == $uid' >/dev/null
          done

  tx:
    needs: preflight
    if: contains(fromJSON('["keycloak","rabbitmq","business-postgres","keycloak-postgres"]'), needs.preflight.outputs.root)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tx-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Remove stale staged TX root
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          script: |
            set -eu
            case "${{ needs.preflight.outputs.root_path }}" in
              infra/tofu/keycloak|infra/tofu/rabbitmq|infra/tofu/postgres-business|infra/tofu/postgres-keycloak) ;;
              *) echo 'Unexpected TX root path.' >&2; exit 1 ;;
            esac
            stage="/opt/wotb-tx/tofu.incoming/${{ needs.preflight.outputs.source_sha }}"
            rm -rf -- "$stage/${{ needs.preflight.outputs.root_path }}"
            mkdir -p -- "$stage"
      - name: Stage one TX root
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: ${{ needs.preflight.outputs.root_path }},deploy/tx/keycloak-tofu.sh
          target: /opt/wotb-tx/tofu.incoming/${{ needs.preflight.outputs.source_sha }}
          overwrite: true
      - name: Reject stale main before TX mutation
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$SOURCE_SHA" ]] || {
            echo 'Main advanced before TX OpenTofu apply.' >&2
            exit 1
          }
      - name: Apply Keycloak realm on TX localhost
        if: needs.preflight.outputs.root == 'keycloak'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 25m
          envs: KEYCLOAK_ADMIN_USERNAME,KEYCLOAK_ADMIN_PASSWORD,KEYCLOAK_ADMIN_CLIENT_SECRET,KEYCLOAK_ADMIN_CLIENT_SECRET_VERSION,KEYCLOAK_E2E_CLIENT_SECRET,KEYCLOAK_E2E_CLIENT_SECRET_VERSION,WG_APPLICATION_ID,TX_QQ_CLIENT_ID,TX_QQ_CLIENT_SECRET,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            set -euo pipefail
            root="/opt/wotb-tx/tofu.incoming/${{ needs.preflight.outputs.source_sha }}"
            bash "$root/deploy/tx/keycloak-tofu.sh" "$root/infra/tofu/keycloak"
        env:
          KEYCLOAK_ADMIN_USERNAME: admin
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.TX_KC_BOOTSTRAP_ADMIN_PASSWORD }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          KEYCLOAK_ADMIN_CLIENT_SECRET_VERSION: ${{ vars.KEYCLOAK_ADMIN_CLIENT_SECRET_VERSION || '1' }}
          KEYCLOAK_E2E_CLIENT_SECRET: ${{ secrets.KEYCLOAK_E2E_CLIENT_SECRET }}
          KEYCLOAK_E2E_CLIENT_SECRET_VERSION: ${{ vars.KEYCLOAK_E2E_CLIENT_SECRET_VERSION || '1' }}
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
          TX_QQ_CLIENT_ID: ${{ vars.TX_QQ_CLIENT_ID }}
          TX_QQ_CLIENT_SECRET: ${{ secrets.TX_QQ_CLIENT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}

      - name: Apply RabbitMQ on TX localhost
        if: needs.preflight.outputs.root == 'rabbitmq'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 25m
          envs: TX_RABBITMQ_ADMIN_USER,TX_RABBITMQ_ADMIN_PASSWORD,TX_RABBITMQ_CONTROL_API_PASSWORD,TX_RABBITMQ_PARSER_WORKER_PASSWORD
          script: |
            set -euo pipefail
            root="/opt/wotb-tx/tofu.incoming/${{ needs.preflight.outputs.source_sha }}/infra/tofu/rabbitmq"
            test -d "$root" && test -f /opt/wotb-tx/deploy/rabbitmq.tofurc
            for name in TX_RABBITMQ_ADMIN_USER TX_RABBITMQ_ADMIN_PASSWORD TX_RABBITMQ_CONTROL_API_PASSWORD TX_RABBITMQ_PARSER_WORKER_PASSWORD; do
              test -n "${!name:-}" || { echo "$name is required." >&2; exit 2; }
            done
            command -v tofu >/dev/null && command -v python3 >/dev/null
            bash "$root/bootstrap-provider-mirror.sh" "$root"
            export TF_CLI_CONFIG_FILE=/opt/wotb-tx/deploy/rabbitmq.tofurc
            export TF_VAR_rabbitmq_management_endpoint=http://127.0.0.1:15672
            export TF_VAR_rabbitmq_admin_user="$TX_RABBITMQ_ADMIN_USER"
            export TF_VAR_rabbitmq_admin_password="$TX_RABBITMQ_ADMIN_PASSWORD"
            export TF_VAR_control_api_password="$TX_RABBITMQ_CONTROL_API_PASSWORD"
            export TF_VAR_parser_worker_password="$TX_RABBITMQ_PARSER_WORKER_PASSWORD"
            umask 077
            install -d -m 700 /opt/wotb-tx/rabbitmq-tofu-state
            cd "$root"
            trap 'rm -f -- plan.tfplan second-plan.tfplan' EXIT
            tofu fmt -check -recursive
            tofu init -reconfigure -input=false -lockfile=readonly
            tofu validate
            tofu plan -input=false -no-color -out=plan.tfplan
            bash ./validate-plan.sh plan.tfplan
            tofu apply -input=false -auto-approve plan.tfplan
            tofu plan -input=false -no-color -out=second-plan.tfplan
            bash ./validate-plan.sh second-plan.tfplan --require-no-changes
            printf '%s\n' tx-local-opentofu-rabbitmq > /opt/wotb-tx/rabbitmq.tofu-provisioned
            chmod 600 /opt/wotb-tx/rabbitmq.tofu-provisioned
        env:
          TX_RABBITMQ_ADMIN_USER: ${{ vars.TX_RABBITMQ_ADMIN_USER }}
          TX_RABBITMQ_ADMIN_PASSWORD: ${{ secrets.TX_RABBITMQ_ADMIN_PASSWORD }}
          TX_RABBITMQ_CONTROL_API_PASSWORD: ${{ secrets.TX_RABBITMQ_CONTROL_API_PASSWORD }}
          TX_RABBITMQ_PARSER_WORKER_PASSWORD: ${{ secrets.TX_RABBITMQ_PARSER_WORKER_PASSWORD }}
      - name: Apply Business PostgreSQL on TX localhost
        if: needs.preflight.outputs.root == 'business-postgres'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 25m
          envs: TX_BUSINESS_POSTGRES_ADMIN_USER,TX_BUSINESS_POSTGRES_ADMIN_PASSWORD,TX_BUSINESS_DB_NAME,TX_BUSINESS_DB_USERNAME,TX_BUSINESS_DB_PASSWORD,TX_BUSINESS_DB_PASSWORD_VERSION
          script: |
            set -euo pipefail
            root="/opt/wotb-tx/tofu.incoming/${{ needs.preflight.outputs.source_sha }}/infra/tofu/postgres-business"
            test -d "$root" && test -f /opt/wotb-tx/deploy/business-postgres.tofurc
            for name in TX_BUSINESS_POSTGRES_ADMIN_USER TX_BUSINESS_POSTGRES_ADMIN_PASSWORD TX_BUSINESS_DB_NAME TX_BUSINESS_DB_USERNAME TX_BUSINESS_DB_PASSWORD TX_BUSINESS_DB_PASSWORD_VERSION; do
              test -n "${!name:-}" || { echo "$name is required." >&2; exit 2; }
            done
            command -v tofu >/dev/null && command -v python3 >/dev/null
            export TF_CLI_CONFIG_FILE=/opt/wotb-tx/deploy/business-postgres.tofurc
            export TF_VAR_postgresql_admin_username="$TX_BUSINESS_POSTGRES_ADMIN_USER"
            export TF_VAR_postgresql_admin_password="$TX_BUSINESS_POSTGRES_ADMIN_PASSWORD"
            export TF_VAR_business_database_name="$TX_BUSINESS_DB_NAME"
            export TF_VAR_business_role_name="$TX_BUSINESS_DB_USERNAME"
            export TF_VAR_business_role_password="$TX_BUSINESS_DB_PASSWORD"
            export TF_VAR_business_role_password_version="$TX_BUSINESS_DB_PASSWORD_VERSION"
            umask 077
            install -d -m 700 /opt/wotb-tx/postgres-business-tofu-state
            cd "$root"
            trap 'rm -f -- plan.tfplan second-plan.tfplan' EXIT
            tofu fmt -check -recursive
            tofu init -reconfigure -input=false -lockfile=readonly
            tofu validate
            tofu plan -input=false -no-color -out=plan.tfplan
            bash ./validate-plan.sh plan.tfplan
            tofu apply -input=false -auto-approve plan.tfplan
            tofu plan -input=false -no-color -out=second-plan.tfplan
            bash ./validate-plan.sh second-plan.tfplan --require-no-changes
            printf '%s\n' tx-local-opentofu-business-postgres > /opt/wotb-tx/business-postgres.tofu-provisioned
            chmod 600 /opt/wotb-tx/business-postgres.tofu-provisioned
        env:
          TX_BUSINESS_POSTGRES_ADMIN_USER: ${{ vars.TX_BUSINESS_POSTGRES_ADMIN_USER }}
          TX_BUSINESS_POSTGRES_ADMIN_PASSWORD: ${{ secrets.TX_BUSINESS_POSTGRES_ADMIN_PASSWORD }}
          TX_BUSINESS_DB_NAME: ${{ vars.TX_BUSINESS_DB_NAME }}
          TX_BUSINESS_DB_USERNAME: ${{ vars.TX_BUSINESS_DB_USERNAME }}
          TX_BUSINESS_DB_PASSWORD: ${{ secrets.TX_BUSINESS_DB_PASSWORD }}
          TX_BUSINESS_DB_PASSWORD_VERSION: ${{ vars.TX_BUSINESS_DB_PASSWORD_VERSION || '1' }}
      - name: Apply Keycloak PostgreSQL on TX localhost
        if: needs.preflight.outputs.root == 'keycloak-postgres'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 25m
          envs: KC_POSTGRES_ADMIN_PASSWORD,KC_DB_PASSWORD,KC_DB_PASSWORD_VERSION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            set -euo pipefail
            root="/opt/wotb-tx/tofu.incoming/${{ needs.preflight.outputs.source_sha }}/infra/tofu/postgres-keycloak"
            test -d "$root" && test -f /opt/wotb-tx/tofurc
            for name in KC_POSTGRES_ADMIN_PASSWORD KC_DB_PASSWORD KC_DB_PASSWORD_VERSION; do
              test -n "${!name:-}" || { echo "$name is required." >&2; exit 2; }
            done
            command -v tofu >/dev/null && command -v jq >/dev/null
            export TF_CLI_CONFIG_FILE=/opt/wotb-tx/tofurc
            export TF_VAR_postgresql_admin_username=kc_admin
            export TF_VAR_postgresql_admin_password="$KC_POSTGRES_ADMIN_PASSWORD"
            export TF_VAR_keycloak_role_password="$KC_DB_PASSWORD"
            export TF_VAR_keycloak_role_password_version="$KC_DB_PASSWORD_VERSION"
            umask 077
            cd "$root"
            trap 'rm -f -- plan.tfplan second-plan.tfplan' EXIT
            tofu fmt -check -recursive
            tofu init -reconfigure -input=false
            tofu validate
            tofu plan -input=false -no-color -out=plan.tfplan
            bash ./validate-plan.sh plan.tfplan
            tofu apply -input=false -auto-approve plan.tfplan
            tofu plan -input=false -no-color -out=second-plan.tfplan
            second_json="$(tofu show -json second-plan.tfplan)"
            if jq -e 'any(.resource_changes[]?; ((.change.actions // []) | any(. != "no-op")))' <<< "$second_json" >/dev/null; then
              echo 'Keycloak PostgreSQL second plan is not clean.' >&2
              exit 1
            fi
        env:
          KC_POSTGRES_ADMIN_PASSWORD: ${{ secrets.TX_KC_POSTGRES_ADMIN_PASSWORD }}
          KC_DB_PASSWORD: ${{ secrets.TX_KC_DB_PASSWORD }}
          KC_DB_PASSWORD_VERSION: ${{ vars.TX_KC_DB_PASSWORD_VERSION || '1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
  yecao:
    needs: preflight
    if: needs.preflight.outputs.root == 'minio'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Remove stale staged MinIO root
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            stage="/opt/wotb/minio.incoming/${{ needs.preflight.outputs.source_sha }}"
            rm -rf -- "$stage/infra/tofu/minio"
            mkdir -p -- "$stage"
      - name: Stage MinIO root and provider CLI config
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: infra/tofu/minio,deploy/minio/tofurc
          target: /opt/wotb/minio.incoming/${{ needs.preflight.outputs.source_sha }}
          overwrite: true
      - name: Reject stale main before Yecao mutation
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$SOURCE_SHA" ]] || {
            echo 'Main advanced before Yecao OpenTofu apply.' >&2
            exit 1
          }
      - name: Apply MinIO on Yecao local state
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          envs: YECAO_MINIO_ROOT_USER,YECAO_MINIO_ROOT_PASSWORD,YECAO_MINIO_WORKER_ACCESS_KEY,YECAO_MINIO_WORKER_SECRET_KEY,YECAO_MINIO_CONTROL_API_ACCESS_KEY,YECAO_MINIO_CONTROL_API_SECRET_KEY
          script: |
            set -euo pipefail
            stage="/opt/wotb/minio.incoming/${{ needs.preflight.outputs.source_sha }}"
            root="$stage/infra/tofu/minio"
            test -d "$root" && test -f "$stage/deploy/minio/tofurc"
            test -d /opt/wotb/tofu-provider-mirror
            for name in YECAO_MINIO_ROOT_USER YECAO_MINIO_ROOT_PASSWORD YECAO_MINIO_WORKER_ACCESS_KEY YECAO_MINIO_WORKER_SECRET_KEY YECAO_MINIO_CONTROL_API_ACCESS_KEY YECAO_MINIO_CONTROL_API_SECRET_KEY; do
              test -n "${!name:-}" || { echo "$name is required." >&2; exit 2; }
            done
            command -v tofu >/dev/null && command -v python3 >/dev/null
            export TF_CLI_CONFIG_FILE="$stage/deploy/minio/tofurc"
            export TF_VAR_minio_server=10.20.0.2:9000
            export TF_VAR_minio_root_user="$YECAO_MINIO_ROOT_USER"
            export TF_VAR_minio_root_password="$YECAO_MINIO_ROOT_PASSWORD"
            export TF_VAR_worker_access_key="$YECAO_MINIO_WORKER_ACCESS_KEY"
            export TF_VAR_worker_secret_key="$YECAO_MINIO_WORKER_SECRET_KEY"
            export TF_VAR_control_api_access_key="$YECAO_MINIO_CONTROL_API_ACCESS_KEY"
            export TF_VAR_control_api_secret_key="$YECAO_MINIO_CONTROL_API_SECRET_KEY"
            umask 077
            install -d -m 700 /opt/wotb/minio-tofu-state
            cd "$root"
            trap 'rm -f -- plan.tfplan second-plan.tfplan' EXIT
            tofu fmt -check -recursive
            tofu init -reconfigure -input=false -lockfile=readonly
            tofu validate
            tofu plan -input=false -no-color -out=plan.tfplan
            bash ./validate-plan.sh plan.tfplan
            tofu apply -input=false -auto-approve plan.tfplan
            tofu plan -input=false -no-color -out=second-plan.tfplan
            bash ./validate-plan.sh second-plan.tfplan --require-no-changes
        env:
          YECAO_MINIO_ROOT_USER: ${{ secrets.YECAO_MINIO_ROOT_USER }}
          YECAO_MINIO_ROOT_PASSWORD: ${{ secrets.YECAO_MINIO_ROOT_PASSWORD }}
          YECAO_MINIO_WORKER_ACCESS_KEY: ${{ secrets.YECAO_MINIO_WORKER_ACCESS_KEY }}
          YECAO_MINIO_WORKER_SECRET_KEY: ${{ secrets.YECAO_MINIO_WORKER_SECRET_KEY }}
          YECAO_MINIO_CONTROL_API_ACCESS_KEY: ${{ secrets.YECAO_MINIO_CONTROL_API_ACCESS_KEY }}
          YECAO_MINIO_CONTROL_API_SECRET_KEY: ${{ secrets.YECAO_MINIO_CONTROL_API_SECRET_KEY }}
