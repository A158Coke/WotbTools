name: Caddy Gateway

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/caddy.yml
      - deploy/tx/deploy.sh
      - deploy/tx/docker-compose.yml
      - deploy/tx/common.compose.yml
      - deploy/tx/caddy.compose.yml
      - deploy/tx/validate-caddy-config.sh
      - deploy/tx/Caddyfile
      - deploy/tx/assets/**
      # The Komodo owner's canonical release pin: this workflow verifies the public
      # Komodo route against that exact release, so a version bump must re-run the
      # gateway verification too.
      - deploy/komodo/verify.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false
  queue: max

env:
  PRODUCTION_INPUT_PATHS: |
    .github/workflows/caddy.yml
    deploy/tx/deploy.sh
    deploy/tx/docker-compose.yml
    deploy/tx/common.compose.yml
    deploy/tx/caddy.compose.yml
    deploy/tx/validate-caddy-config.sh
    deploy/tx/Caddyfile
    deploy/tx/assets/**
    deploy/komodo/verify.sh

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: tx-production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Freeze current main and reject stale source
        id: identity
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [ "$REF_NAME" = refs/heads/main ] || { echo 'Manual deployment must dispatch from main.' >&2; exit 1; }
          fi
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
          echo "commit_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Recheck main immediately before production staging
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ steps.identity.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
      - name: Prepare TX Caddy staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          script: |
            set -eu
            root=/opt/wotb-tx
            mkdir -p "$root/deploy.incoming/deploy" "$root/deploy.incoming/deploy/tx"
            rm -rf -- "$root/deploy.incoming/deploy/tx"
            mkdir -p "$root/deploy.incoming/deploy/tx"
      - name: Stage the TX Caddy configuration and shared runtime contract
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tx
          target: /opt/wotb-tx/deploy.incoming
          overwrite: true
      - name: Reject stale main before TX mutation
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ steps.identity.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
      - name: Read the pinned Komodo Core release
        id: komodo
        shell: bash
        run: |
          set -euo pipefail
          # `deploy/komodo/verify.sh` holds the Komodo owner's canonical release
          # pin. The public Komodo route is verified against that exact release, so
          # the value is derived instead of duplicated here.
          core_version="$(sed -n 's/^pinned_core_version=\([0-9][0-9.]*\)$/\1/p' deploy/komodo/verify.sh)"
          [[ "$core_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo 'Unable to read the pinned Komodo Core release from deploy/komodo/verify.sh.' >&2; exit 1; }
          echo "core_version=$core_version" >> "$GITHUB_OUTPUT"
      - name: Reconcile and verify Caddy under one TX host lock
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 30m
          envs: WOTB_DEPLOY_SERVICE,WOTB_DEPLOY_CONFIG_SHA,CADDY_ACME_EMAIL,KOMODO_CORE_VERSION
          script: |
            set -euo pipefail
            exec 9>/opt/wotb-tx/.deploy.lock
            flock -n 9 || { echo 'Another TX production deployment is running.' >&2; exit 1; }
            export WOTB_DEPLOY_LOCK_FD=9
            export WOTB_DEPLOY_SERVICE=caddy
            export WOTB_DEPLOY_CONFIG_SHA='${{ steps.identity.outputs.commit_sha }}'
            bash /opt/wotb-tx/deploy.incoming/deploy/tx/deploy.sh

            # Test the gateway after its own local readiness and trusted-peer reload
            # have succeeded. These checks are intentionally separate from Caddy process health:
            # upstream failures fail this gate but never stop a repaired Caddy container.
            # `tx_probe` runs curl on the TX host network, so it reaches both the public
            # names below and the WireGuard upstreams behind them.
            tx_probe() {
              docker run --rm --network host curlimages/curl:8.12.1 "$@"
            }
            www_redirect="$(tx_probe --silent --show-error --output /dev/null --max-time 15 \
              --write-out '%{http_code} %{redirect_url}' --max-redirs 0 \
              https://www.wotbtools.com/ci-gateway-check)"
            [[ "$www_redirect" == 301\ https://wotbtools.com/ci-gateway-check ]] \
              || { echo "www canonical redirect contract failed: $www_redirect" >&2; exit 1; }
            http_www_redirect="$(tx_probe --silent --show-error --output /dev/null --max-time 15 \
              --write-out '%{http_code} %{redirect_url}' --max-redirs 0 \
              http://www.wotbtools.com/ci-gateway-check)"
            case "$http_www_redirect" in
              301\ https://*|308\ https://*) ;;
              *) echo "HTTP www redirect contract failed: $http_www_redirect" >&2; exit 1 ;;
            esac
            http_redirect="$(tx_probe --silent --show-error --output /dev/null --max-time 15 \
              --write-out '%{http_code} %{redirect_url}' --max-redirs 0 \
              http://wotbtools.com/ci-gateway-check)"
            [[ "$http_redirect" == 301\ https://wotbtools.com/ci-gateway-check || \
               "$http_redirect" == 308\ https://wotbtools.com/ci-gateway-check ]] \
              || { echo "HTTP-to-HTTPS redirect contract failed: $http_redirect" >&2; exit 1; }

            ready=false
            for attempt in $(seq 1 60); do
              if tx_probe --fail --silent --show-error --max-time 15 \
                  https://wotbtools.com/api/health >/dev/null; then
                ready=true
                break
              fi
              [ "$attempt" -lt 60 ] && sleep 2
            done
            [ "$ready" = true ] || { echo 'Public frontend/API route did not become ready over trusted TLS.' >&2; exit 1; }
            tx_probe --fail --silent --show-error --max-time 15 \
              https://auth.wotbtools.com/realms/wotbtools/.well-known/openid-configuration >/dev/null
            tx_probe --fail --silent --show-error --max-time 15 \
              https://auth.wotbtools.com/.well-known/assetlinks.json | grep -F 'com.wotbtools.app'

            # Komodo public ingress (K2). Two layers, in this order on purpose:
            # the WireGuard upstream is proved first, so a failure below can be
            # attributed to Caddy/TLS/DNS rather than to Yecao or Komodo Core.
            komodo_upstream=
            for attempt in $(seq 1 15); do
              if komodo_upstream="$(tx_probe --fail --silent --show-error --max-time 10 \
                  http://10.20.0.2:9120/version 2>/dev/null)" && [ -n "$komodo_upstream" ]; then
                break
              fi
              komodo_upstream=
              [ "$attempt" -lt 15 ] && sleep 2
            done
            [ "$komodo_upstream" = "$KOMODO_CORE_VERSION" ] || {
              echo "TX cannot reach the Komodo Core WireGuard upstream http://10.20.0.2:9120/version: expected $KOMODO_CORE_VERSION, got '${komodo_upstream:-<unreachable>}'. This is a WireGuard / Yecao / Komodo Core problem, not a Caddy configuration problem." >&2
              exit 1
            }
            echo "Komodo Core private upstream reports: $komodo_upstream"

            # Certificates for a new site are issued on first use, so bound the
            # retries instead of assuming the first handshake succeeds.
            komodo_public=
            for attempt in $(seq 1 45); do
              if komodo_public="$(tx_probe --fail --silent --show-error --max-time 15 \
                  https://komodo.wotbtools.com/version 2>/dev/null)" && [ -n "$komodo_public" ]; then
                break
              fi
              komodo_public=
              [ "$attempt" -lt 45 ] && sleep 2
            done
            [ "$komodo_public" = "$KOMODO_CORE_VERSION" ] || {
              echo "Public Komodo route https://komodo.wotbtools.com/version did not return $KOMODO_CORE_VERSION (got '${komodo_public:-<unreachable>}') although the private upstream was verified over WireGuard. This is a Caddy / TLS / DNS problem." >&2
              caddy_container="$(docker ps --format '{{.Names}}' | grep -m1 caddy || true)"
              [ -z "$caddy_container" ] || docker logs --tail 80 "$caddy_container" >&2 || true
              exit 1
            }
            tx_probe --fail --silent --show-error --max-time 15 --output /dev/null \
              https://komodo.wotbtools.com/ \
              || { echo 'The Komodo frontend did not answer over the public route.' >&2; exit 1; }
            echo "Komodo public ingress verified: $komodo_public"
        env:
          WOTB_DEPLOY_SERVICE: caddy
          WOTB_DEPLOY_CONFIG_SHA: ${{ steps.identity.outputs.commit_sha }}
          CADDY_ACME_EMAIL: ${{ vars.CADDY_ACME_EMAIL }}
          KOMODO_CORE_VERSION: ${{ steps.komodo.outputs.core_version }}
