name: Temporary playback terrain attitude implementation

on:
  push:
    branches:
      - feat/playback-terrain-attitude
    paths:
      - .github/workflows/tmp-playback-terrain-attitude.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/playback-terrain-attitude
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply feature patch
        run: python tmp/apply-playback-terrain-attitude.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Targeted validation
        working-directory: frontend
        run: npx vitest run src/utils/terrainReliefProjection.test.js src/components/VehicleMarker.test.js src/utils/playbackVehicleState.test.js src/components/BattlePlayback.integration.test.js

      - name: Commit implementation and remove temporary files
        run: |
          git config user.name 'WotbTools AI'
          git config user.email 'wotbtools-ai@local'
          git add frontend/src/utils/terrainReliefProjection.js frontend/src/utils/terrainReliefProjection.test.js frontend/src/components/BattlePlayback.vue frontend/src/components/VehicleMarker.vue frontend/src/components/VehicleMarker.test.js docs/current-plan.md docs/features/battle-playback.md docs/CHANGELOG.md docs/CHANGELOG-PRODUCT.md
          git rm .github/workflows/tmp-playback-terrain-attitude.yml tmp/apply-playback-terrain-attitude.py
          git commit -m 'feat(playback): 增加2.5D车辆地形姿态' -m 'Co-Authored-By: OpenAI <noreply@openai.com>'
          git push origin HEAD:feat/playback-terrain-attitude
