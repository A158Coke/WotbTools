name: Data / Crew Skills Update
run-name: Sync Crew Skills from BlitzKit by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-crew-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Sync crew skills from stable BlitzKit snapshot
        run: |
          set -euo pipefail
          python3 common/python/update_crew_skills.py \
            --existing common/crew-skills.json \
            --output /tmp/crew-skills.json
          python3 -m json.tool /tmp/crew-skills.json >/dev/null
          mv /tmp/crew-skills.json common/crew-skills.json

      - name: Validate generated crew skills
        run: |
          set -euo pipefail
          python3 -m unittest common.python.tests.test_update_crew_skills
          git diff --check

      - name: Commit data branch and open/update PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/update-crew-skills
        run: |
          set -euo pipefail
          cat > /tmp/crew-skills-pr-body.md <<'BODY'
          Automated crew-skill sync from BlitzKit.

          - Reads stable game.pb + skills.pb snapshots
          - Imports newly supported canonical skill IDs automatically
          - Rejects missing/new tank classes, suspicious count drops, invalid IDs, and duplicates
          - Records game version and skills.pb SHA-256 when skill semantics actually change
          - Does not create timestamp-only or metadata-only PRs
          - Runs generator tests and explicitly dispatches normal CI
          - Never auto-merges
          BODY
          bash scripts/ci/publish-data-update.sh \
            --branch "$BRANCH" \
            --commit-message "chore(data): sync BlitzKit crew skills" \
            --pr-title "chore(data): sync BlitzKit crew skills" \
            --pr-body-file /tmp/crew-skills-pr-body.md \
            --path common/crew-skills.json
