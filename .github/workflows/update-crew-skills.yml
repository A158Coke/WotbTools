name: Update Crew Skills

# 手动触发：从 BlitzKit 的 SkillDefinitions protobuf 同步成员技能目录。
# 数据源不需要 secret；脚本只落档 BlitzKit 明确提供的车型 -> canonical skill id，
# 不根据网页文案猜测技能名称、描述或效果数值。
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-crew-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync crew skills from BlitzKit
        run: |
          set -e
          python3 common/python/update_crew_skills.py --output /tmp/crew-skills.json
          python3 -m json.tool /tmp/crew-skills.json >/dev/null
          mv /tmp/crew-skills.json common/crew-skills.json

      - name: Commit updated crew skills
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process');
            const changed = execSync(
              'git status --porcelain -- common/crew-skills.json',
              { encoding: 'utf8' }
            ).trim();
            if (!changed) {
              console.log('crew skills unchanged; nothing to commit.');
              return;
            }
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
            execSync('git add common/crew-skills.json');
            execSync('git commit -m "chore(data): 同步 BlitzKit 成员技能"');
            execSync('git push');
