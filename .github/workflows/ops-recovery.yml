name: Ops Recovery
run-name: Ops Recovery ${{ inputs.service }} (${{ inputs.operation }}) by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: Application service to recover; never selects the whole stack
        required: true
        type: choice
        options:
          - backend
          - frontend
          - keycloak
      operation:
        description: Use the service identity in production metadata or an explicit source SHA
        required: true
        type: choice
        default: current
        options:
          - current
          - specific
      target_sha:
        description: Full lowercase source SHA for specific recovery; leave empty for current metadata
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
      target_schema_max: ${{ steps.target.outputs.target_schema_max }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Validate target and calculate migration ceiling
        id: target
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CHECKED_OUT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OPERATION" = specific ]; then
            [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "specific recovery requires a full lowercase target SHA" >&2
              exit 1
            }
            target_sha="$TARGET_SHA"
            if ! git cat-file -e "$target_sha^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$target_sha"
            fi
            git cat-file -e "$target_sha^{commit}" 2>/dev/null || {
              echo "specific recovery target commit is unavailable" >&2
              exit 1
            }
            target_schema_max=0
            while IFS= read -r migration_path; do
              migration_name="${migration_path##*/}"
              if [[ "$migration_name" =~ ^V([0-9]+)__.*[.]sql$ ]]; then
                version="${BASH_REMATCH[1]}"
                [ "$version" -gt "$target_schema_max" ] && target_schema_max="$version"
              fi
            done < <(git ls-tree -r --name-only "$target_sha" -- java/wotb-web/src/main/resources/db/migration)
          else
            [ -z "$TARGET_SHA" ] || {
              echo "target_sha is only valid for specific recovery" >&2
              exit 1
            }
            target_sha="$CHECKED_OUT_SHA"
            target_schema_max=""
          fi
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "target_schema_max=$target_schema_max" >> "$GITHUB_OUTPUT"

  recover:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Verify immutable recovery image exists
        if: inputs.operation == 'specific'
        env:
          SERVICE: ${{ inputs.service }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SERVICE" in
            backend) image=ghcr.io/a158coke/wotbtools-backend ;;
            frontend) image=ghcr.io/a158coke/wotbtools-frontend ;;
            keycloak) image=ghcr.io/a158coke/wotbtools-keycloak ;;
            *) echo "unsupported recovery service" >&2; exit 1 ;;
          esac
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
          docker manifest inspect "$image:sha-${TARGET_SHA:0:12}" >/dev/null
      - name: Prepare recovery directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            rm -rf -- /opt/wotb/recovery.incoming
            mkdir -p /opt/wotb/recovery.incoming
      - name: Install recovery scripts
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy
          target: /opt/wotb/recovery.incoming
          overwrite: true
      - name: Recover one application service via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          envs: WOTB_RECOVERY_SERVICE,WOTB_RECOVERY_MODE,WOTB_RECOVERY_SHA,WOTB_TARGET_SCHEMA_MAX,WOTB_RECOVERY_RUN_NUMBER,DB_PASSWORD,KC_ADMIN_PASSWORD,WG_APPLICATION_ID,KEYCLOAK_ADMIN_CLIENT_SECRET,AI_API_KEY,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD,BOOST_AUTO_CONFIRM_HOURS,BOOST_AUTO_CONFIRM_SCAN_MS,AI_BASE_URL,AI_MODEL,AI_CONNECT_TIMEOUT_SEC,AI_TIMEOUT_SEC,AI_CALL_TIMEOUT_SEC,AI_RETRY_MAX_ATTEMPTS,AI_RETRY_INITIAL_BACKOFF_MS,AI_RETRY_MAX_BACKOFF_MS,AI_RETRY_BACKOFF_MULTIPLIER,AI_CONTEXT_WINDOW_TOKENS,AI_SINGLE_REPLAY_MAX_INPUT_TOKENS,AI_MAX_OUTPUT_TOKENS,AI_PROMPT_SAFETY_MARGIN_TOKENS,AI_THINKING_ENABLED,AI_THINKING_ENABLED_CALL2,AI_REASONING_EFFORT,AI_REVIEW_WORKER_MAX_CONCURRENT,AI_REVIEW_WORKER_QUEUE_CAPACITY,AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC,REPLAY_COORDINATE_HALF_EXTENT,REPLAY_COORDINATE_CLAMP_TOLERANCE,GRAFANA_ROOT_URL,OBSERVABILITY_ENVIRONMENT
          script: bash /opt/wotb/recovery.incoming/deploy/ops-recovery.sh
        env:
          WOTB_RECOVERY_SERVICE: ${{ inputs.service }}
          WOTB_RECOVERY_MODE: ${{ inputs.operation }}
          WOTB_RECOVERY_SHA: ${{ inputs.operation == 'specific' && needs.prepare.outputs.target_sha || '' }}
          WOTB_TARGET_SCHEMA_MAX: ${{ needs.prepare.outputs.target_schema_max }}
          WOTB_RECOVERY_RUN_NUMBER: ${{ github.run_number }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          BOOST_AUTO_CONFIRM_HOURS: ${{ vars.BOOST_AUTO_CONFIRM_HOURS || '72' }}
          BOOST_AUTO_CONFIRM_SCAN_MS: ${{ vars.BOOST_AUTO_CONFIRM_SCAN_MS || '300000' }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-v4-flash' }}
          AI_CONNECT_TIMEOUT_SEC: ${{ vars.AI_CONNECT_TIMEOUT_SEC || '10' }}
          AI_TIMEOUT_SEC: ${{ vars.AI_TIMEOUT_SEC || '300' }}
          AI_CALL_TIMEOUT_SEC: ${{ vars.AI_CALL_TIMEOUT_SEC || '315' }}
          AI_RETRY_MAX_ATTEMPTS: ${{ vars.AI_RETRY_MAX_ATTEMPTS || '3' }}
          AI_RETRY_INITIAL_BACKOFF_MS: ${{ vars.AI_RETRY_INITIAL_BACKOFF_MS || '1000' }}
          AI_RETRY_MAX_BACKOFF_MS: ${{ vars.AI_RETRY_MAX_BACKOFF_MS || '8000' }}
          AI_RETRY_BACKOFF_MULTIPLIER: ${{ vars.AI_RETRY_BACKOFF_MULTIPLIER || '2.0' }}
          AI_CONTEXT_WINDOW_TOKENS: ${{ vars.AI_CONTEXT_WINDOW_TOKENS || '1000000' }}
          AI_SINGLE_REPLAY_MAX_INPUT_TOKENS: ${{ vars.AI_SINGLE_REPLAY_MAX_INPUT_TOKENS || '940000' }}
          AI_MAX_OUTPUT_TOKENS: ${{ vars.AI_MAX_OUTPUT_TOKENS || '32768' }}
          AI_PROMPT_SAFETY_MARGIN_TOKENS: ${{ vars.AI_PROMPT_SAFETY_MARGIN_TOKENS || '16384' }}
          AI_THINKING_ENABLED: ${{ vars.AI_THINKING_ENABLED || 'true' }}
          AI_THINKING_ENABLED_CALL2: ${{ vars.AI_THINKING_ENABLED_CALL2 || 'false' }}
          AI_REASONING_EFFORT: ${{ vars.AI_REASONING_EFFORT || 'max' }}
          AI_REVIEW_WORKER_MAX_CONCURRENT: ${{ vars.AI_REVIEW_WORKER_MAX_CONCURRENT || '4' }}
          AI_REVIEW_WORKER_QUEUE_CAPACITY: ${{ vars.AI_REVIEW_WORKER_QUEUE_CAPACITY || '4' }}
          AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC: '1100'
          REPLAY_COORDINATE_HALF_EXTENT: ${{ vars.REPLAY_COORDINATE_HALF_EXTENT || '250' }}
          REPLAY_COORDINATE_CLAMP_TOLERANCE: ${{ vars.REPLAY_COORDINATE_CLAMP_TOLERANCE || '12.5' }}
          GRAFANA_ROOT_URL: ${{ vars.GRAFANA_ROOT_URL || 'https://monitor.wotbtools.com' }}
          OBSERVABILITY_ENVIRONMENT: ${{ vars.OBSERVABILITY_ENVIRONMENT || 'production' }}
