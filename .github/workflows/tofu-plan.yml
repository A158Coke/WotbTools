name: OpenTofu COS Plan

on:
  pull_request:
    paths:
      - "infra/tofu/**"
      - ".github/workflows/tofu-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opentofu-prod
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra/tofu/environments/prod

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      CHECKPOINT_DISABLE: "1"
      TRUSTED_PRODUCTION_RUN: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Verify Tencent credential wiring
        if: env.TRUSTED_PRODUCTION_RUN == 'true'
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        shell: bash
        run: |
          test -n "$TENCENTCLOUD_SECRET_ID"
          test -n "$TENCENTCLOUD_SECRET_KEY"

          echo "SecretId length: ${#TENCENTCLOUD_SECRET_ID}"
          echo "SecretId prefix: ${TENCENTCLOUD_SECRET_ID:0:4}"
          echo "SecretKey length: ${#TENCENTCLOUD_SECRET_KEY}"

      - name: Probe Tencent provider authentication
        if: env.TRUSTED_PRODUCTION_RUN == 'true'
        continue-on-error: true
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        shell: bash
        run: |
          probe_dir="$(mktemp -d "${RUNNER_TEMP}/tencent-provider-probe.XXXXXX")"
          probe_log="${RUNNER_TEMP}/tencent-provider-probe.log"
          cleanup() {
            rm -rf "$probe_dir" "$probe_log"
          }
          trap cleanup EXIT

          cat > "$probe_dir/main.tf" <<'EOF'
          terraform {
            required_providers {
              tencentcloud = {
                source  = "tencentcloudstack/tencentcloud"
                version = "1.83.26"
              }
            }
          }

          provider "tencentcloud" {
            region = "ap-shanghai"
          }

          data "tencentcloud_user_info" "credential_probe" {}
          EOF

          tofu -chdir="$probe_dir" init -backend=false -input=false -no-color

          if tofu -chdir="$probe_dir" plan -input=false -no-color -target=data.tencentcloud_user_info.credential_probe >"$probe_log" 2>&1; then
            echo "Tencent provider probe: authentication request succeeded"
          else
            echo "Tencent provider probe: failed; inspect this separately from the S3 backend result"
            grep -E 'Error:|StatusCode|AccessDenied|InvalidAccessKeyId|Unauthorized' "$probe_log" | head -n 8 || true
            exit 1
          fi

      - name: Initialize OpenTofu without production backend
        if: env.TRUSTED_PRODUCTION_RUN != 'true'
        run: tofu init -backend=false -input=false

      - name: Initialize OpenTofu with production backend
        if: env.TRUSTED_PRODUCTION_RUN == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: tofu init -reconfigure -input=false

      - name: Validate configuration
        run: tofu validate

      - name: Create authenticated plan
        if: env.TRUSTED_PRODUCTION_RUN == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: tofu plan -input=false -no-color -out=plan.tfplan

      - name: Reject artifact bucket destruction or replacement
        if: env.TRUSTED_PRODUCTION_RUN == 'true'
        shell: bash
        run: |
          if tofu show -json plan.tfplan | jq -e '
            any(.resource_changes[]?;
              (.address == "tencentcloud_cos_bucket.production_artifacts" and
                ((.change.actions // []) | index("delete") != null)))
          ' >/dev/null; then
            echo "The production artifact bucket has a delete action in the plan."
            exit 1
          fi
