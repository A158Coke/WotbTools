name: Infra / COS Plan

on:
  pull_request:
    paths:
      - "infra/tofu/**"
      - ".github/workflows/tofu-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opentofu-prod
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra/tofu/environments/prod

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      CHECKPOINT_DISABLE: "1"
      TRUSTED_PRODUCTION_RUN: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Initialize OpenTofu without production backend
        if: env.TRUSTED_PRODUCTION_RUN != 'true'
        run: tofu init -backend=false -input=false

      - name: Initialize OpenTofu with production backend
        if: env.TRUSTED_PRODUCTION_RUN == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: tofu init -reconfigure -input=false

      - name: Validate configuration
        run: tofu validate

      - name: Create authenticated plan
        if: env.TRUSTED_PRODUCTION_RUN == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: tofu plan -input=false -no-color -out=plan.tfplan

      - name: Reject artifact bucket destruction or replacement
        if: env.TRUSTED_PRODUCTION_RUN == 'true'
        shell: bash
        run: |
          if tofu show -json plan.tfplan | jq -e '
            any(.resource_changes[]?;
              (.address == "tencentcloud_cos_bucket.production_artifacts" and
                ((.change.actions // []) | index("delete") != null)))
          ' >/dev/null; then
            echo "The production artifact bucket has a delete action in the plan."
            exit 1
          fi

      - name: Reject production Lighthouse destruction or replacement
        if: env.TRUSTED_PRODUCTION_RUN == 'true'
        shell: bash
        run: |
          if tofu show -json plan.tfplan | jq -e '
            any(.resource_changes[]?;
              ((.address == "tencentcloud_lighthouse_instance.production" or
                .address == "tencentcloud_lighthouse_firewall_rule.production") and
                ((.change.actions // []) | index("delete") != null)))
          ' >/dev/null; then
            echo "The production Lighthouse instance or firewall has a delete action in the plan."
            exit 1
          fi
