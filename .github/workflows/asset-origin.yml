name: Asset Origin Source Mirror

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/asset-origin.yml
      - deploy/assets/**
      - infra/komodo/resources/asset-origin.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-asset-origin-source
  cancel-in-progress: true

jobs:
  mirror_gitee:
    name: Mirror exact GitHub source to Gitee
    concurrency:
      group: production-gitee-mirror
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject non-main invocation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "Unsupported mirror event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          [ "$EVENT_REF" = refs/heads/main ] || {
            echo "Asset-origin Gitee mirror must run from main." >&2
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Asset-origin source SHA must be a full lowercase commit SHA." >&2
            exit 1
          }

      - name: Mirror WotbTools to Gitee
        uses: Yikun/hub-mirror-action@ec47170fa9d126a4bee5a1ab9359845bb1395248
        with:
          src: github/A158Coke
          dst: gitee/A158Coke
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          static_list: WotbTools
          account_type: user
          force_update: true
          timeout: 10m

      - name: Require Gitee main at the reviewed GitHub SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mirrored=
          for attempt in $(seq 1 12); do
            mirrored="$(timeout 15s git ls-remote https://gitee.com/A158Coke/Wotbtools.git refs/heads/main 2>/dev/null | awk '{print $1}' || true)"
            if [ "$mirrored" = "$SOURCE_SHA" ]; then
              echo "Gitee mirror verified at $SOURCE_SHA"
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          echo "Gitee main does not match reviewed GitHub SHA $SOURCE_SHA (found ${mirrored:-<missing>})." >&2
          exit 1
