name: Asset Origin Source Mirror

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/asset-origin.yml
      - deploy/assets/**
      - infra/komodo/resources/asset-origin.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-asset-origin-source
  cancel-in-progress: true

env:
  GITEE_ASSET_BRANCH: asset-origin

jobs:
  mirror_gitee:
    name: Mirror exact GitHub source to Gitee
    concurrency:
      group: production-gitee-mirror
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Freeze reviewed main source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "Unsupported mirror event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          [ "$EVENT_REF" = refs/heads/main ] || {
            echo "Asset-origin Gitee mirror must run from main." >&2
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Asset-origin source SHA must be a full lowercase commit SHA." >&2
            exit 1
          }
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ] || {
            echo "Checked-out source differs from the frozen event SHA." >&2
            exit 1
          }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      # Do not mirror whatever GitHub `main` happens to point at when this step
      # starts. Push the already-checked-out event commit to a dedicated Gitee
      # transport branch so unrelated newer main commits cannot make this gate
      # verify or deploy the wrong source, and this workflow cannot move the
      # shared Gitee `main` backward underneath Frontend/Business API builds.
      - name: Push frozen event SHA to Gitee asset branch
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          GITEE_USERNAME: A158Coke
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/gitee-askpass.sh"
          cleanup() { rm -f -- "$askpass"; }
          trap cleanup EXIT
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$GITEE_USERNAME" ;;
            *Password*) printf '%s\n' "$GITEE_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"

          git update-ref refs/heads/asset-origin-frozen "$SOURCE_SHA"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push --force \
              https://gitee.com/A158Coke/Wotbtools.git \
              refs/heads/asset-origin-frozen:refs/heads/$GITEE_ASSET_BRANCH

      - name: Require Gitee asset branch at the reviewed GitHub SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          mirrored=
          for attempt in $(seq 1 12); do
            mirrored="$(timeout 15s git ls-remote \
              https://gitee.com/A158Coke/Wotbtools.git \
              "refs/heads/$GITEE_ASSET_BRANCH" 2>/dev/null | awk '{print $1}' || true)"
            if [ "$mirrored" = "$SOURCE_SHA" ]; then
              echo "Gitee $GITEE_ASSET_BRANCH verified at $SOURCE_SHA"
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          echo "Gitee $GITEE_ASSET_BRANCH does not match reviewed GitHub SHA $SOURCE_SHA (found ${mirrored:-<missing>})." >&2
          exit 1
