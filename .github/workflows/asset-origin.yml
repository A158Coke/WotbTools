name: Asset Origin Source Mirror

# Source-transport owner for the Komodo Stack `wotbtools-asset-origin`.
#
# It may mutate ONLY the asset-owned transport pair:
#   * the derived GitHub `asset-origin` branch (a pointer to the frozen reviewed
#     main SHA), and
#   * the matching Gitee `asset-origin` transport branch.
# It never touches shared Gitee `main`, never applies ResourceSync, never mutates
# Komodo resources, and never deploys the Stack (`deploy = false`,
# `webhook_enabled = false`, human ResourceSync Apply).
#
# asset-origin owner 保留 GitHub pointer 与 Gitee transport pair。
# 独立 gitee-mirror.yml 只更新 main，不写或 prune asset-origin；共享
# production-gitee-mirror 队列保留，防止 transport mutation 交错。
#
# `infra/komodo/resources/asset-origin.toml` is the single reviewed exception to
# the rule that the declarative resource tree is owned by no production workflow:
# it is an input of this source-transport gate only (see .github/AGENTS.md).
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/asset-origin.yml
      - deploy/assets/**
      - deploy/check-production-freshness.sh
      - infra/komodo/resources/asset-origin.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-asset-origin-source
  cancel-in-progress: true

env:
  PRODUCTION_INPUT_PATHS: |
    .github/workflows/asset-origin.yml
    deploy/assets/**
    deploy/check-production-freshness.sh
    infra/komodo/resources/asset-origin.toml

jobs:
  mirror_gitee:
    name: Mirror exact GitHub source to Gitee
    concurrency:
      group: production-gitee-mirror
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The job publishes the derived GitHub `asset-origin` pointer branch (so the
    # all-branch Gitee mirrors carry it instead of pruning it) and nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Freeze reviewed main source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "Unsupported mirror event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          [ "$EVENT_REF" = refs/heads/main ] || {
            echo "Asset-origin Gitee mirror must run from main." >&2
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Asset-origin source SHA must be a full lowercase commit SHA." >&2
            exit 1
          }
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ] || {
            echo "Checked-out source differs from the frozen event SHA." >&2
            exit 1
          }
          # Shared production gate: reject a non-ancestor source and any later
          # change to this owner's inputs. A stale workflow_dispatch already fails
          # here; the stricter exact-current-main check runs immediately before the
          # asset-owned Gitee ref mutation below.
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      # 将冻结的 event SHA 发布到 asset-owned transport pair；main-only 同步
      # 不写 asset-origin，共享 production-gitee-mirror 队列仍串行化 transport mutation。
      #
      # The transport pair is asset-owned: ONLY this workflow moves
      # `refs/heads/asset-origin` (GitHub pointer and Gitee transport), so no other
      # owner can move the Stack's source underneath a human deploy. The ordinary
      # freshness tolerance for "main advanced in unrelated commits" is still not
      # enough for a force update: a run that is no longer exact current main must
      # fail closed instead of pinning the asset ref to an older source.
      # `PRODUCTION_REQUIRE_EXACT_MAIN=1` makes the shared helper fetch current
      # GitHub main and require it to still equal the frozen SOURCE_SHA, for both
      # push and workflow_dispatch; it runs before either ref is mutated.
      - name: Push frozen event SHA to the Gitee asset-origin ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          PRODUCTION_REQUIRE_EXACT_MAIN: "1"
          GITEE_USERNAME: A158Coke
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/gitee-askpass.sh"
          cleanup() { rm -f -- "$askpass"; }
          trap cleanup EXIT
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$GITEE_USERNAME" ;;
            *Password*) printf '%s\n' "$GITEE_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"

          git update-ref refs/heads/asset-origin-frozen "$SOURCE_SHA"

          # The ref mutation follows immediately. Re-run the shared freshness gate
          # with the exact-current-main requirement, so a run that is no longer
          # exact current main fails before anything is pushed and never switches
          # to the newer SHA.
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"

          # 保留现有 asset-owned GitHub pointer，随后发布同一 SHA 到 Gitee transport ref。
          git push --force origin "$SOURCE_SHA:refs/heads/asset-origin"

          # main 由独立 gitee-mirror.yml 拥有；此 Stack 仅消费 asset-owned ref。
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push --force \
              https://gitee.com/A158Coke/Wotbtools.git \
              refs/heads/asset-origin-frozen:refs/heads/asset-origin

      - name: Require Gitee asset-origin ref at the reviewed GitHub SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          mirrored=
          for attempt in $(seq 1 12); do
            mirrored="$(timeout 15s git ls-remote \
              https://gitee.com/A158Coke/Wotbtools.git \
              refs/heads/asset-origin 2>/dev/null | awk '{print $1}' || true)"
            if [ "$mirrored" = "$SOURCE_SHA" ]; then
              echo "Gitee asset-origin ref verified at $SOURCE_SHA"
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          echo "Gitee asset-origin ref does not match reviewed GitHub SHA $SOURCE_SHA (found ${mirrored:-<missing>})." >&2
          exit 1
