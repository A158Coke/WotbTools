name: Update Tankopedia

# 手动触发：在 VPS（WG 白名单 IP）上跑 WG 官方百科同步，把生成的 tankopedia.json
# 拉回 runner 并提交回当前分支（merge 后为 main）。
#
# 为什么走 VPS：WG application_id 有 IP 白名单（上限 10 个），GitHub Actions runner
# 的 IP 是动态池无法白名单；VPS 因运行 WG 登录已在使用同一个 application_id 且 IP
# 已白名单。本地手动跑需把本机出口 IP 加入 WG 开发者后台白名单。
#
# 需要的 GitHub Secrets：WG_APPLICATION_ID、VPS_HOST / VPS_USER / VPS_PORT / VPS_SSH_KEY。
on:
  workflow_dispatch:
    inputs:
      region:
        description: "WG 区服"
        type: choice
        default: asia
        options:
          - asia
          - eu
          - com
      min-tier:
        description: "保留的最低等级（默认 7 = 只保留 7-10 级）"
        type: number
        default: 7
      alpha-rule:
        description: "alphaDamage 规则（first=default_profile.shells 第一发；conservative=保留旧值）"
        type: choice
        default: first
        options:
          - first
          - conservative

permissions:
  contents: write

concurrency:
  group: update-tankopedia
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          for var in WG_APPLICATION_ID VPS_HOST VPS_USER VPS_PORT VPS_SSH_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::$var secret is required."
              exit 1
            fi
          done

      - name: Prepare VPS temp dir and upload script + current tankopedia
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "rm -rf /tmp/wotb-tankopedia && mkdir -p /tmp/wotb-tankopedia"
          # 命名契约：tankopedia-current.json = 旧数据输入，tankopedia-new.json = 新数据输出
          scp -o StrictHostKeyChecking=no -P "$VPS_PORT" \
            common/python/update_tankopedia.py \
            "$VPS_USER@$VPS_HOST:/tmp/wotb-tankopedia/update_tankopedia.py"
          scp -o StrictHostKeyChecking=no -P "$VPS_PORT" \
            common/tankopedia.json \
            "$VPS_USER@$VPS_HOST:/tmp/wotb-tankopedia/tankopedia-current.json"

      - name: Sync tankopedia on VPS
        uses: appleboy/ssh-action@v1
        envs: WG_APPLICATION_ID,REGION,MIN_TIER,ALPHA_RULE
        env:
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
          REGION: ${{ inputs.region }}
          MIN_TIER: ${{ inputs.min-tier }}
          ALPHA_RULE: ${{ inputs.alpha-rule }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /tmp/wotb-tankopedia
            test -f update_tankopedia.py
            test -f tankopedia-current.json
            docker run --rm \
              -e WG_APPLICATION_ID="$WG_APPLICATION_ID" \
              -v "$PWD:/sync" \
              python:3.12-alpine \
              python /sync/update_tankopedia.py \
                --region "$REGION" \
                --min-tier "$MIN_TIER" \
                --alpha-rule "$ALPHA_RULE" \
                --existing /sync/tankopedia-current.json \
                --output /sync/tankopedia-new.json

      - name: Fetch new tankopedia.json
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          scp -o StrictHostKeyChecking=no -P "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST:/tmp/wotb-tankopedia/tankopedia-new.json" \
            "$GITHUB_WORKSPACE/common/tankopedia.new.json"

      - name: Verify extraKnowledge preservation before commit
        run: |
          set -e
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "common/python")
          from update_tankopedia import load_existing_data, verify_knowledge_preservation
          old = load_existing_data("common/tankopedia.json")
          new = load_existing_data("common/tankopedia.new.json")
          ok, old_count, preserved = verify_knowledge_preservation(old, new)
          print("existing_knowledge=%d preserved_knowledge=%d" % (old_count, preserved))
          if not ok:
              print("::error::extraKnowledge preservation check failed; aborting commit.")
              sys.exit(1)
          PY

      - name: Replace tankopedia.json
        run: mv common/tankopedia.new.json common/tankopedia.json

      - name: Commit updated tankopedia.json
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process');
            const changed = execSync(
              'git status --porcelain -- common/tankopedia.json',
              { encoding: 'utf8' }
            ).trim();
            if (!changed) {
              console.log('tankopedia.json unchanged; nothing to commit.');
              return;
            }
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
            execSync('git add common/tankopedia.json');
            execSync(
              'git commit -m "chore(data): 同步 WG 官方车辆百科（region=${{ inputs.region }}, min-tier=${{ inputs.min-tier }}, alpha-rule=${{ inputs.alpha-rule }}）"'
            );
            execSync('git push');
