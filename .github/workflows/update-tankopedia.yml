name: Update Tankopedia
run-name: Sync Tankopedia from BlitzKit by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-tankopedia
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Sync tankopedia from BlitzKit
        run: |
          set -euo pipefail
          mkdir -p /tmp/wotb-tankopedia-out
          python3 common/python/update_tankopedia.py \
            --existing-dir common \
            --output-dir /tmp/wotb-tankopedia-out

      - name: Verify extraInfo preservation before commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "common/python")
          from update_tankopedia import load_existing_data_dir, verify_knowledge_preservation
          old = load_existing_data_dir("common")
          new = load_existing_data_dir("/tmp/wotb-tankopedia-out")
          ok, old_count, preserved = verify_knowledge_preservation(old, new)
          print("existing_knowledge=%d preserved_knowledge=%d" % (old_count, preserved))
          if not ok:
              print("::error::extraInfo preservation check failed; aborting update.")
              sys.exit(1)
          PY

      - name: Replace tier files
        run: |
          set -euo pipefail
          cp /tmp/wotb-tankopedia-out/tankopedia-tier7.json common/tankopedia-tier7.json
          cp /tmp/wotb-tankopedia-out/tankopedia-tier8.json common/tankopedia-tier8.json
          cp /tmp/wotb-tankopedia-out/tankopedia-tier9.json common/tankopedia-tier9.json
          cp /tmp/wotb-tankopedia-out/tankopedia-tier10.json common/tankopedia-tier10.json

      - name: Validate generated files
        run: |
          set -euo pipefail
          python3 -m unittest discover -s common/python/tests -p 'test_*.py'
          git diff --check

      - name: Commit data branch and open/update PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/update-tankopedia
        run: |
          set -euo pipefail
          if git diff --quiet -- common/tankopedia-tier7.json common/tankopedia-tier8.json common/tankopedia-tier9.json common/tankopedia-tier10.json; then
            echo "Tankopedia unchanged; nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add common/tankopedia-tier7.json common/tankopedia-tier8.json common/tankopedia-tier9.json common/tankopedia-tier10.json
          git commit -m "chore(data): sync BlitzKit Tankopedia"
          git push --force-with-lease origin "HEAD:$BRANCH" || git push --force origin "HEAD:$BRANCH"

          pr_number="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(data): sync BlitzKit Tankopedia" \
              --body $'Automated Tankopedia sync from BlitzKit.\n\n- Generates tier 7-10 data\n- Preserves existing extraInfo\n- Runs integrity gates and Python tests\n- Requires normal PR CI/review before merge'
          else
            echo "Updated existing PR #$pr_number"
          fi
