name: Data / Tankopedia Update
run-name: Sync Tankopedia from BlitzKit by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-tankopedia
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Sync and validate Tankopedia from one BlitzKit snapshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/wotb-tankopedia-out
          python3 common/python/sync_tankopedia_snapshot.py \
            --existing-dir common \
            --output-dir /tmp/wotb-tankopedia-out

      - name: Verify extraInfo preservation before commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "common/python")
          from update_tankopedia import load_existing_data_dir, verify_knowledge_preservation
          old = load_existing_data_dir("common")
          new = load_existing_data_dir("/tmp/wotb-tankopedia-out")
          ok, old_count, preserved = verify_knowledge_preservation(old, new)
          print("existing_knowledge=%d preserved_knowledge=%d" % (old_count, preserved))
          if not ok:
              print("::error::extraInfo preservation check failed; aborting update.")
              sys.exit(1)
          PY

      - name: Replace tier files and vehicle roster
        run: |
          set -euo pipefail
          for tier in {1..10}; do
            cp "/tmp/wotb-tankopedia-out/tankopedia-tier${tier}.json" "common/tankopedia-tier${tier}.json"
          done
          cp /tmp/wotb-tankopedia-out/tank_ids.json common/tank_ids.json

      - name: Validate generated files
        run: |
          set -euo pipefail
          python3 -m unittest discover -s common/python/tests -p 'test_*.py'
          git diff --check

      - name: Commit data branch and open/update PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/update-tankopedia
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > /tmp/tankopedia-pr-body.md <<'BODY'
          Automated Tankopedia sync from BlitzKit.

          - Generates and validates tier 1-10 data from one upstream snapshot
          - Fails closed when a vehicle has no reviewed equipment preset
          - Fails closed when a preset references unknown equipment
          - Preserves existing extraInfo
          - Runs integrity gates and Python tests
          - Explicitly dispatches normal CI for this automation branch
          - Never auto-merges
          BODY
          bash scripts/ci/publish-data-update.sh \
            --branch "$BRANCH" \
            --source-ref "$SOURCE_REF" \
            --commit-message "chore(data): sync BlitzKit Tankopedia" \
            --pr-title "chore(data): sync BlitzKit Tankopedia" \
            --pr-body-file /tmp/tankopedia-pr-body.md \
            --path 'common/tankopedia-tier*.json' \
            --path common/tank_ids.json
