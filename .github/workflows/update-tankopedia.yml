name: Update Tankopedia

# 手动触发：直接从 blitzkit（assets.blitzkit.app/definitions/tanks.pb，游戏客户端数据）
# 同步车辆库，把生成的 tankopedia.json 提交回当前分支（merge 后为 main）。
#
# 为什么不再走 VPS / WG API：数据源已全面切换为 blitzkit（WG 百科滞后游戏版本，
# 如 11.19 的 SPHT / AC Atlas 缺失，且 application_id 有 IP 白名单限制）；
# blitzkit 是公开 CDN，GitHub Actions runner 可直接访问，无需任何 secret。
#
# 额外知识保护：脚本 --existing / --output 路径分离，提交前再次用
# verify_knowledge_preservation 校验，仍存在的车辆知识点丢失会中止提交。
on:
  workflow_dispatch:
    inputs:
      min-tier:
        description: "保留的最低等级（默认 7 = 只保留 7-10 级）"
        type: number
        default: 7

permissions:
  contents: write

concurrency:
  group: update-tankopedia
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync tankopedia from blitzkit
        env:
          MIN_TIER: ${{ inputs.min-tier }}
        run: |
          set -e
          python3 common/python/update_tankopedia.py \
            --min-tier "$MIN_TIER" \
            --existing common/tankopedia.json \
            --output common/tankopedia.new.json

      - name: Verify extraKnowledge preservation before commit
        run: |
          set -e
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "common/python")
          from update_tankopedia import load_existing_data, verify_knowledge_preservation
          old = load_existing_data("common/tankopedia.json")
          new = load_existing_data("common/tankopedia.new.json")
          ok, old_count, preserved = verify_knowledge_preservation(old, new)
          print("existing_knowledge=%d preserved_knowledge=%d" % (old_count, preserved))
          if not ok:
              print("::error::extraKnowledge preservation check failed; aborting commit.")
              sys.exit(1)
          PY

      - name: Replace tankopedia.json
        run: mv common/tankopedia.new.json common/tankopedia.json

      - name: Commit updated tankopedia.json
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process');
            const changed = execSync(
              'git status --porcelain -- common/tankopedia.json',
              { encoding: 'utf8' }
            ).trim();
            if (!changed) {
              console.log('tankopedia.json unchanged; nothing to commit.');
              return;
            }
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
            execSync('git add common/tankopedia.json');
            execSync(
              'git commit -m "chore(data): 同步 blitzkit 车辆库（min-tier=${{ inputs.min-tier }}）"'
            );
            execSync('git push');
