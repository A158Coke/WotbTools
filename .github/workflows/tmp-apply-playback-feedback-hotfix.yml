name: Temporary playback feedback patch

on:
  push:
    branches:
      - fix/playback-damage-feedback

permissions:
  contents: write

jobs:
  patch:
    if: startsWith(github.event.head_commit.message, 'chore: retry playback feedback hotfix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/playback-damage-feedback
          fetch-depth: 0

      - name: Apply focused projector fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('java/wotb-web/src/main/java/com/wotb/web/replay/ai/BattlePlaybackProjector.java')
          text = path.read_text(encoding='utf-8')
          old = '''    private static boolean transientAllowed(final List<PositionSegment> segments,
                                              final PlaybackCombatReconstruction.Loss loss) {
              if (segments == null) {
                  return false;
              }
              return segments.stream().filter(segment -> "OBSERVED".equals(segment.knowledge())
                              && segment.startSec() <= loss.fromSec() + 1e-6
                              && segment.endSec() >= loss.toSec() - 1e-6)
                      .count() == 1;
          }
          '''
          new = '''    /**
           * Combat feedback needs a trustworthy damage fact and a place to render it; it does not
           * require a fresh Type-10 position packet for the entire HP-sample interval. A stationary
           * vehicle can legitimately keep the same canonical last-known anchor while its HP changes.
           *
           * <p>Keep the gate conservative: only a single, reliably attributed canonical damage event
           * may animate. Multi-hit/ambiguous windows remain deterministic HP state changes only.</p>
           */
          private static boolean transientAllowed(final List<PositionSegment> segments,
                                                  final PlaybackCombatReconstruction.Loss loss) {
              if (segments == null || loss == null
                      || loss.damageEventCount() != 1 || !loss.attackerReliable()) {
                  return false;
              }
              return segments.stream()
                      .flatMap(segment -> segment.samples().stream())
                      .anyMatch(sample -> sample.timeSec() <= loss.toSec() + 1e-6);
          }
          '''
          if old not in text:
              raise SystemExit('expected transientAllowed block not found; refusing broad edit')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "WotbTools AI"
          git config user.email "wotbtools-ai@local"
          git add java/wotb-web/src/main/java/com/wotb/web/replay/ai/BattlePlaybackProjector.java
          git commit -m "fix(playback): restore damage feedback for retained markers"
          git push origin HEAD:fix/playback-damage-feedback
