name: Temporary playback feedback patch

on:
  push:
    branches:
      - fix/playback-damage-feedback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/playback-damage-feedback
          fetch-depth: 0

      - name: Apply hit-time observation gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('java/wotb-web/src/main/java/com/wotb/web/replay/ai/BattlePlaybackProjector.java')
          text = path.read_text(encoding='utf-8')
          desired_marker = 'only the HP-loss endpoint must be currently observed'
          if desired_marker in text:
              print('focused fix already present')
              raise SystemExit(0)
          start_token = '    /**\n     * Combat feedback needs a trustworthy damage fact and a place to render it; it does not'
          start = text.find(start_token)
          if start < 0:
              start_token = '    private static boolean transientAllowed(final List<PositionSegment> segments,'
              start = text.find(start_token)
          next_token = '    private static List<LifeTransition> lifeTransitions('
          end = text.find(next_token, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('transientAllowed method boundary not found; refusing broad edit')
          lines = [
              '    /**',
              '     * fromSec is the previous trustworthy HP sample, not a visibility-window start. For',
              '     * map-anchored hit feedback only the HP-loss endpoint must be currently observed;',
              '     * requiring one OBSERVED position segment to cover the whole HP sample interval',
              '     * suppresses real hits when a vehicle becomes observed after the previous HP sample.',
              '     */',
              '    private static boolean transientAllowed(final List<PositionSegment> segments,',
              '                                            final PlaybackCombatReconstruction.Loss loss) {',
              '        if (segments == null || loss == null) {',
              '            return false;',
              '        }',
              '        return segments.stream().anyMatch(segment -> "OBSERVED".equals(segment.knowledge())',
              '                && segment.startSec() <= loss.toSec() + 1e-6',
              '                && segment.endSec() >= loss.toSec() - 1e-6);',
              '    }',
              '',
          ]
          replacement = '\n'.join(lines) + '\n'
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Commit focused fix when changed
        run: |
          if git diff --quiet -- java/wotb-web/src/main/java/com/wotb/web/replay/ai/BattlePlaybackProjector.java; then
            echo "No projector change to commit."
            exit 0
          fi
          git config user.name "WotbTools AI"
          git config user.email "wotbtools-ai@local"
          git add java/wotb-web/src/main/java/com/wotb/web/replay/ai/BattlePlaybackProjector.java
          git commit -m "fix(playback): gate damage feedback at hit time"
          git push origin HEAD:fix/playback-damage-feedback
