name: CI / deployment
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy_smoke:
    name: Deployment and infrastructure contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          # 历史重写后 main 与旧 commit 图无关：`deploy/test-flyway-immutability.sh` 里
          # "已批准的 V18 历史恢复"用例所依赖的 base commit 只经由旧 android 发布标签可达，
          # 而 checkout 默认不取 tags —— 不显式打开，该用例解析不到 base commit。
          fetch-tags: true
      - name: Flyway migration immutability guard
        env:
          FLYWAY_BASE_REF: ${{ inputs.base_sha }}
        run: bash deploy/check-flyway-immutability.sh "$FLYWAY_BASE_REF"
      - name: Flyway migration guard fixture
        run: bash deploy/test-flyway-immutability.sh
      - name: Read-only dependency readiness protocol unit tests
        run: python3 deploy/test_dependency_readiness.py
      - name: Bash syntax for deploy entrypoints and local policy fixtures
        run: >-
          bash -n deploy/deploy.sh
          deploy/verify-observability.sh deploy/tx/deploy.sh deploy/tx/with-deploy-lock.sh
          deploy/tx/build-frontend-from-gitee.sh scripts/fetch-agent-wasm.sh
          deploy/tx/validate-caddy-config.sh deploy/list-image-tags.sh
          deploy/tx/business-postgres-backup.sh deploy/tx/business-postgres-restore.sh
          deploy/tx/keycloak-postgres-backup.sh deploy/test-keycloak-postgres-backup.sh
          deploy/tofu-local-state-backup.sh
          deploy/tx/runtime-check.sh deploy/tx/runtime-check-lib.sh
          deploy/tx/publish-loaded-image-to-tcr.sh deploy/tx/k7c-preflight.sh
          deploy/tx/k7c-sync-runtime-content.sh
          deploy/assets/verify.sh
          deploy/test-tx-runtime-config.sh deploy/test-user-profile-reset-audit.sh
          deploy/test-yecao-wireguard-boundary.sh deploy/test-tx-runtime-check.sh
          deploy/test-deploy-contract.sh deploy/test-nginx-grafana-recreate.sh
          deploy/test-nginx-real-ip.sh
          deploy/test-caddy-route-inventory.sh
          deploy/check-latest-main.sh deploy/test-check-latest-main.sh deploy/test-tx-deploy-lock.sh
          deploy/test-workflow-bash-blocks.sh
          infra/tofu/postgres-business/validate-plan.sh infra/tofu/postgres-business/test-validate-plan.sh
          deploy/test-business-postgres-runtime.sh
          scripts/ci/test-postgres-business-tofu-contract.sh
          scripts/ci/test-tofu-workflow-contract.sh
      - name: Workflow inline bash run blocks syntax gate
        run: bash deploy/test-workflow-bash-blocks.sh .github/workflows
      - name: Caddy staged configuration validation
        env:
          TX_RUNTIME_ROOT: /tmp/tx-runtime
          CADDY_ACME_EMAIL: ci@example.invalid
        run: |
          set -euo pipefail
          mkdir -p "$TX_RUNTIME_ROOT"
          bash scripts/ci/run-with-network-retry.sh "Pull Caddy image" docker pull caddy:2.10.2-alpine
          bash deploy/tx/validate-caddy-config.sh deploy/tx
          broken="$RUNNER_TEMP/broken-caddy"
          rm -rf -- "$broken"
          cp -a deploy/tx "$broken"
          printf '%s\n' 'wotbtools.com {' '  this-is-not-a-caddy-directive' '}' > "$broken/Caddyfile"
          if bash deploy/tx/validate-caddy-config.sh "$broken" > "$RUNNER_TEMP/broken-caddy.log" 2>&1; then
            echo 'an invalid staged Caddyfile was accepted' >&2
            exit 1
          fi
          grep -q 'must reverse_proxy {$CADDY_FRONTEND_UPSTREAM}' "$RUNNER_TEMP/broken-caddy.log" || {
            cat "$RUNNER_TEMP/broken-caddy.log" >&2
            exit 1
          }
          not_adaptable="$RUNNER_TEMP/not-adaptable-caddy"
          rm -rf -- "$not_adaptable"
          cp -a deploy/tx "$not_adaptable"
          sed -i '/^wotbtools\.com {$/a \\tthis-is-not-a-caddy-directive' "$not_adaptable/Caddyfile"
          if bash deploy/tx/validate-caddy-config.sh "$not_adaptable" > "$RUNNER_TEMP/not-adaptable-caddy.log" 2>&1; then
            echo 'a Caddyfile that Caddy cannot adapt was accepted' >&2
            exit 1
          fi
          grep -q 'could not be adapted by Caddy' "$RUNNER_TEMP/not-adaptable-caddy.log" || {
            cat "$RUNNER_TEMP/not-adaptable-caddy.log" >&2
            exit 1
          }
          docker compose -p deploy -f deploy/tx/common.compose.yml -f deploy/tx/caddy.compose.yml \
            down --volumes --remove-orphans >/dev/null 2>&1 || true
      - name: Asset origin Compose and Caddy request-level smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$(mktemp -d)"
          container="wotb-asset-origin-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT

          # Native Compose validation owns the workload-shape contract; no source
          # grep is used as a proxy for what Docker will actually run.
          docker compose --project-directory deploy/assets -f deploy/assets/compose.yaml \
            config --format json > "$work/compose.json"
          python3 - "$work/compose.json" <<'PY'
          import json, sys
          compose = json.load(open(sys.argv[1], encoding="utf-8"))
          assert compose["name"] == "wotbtools-asset-origin", compose.get("name")
          services = compose.get("services", {})
          assert set(services) == {"caddy"}, sorted(services)
          caddy = services["caddy"]
          assert caddy["image"] == "caddy:2.10.2-alpine", caddy.get("image")
          assert caddy.get("restart") == "unless-stopped", caddy.get("restart")
          ports = {(int(p["target"]), str(p["published"]), p.get("protocol", "tcp")) for p in caddy.get("ports", [])}
          assert ports == {(80, "80", "tcp"), (443, "443", "tcp")}, ports
          by_target = {v["target"]: v for v in caddy.get("volumes", [])}
          assert by_target["/etc/caddy/Caddyfile"].get("read_only") is True, by_target
          assert by_target["/srv/wotb-assets"].get("type") == "bind", by_target
          assert by_target["/srv/wotb-assets"].get("read_only") is True, by_target
          assert "/data" in by_target and "/config" in by_target, by_target
          PY

          mkdir -p "$work/assets/current"
          printf '%s\n' '{"asset-origin":"fixture"}' > "$work/assets/current/index.json"
          sed 's/^assets\.wotbtools\.com {/http:\/\/:8080 {/' deploy/assets/Caddyfile > "$work/Caddyfile"

          docker run --rm --entrypoint caddy \
            -v "$work/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null

          docker run -d --name "$container" --entrypoint caddy \
            -p 127.0.0.1::8080 \
            -v "$work/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$work/assets:/srv/wotb-assets:ro" \
            caddy:2.10.2-alpine \
            run --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null

          host_port="$(docker port "$container" 8080/tcp | sed -n 's/.*://p' | head -n1)"
          [[ "$host_port" =~ ^[0-9]+$ ]] || { echo "could not resolve disposable Caddy port: $host_port" >&2; exit 1; }
          base="http://127.0.0.1:$host_port"
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 0 \
            --connect-timeout 1 --max-time 10 "$base/index.json" >/dev/null

          # The production verifier owns request-level semantics and is deliberately
          # reused here against the disposable real Caddy process. This keeps ETag
          # parsing, timeouts, CORS, Range, and conditional GET behavior single-sourced.
          bash deploy/assets/verify.sh "$base"
          echo 'asset-origin Compose and Caddy request-level smoke: PASS'
      - name: Workflow and ToFu safety fixtures
        run: |
          set -euo pipefail
          bash scripts/ci/test-workflow-contract.sh
          bash scripts/ci/test-tofu-workflow-contract.sh
          bash scripts/ci/test-postgres-keycloak-tofu-contract.sh
          bash scripts/ci/test-postgres-business-tofu-contract.sh
      - name: Declarative Komodo resource contract
        run: python3 scripts/ci/test-komodo-resources.py
      - name: TX and Yecao runtime fixtures
        run: |
          set -euo pipefail
          bash deploy/test-check-latest-main.sh
          bash deploy/test-tx-deploy-lock.sh
          bash deploy/test-tx-runtime-config.sh
          bash deploy/test-k7b-frontend-shadow.sh
          bash deploy/test-k7c-preflight.sh
          bash deploy/test-k7c-runtime-content.sh
          bash deploy/test-yecao-wireguard-boundary.sh
          bash deploy/test-tx-runtime-check.sh
          bash deploy/test-user-profile-reset-audit.sh
          bash deploy/test-deploy-contract.sh
      - name: Keycloak PostgreSQL backup runtime smoke
        run: bash deploy/test-keycloak-postgres-backup.sh
      - name: Production Compose configuration contract
        env:
          DB_PASSWORD: ci
          KC_ADMIN_PASSWORD: ci
          WG_APPLICATION_ID: ci
          KEYCLOAK_ADMIN_CLIENT_SECRET: ci
          AI_API_KEY: ci
          GRAFANA_ADMIN_USER: ci
          GRAFANA_ADMIN_PASSWORD: ci
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.prod.yml config --format json > /tmp/compose.json
          export TX_RUNTIME_ROOT=/tmp/tx-runtime
          export TX_BUSINESS_POSTGRES_ADMIN_USER=ci-business-admin
          export TX_BUSINESS_POSTGRES_ADMIN_PASSWORD=ci-business-password
          export KC_POSTGRES_ADMIN_USER=ci-keycloak-admin
          export KC_POSTGRES_ADMIN_PASSWORD=ci-keycloak-password
          export KC_BOOTSTRAP_ADMIN_PASSWORD=ci-keycloak-bootstrap
          export KC_DB_USERNAME=ci-keycloak
          export KC_DB_PASSWORD=ci-keycloak-password
          export WG_APPLICATION_ID=ci-wg
          export CADDY_ACME_EMAIL=ci@example.invalid
          export TX_BUSINESS_DB_NAME=wotb
          export TX_BUSINESS_DB_USERNAME=control_api
          export TX_BUSINESS_DB_PASSWORD=ci-business-app
          export TX_FRONTEND_IMAGE_REF=ccr.ccs.tencentyun.com/wotbtools/wotbtools-frontend@sha256:abcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcd
          export TX_BUSINESS_API_IMAGE_REF=ccr.ccs.tencentyun.com/wotbtools/wotbtools-business-api@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          export KEYCLOAK_ADMIN_CLIENT_SECRET=ci-kc-client
          docker compose -p deploy -f deploy/tx/docker-compose.yml config --format json > /tmp/tx-compose.json
          KC_POSTGRES_ADMIN_USER=ci-keycloak-admin KC_POSTGRES_ADMIN_PASSWORD=ci-keycloak-password \
            docker compose -p deploy -f deploy/tx/keycloak-postgres.compose.yml config --format json > /tmp/keycloak-postgres-compose.json
          TX_BUSINESS_POSTGRES_ADMIN_USER=ci-business-admin TX_BUSINESS_POSTGRES_ADMIN_PASSWORD=ci-business-password \
            docker compose -p deploy -f deploy/tx/business-postgres.compose.yml config --format json > /tmp/business-postgres-compose.json
          python3 - <<'PY'
          import json
          expected_volumes = {
              "/tmp/tx-compose.json": {
                  "business_postgres_data": "deploy_business_postgres_data",
                  "keycloak_postgres_data": "deploy_keycloak_postgres_data",
              },
              "/tmp/keycloak-postgres-compose.json": {
                  "keycloak_postgres_data": "deploy_keycloak_postgres_data",
              },
              "/tmp/business-postgres-compose.json": {
                  "business_postgres_data": "deploy_business_postgres_data",
              },
          }
          for path, volumes in expected_volumes.items():
              with open(path, encoding="utf-8") as handle:
                  compose = json.load(handle)
              assert compose["name"] == "deploy", (path, compose.get("name"))
              for key, name in volumes.items():
                  assert compose["volumes"][key]["name"] == name, path
              assert compose["networks"]["default"]["name"] == "wotb_tx_internal", path
          print("TX Compose project and authoritative PostgreSQL volume identities are stable")
          PY
          python3 - <<'PY'
          import json
          with open('/tmp/compose.json', encoding='utf-8') as compose_file:
              services = json.load(compose_file)['services']
          retired = {'parser-worker', 'minio', 'rabbitmq'}
          assert not retired & set(services), sorted(retired & set(services))
          with open('/tmp/tx-compose.json', encoding='utf-8') as compose_file:
              tx_services = json.load(compose_file)['services']
          assert not retired & set(tx_services), sorted(retired & set(tx_services))
          print('No server-side replay infrastructure is declared on Yecao or TX')
          PY
      - name: nginx real-IP trust fixture smoke
        run: bash deploy/test-nginx-real-ip.sh
      - name: nginx Android download route fixture smoke
        run: bash deploy/test-nginx-android-route.sh
      - name: nginx Grafana recreate fixture smoke
        run: bash deploy/test-nginx-grafana-recreate.sh
