name: RabbitMQ

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rabbitmq.yml
      - deploy/release-metadata.py
      - deploy/tx/deploy.sh
      - deploy/tx/docker-compose.yml
      - deploy/tx/rabbitmq.tofurc
      - infra/tofu/rabbitmq/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  rabbitmq:
    name: Reconcile RabbitMQ on TX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tx-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Freeze current main
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == refs/heads/main ]] || { echo 'RabbitMQ workflow requires main.' >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'The event SHA must be a full lowercase commit SHA.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo 'Checkout SHA differs from the event SHA.' >&2; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$SOURCE_SHA" ]] || {
            echo 'This run is stale; dispatch RabbitMQ again from current main.' >&2
            exit 1
          }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Stage TX runtime and RabbitMQ root
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tx,deploy/release-metadata.py,infra/tofu/rabbitmq
          target: /opt/wotb-tx/tofu.incoming/${{ steps.source.outputs.source_sha }}
          overwrite: true

      - name: Stage TX runtime inputs
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tx,deploy/release-metadata.py
          target: /opt/wotb-tx/deploy.incoming
          overwrite: true

      - name: Reject stale main before TX mutation
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$SOURCE_SHA" ]] || {
            echo 'Main advanced before TX production mutation.' >&2
            exit 1
          }

      - name: Reconcile runtime, apply exact RabbitMQ plan, and verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 35m
          envs: SOURCE_SHA,WOTB_DEPLOY_SERVICE,WOTB_DEPLOY_CONFIG_SHA,WOTB_DEPLOY_IMAGE_TAG,WOTB_DEPLOY_IMAGE_COMMIT_SHA,TX_IMAGE_REGISTRY_PREFIX,TX_RABBITMQ_ADMIN_USER,TX_RABBITMQ_ADMIN_PASSWORD,TX_RABBITMQ_CONTROL_API_PASSWORD,TX_RABBITMQ_PARSER_WORKER_PASSWORD
          script: |
            set -Eeuo pipefail
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$WOTB_DEPLOY_CONFIG_SHA" == "$SOURCE_SHA" ]]
            root="/opt/wotb-tx/tofu.incoming/$SOURCE_SHA/infra/tofu/rabbitmq"
            test -d "$root"
            test -f /opt/wotb-tx/deploy.incoming/deploy/tx/deploy.sh
            test -f /opt/wotb-tx/deploy.incoming/deploy/tx/rabbitmq.tofurc
            command -v flock >/dev/null
            command -v tofu >/dev/null
            command -v python3 >/dev/null
            exec 9>/opt/wotb-tx/.deploy.lock
            flock -n 9 || { echo 'Another TX production mutation is running.' >&2; exit 1; }
            export WOTB_DEPLOY_LOCK_FD=9
            TX_RABBITMQ_CONTROL_API_PASSWORD=not-configured \
              TX_RABBITMQ_PARSER_WORKER_PASSWORD=not-configured \
              bash /opt/wotb-tx/deploy.incoming/deploy/tx/deploy.sh
            test -f /opt/wotb-tx/deploy/rabbitmq.tofurc
            bash "$root/bootstrap-provider-mirror.sh" "$root"
            export TF_CLI_CONFIG_FILE=/opt/wotb-tx/deploy/rabbitmq.tofurc
            export TF_VAR_rabbitmq_management_endpoint=http://127.0.0.1:15672
            export TF_VAR_rabbitmq_admin_user="$TX_RABBITMQ_ADMIN_USER"
            export TF_VAR_rabbitmq_admin_password="$TX_RABBITMQ_ADMIN_PASSWORD"
            export TF_VAR_control_api_password="$TX_RABBITMQ_CONTROL_API_PASSWORD"
            export TF_VAR_parser_worker_password="$TX_RABBITMQ_PARSER_WORKER_PASSWORD"
            umask 077
            install -d -m 700 /opt/wotb-tx/rabbitmq-tofu-state
            cd "$root"
            trap 'rm -f -- plan.tfplan second-plan.tfplan' EXIT
            tofu fmt -check -recursive
            tofu init -reconfigure -input=false -lockfile=readonly
            tofu validate
            tofu plan -input=false -no-color -out=plan.tfplan
            bash ./validate-plan.sh plan.tfplan
            tofu apply -input=false -auto-approve plan.tfplan
            tofu plan -input=false -no-color -out=second-plan.tfplan
            bash ./validate-plan.sh second-plan.tfplan --require-no-changes
            docker compose -f /opt/wotb-tx/deploy/docker-compose.yml exec -T rabbitmq rabbitmq-diagnostics -q ping
            printf '%s\n' tx-local-opentofu-rabbitmq > /opt/wotb-tx/rabbitmq.tofu-provisioned
            chmod 600 /opt/wotb-tx/rabbitmq.tofu-provisioned
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          WOTB_DEPLOY_SERVICE: rabbitmq
          WOTB_DEPLOY_CONFIG_SHA: ${{ steps.source.outputs.source_sha }}
          WOTB_DEPLOY_IMAGE_TAG: ''
          WOTB_DEPLOY_IMAGE_COMMIT_SHA: ''
          TX_IMAGE_REGISTRY_PREFIX: ${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}
          TX_RABBITMQ_ADMIN_USER: ${{ vars.TX_RABBITMQ_ADMIN_USER }}
          TX_RABBITMQ_ADMIN_PASSWORD: ${{ secrets.TX_RABBITMQ_ADMIN_PASSWORD }}
          TX_RABBITMQ_CONTROL_API_PASSWORD: ${{ secrets.TX_RABBITMQ_CONTROL_API_PASSWORD }}
          TX_RABBITMQ_PARSER_WORKER_PASSWORD: ${{ secrets.TX_RABBITMQ_PARSER_WORKER_PASSWORD }}
