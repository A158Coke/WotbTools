name: PR710 conditional contract v2

on:
  push:
    branches: [fix/android-download-click-observability]
    paths: [.github/workflows/pr710-contract-conditional-v2.yml]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/android-download-click-observability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Encode click invariants
        shell: bash
        run: >-
          python -c 'from pathlib import Path; p=Path("contracts/http/openapi.yaml"); t=p.read_text(); a="        error_id:\n          type: string\n          format: uuid\n          description: Allowed only for failed replay_parse.\n    TournamentEvent:\n"; r="        error_id:\n          type: string\n          format: uuid\n          description: Allowed only for failed replay_parse.\n      allOf:\n        - if:\n            properties:\n              event:\n                const: android_download_click\n            required: [event]\n          then:\n            properties:\n              platform:\n                const: web\n              feature:\n                const: android_download\n            not:\n              anyOf:\n                - required: [operation_id]\n                - required: [outcome]\n                - required: [error_code]\n                - required: [error_id]\n    TournamentEvent:\n"; assert t.count(a)==1, t.count(a); p.write_text(t.replace(a,r,1))'
      - name: Regenerate and validate HTTP contract
        working-directory: frontend
        run: |
          npm ci
          npm run api:generate
          npm run api:lint
          npm run api:check
          npm run api:fixture
      - name: Verify conditional output
        run: |
          grep -Fq 'const: android_download_click' contracts/http/openapi.yaml
          grep -Fq 'android_download_click' frontend/src/api/generated/http-contract.ts
          grep -Fq 'android_download_click' frontend/src/api/generated/playback-v2.schema.ts
          grep -Fq 'android_download_click' frontend/src/api/generated/contract-validators.js
      - name: Commit result and remove temporary workflows
        run: |
          git rm .github/workflows/pr710-contract-conditional.yml .github/workflows/pr710-contract-conditional-v2.yml
          git add contracts/http/openapi.yaml frontend/src/api/generated/http-contract.ts frontend/src/api/generated/playback-v2.schema.ts frontend/src/api/generated/contract-validators.js frontend/src/api/generated/api-error-codes.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(observability): constrain Android download click contract'
          git push origin HEAD:fix/android-download-click-observability
