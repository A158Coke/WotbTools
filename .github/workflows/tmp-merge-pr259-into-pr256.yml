name: Merge PR259 content into PR256

on:
  push:
    branches:
      - feat/maps-ai-hd-v2
    paths:
      - .github/workflows/tmp-merge-pr259-into-pr256.yml

permissions:
  contents: write

jobs:
  merge-content:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/maps-ai-hd-v2
          fetch-depth: 0

      - name: Fetch PR259 branch
        run: git fetch origin feat/playback-terrain-attitude --no-tags

      - name: Copy PR259 changed files into PR256 branch
        run: |
          git checkout origin/feat/playback-terrain-attitude -- \
            docs/CHANGELOG-PRODUCT.md \
            docs/CHANGELOG.md \
            docs/current-plan.md \
            docs/features/battle-playback.md \
            frontend/src/components/BattlePlayback.vue \
            frontend/src/components/VehicleMarker.test.js \
            frontend/src/components/VehicleMarker.vue \
            frontend/src/utils/terrainReliefProjection.js \
            frontend/src/utils/terrainReliefProjection.test.js

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate PR259 playback changes
        working-directory: frontend
        run: npx vitest run src/utils/terrainReliefProjection.test.js src/components/VehicleMarker.test.js src/utils/playbackVehicleState.test.js src/components/BattlePlayback.integration.test.js

      - name: Commit into PR256 branch and remove temporary workflow
        run: |
          git config user.name 'WotbTools AI'
          git config user.email 'wotbtools-ai@local'
          git add \
            docs/CHANGELOG-PRODUCT.md \
            docs/CHANGELOG.md \
            docs/current-plan.md \
            docs/features/battle-playback.md \
            frontend/src/components/BattlePlayback.vue \
            frontend/src/components/VehicleMarker.test.js \
            frontend/src/components/VehicleMarker.vue \
            frontend/src/utils/terrainReliefProjection.js \
            frontend/src/utils/terrainReliefProjection.test.js
          git rm .github/workflows/tmp-merge-pr259-into-pr256.yml
          git commit -m 'feat(playback): merge PR259 terrain attitude into PR256' -m 'Co-Authored-By: OpenAI <noreply@openai.com>'
          git push origin HEAD:feat/maps-ai-hd-v2
