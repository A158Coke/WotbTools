name: Temporary prompt policy repair

on:
  push:
    branches:
      - chore/system-prompt-tool-evidence-policy
    paths:
      - .github/workflows/temp-prompt-policy-repair.yml
      - .github/scripts/temp_prompt_policy_repair.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/system-prompt-tool-evidence-policy
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Pre-clean remaining stale Team Review labels
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              'java/wotb-ai/src/main/resources/prompts/team/reasoning-contract.zh.md': {
                  'v0.5 输出 schema': 'structured result 输出 schema',
              },
              'java/wotb-ai/src/main/java/com/wotb/ai/review/TeamPromptLocalizer.java': {
                  'Output still uses the v0.5 structured result;': 'Output still uses the structured result;',
                  'Вывод по-прежнему в структуре v0.5;': 'Вывод по-прежнему использует structured result;',
              },
              'java/wotb-ai/src/test/java/com/wotb/ai/review/TeamReviewNaturalCoachContractTest.java': {
                  'Focus Window 是内部 attention 提示而非用户模板；v0.5 结构化输出契约；': 'Focus Window 是内部 attention 提示而非用户模板；结构化输出契约；',
                  '=== Team AI Review v0.5 结构化结果（最终输出契约） ===': '=== Team AI Review 结构化结果（最终输出契约） ===',
                  '必须有 v0.5 输出契约段': '必须有结构化输出契约段',
                  'v0.5 必须使用 summary 结构': 'structured result 必须使用 summary 结构',
                  'v0.5 必须有 episodes': 'structured result 必须有 episodes',
                  'v0.5 必须有 trainingSuggestions': 'structured result 必须有 trainingSuggestions',
                  'v0.5 必须有 reviewFocus': 'structured result 必须有 reviewFocus',
                  'v0.5 必须有 highContributors': 'structured result 必须有 highContributors',
                  '=== 团队复盘 v0.6 推理顺序与因果质量约束（强制） ===': '=== 团队复盘推理顺序与因果质量约束（强制） ===',
                  '残留中文 v0.6 reasoning contract': '残留中文 reasoning contract',
                  'primaryDiagnosis 只是整场摘要，不得压缩 v0.5 structured result 中的 episodes 或训练建议': 'primaryDiagnosis 只是整场摘要，不得压缩 structured result 中的 episodes 或训练建议',
                  'Team AI Review v0.5 structured result': 'Team AI Review structured result',
                  'EN 必须有 v0.5 structured result 契约': 'EN 必须有 structured result 契约',
                  'Team AI Review v0.5': 'Team AI Review',
                  'RU 必须有 v0.5 structured result 契约': 'RU 必须有 structured result 契约',
              },
          }
          for path, pairs in replacements.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs.items():
                  if old not in text:
                      raise SystemExit(f'missing expected stale label in {path}: {old}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8', newline='\n')

      - name: Apply prompt-policy repair and stale-label cleanup
        run: python .github/scripts/temp_prompt_policy_repair.py

      - name: Check diff
        run: git diff --check

      - name: Run targeted prompt contract tests
        working-directory: java
        run: mvn -s settings.xml -pl wotb-ai -am -Dtest=TeamReviewNaturalCoachContractTest,PromptRuleContractTest,TeamReviewQualityGateContractTest,TeamReplayOfflineEvalHarnessTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md java frontend docs
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "fix(prompt): preserve evidence policy across locales"
          git push origin HEAD:chore/system-prompt-tool-evidence-policy
