name: Temporary prompt policy repair

on:
  push:
    branches:
      - chore/system-prompt-tool-evidence-policy
    paths:
      - .github/workflows/temp-prompt-policy-repair.yml
      - .github/scripts/temp_prompt_policy_repair.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/system-prompt-tool-evidence-policy
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Apply prompt-policy repair and stale-label cleanup
        run: python .github/scripts/temp_prompt_policy_repair.py

      - name: Check diff
        run: git diff --check

      - name: Run targeted prompt contract tests
        working-directory: java
        run: ./mvnw -pl wotb-ai -am -Dtest=TeamReviewNaturalCoachContractTest,PromptRuleContractTest,TeamReviewQualityGateContractTest,TeamReplayOfflineEvalHarnessTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md java frontend docs
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "fix(prompt): preserve evidence policy across locales"
          git push origin HEAD:chore/system-prompt-tool-evidence-policy
