name: TX SSH Source Benchmark

on:
  workflow_dispatch:
    inputs:
      component:
        description: Source payload to benchmark
        required: true
        default: both
        type: choice
        options:
          - both
          - business-api
          - frontend
      repetitions:
        description: Number of SCP transfers per selected payload
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

permissions:
  contents: read

jobs:
  benchmark:
    name: GitHub runner -> TX source transfer
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: tx-production

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Prepare frontend generated build input
        if: inputs.component == 'both' || inputs.component == 'frontend'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-agent-wasm.sh

      - name: Configure SSH
        shell: bash
        env:
          TX_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_USER: ${{ secrets.TX_VPS_USER }}
          TX_PORT: ${{ secrets.TX_VPS_PORT }}
          TX_KEY: ${{ secrets.TX_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${TX_HOST:?TX_VPS_HOST is required}"
          : "${TX_USER:?TX_VPS_USER is required}"
          : "${TX_PORT:?TX_VPS_PORT is required}"
          : "${TX_KEY:?TX_VPS_SSH_KEY is required}"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$TX_KEY" | tr -d '\r' > ~/.ssh/tx-benchmark
          chmod 600 ~/.ssh/tx-benchmark

          # Benchmark-only trust bootstrap, matching the repository's existing
          # TX workflows that authenticate the server through the configured
          # deployment endpoint rather than a separately pinned host key.
          ssh-keyscan -T 15 -p "$TX_PORT" "$TX_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > "$RUNNER_TEMP/ssh-args" <<EOF
          -i ~/.ssh/tx-benchmark
          -p $TX_PORT
          -o BatchMode=yes
          -o ConnectTimeout=15
          -o ServerAliveInterval=10
          -o ServerAliveCountMax=3
          EOF

      - name: Measure SSH handshake latency
        id: handshake
        shell: bash
        env:
          TX_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_USER: ${{ secrets.TX_VPS_USER }}
          TX_PORT: ${{ secrets.TX_VPS_PORT }}
        run: |
          set -u

          csv="$RUNNER_TEMP/ssh-handshake.csv"
          printf 'run,status,elapsed_seconds\n' > "$csv"
          failures=0

          for run in $(seq 1 10); do
            start_ns=$(date +%s%N)
            if timeout 30 ssh               -i ~/.ssh/tx-benchmark               -p "$TX_PORT"               -o BatchMode=yes               -o ConnectTimeout=15               -o ServerAliveInterval=10               -o ServerAliveCountMax=3               "$TX_USER@$TX_HOST" true; then
              status=0
            else
              status=$?
              failures=$((failures + 1))
            fi
            end_ns=$(date +%s%N)

            elapsed=$(python3 -c "print(f'{($end_ns-$start_ns)/1e9:.3f}')")
            printf '%s,%s,%s\n' "$run" "$status" "$elapsed" | tee -a "$csv"
          done

          echo "failures=$failures" >> "$GITHUB_OUTPUT"

      - name: Create realistic source payloads
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail

          command -v zstd >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y zstd
          }

          out="$RUNNER_TEMP/tx-source-benchmark"
          mkdir -p "$out"

          create_archive() {
            local name="$1"
            shift
            local archive="$out/$name.tar.zst"

            tar -cf - "$@" | zstd -3 -T0 -q -o "$archive"
            sha256sum "$archive" > "$archive.sha256"

            bytes=$(stat -c '%s' "$archive")
            mib=$(python3 -c "print(f'{$bytes/1024/1024:.2f}')")
            printf '%s archive: %s bytes (%s MiB)\n' "$name" "$bytes" "$mib"
          }

          if [ "$COMPONENT" = both ] || [ "$COMPONENT" = business-api ]; then
            create_archive business-api               .dockerignore               docker/Dockerfile.business-api               common/tankopedia-tier7.json               common/tankopedia-tier8.json               common/tankopedia-tier9.json               common/tankopedia-tier10.json               common/map_names.json               common/tank_tactical_profiles.json               common/map-semantics               java/pom.xml               java/settings-docker.xml               java/wotb-contracts               java/wotb-object-storage-minio               java/wotb-broker-rabbitmq               java/wotb-core               java/wotb-result               java/wotb-playback               java/wotb-replay-coordinator               java/wotb-replay-processing               java/wotb-parser-worker/pom.xml               java/wotb-ai               java/wotb-web               contracts/http               contracts/mq
          fi

          if [ "$COMPONENT" = both ] || [ "$COMPONENT" = frontend ]; then
            create_archive frontend               .dockerignore               docker/Dockerfile.frontend               frontend               common/map_names.json               common/tankopedia-tier10.json               common/map-semantics               common/assets               HISTORY.md               docs/architecture/TECHNICAL_EVOLUTION.md               docs/WotBTools_League_Rating_V6.md               deploy/nginx/nginx.conf
          fi

      - name: Prepare isolated TX benchmark directory
        id: remote
        shell: bash
        env:
          TX_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_USER: ${{ secrets.TX_VPS_USER }}
          TX_PORT: ${{ secrets.TX_VPS_PORT }}
        run: |
          set -euo pipefail
          remote="/tmp/wotbtools-ssh-benchmark-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh             -i ~/.ssh/tx-benchmark             -p "$TX_PORT"             -o BatchMode=yes             -o ConnectTimeout=15             "$TX_USER@$TX_HOST"             "mkdir -p '$remote' && chmod 700 '$remote'"
          echo "path=$remote" >> "$GITHUB_OUTPUT"

      - name: Benchmark source archive transfers
        id: transfer
        shell: bash
        env:
          TX_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_USER: ${{ secrets.TX_VPS_USER }}
          TX_PORT: ${{ secrets.TX_VPS_PORT }}
          REMOTE_DIR: ${{ steps.remote.outputs.path }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          set -u

          out="$RUNNER_TEMP/tx-source-benchmark"
          csv="$RUNNER_TEMP/ssh-transfer.csv"
          printf 'payload,run,status,bytes,elapsed_seconds,mib_per_second,sha256_verified\n' > "$csv"

          failures=0
          for archive in "$out"/*.tar.zst; do
            [ -e "$archive" ] || continue

            payload=$(basename "$archive" .tar.zst)
            bytes=$(stat -c '%s' "$archive")
            local_sha=$(sha256sum "$archive" | awk '{print $1}')

            for run in $(seq 1 "$REPETITIONS"); do
              remote_file="$REMOTE_DIR/${payload}-${run}.tar.zst"
              start_ns=$(date +%s%N)

              if timeout 300 scp -q                 -i ~/.ssh/tx-benchmark                 -P "$TX_PORT"                 -o BatchMode=yes                 -o ConnectTimeout=15                 -o ServerAliveInterval=10                 -o ServerAliveCountMax=3                 "$archive"                 "$TX_USER@$TX_HOST:$remote_file"; then
                status=0
              else
                status=$?
              fi

              end_ns=$(date +%s%N)
              elapsed=$(python3 -c "print(f'{($end_ns-$start_ns)/1e9:.3f}')")

              verified=false
              if [ "$status" -eq 0 ]; then
                remote_sha=$(ssh                   -i ~/.ssh/tx-benchmark                   -p "$TX_PORT"                   -o BatchMode=yes                   -o ConnectTimeout=15                   "$TX_USER@$TX_HOST"                   "sha256sum '$remote_file'" | awk '{print $1}' || true)

                if [ "$remote_sha" = "$local_sha" ]; then
                  verified=true
                else
                  status=99
                fi
              fi

              if [ "$status" -eq 0 ]; then
                mibps=$(python3 -c "print(f'{($bytes/1024/1024)/float("$elapsed"):.2f}')")
              else
                mibps=0
                failures=$((failures + 1))
              fi

              printf '%s,%s,%s,%s,%s,%s,%s\n'                 "$payload" "$run" "$status" "$bytes" "$elapsed" "$mibps" "$verified"                 | tee -a "$csv"
            done
          done

          echo "failures=$failures" >> "$GITHUB_OUTPUT"

      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          import pathlib
          import statistics

          temp = pathlib.Path(__import__("os").environ["RUNNER_TEMP"])

          print("# TX SSH source benchmark")
          print()
          print(f"- GitHub run: {__import__('os').environ['GITHUB_RUN_ID']}")
          print(f"- Commit: `{__import__('os').environ['GITHUB_SHA']}`")
          print()

          handshake = temp / "ssh-handshake.csv"
          if handshake.exists():
              rows = list(csv.DictReader(handshake.open()))
              ok = [float(r["elapsed_seconds"]) for r in rows if r["status"] == "0"]
              failures = len(rows) - len(ok)
              print("## SSH handshake")
              print()
              print(f"- Attempts: {len(rows)}")
              print(f"- Failures: {failures}")
              if ok:
                  print(f"- P50: {statistics.median(ok):.3f} s")
                  print(f"- Min / max: {min(ok):.3f} / {max(ok):.3f} s")
              print()

          transfers = temp / "ssh-transfer.csv"
          if transfers.exists():
              rows = list(csv.DictReader(transfers.open()))
              print("## Source transfer")
              print()
              print("| Payload | Compressed MiB | Attempts | Failures | P50 seconds | Min / max MiB/s |")
              print("|---|---:|---:|---:|---:|---:|")
              for payload in sorted({r["payload"] for r in rows}):
                  subset = [r for r in rows if r["payload"] == payload]
                  ok = [r for r in subset if r["status"] == "0" and r["sha256_verified"] == "true"]
                  failures = len(subset) - len(ok)
                  size_mib = int(subset[0]["bytes"]) / 1024 / 1024
                  if ok:
                      times = [float(r["elapsed_seconds"]) for r in ok]
                      rates = [float(r["mib_per_second"]) for r in ok]
                      values = (
                          f"{statistics.median(times):.3f}",
                          f"{min(rates):.2f} / {max(rates):.2f}",
                      )
                  else:
                      values = ("n/a", "n/a")
                  print(
                      f"| {payload} | {size_mib:.2f} | {len(subset)} | {failures} | "
                      f"{values[0]} | {values[1]} |"
                  )
              print()
              print("Every successful transfer is SHA-256 verified on TX.")
          PY

      - name: Cleanup remote benchmark files
        if: always() && steps.remote.outputs.path != ''
        shell: bash
        env:
          TX_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_USER: ${{ secrets.TX_VPS_USER }}
          TX_PORT: ${{ secrets.TX_VPS_PORT }}
          REMOTE_DIR: ${{ steps.remote.outputs.path }}
        run: |
          ssh             -i ~/.ssh/tx-benchmark             -p "$TX_PORT"             -o BatchMode=yes             -o ConnectTimeout=15             "$TX_USER@$TX_HOST"             "rm -rf -- '$REMOTE_DIR'" || true

      - name: Fail benchmark on transport errors
        if: always()
        shell: bash
        env:
          HANDSHAKE_FAILURES: ${{ steps.handshake.outputs.failures || '10' }}
          TRANSFER_FAILURES: ${{ steps.transfer.outputs.failures || '1' }}
        run: |
          set -euo pipefail
          echo "handshake_failures=$HANDSHAKE_FAILURES"
          echo "transfer_failures=$TRANSFER_FAILURES"
          [ "$HANDSHAKE_FAILURES" -eq 0 ]
          [ "$TRANSFER_FAILURES" -eq 0 ]
