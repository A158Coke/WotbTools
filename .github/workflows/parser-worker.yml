name: Parser Worker

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/parser-worker.yml
      - .dockerignore
      - docker/Dockerfile.parser-worker
      - common/tankopedia-tier7.json
      - common/tankopedia-tier8.json
      - common/tankopedia-tier9.json
      - common/tankopedia-tier10.json
      - common/map_names.json
      - common/tank_tactical_profiles.json
      - common/map-semantics/**
      - java/pom.xml
      - java/**/pom.xml
      - java/settings-docker.xml
      - java/wotb-contracts/**
      - java/wotb-object-storage-minio/**
      - java/wotb-broker-rabbitmq/**
      - java/wotb-core/**
      - java/wotb-result/**
      - java/wotb-playback/**
      - java/wotb-replay-processing/**
      - java/wotb-parser-worker/**
      - contracts/mq/**
      - deploy/dependency-readiness.sh
      - deploy/dependency-readiness.py
      - deploy/deploy.sh
      - deploy/docker-compose.prod.yml
      - deploy/release-metadata.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Freeze current main and image identity
        id: identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [ "$REF_NAME" = refs/heads/main ] || { echo 'Manual deployment must dispatch from main.' >&2; exit 1; }
          fi
          git fetch --no-tags origin main
          [ "$SOURCE_SHA" = "$(git rev-parse origin/main)" ] || { echo 'Source SHA is not current main.' >&2; exit 1; }
          image="ghcr.io/a158coke/wotbtools-parser-worker:sha-${SOURCE_SHA:0:12}"
          {
            echo "commit_sha=$SOURCE_SHA"
            echo "image=$image"
            echo "repository=${image%:*}"
            echo "tag=sha-${SOURCE_SHA:0:12}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-crane@v0.7
      - name: Reuse only an existing immutable image with this source identity
        id: immutable
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          REPOSITORY: ${{ steps.identity.outputs.repository }}
          TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_SHA: ${{ steps.identity.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tags="$(crane ls "$REPOSITORY")"
          if grep -Fxq "$TAG" <<< "$tags"; then
            docker pull "$IMAGE"
            revision="$(docker image inspect --format='{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE" | sed -n 's/^BUILD_COMMIT=//p' | head -n 1)"
            [ "$revision" = "$SOURCE_SHA" ] || { echo 'Existing immutable tag has a different BUILD_COMMIT.' >&2; exit 1; }
            digest="$(crane digest "$IMAGE")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "existing_digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo 'existing_digest=' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish this frozen image
        id: build_image
        if: steps.immutable.outputs.existing_digest == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.parser-worker
          push: true
          tags: ${{ steps.identity.outputs.image }}
          build-args: BUILD_COMMIT=${{ steps.identity.outputs.commit_sha }}
          cache-from: type=gha,scope=parser-worker
          cache-to: type=gha,mode=max,scope=parser-worker
          provenance: false
          sbom: false
      - name: Verify registry digest and source identity
        id: verify
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          SOURCE_SHA: ${{ steps.identity.outputs.commit_sha }}
          EXISTING_DIGEST: ${{ steps.immutable.outputs.existing_digest }}
          BUILD_DIGEST: ${{ steps.build_image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-$BUILD_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Missing or invalid image digest.' >&2; exit 1; }
          [ "$(crane digest "$IMAGE")" = "$digest" ] || { echo 'Registry digest changed after build.' >&2; exit 1; }
          docker pull "$IMAGE@$digest" >/dev/null
          revision="$(docker image inspect --format='{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE@$digest" | sed -n 's/^BUILD_COMMIT=//p' | head -n 1)"
          [ "$revision" = "$SOURCE_SHA" ] || { echo 'Published image does not contain the frozen BUILD_COMMIT.' >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit_sha }}
      - name: Reject stale main before staging production inputs
        env:
          SOURCE_SHA: ${{ needs.build.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA" ]] || { echo 'Main advanced before Yecao deployment.' >&2; exit 1; }
      - name: Prepare complete Yecao deployment input tree
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            root=/opt/wotb
            mkdir -p "$root/deploy.incoming"
            rm -rf -- "$root/deploy.incoming/deploy"
            mkdir -p "$root/deploy.incoming/deploy"
      - name: Stage the complete Compose rendering input tree
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy
          target: /opt/wotb/deploy.incoming
          overwrite: true
      - name: Reject stale main before Yecao mutation
        env:
          SOURCE_SHA: ${{ needs.build.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA" ]] || { echo 'Main advanced before production mutation.' >&2; exit 1; }
      - name: Read dependencies and deploy Parser Worker under one host lock
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 35m
          envs: WOTB_DEPLOY_SERVICE,WOTB_DEPLOY_CONFIG_SHA,WOTB_DEPLOY_IMAGE_TAG,WOTB_DEPLOY_IMAGE_COMMIT_SHA,WOTB_DEPLOY_IMAGE_DIGEST,TX_RABBITMQ_PARSER_WORKER_PASSWORD,YECAO_MINIO_WORKER_ACCESS_KEY,YECAO_MINIO_WORKER_SECRET_KEY
          script: |
            set -euo pipefail
            exec 9>/opt/wotb/.deploy.lock
            flock -n 9 || { echo 'Another Yecao production deployment is running.' >&2; exit 1; }
            export WOTB_DEPLOY_LOCK_FD=9
            export WOTB_DEPLOY_SERVICE=parser-worker
            export WOTB_DEPLOY_CONFIG_SHA='${{ needs.build.outputs.commit_sha }}'
            export WOTB_DEPLOY_IMAGE_TAG='${{ needs.build.outputs.image }}'
            export WOTB_DEPLOY_IMAGE_COMMIT_SHA='${{ needs.build.outputs.commit_sha }}'
            export WOTB_DEPLOY_IMAGE_DIGEST='${{ needs.build.outputs.digest }}'
            bash /opt/wotb/deploy.incoming/deploy/dependency-readiness.sh parser-worker
            bash /opt/wotb/deploy.incoming/deploy/deploy.sh
        env:
          WOTB_DEPLOY_SERVICE: parser-worker
          WOTB_DEPLOY_CONFIG_SHA: ${{ needs.build.outputs.commit_sha }}
          WOTB_DEPLOY_IMAGE_TAG: ${{ needs.build.outputs.image }}
          WOTB_DEPLOY_IMAGE_COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
          WOTB_DEPLOY_IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          TX_RABBITMQ_PARSER_WORKER_PASSWORD: ${{ secrets.TX_RABBITMQ_PARSER_WORKER_PASSWORD }}
          YECAO_MINIO_WORKER_ACCESS_KEY: ${{ secrets.YECAO_MINIO_WORKER_ACCESS_KEY }}
          YECAO_MINIO_WORKER_SECRET_KEY: ${{ secrets.YECAO_MINIO_WORKER_SECRET_KEY }}
