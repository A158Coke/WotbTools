name: CI / frontend
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # 上游产物 pin（deploy/agent/source.json）的确定性验证：每个 PR 都重新下载
      # v0.1.6 附件并 sha256 校验——pin 漂移/上游重发布在这里 fail，而不是发布日。
      - name: Fetch upstream agent WASM artifact (release pin, sha256 verified)
        run: bash scripts/fetch-agent-wasm.sh
      - name: Verify generated HTTP client contract
        working-directory: frontend
        run: npm run api:check
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Real-browser Playback layout regression
        working-directory: frontend
        run: npm run test:browser-layout
      - name: Real-browser Playback/Workspace interaction regression
        working-directory: frontend
        run: npm run test:browser-interaction
      - name: Build
        working-directory: frontend
        run: npm run build
      # dist 存在性 smoke：Agent WASM 产物必须经 publicDir 进 dist
      #（三维回放/装甲查看器/射击复现的运行前提；Vite 对 @vite-ignore 动态 import
      # 不做存在性检查，缺产物构建仍绿——在此显式把住）
      - name: Agent WASM dist existence smoke
        working-directory: frontend
        run: |
          node -e 'const fs=require("fs");const js="dist/wasm/wotb_replay_wasm.js";const bin="dist/wasm/wotb_replay_wasm_bg.wasm";for(const f of [js,bin]){if(!fs.existsSync(f))throw new Error("agent wasm artifact missing from dist: "+f);if(!fs.statSync(f).size)throw new Error("agent wasm artifact empty: "+f)}if(fs.readFileSync(bin).subarray(0,4).toString("hex")!=="0061736d")throw new Error("wotb_replay_wasm_bg.wasm lacks wasm magic");console.log("agent wasm artifacts present in dist")'
      - name: Bundle separation check
        working-directory: frontend
        run: node scripts/check-bundle-separation.mjs
      - name: Production Docker build and payload baseline
        run: |
          set -euo pipefail
          du -sk frontend/dist
          du -sk frontend/dist/assets
          find frontend/dist -type f -printf "%s %p\n" | sort -n | tail -15
          docker build -f docker/Dockerfile.frontend --build-arg BUILD_COMMIT=${{ inputs.head_sha }} -t frontend-ci .
          docker image inspect --format 'total_size_bytes={{.Size}}' frontend-ci
          docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' frontend-ci
          docker run --rm --entrypoint sh frontend-ci -c '
            set -e
            du -sk /usr/share/nginx/html
            du -sk /usr/share/nginx/html/assets
            find /usr/share/nginx/html -type f -exec du -k {} + | sort -n | tail -15
          '
