name: CI / frontend
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.head_sha }}
      - name: TX frontend builder exit cleanup regression
        run: python3 deploy/test_frontend_builder.py
      - name: Frontend image identity consistency regression
        run: python3 deploy/test_frontend_image_identity.py
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # 上游产物 pin（deploy/agent/source.json）的确定性验证：每个 PR 都重新下载
      # v0.1.6 附件并 sha256 校验——pin 漂移/上游重发布在这里 fail，而不是发布日。
      - name: Fetch upstream agent WASM artifact (release pin, sha256 verified)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-agent-wasm.sh
      # 完整 HTTP 契约检查归属 Frontend owner（FE 与 BA 同时受影响时唯一执行位置；
      # BA-only 时仍由 ci-business-api.yml 的 http_contract 承担）。
      - name: Validate OpenAPI and local refs
        working-directory: frontend
        run: pnpm run api:lint
      - name: Verify generated HTTP client contract
        working-directory: frontend
        run: pnpm run api:check
      - name: Validate shared Playback fixture
        working-directory: frontend
        run: pnpm run api:fixture
      - name: Type check
        working-directory: frontend
        run: pnpm run typecheck
      - name: TypeScript baseline base→head monotonic guard
        working-directory: frontend
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node scripts/check-typescript-baseline.mjs --base "$BASE_SHA"
      - name: Style lint (design language)
        working-directory: frontend
        run: pnpm run lint:css
      - name: Unit tests
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        run: pnpm run build
      # dist 契约 smoke：Agent WASM 产物必须是 commit-addressed 的
      #（`/wasm/<deploy/agent/source.json ref>/`），fingerprint 与 pin 逐字段一致，且
      # stable `/wasm/wotb_replay_wasm.js` 不再存在。校验实现与生产 Docker build 共用
      # `frontend/scripts/verify-agent-wasm-dist.mjs`（单一实现，不重复写检查）。
      # 三维回放/装甲查看器/射击复现的运行前提；Vite 对 @vite-ignore 动态 import
      # 不做存在性检查，缺产物构建仍绿——在此显式把住。
      - name: Agent WASM dist contract smoke
        working-directory: frontend
        run: node scripts/verify-agent-wasm-dist.mjs --dist dist
      - name: Bundle separation check
        working-directory: frontend
        run: node scripts/check-bundle-separation.mjs
      - name: Production Docker build and payload baseline
        run: |
          set -euo pipefail
          du -sk frontend/dist
          du -sk frontend/dist/assets
          find frontend/dist -type f -printf "%s %p\n" | sort -n | tail -15
          docker build -f docker/Dockerfile.frontend --build-arg BUILD_COMMIT=${{ inputs.head_sha }} --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" -t frontend-ci .
          docker image inspect --format 'total_size_bytes={{.Size}}' frontend-ci
          docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' frontend-ci
          docker run --rm --entrypoint sh frontend-ci -c '
            set -e
            du -sk /usr/share/nginx/html
            du -sk /usr/share/nginx/html/assets
            find /usr/share/nginx/html -type f -exec du -k {} + | sort -n | tail -15
          '

  # 浏览器门禁并行运行，复用 runner Chrome 和既有夹具，无需先跑 build。
  # Playback/Workspace 场景消费 pinned WASM；各功能的独立门禁仍在同一 owner 内执行。
  # 分钟级门禁各占一个 job；短门禁合并进 browser-fast / browser-medium，省掉重复的 setup。
  # fail-fast: false 保留每条门禁的失败证据。
  browser-gates:
    name: Frontend / ${{ matrix.gate.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gate:
          # 交互门禁是最慢的两条浏览器门禁之一；`--shard i/n` 按**静态场景清单
          # 下标取模**确定性切分，三片并行缩短关键路径。清单变化不影响切分正确性（每片覆盖
          # 的是同一次 checkout 的同一份清单）。
          - label: Playback/Workspace interaction (1/3)
            script: test:browser-interaction
            args: --shard 1/3
          - label: Playback/Workspace interaction (2/3)
            script: test:browser-interaction
            args: --shard 2/3
          - label: Playback/Workspace interaction (3/3)
            script: test:browser-interaction
            args: --shard 3/3
          # 串行 28 场景的装甲查看器门禁是最慢的两条之一；切分方式与交互门禁相同，
          # picker 场景约占总耗时七成，按下标取模切成三片。
          - label: Armor viewer mobile layout (1/3)
            script: test:browser-armor-mobile
            args: --shard 1/3
          - label: Armor viewer mobile layout (2/3)
            script: test:browser-armor-mobile
            args: --shard 2/3
          - label: Armor viewer mobile layout (3/3)
            script: test:browser-armor-mobile
            args: --shard 3/3
          # 装甲查看器瞄准交互（Pointer Events × OrbitControls）同样只有真浏览器 + 真实输入能验证。
          # 门禁自带确定性夹具资产包（frontend/scripts/browser-fixtures/fixture-asset-pack.mjs：
          # 进程内资产源 + 构造的 hull/turret_01/gun_01 GLB），不需要真实资产、不 SKIP。
          - label: Armor viewer aiming interaction
            script: test:browser-armor-aiming
          # 间隙甲厚度通道「背面开放板」等效厚度（真实 GPU readback）：SPACED_FRAG 的
          # BackSide clone 必须按 FLIP_SIDED 翻回几何法线，20mm 背面屏 R=0.1（回归值 100000）。
          # 该不变量的行为证据在浏览器里，不在源码正则里（frontend/AGENTS.md Testing rules）。
          - label: Armor viewer spaced backside thickness
            script: test:browser-armor-spaced-backside
          - label: Creator recommendations
            script: test:browser-creators
          # Map Preview 移动布局（2D 正方形地图 / 工具区贴地图 / 全屏按钮可达）
          - label: Map preview mobile layout
            script: test:browser-map-preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Fetch upstream agent WASM artifact (release pin, sha256 verified)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-agent-wasm.sh
      - name: Real-browser ${{ matrix.gate.label }} regression
        working-directory: frontend
        run: pnpm run ${{ matrix.gate.script }} ${{ matrix.gate.args }}

  # 秒级门禁串行共用一个 runner。一条失败时后续仍继续并让 job 变红，保留每条门禁的失败证据；
  # step 级超时防止单条挂死吃掉整组。
  browser-fast:
    name: Frontend / Browser fast gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Fetch upstream agent WASM artifact (release pin, sha256 verified)
        id: wasm
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-agent-wasm.sh
      - name: Real-browser Playback layout regression
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: frontend
        run: pnpm run test:browser-layout
      - name: Real-browser Feedback flows regression
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: frontend
        run: pnpm run test:browser-feedback
      # 首页 reduced-motion：真实浏览器媒体查询 + computed style + hover，而不是源码正则。
      - name: Real-browser Home reduced motion regression
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: frontend
        run: pnpm run test:browser-home
      # 科技树 / compact 页头布局：真实应用 + 真实外壳的几何门禁，锁 DC-ARC-02、
      # 吸底等级条与固定底栏的相对位置；负向对照注入旧 max-block-size 实现。
      - name: Real-browser Tech tree / compact header layout regression
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: frontend
        run: pnpm run test:browser-techtree-layout
      # 场景材质着色器编译门禁（真 three.js + headless Chrome）：编译失败在页面上
      # 只表现为“物体不渲染”，普通单测/source 断言抓不到；覆盖 ST/lightmap/decal
      # 的 alphaBlend 路由与共享地面 shader。
      - name: Real-browser Scenery shader compile regression
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: frontend
        run: pnpm run test:shader-check

  # 一分钟量级的门禁，失败语义与 browser-fast 相同。
  browser-medium:
    name: Frontend / Browser medium gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Fetch upstream agent WASM artifact (release pin, sha256 verified)
        id: wasm
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-agent-wasm.sh
      # 初始化、选弹、失败重试与销毁生命周期；同样自带夹具资产包，不需要真实资产。
      - name: Real-browser Armor viewer shot readiness regression
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: frontend
        run: pnpm run test:browser-armor-shot-readiness
      - name: Real-browser League broadcast directory regression
        if: ${{ !cancelled() && steps.wasm.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: frontend
        run: pnpm run test:browser-broadcasts
