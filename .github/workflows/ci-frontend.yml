name: CI / frontend
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - name: TX frontend builder exit cleanup regression
        run: python3 deploy/test_frontend_builder.py
      - name: Frontend image identity consistency regression
        run: python3 deploy/test_frontend_image_identity.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # 上游产物 pin（deploy/agent/source.json）的确定性验证：每个 PR 都重新下载
      # v0.1.6 附件并 sha256 校验——pin 漂移/上游重发布在这里 fail，而不是发布日。
      - name: Fetch upstream agent WASM artifact (release pin, sha256 verified)
        run: bash scripts/fetch-agent-wasm.sh
      - name: Verify generated HTTP client contract
        working-directory: frontend
        run: npm run api:check
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Style lint (design language)
        working-directory: frontend
        run: npm run lint:css
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      # dist 契约 smoke：Agent WASM 产物必须是 commit-addressed 的
      #（`/wasm/<deploy/agent/source.json ref>/`），fingerprint 与 pin 逐字段一致，且
      # stable `/wasm/wotb_replay_wasm.js` 不再存在。校验实现与生产 Docker build 共用
      # `frontend/scripts/verify-agent-wasm-dist.mjs`（单一实现，不重复写检查）。
      # 三维回放/装甲查看器/射击复现的运行前提；Vite 对 @vite-ignore 动态 import
      # 不做存在性检查，缺产物构建仍绿——在此显式把住。
      - name: Agent WASM dist contract smoke
        working-directory: frontend
        run: node scripts/verify-agent-wasm-dist.mjs --dist dist
      - name: Bundle separation check
        working-directory: frontend
        run: node scripts/check-bundle-separation.mjs
      - name: Production Docker build and payload baseline
        run: |
          set -euo pipefail
          du -sk frontend/dist
          du -sk frontend/dist/assets
          find frontend/dist -type f -printf "%s %p\n" | sort -n | tail -15
          docker build -f docker/Dockerfile.frontend --build-arg BUILD_COMMIT=${{ inputs.head_sha }} -t frontend-ci .
          docker image inspect --format 'total_size_bytes={{.Size}}' frontend-ci
          docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' frontend-ci
          docker run --rm --entrypoint sh frontend-ci -c '
            set -e
            du -sk /usr/share/nginx/html
            du -sk /usr/share/nginx/html/assets
            find /usr/share/nginx/html -type f -exec du -k {} + | sort -n | tail -15
          '

  # 真实浏览器门禁拆成 4 个并行 job（原先是 frontend job 尾部的串行 step，合计占该 job 约 2/3 时长；
  # 其中装甲瞄准门禁又占其大头）。各 job 只依赖 npm ci + runner 自带 Chrome（不跑 build）；
  # WASM 产物仍需按 pin 下载——Playback/Workspace interaction 的 local-workspace-matrix 场景
  # 真的走本地 WASM 解析（夹具桩只替代了部分通道），其余三条门禁不消费它（各约 1s，统一带上）。
  # fail-fast: false —— 一条门禁失败不取消其它三条，PR 上一次就能看到全部失败面。
  browser-gates:
    name: Frontend / ${{ matrix.gate.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gate:
          - label: Playback layout
            script: test:browser-layout
          # 交互门禁 48 场景 ≈ 全矩阵最慢一条（~5.5min）；`--shard i/n` 按**静态场景清单
          # 下标取模**确定性切分，两片并行墙钟减半。清单变化不影响切分正确性（每片覆盖
          # 的是同一次 checkout 的同一份清单）。
          - label: Playback/Workspace interaction (1/2)
            script: test:browser-interaction
            args: --shard 1/2
          - label: Playback/Workspace interaction (2/2)
            script: test:browser-interaction
            args: --shard 2/2
          - label: Armor viewer mobile layout
            script: test:browser-armor-mobile
          # 装甲查看器瞄准交互（Pointer Events × OrbitControls）同样只有真浏览器 + 真实输入能验证。
          # 门禁自带确定性夹具资产包（frontend/scripts/browser-fixtures/fixture-asset-pack.mjs：
          # 进程内资产源 + 构造的 hull/turret_01/gun_01 GLB），不需要真实资产、不 SKIP。
          - label: Armor viewer aiming interaction
            script: test:browser-armor-aiming
          # 初始化、选弹、失败重试与销毁生命周期；同样自带夹具资产包，不需要真实资产。
          - label: Armor viewer shot readiness
            script: test:browser-armor-shot-readiness
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Fetch upstream agent WASM artifact (release pin, sha256 verified)
        run: bash scripts/fetch-agent-wasm.sh
      - name: Real-browser ${{ matrix.gate.label }} regression
        working-directory: frontend
        run: npm run ${{ matrix.gate.script }} -- ${{ matrix.gate.args }}
