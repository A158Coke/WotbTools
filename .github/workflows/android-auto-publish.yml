name: Android Auto Publish

# 正常发布路径的薄续跑入口：
#   main version bump -> Release / Android stage -> stage 成功 -> 本 workflow
#   -> dispatch Release / Android(mode=publish, version=X, auto_publish=true)。
#
# 本 workflow **不**决定候选是否可以发布。调度与安全不变量由 android-release.yml 自己保证：
#   - 它使用 android-release concurrency group + queue: max，因此自动 publish 请求不会取消、
#     替换或挤掉任何更新的 pending stage；
#   - publish 开始执行时由 publish_gate 重新判定「main 上是否已有更新的 Android candidate」，
#     判定以 Version-as-Code（android/gradle.properties:wotbVersion）为准，而不是
#     「repo main SHA 是否等于 staged SHA」。docs/backend/infra-only 的 main 前进不改版本号，
#     不会让唯一已 staged 的候选失去自动发布权。
#   - 被更新的 Android candidate 取代时，publish_gate 安全 skip（不写 version.json），
#     更新候选自己的 stage 成功后拥有自动发布权。
#
# 现有 publish job 仍然是 production version.json 的唯一写入者，并保留全部 staged-identity /
# runtime / CORS / minSupported 守卫。手动 workflow_dispatch(mode=publish, version=X) 仍是
# 自动 dispatch 失败或需要幂等重跑时的 recovery 入口。
on:
  workflow_run:
    workflows:
      - "Release / Android"
    types:
      - completed

permissions:
  contents: read
  actions: write

# 串行化这个薄入口本身：每个完成的 stage run 对应一次 publish 请求；dispatch 很轻，
# 真正的候选新鲜度判定在 android-release 的 publish_gate 里。
concurrency:
  group: android-auto-publish
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    # 只续跑正常 main-push stage。publish run 本身是 workflow_dispatch，因此它的完成
    # 不会递归触发这里（event != push）。
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify triggering stage job succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          STAGE_CONCLUSION="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.name == "stage") | .conclusion' | head -n1)"
          if [ "$STAGE_CONCLUSION" != "success" ]; then
            echo "::error::Release / Android run $RUN_ID completed successfully overall, but stage conclusion is '${STAGE_CONCLUSION:-missing}'. Refusing auto-publish." >&2
            exit 1
          fi
          echo "Verified stage success for Release / Android run $RUN_ID."

      - name: Checkout the staged source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Resolve immutable staged version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^wotbVersion=//p' android/gradle.properties | head -n1)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid or missing wotbVersion at staged source ${{ github.event.workflow_run.head_sha }}: '$VERSION'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Auto-publish candidate: $VERSION"

      - name: Request the guarded publish phase
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          STAGE_RUN_ID: ${{ github.event.workflow_run.id }}
          STAGED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          # 这里不做 publish / skip 决策：dispatch 不是原子的（读取候选与入队之间 main 可能前进），
          # 真正的安全不变量必须由目标 release 调度层保证。android-release 的 queue: max 保证这次
          # dispatch 不会替换更新的 pending stage；publish_gate 在 publish 开始执行时再按
          # Version-as-Code 判定该候选是否已被更新候选取代，被取代则安全 skip。
          gh workflow run android-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f mode=publish \
            -f version="$VERSION" \
            -f auto_publish=true
          {
            echo "# Android auto publish"
            echo ""
            echo "Stage run: $STAGE_RUN_ID"
            echo "Staged source: $STAGED_SHA"
            echo "Version: $VERSION"
            echo "Action: requested Release / Android mode=publish (auto_publish=true)"
            echo ""
            echo "publish_gate decides at execution time whether this candidate is still the latest"
            echo "Android candidate; the existing publish guards are unchanged. Manual"
            echo "workflow_dispatch(mode=publish, version=X) remains the recovery path."
          } >> "$GITHUB_STEP_SUMMARY"
