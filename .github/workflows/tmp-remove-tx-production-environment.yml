name: Temporary remove tx-production environment

on:
  push:
    branches: [chore/remove-tx-production-environment]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[tx-env-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/remove-tx-production-environment
          fetch-depth: 0
      - name: Apply exact migration
        shell: python
        run: |
          from pathlib import Path

          # Runtime workflows: remove only the job-level GitHub Environment binding.
          for path in Path('.github/workflows').glob('*.yml'):
              if path.name == 'tmp-remove-tx-production-environment.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('    environment: tx-production\n', '')
              path.write_text(text, encoding='utf-8')

          # Existing contract assertions that require that Environment are obsolete;
          # do not replace them with a new guard.
          contract = Path('scripts/ci/test-workflow-contract.sh')
          text = contract.read_text(encoding='utf-8')
          text = text.replace('assert tx_runtime_job["environment"] == "tx-production"\n', '')
          text = text.replace(
              '# A host mutating workflow runs in the protected environment and serializes with every\n'
              '# other TX mutation through the shared maintenance queue.\n'
              'assert worker_job["environment"] == "tx-production", worker_job.get("environment")\n',
              '# A host mutating workflow serializes with every other TX mutation through the shared maintenance queue.\n'
          )
          text = text.replace(
              '# The registry credential is read from the protected environment and handed over\n'
              '# through the SSH action\'s environment: never inline, never an argument, never a file.\n',
              '# The registry credential is read from repository-level Actions secrets and handed over\n'
              '# through the SSH action\'s environment: never inline, never an argument, never a file.\n'
          )
          text = text.replace(
              '# the host from the protected environment, so the repository stays credential-free; only\n',
              '# the host from repository-level Actions secrets, so the repository stays credential-free; only\n'
          )
          text = text.replace(
              '# variable, and never echoes it.\n',
              '# variable, and never echoes it.\n'
          )
          contract.write_text(text, encoding='utf-8')

          # Live documentation/comments: change only the secret-scope wording.
          replacements = {
              'docs/android/release-process.md': [
                  ('`workflow_dispatch`（`environment: tx-production`，与部署/备份共用',
                   '`workflow_dispatch`（凭据读取 repository-level Actions secrets / variables，与部署/备份共用'),
              ],
              'docs/operations/tx2-production-worker.md': [
                  ('受保护 `tx-production` environment 的 `secrets.TCR_USERNAME` /',
                   'repository-level Actions `secrets.TCR_USERNAME` /'),
              ],
              'docs/operations/league-broadcast-covers.md': [
                  ('在 GitHub `tx-production` environment 配置以下变量／secret：',
                   '在 GitHub repository-level Actions variables / secrets 配置以下项目：'),
              ],
              'docs/operations/tx-service-plane.md': [
                  ('`tx-production` environment', 'repository-level Actions secrets / variables'),
              ],
              'docs/DEVELOPER_GUIDE.md': [
                  ('`tx-production` environment', 'repository-level Actions secrets / variables'),
              ],
              'deploy/AGENTS.md': [
                  ('受保护 `tx-production` environment 的', 'repository-level Actions'),
              ],
              '.github/AGENTS.md': [
                  ('`tx-production` environment', 'repository-level Actions secrets / variables'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows scripts/ci/test-workflow-contract.sh docs deploy/AGENTS.md .github/AGENTS.md
          if git diff --cached --quiet; then
            echo 'No migration changes remaining.'
            exit 0
          fi
          git commit -m 'ci(actions): remove tx-production environment references [tx-env-migration]'
          git push origin HEAD:chore/remove-tx-production-environment
