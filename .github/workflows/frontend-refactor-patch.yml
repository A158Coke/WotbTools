name: Frontend refactor patch

on:
  push:
    branches: [refactor/frontend-navigation-context]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/frontend-navigation-context
      - name: Wire browser regression gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('.github/workflows/ci.yml')
          s = p.read_text(encoding='utf-8')
          if 'Real-browser Playback layout regression' not in s:
              pattern = re.compile(
                  r"(?P<indent>\s*)- name: Unit tests\n"
                  r"(?P=indent)  working-directory: frontend\n"
                  r"(?P=indent)  run: npm test\n"
              )
              match = pattern.search(s)
              assert match, 'frontend Unit tests step not found'
              indent = match.group('indent')
              addition = (
                  f"{indent}- name: Real-browser Playback layout regression\n"
                  f"{indent}  working-directory: frontend\n"
                  f"{indent}  run: npm run test:browser-layout\n"
              )
              s = s[:match.end()] + addition + s[match.end():]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit patch
        run: |
          set -euo pipefail
          git rm .github/workflows/frontend-refactor-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "ci(frontend): run real-browser playback layout gate"
          git push origin HEAD:refactor/frontend-navigation-context
