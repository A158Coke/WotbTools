name: Frontend refactor patch

on:
  push:
    branches: [refactor/frontend-navigation-context]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/frontend-navigation-context
      - name: Wire browser regression gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text(encoding='utf-8')
          old = """      - name: Unit tests
                working-directory: frontend
                run: npm test
              - name: Build
          """
          new = """      - name: Unit tests
                working-directory: frontend
                run: npm test
              - name: Real-browser Playback layout regression
                working-directory: frontend
                run: npm run test:browser-layout
              - name: Build
          """
          if old in s:
              s = s.replace(old, new, 1)
          else:
              assert 'Real-browser Playback layout regression' in s, 'frontend CI insertion point changed'
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit patch
        run: |
          set -euo pipefail
          git rm .github/workflows/frontend-refactor-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "ci(frontend): run real-browser playback layout gate"
          git push origin HEAD:refactor/frontend-navigation-context
