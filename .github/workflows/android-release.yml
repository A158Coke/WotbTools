name: Release / Android
# 两阶段发布协议（见 docs/android/release-process.md）：
#
#   stage   —— main 合并后自动跑（也可 workflow_dispatch 重跑/恢复）：contract + **cutover 守卫**
#              （guard_min_supported / guard_local_first_cutover / guard_bridge_covered）→ 构建/签名 →
#              证书校验 → 清华副本上传（distribution replica，可 replace 覆盖，不锁定版本）→
#              immutable APK seed（TX1 → TX2 依次从副本拉取，逐跳 SHA-256，no-clobber 落位；任意一台落位即消耗该
#              版本号，之后改变 Android candidate 的修改必须换版本）→ 线上 APK 可访问 + SHA 核验 → tag →
#              写并上传 **staging evidence**。**绝不**写 production version.json。
#              ⇒ major / bridge cutover 的 ANDROID_MIN_SUPPORTED_VERSION_CODE 必须在**合并之前**设好：
#              floor 未到位时这个 preflight 会 fail-closed（修好变量后幂等重跑是恢复路径，不是正常流程）。
#              major cutover：设 floor → 合并 → 本 stage 与随 PR 带来的基础设施 workflow（如 caddy.yml）各自从 main
#              运行；stage 成功即自动请求 guarded publish，**不等待**基础设施 workflow —— infra 未就绪时
#              publish 的 runtime readiness fail-closed（不写 version.json），之后对同一候选做 recovery publish。
#   publish —— stage 成功后由 Android Auto Publish 自动续跑（mode=publish, version=X, auto_publish=true）：
#              候选身份由**显式版本 X**决定（X 的 immutable tag target = staged 源码），
#              不重建 APK（复用 staged 的 immutable APK），校验 staged 身份（版本/SHA/tag/URL/
#              source SHA）→ minSupported 覆盖 breaking bridge cutover → Keycloak runtime client
#              与 bundled frontend 与 API/CORS/asset 运行面就绪 → 才写 version.json（Android 客户端 rollout 的唯一 commit point）。
#              真机测试仍有价值，但不再是 version.json 之前的人工审批门：它在 rollout 之后做 production
#              smoke / regression，发现问题按正常版本规则发布更高版本。
#
# 调度不变量：stage 与 publish 共用 android-release concurrency group，并设置 queue: max。生产 mutation
# 仍然严格串行（cancel-in-progress: false），但 GitHub 默认的单 pending 槽不会再把 stage / publish 请求
# 互相取消：后到的自动 publish 不会替换一个更新的 pending stage。
#
# 自动续跑在**开始执行时**重新判定候选新鲜度（publish_gate job）：只有 main 上出现更高的
# Version-as-Code（android/gradle.properties:wotbVersion）时，旧 staged candidate 才跳过自动发布；
# docs/backend/infra-only 的 main 前进不改变版本，不会误杀唯一候选。被跳过的自动发布是安全 no-op：
# 不写 version.json，候选保持 immutable，且仍可用显式 workflow_dispatch 做 recovery。
# 排队 ≠ 逐个上线：queue: max 只保证请求不丢失，是否需要发布由 publish_gate 在执行时决定。
#
# 当前 main 在 publish 里的角色只有「策略与历史」：ancestry、minSupported、runtime compatibility
# 以及 workflow 代码本身。它**不**决定发布哪个候选 —— main 前进到 2.0.2 不能作废已 staged 的 2.0.1。
#
# `version.json` 是强制更新的开关：只有 publish 阶段会动它，因此 publish 守卫失败 / 自动发布被更新候选
# 取代时线上 manifest 保持不变，旧客户端不会被推向一个未经守卫验证的客户端。
#
# 手动 `workflow_dispatch(mode=publish, version=X)` 是 recovery / rerun 入口：它不受自动发布
# 最新候选策略限制，但仍要经过全部 publish 安全守卫。
#
# 全程 fail-closed + 幂等：APK/tag/staging evidence/version.json 任一步失败后对**同一源码**重跑同一版本都安全，
# 不会双写、不会覆盖 immutable APK、不会 repoint tag。stage 失败不代表版本可复用：只要已有任一 immutable
# artifact（tag / 任意一台 origin 的 APK / staging evidence / version.json），改变 Android candidate 的修改就必须
# 换更高版本；stage 只从 origin/main HEAD 构建，main 前进后部分 stage 也无法再补齐。
on:
  push:
    branches:
      - main
    paths:
      - android/gradle.properties
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "stage = 构建/签名/staging（默认）；publish = 发布已 staged 的 immutable 候选并写 version.json"
        type: choice
        options:
          - stage
          - publish
        default: stage
      version:
        # publish **必须**显式给出要发布的已 staged 版本。GitHub 的 input schema 无法做
        # 「条件必填」，因此 publish job 的第一件事就是 fail-closed 校验它非空（见
        # "Guard: publish requires an explicit staged version"）。
        #
        # 为什么必须显式：stage 完成后 main 可能已经从 2.0.1 走到 2.0.2，从此不能再拿
        # 「当前 main 的 android/gradle.properties」当作发布候选 —— 那份文件的 owner 是
        # **当前策略**（ancestry / minSupported / compatibility），候选身份来自操作者给出的
        # 这个版本 + 它对应的 immutable tag target。自动续跑传入 stage 解析出的同一个版本。
        description: "Immutable staged Android version to publish, e.g. 2.0.1 (required for mode=publish; unused for mode=stage)"
        required: false
        type: string
      auto_publish:
        # 只有 Android Auto Publish 的自动续跑传 true。手动 recovery 保持默认 false：
        # 历史 staged candidate 是否放行只由既有 publish 安全守卫决定，不能被
        # 「main 上已有更新候选」的自动发布策略拦住。
        description: "true = automatic continuation from Android Auto Publish (adds the latest-Android-candidate skip)"
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: read

concurrency:
  # 生产 mutation 串行 + 请求不丢失：GitHub 默认只有 1 个 pending 槽，后到的 run 会替换（取消）
  # 正在等待的那个。自动续跑的 publish dispatch 因此可能把更新的 pending stage 挤掉。queue: max
  # 最多保留 100 个 pending 请求，stage / publish 请求互不取消；是否需要真正发布由 publish_gate
  # 在实际执行时判定，排队本身不等于逐个上线。
  group: android-release
  cancel-in-progress: false
  queue: max

env:
  ANDROID_MIN_SUPPORTED_VERSION_CODE: ${{ vars.ANDROID_MIN_SUPPORTED_VERSION_CODE || '1000000' }}
  ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 || '' }}
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  stage:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'publish'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/android-stage.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
  publish_gate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    permissions:
      contents: read
    uses: ./.github/workflows/android-publish-gate.yml
    with:
      version: ${{ inputs.version }}
      auto_publish: ${{ inputs.auto_publish }}
    secrets: inherit
  publish:
    needs: publish_gate
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && needs.publish_gate.outputs.superseded != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/android-publish.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
