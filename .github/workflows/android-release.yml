name: Release / Android
# 两阶段发布协议（见 docs/android/release-process.md）：
#
#   stage   —— main 合并后自动跑（也可 workflow_dispatch 重跑/恢复）：contract → 构建/签名 →
#              证书校验 → immutable APK 上传 → 线上 APK 可访问 + SHA 核验 → tag →
#              写并上传 **staging evidence**。**绝不**写 production version.json。
#   publish —— 真机 A14 验证通过后由 workflow_dispatch(mode=publish, version=X) 手工续跑：
#              候选身份由**显式版本 X**决定（X 的 immutable tag target = staged 源码），
#              不重建 APK（复用 staged 的 immutable APK），校验 staged 身份（版本/SHA/tag/URL/
#              source SHA）→ minSupported 覆盖 breaking bridge cutover → Keycloak runtime client
#              与 bundled frontend 与 API/CORS/asset 运行面就绪 → 才写 version.json（唯一 commit point）。
#
# 当前 main 在 publish 里的角色只有「策略与历史」：ancestry、minSupported、runtime compatibility
# 以及 workflow 代码本身。它**不**决定发布哪个候选 —— main 前进到 2.0.2 不能作废已 staged 的 2.0.1。
#
# `version.json` 是强制更新的开关：只有 publish 阶段会动它，因此真机验证失败 / 未做时线上
# manifest 保持不变，旧客户端不会被推向一个尚未验证的客户端。
#
# 全程 fail-closed + 幂等：APK/tag/staging evidence/version.json 任一步失败后重跑同一版本都安全，
# 不会双写、不会覆盖 immutable APK、不会 repoint tag。
on:
  push:
    branches:
      - main
    paths:
      - android/gradle.properties
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "stage = 构建/签名/staging（默认）；publish = 真机验证通过后发布 version.json"
        type: choice
        options:
          - stage
          - publish
        default: stage
      version:
        # publish **必须**显式给出要发布的已 staged 版本。GitHub 的 input schema 无法做
        # 「条件必填」，因此 publish job 的第一件事就是 fail-closed 校验它非空（见
        # "Guard: publish requires an explicit staged version"）。
        #
        # 为什么必须显式：真机验证期间 main 可能已经从 2.0.1 走到 2.0.2，从此不能再拿
        # 「当前 main 的 android/gradle.properties」当作发布候选 —— 那份文件的 owner 是
        # **当前策略**（ancestry / minSupported / compatibility），候选身份来自操作者给出的
        # 这个版本 + 它对应的 immutable tag target。
        description: "Immutable staged Android version to publish, e.g. 2.0.1 (required for mode=publish; unused for mode=stage)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  ANDROID_MIN_SUPPORTED_VERSION_CODE: ${{ vars.ANDROID_MIN_SUPPORTED_VERSION_CODE || '1000000' }}
  ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 || '' }}
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  stage:
    # 只有 publish 入口跑第二阶段；push / tag / dispatch(stage) 一律只做 staging。
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'publish'
    # 创建 release tag 需要 contents: write；publish 只读，不继承这个权限。
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # 构建 + 签名/上传约 35 分钟；staging 阶段不做任何线上就绪等待（那属于 publish）。
    timeout-minutes: 60
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          # 每个入口都固定到事件携带的 immutable commit SHA；dispatch 随后验证它是 origin/main HEAD。
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: version
        shell: bash
        env:
          WOTB_TRIGGER: ${{ github.event_name }}
          WOTB_TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          export WOTB_COMMIT="$(git rev-parse HEAD)"
          bash scripts/android-release/resolve-version.sh >> "$GITHUB_OUTPUT"

      - name: Android Contract and committed version gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/android-release/android_contract.py validate \
            --contract contracts/android-native-bridge.json \
            --gradle-properties android/gradle.properties \
            --frontend frontend/src/platform/nativeBridgeContract.js \
            --native-source android/app/src/main/java/com/wotbtools/app/NativeBridge.kt \
            --native-source android/app/src/main/java/com/wotbtools/app/MainActivity.kt \
            --native-source android/app/src/main/java/com/wotbtools/app/ReplayIntentHandler.kt \
            --frontend-source frontend/src/platform/nativeBridgeContract.js \
            --frontend-source frontend/src/platform/androidAuthProvider.js

      - name: Validate source is main (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          BUILD_SHA="${{ steps.version.outputs.commit }}"
          echo "Release source:"
          echo "branch=main"
          echo "commit=$BUILD_SHA"
          echo "version=${{ steps.version.outputs.versionName }}"
          echo "versionCode=${{ steps.version.outputs.versionCode }}"
          echo "tag=${{ steps.version.outputs.tagName }}"
          echo "apk=${{ steps.version.outputs.apkName }}"
          git fetch origin main
          ORIGIN_MAIN="$(git rev-parse origin/main)"
          if [ "$BUILD_SHA" != "$ORIGIN_MAIN" ]; then
            echo "::error::Release must run from origin/main HEAD (checked out $BUILD_SHA != origin/main $ORIGIN_MAIN)." >&2
            exit 1
          fi
          # mode=stage 的版本权威永远是当前 main 的 android/gradle.properties：
          # version 输入只在 mode=publish 有意义，这里显式忽略（重复 dispatch 时不会静默改变行为）。
          if [ -n "${{ inputs.version }}" ]; then
            echo "::notice::version input '${{ inputs.version }}' is ignored for mode=stage; staging uses the committed android/gradle.properties."
          fi

      - name: Preflight classify production state (safe + idempotent)
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="${{ steps.version.outputs.versionCode }}"
          VERSION_NAME="${{ steps.version.outputs.versionName }}"
          APK_NAME="${{ steps.version.outputs.apkName }}"
          PROD_JSON="$RUNNER_TEMP/prod-version.json"
          URL="https://wotbtools.com/download/android/version.json"
          CODE="$(curl -s -o "$PROD_JSON" -w '%{http_code}' "$URL")"
          . scripts/android-release/check-release-guards.sh
          case "$CODE" in
            404)
              echo "First Android release: production version.json HTTP 404."
              PROD_STATE="prod_absent"
              ;;
            200)
              classify_prod "$PROD_JSON" "$VERSION_CODE" "$VERSION_NAME" "$APK_NAME" "$ANDROID_MIN_SUPPORTED_VERSION_CODE" "${{ steps.version.outputs.nativeBridgeVersion }}" "${{ steps.version.outputs.commit }}"
              ;;
            *)
              echo "::error::Unexpected HTTP $CODE fetching production version.json" >&2
              exit 1
              ;;
          esac
          guard_min_supported "$ANDROID_MIN_SUPPORTED_VERSION_CODE" "$VERSION_CODE"
          guard_local_first_cutover "$ANDROID_MIN_SUPPORTED_VERSION_CODE" "$VERSION_CODE"

          # 一个前端已不再支持的 bridge 版本必须靠 minSupportedVersionCode 强制更新：
          # 否则发布出去的是一个「看起来兼容」的 manifest，而线上旧客户端继续用一个本
          # 前端已经无法服务的 wire contract（version.json 的 nativeBridgeVersion 就是
          # 线上客户端当前使用的 bridge 世代）。
          PROD_BRIDGE=""
          if [ -s "$PROD_JSON" ]; then
            PROD_BRIDGE="$(jq -r '.nativeBridgeVersion // empty' "$PROD_JSON" 2>/dev/null || true)"
          fi
          FE_VERSIONS="$(python3 - <<'PY'
          import re
          text = open('frontend/src/platform/nativeBridgeContract.js', encoding='utf-8').read()
          match = re.search(r'SUPPORTED_NATIVE_BRIDGE_VERSIONS\s*=\s*Object\.freeze\(\[([^\]]*)\]\)', text)
          print(','.join(re.findall(r'\b[0-9]+\b', match.group(1))) if match else '')
          PY
          )"
          guard_bridge_covered "$PROD_BRIDGE" "${{ steps.version.outputs.nativeBridgeVersion }}" \
            "$FE_VERSIONS" "$ANDROID_MIN_SUPPORTED_VERSION_CODE" "$VERSION_CODE"
          echo "Frontend-supported bridge versions: ${FE_VERSIONS:-none}; production bridge: ${PROD_BRIDGE:-none}"

          # Reject an immutable release-tag conflict before expensive builds or any
          # production APK mutation. A retry is allowed only when the tag is absent
          # or already points at this exact source commit.
          TAG="${{ steps.version.outputs.tagName }}"
          COMMIT_SHA="${{ steps.version.outputs.commit }}"
          REFS="$(git ls-remote --tags origin "refs/tags/$TAG")"
          classify_tag "$REFS" "$TAG" "$COMMIT_SHA"
          if [ "$TAG_STATE" = "tag_conflict" ]; then
            echo "::error::Release tag $TAG points to a different commit; refusing before build/upload." >&2
            exit 1
          fi
          echo "Release tag preflight: $TAG_STATE"

          echo "Production state: $PROD_STATE"
          case "$PROD_STATE" in
            prod_absent|prod_older)
              echo "No conflicting production version; proceeding to release."
              echo "releaseAction=publish" >> "$GITHUB_OUTPUT"
              ;;
            prod_equal_ok)
              # Same version & metadata coherent is NOT auto-success: verify the
              # already-published artifacts are still valid before no-op success.
              echo "Same version & metadata coherent; verifying existing release."
              PUBLISHED_SHA="$PROD_PUBLISHED_SHA"
              APK_URL="https://wotbtools.com/download/android/$APK_NAME"
              TMP_EXISTING="$RUNNER_TEMP/existing-release.apk"
              if ! curl -fsSL -o "$TMP_EXISTING" "$APK_URL" 2>/dev/null; then
                echo "::error::Existing release APK not reachable at apkUrl; refusing already-published." >&2
                exit 1
              fi
              test -s "$TMP_EXISTING" || { echo "::error::Existing release APK is empty; refusing already-published." >&2; exit 1; }
              ACTUAL_SHA="$(sha256sum "$TMP_EXISTING" | awk '{print $1}')"
              classify_prod_apk "$ACTUAL_SHA" "$PUBLISHED_SHA"
              case "$APK_STATE" in
                apk_equal)
                  echo "Existing release APK SHA-256 matches published version.json."
                  ;;
                apk_absent)
                  echo "::error::Existing release APK missing; refusing already-published." >&2
                  exit 1
                  ;;
                apk_conflict)
                  echo "::error::Existing release APK SHA-256 differs from published version.json; refusing already-published." >&2
                  exit 1
                  ;;
              esac
              TAG="${{ steps.version.outputs.tagName }}"
              COMMIT_SHA="${{ steps.version.outputs.commit }}"
              REFS="$(git ls-remote --tags origin "refs/tags/$TAG")"
              classify_tag "$REFS" "$TAG" "$COMMIT_SHA"
              if [ "$TAG_STATE" != "tag_equal" ]; then
                echo "::error::Existing release tag must exist and point to expected commit (got $TAG_STATE); refusing already-published." >&2
                exit 1
              fi
              echo "Existing release tag verified (points to expected commit)."
              echo "Existing release fully verified; safe success (no-op)."
              echo "releaseAction=already-published" >> "$GITHUB_OUTPUT"
              ;;
            prod_equal_conflict)
              echo "::error::Production version.json for the same versionCode does not match release metadata." >&2
              exit 1
              ;;
            prod_newer)
              echo "::error::Android release rollback rejected: production latestVersionCode is newer than this version." >&2
              exit 1
              ;;
          esac

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.releaseAction == 'publish'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fetch pinned Agent WASM for frontend validation
        if: steps.preflight.outputs.releaseAction == 'publish'
        shell: bash
        run: bash scripts/fetch-agent-wasm.sh

      - name: Frontend tests + build validation
        if: steps.preflight.outputs.releaseAction == 'publish'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      # PR B：signed release APK 必须和内层 debug APK 一样携带**完整的本地前端 bundle**
      # （index + JS/CSS + pinned Agent WASM + 本地 2D 资源）。否则会出现「CI 是 local-first、
      # 线上 APK 不是」的分裂。复用上一步的 node_modules 与已取回的 Agent 产物，不重复下载。
      - name: Build the local-first frontend bundle into APK assets
        if: steps.preflight.outputs.releaseAction == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend run build:android

      - uses: actions/setup-java@v4
        if: steps.preflight.outputs.releaseAction == 'publish'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.preflight.outputs.releaseAction == 'publish'
        with:
          gradle-version: "8.7"

      - name: Prepare staging directory (workspace-relative, 服务器路径严格)
        if: steps.preflight.outputs.releaseAction == 'publish'
        shell: bash
        run: mkdir -p release-staging

      - name: Validate signing config and restore keystore (fail-fast; secrets 不出现在日志)
        if: steps.preflight.outputs.releaseAction == 'publish'
        shell: bash
        run: |
          set -euo pipefail

          # 1. 必需 secret 非空（在真正 Gradle build 前 fail-fast，避免跑到签名处才报错）
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required secret: $v"
              exit 1
            fi
          done

          # 2. 解码 keystore。用 printf（非 echo），避免换行/转义污染 base64。
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP"/keystore.jks

          # 3. 解码后 keystore 必须非空。
          if [ ! -s "$RUNNER_TEMP"/keystore.jks ]; then
            echo "::error::Decoded keystore is empty"
            exit 1
          fi

          # 4. keytool 用配置的 store password 找到配置的 alias（fail-fast）。不输出 keystore 内容。
          if ! keytool -list -keystore "$RUNNER_TEMP"/keystore.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Signing key validation failed: keytool could not open keystore with alias '$ANDROID_KEY_ALIAS' using the configured store password. Check ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS."
            exit 1
          fi

          echo "Signing config validated (alias present)."

      - name: Build signed release APK
        if: steps.preflight.outputs.releaseAction == 'publish'
        working-directory: android
        shell: bash
        run: |
          gradle assembleRelease \
            -PwotbKeystorePath="$RUNNER_TEMP/keystore.jks" \
            -PwotbKeystoreStorePass="$ANDROID_KEYSTORE_PASSWORD" \
            -PwotbKeyAlias="$ANDROID_KEY_ALIAS" \
            -PwotbKeyPass="$ANDROID_KEY_PASSWORD"

      - name: Verify APK signature and signing certificate fingerprint
        if: steps.preflight.outputs.releaseAction == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::APK not found" >&2; exit 1; }
          test -s "$APK" || { echo "::error::APK is empty" >&2; exit 1; }

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          # 提取 signer 证书 SHA-256（归一化为大写、去冒号）。指纹属公开证书信息，可输出。
          CERT_FP="$( "$APKSIGNER" verify --print-certs "$APK" 2>/dev/null \
            | grep -i 'SHA-256 digest' \
            | head -n1 \
            | grep -oiE '[0-9a-fA-F]{64}' \
            | head -n1 \
            | tr 'a-f' 'A-F' )"
          EXPECTED_FP="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr -d ':' | tr 'a-f' 'A-F')"

          if [ -z "$EXPECTED_FP" ]; then
            echo "::error::ANDROID_SIGNING_CERT_SHA256 is not configured. Extract the fingerprint from the known production signing certificate and configure it as a GitHub Actions Variable." >&2
            exit 1
          fi
          if [ -z "$CERT_FP" ]; then
            echo "::error::Could not extract signing certificate SHA-256 fingerprint from APK." >&2
            exit 1
          fi
          if [ "$CERT_FP" != "$EXPECTED_FP" ]; then
            echo "::error::Android signing certificate mismatch: expected $ANDROID_SIGNING_CERT_SHA256, got $CERT_FP" >&2
            exit 1
          fi
          echo "Signing certificate SHA-256 verified (public fingerprint)."

      # PR B：signed release APK 的 local-first 内容证明。位置刻意在签名验证之后、任何上传 / tag /
      # staging evidence 之前 —— 一个不含本地 bundle 的 APK 绝不允许被广播或写入 release 身份。
      - name: Verify release APK carries the local-first frontend bundle
        if: steps.preflight.outputs.releaseAction == 'publish'
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::release APK missing or empty" >&2; exit 1; }

          MANIFEST="android/app/src/main/assets/web/bundle-manifest.json"
          test -s "$MANIFEST" || { echo "::error::bundle manifest missing; build:android did not run" >&2; exit 1; }
          AGENT_REF="$(python3 -c 'import json;print(json.load(open("deploy/agent/source.json"))["ref"])')"
          AGENT_RELEASE="$(python3 -c 'import json;print(json.load(open("deploy/agent/source.json"))["artifact"]["release"])')"
          MANIFEST_REF="$(python3 -c 'import json;print(json.load(open("android/app/src/main/assets/web/bundle-manifest.json"))["agentWasm"]["commit"])')"
          MANIFEST_RELEASE="$(python3 -c 'import json;print(json.load(open("android/app/src/main/assets/web/bundle-manifest.json"))["agentWasm"]["release"])')"
          test "$AGENT_REF" = "$MANIFEST_REF" || {
            echo "::error::bundle manifest agent commit $MANIFEST_REF != pinned $AGENT_REF" >&2
            exit 1
          }
          test "$AGENT_RELEASE" = "$MANIFEST_RELEASE" || {
            echo "::error::bundle manifest agent release $MANIFEST_RELEASE != pinned $AGENT_RELEASE" >&2
            exit 1
          }

          # listing 文件而不是管道：`producer | grep -q` 在 `set -o pipefail` 下会因 SIGPIPE 假失败。
          listing_file="$RUNNER_TEMP/release-apk-listing.txt"
          unzip -Z1 "$APK" > "$listing_file"
          for required in \
            assets/web/index.html \
            assets/web/bundle-manifest.json \
            "assets/web/wasm/$AGENT_REF/wotb_replay_wasm.js" \
            "assets/web/wasm/$AGENT_REF/wotb_replay_wasm_bg.wasm"; do
            grep -Fxq "$required" "$listing_file" || {
              echo "::error::release APK 缺少离线前端 bundle 文件：$required" >&2
              grep '^assets/web/' "$listing_file" | head -n 10 || true
              exit 1
            }
          done
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          python3 scripts/android-release/android_contract.py bundle \
            --badging "$RUNNER_TEMP/apk-badging.txt" --apk "$APK" --contract contracts/android-native-bridge.json --pin deploy/agent/source.json \
            --source "${{ steps.version.outputs.commit }}" --version "${{ steps.version.outputs.versionName }}" \
            --output "$RUNNER_TEMP/bundle-evidence.json"
          {
            echo "bundleFiles=$(jq -r '.bundleFileCount' "$RUNNER_TEMP/bundle-evidence.json")"
            echo "agentWasmCommit=$AGENT_REF"
            echo "agentWasmRelease=$AGENT_RELEASE"
            echo "bundleManifestSha256=$(jq -r '.bundleManifestSha256' "$RUNNER_TEMP/bundle-evidence.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Compute SHA-256 and stage APK
        if: steps.preflight.outputs.releaseAction == 'publish'
        id: artifact
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APK_NAME="${{ steps.version.outputs.apkName }}"
          cp "$APK" "release-staging/$APK_NAME"
          SHA256="$(sha256sum "release-staging/$APK_NAME" | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "apkName=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Classify production APK (idempotent upload)
        if: steps.preflight.outputs.releaseAction == 'publish'
        id: apkcheck
        shell: bash
        run: |
          set -euo pipefail
          . scripts/android-release/check-release-guards.sh
          APK_NAME="${{ steps.artifact.outputs.apkName }}"
          BUILD_SHA="${{ steps.artifact.outputs.sha256 }}"
          URL="https://wotbtools.com/download/android/$APK_NAME"
          TMP_PROD="$RUNNER_TEMP/prod-apk-check.apk"
          PROD_SHA=""
          if curl -fsSL -o "$TMP_PROD" "$URL" 2>/dev/null; then
            test -s "$TMP_PROD" || { echo "::error::Production APK exists but is empty" >&2; exit 1; }
            PROD_SHA="$(sha256sum "$TMP_PROD" | awk '{print $1}')"
          fi
          classify_prod_apk "$PROD_SHA" "$BUILD_SHA"
          case "$APK_STATE" in
            apk_absent) echo "Production APK absent; will upload." ;;
            apk_equal) echo "Production APK already matches build SHA-256; resuming (no upload)." ;;
            apk_conflict)
              echo "::error::Production APK already exists with a different SHA-256; immutable release conflict." >&2
              exit 1
              ;;
          esac
          echo "apkState=$APK_STATE" >> "$GITHUB_OUTPUT"

      - name: Upload APK to TX (bind-mount 目录)
        if: steps.preflight.outputs.releaseAction == 'publish' && steps.apkcheck.outputs.apkState == 'apk_absent'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: release-staging/${{ steps.artifact.outputs.apkName }}
          target: /opt/wotb-tx/android-release
          strip_components: 1

      - name: Ensure APK readable by nginx
        if: steps.preflight.outputs.releaseAction == 'publish' && steps.apkcheck.outputs.apkState == 'apk_absent'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          script: chmod 644 /opt/wotb-tx/android-release/${{ steps.artifact.outputs.apkName }}

      - name: Verify production APK (HTTP 200 + non-empty + SHA matches)
        if: steps.preflight.outputs.releaseAction == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="${{ steps.artifact.outputs.apkName }}"
          EXPECTED_SHA="${{ steps.artifact.outputs.sha256 }}"
          URL="https://wotbtools.com/download/android/$APK_NAME"
          TMP_APK="$RUNNER_TEMP/prod.apk"
          SIZE="$(curl -fsSL -o "$TMP_APK" -w '%{size_download}' "$URL")"
          test -s "$TMP_APK" || { echo "::error::Downloaded APK is empty" >&2; exit 1; }
          [ "$SIZE" -gt 0 ] || { echo "::error::APK Content-Length is not > 0" >&2; exit 1; }
          PROD_SHA="$(sha256sum "$TMP_APK" | awk '{print $1}')"
          if [ "$PROD_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Production APK SHA-256 mismatch: expected $EXPECTED_SHA, got $PROD_SHA" >&2
            exit 1
          fi
          echo "Production APK verified: HTTP 200, $SIZE bytes, SHA-256 $PROD_SHA"

      - name: Ensure release tag (idempotent)
        if: github.ref_type != 'tag' && steps.preflight.outputs.releaseAction == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          . scripts/android-release/check-release-guards.sh
          TAG="${{ steps.version.outputs.tagName }}"
          COMMIT_SHA="${{ steps.version.outputs.commit }}"
          REFS="$(git ls-remote --tags origin "refs/tags/$TAG")"
          classify_tag "$REFS" "$TAG" "$COMMIT_SHA"
          case "$TAG_STATE" in
            tag_absent)
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag "$TAG" "$COMMIT_SHA"
              git push origin "$TAG"
              echo "Created and pushed release tag: $TAG -> $COMMIT_SHA"
              ;;
            tag_equal)
              echo "Release tag already points to this commit; resuming: $TAG -> $COMMIT_SHA"
              ;;
            tag_conflict)
              echo "::error::Release tag $TAG points to a different commit; refusing to repoint." >&2
              exit 1
              ;;
          esac

      - name: Write immutable staging evidence (production version.json 保持不变)
        if: steps.preflight.outputs.releaseAction == 'publish'
        id: staging
        shell: bash
        run: |
          set -euo pipefail
          # staging evidence 的唯一用途：让 publish 阶段**不重建 APK**也能证明「它要广播的那个
          # APK 就是这里验证过的那个」。production version.json 是强制更新的 commit point，
          # 本阶段绝不触碰它 —— 真机 A14 验证失败或未完成时，线上 manifest 必须原样不动。
          APK_NAME="${{ steps.artifact.outputs.apkName }}"
          STAGING_NAME="${APK_NAME%.apk}.staging.json"
          EXISTING="$RUNNER_TEMP/existing-staging.json"
          STATUS="$(curl -sS --connect-timeout 5 --max-time 20 -o "$EXISTING" -w '%{http_code}' \
            "https://wotbtools.com/download/android/$STAGING_NAME")"
          case "$STATUS" in
            404) cp "$RUNNER_TEMP/bundle-evidence.json" "release-staging/$STAGING_NAME" ;;
            200)
              python3 scripts/android-release/android_contract.py bundle \
                --badging "$RUNNER_TEMP/apk-badging.txt" --apk "android/app/build/outputs/apk/release/app-release.apk" --contract contracts/android-native-bridge.json \
                --pin deploy/agent/source.json --source "${{ steps.version.outputs.commit }}" \
                --version "${{ steps.version.outputs.versionName }}" --evidence "$EXISTING" \
                --output "release-staging/$STAGING_NAME"
              ;;
            *) echo "::error::Cannot verify existing immutable staging evidence (HTTP $STATUS)" >&2; exit 1 ;;
          esac
          cat "release-staging/$STAGING_NAME"
          echo "stagingName=$STAGING_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload staging evidence to TX
        if: steps.preflight.outputs.releaseAction == 'publish'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: release-staging/${{ steps.staging.outputs.stagingName }}
          target: /opt/wotb-tx/android-release
          strip_components: 1

      - name: Ensure staging evidence readable by nginx
        if: steps.preflight.outputs.releaseAction == 'publish'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          script: chmod 644 /opt/wotb-tx/android-release/${{ steps.staging.outputs.stagingName }}

      - name: Verify production staging evidence (HTTP 200 + content)
        if: steps.preflight.outputs.releaseAction == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://wotbtools.com/download/android/${{ steps.staging.outputs.stagingName }}"
          TMP_STAGING="$RUNNER_TEMP/prod-staging-verify.json"
          curl -fsSL -o "$TMP_STAGING" "$URL"
          cmp "$TMP_STAGING" "release-staging/${{ steps.staging.outputs.stagingName }}" || {
            echo "::error::Production staging evidence differs from the verified immutable APK identity" >&2
            exit 1
          }
          echo "Staging evidence verified: the publish phase can prove this exact APK identity."

      - name: Remind the operator about the manual publish phase
        if: steps.preflight.outputs.releaseAction == 'publish'
        shell: bash
        run: |
          {
            echo "### stage complete — production version.json untouched"
            echo ""
            echo "Next: run the real-device A14 matrix (QQ / WG ASIA / WG EU / WG NA + cancel / error /"
            echo "logout / refresh / process death / both redirect transports). Only after that, dispatch"
            echo "this workflow with \`mode=publish\` to write version.json (the mandatory-update commit point)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write release summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Android Release (stage) ${{ steps.version.outputs.versionName }}"
            echo ""
            echo "Status: ${{ job.status }}"
            echo "Stage Action: ${{ steps.preflight.outputs.releaseAction || 'n/a' }}"
            echo ""
            echo "Version Name: ${{ steps.version.outputs.versionName }}"
            echo "Version Code: ${{ steps.version.outputs.versionCode }}"
            echo "Native Bridge: ${{ steps.version.outputs.nativeBridgeVersion }}"
            echo "Tag: ${{ steps.version.outputs.tagName }}"
            echo "Source Commit: ${{ steps.version.outputs.commit }}"
            echo "APK: ${{ steps.artifact.outputs.apkName }}"
            echo "APK SHA-256: ${{ steps.artifact.outputs.sha256 }}"
            echo "Staging evidence: ${{ steps.staging.outputs.stagingName }}"
            echo "Signing Certificate SHA-256: ${{ env.ANDROID_SIGNING_CERT_SHA256 }}"
            echo ""
            # PR B：登记 release APK 内 bundle 的身份（证明 parser 来自 APK 自带的 pinned 产物）。
            echo "Local-first bundle files: ${{ steps.bundle.outputs.bundleFiles }}"
            echo "Agent WASM: ${{ steps.bundle.outputs.agentWasmRelease }} @ ${{ steps.bundle.outputs.agentWasmCommit }}"
            echo "Bundle manifest SHA-256: ${{ steps.bundle.outputs.bundleManifestSha256 }}"
            echo ""
            echo "production version.json is NOT modified by this job."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    # 第二阶段：真机 A14 验证通过后手工续跑（mode=publish）。复用已经 staged 的 immutable APK，
    # **绝不重建**、绝不改 tag；只有本 job 会写 production version.json（强制更新的 commit point）。
    #
    # 最终发布不变量（全部成立才写 manifest）：
    #   staged APK 身份正确（版本 / source SHA / tag / URL / APK SHA-256）
    #   ∧ production Keycloak 有可用的 wotbtools-android
    #   ∧ APK bundled frontend 支持 Bridge v2 + native-auth，API/asset CORS 就绪
    #   ∧ minSupportedVersionCode 覆盖这次 breaking bridge cutover
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main (current release policy + ancestry history)
        uses: actions/checkout@v5
        with:
          # publish 的权威是 staged release 身份（显式版本 → immutable tag → staging evidence → APK SHA），
          # 这里只需要当前 main 的策略与完整历史来做 ancestry / minSupported / compatibility 判定。
          ref: main
          fetch-depth: 0

      - name: "Guard: publish requires an explicit staged version"
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # GitHub 的 workflow_dispatch schema 不能表达「mode=publish 时 required」，
          # 因此这里 fail closed：没有显式版本就绝不猜、绝不从当前 main 推导候选。
          if [ -z "${REQUESTED_VERSION// /}" ]; then
            echo "::error::mode=publish requires an explicit version input (the immutable staged version, e.g. 2.0.1). Refusing to derive the publish candidate from current main." >&2
            exit 1
          fi
          if ! printf '%s' "$REQUESTED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version input must be X.Y.Z (got '$REQUESTED_VERSION')." >&2
            exit 1
          fi
          echo "Publish candidate version: $REQUESTED_VERSION"

      - name: Resolve the release source from the immutable tag (no rebuild, no current-main candidate)
        id: stagedref
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 只按操作者给出的版本推导 tag / APK / staging evidence 名字；
          # 版本/versionCode/bridge 一律从 **tag target** 的源码解析（绝不读工作区文件）。
          TAG="android-v$REQUESTED_VERSION"
          git fetch origin main --tags --force
          REFS="$(git ls-remote --tags origin "refs/tags/$TAG")"
          TAG_TARGET="$(printf '%s\n' "$REFS" | awk -F'\t' -v want="refs/tags/$TAG" '
            $2 == want       { obj = $1 }
            $2 == want "^{}" { peeled = $1 }
            END              { if (peeled != "") print peeled; else print obj }
          ')"
          if [ -z "$TAG_TARGET" ]; then
            echo "::error::Release tag $TAG does not exist. Stage version $REQUESTED_VERSION before publishing it." >&2
            exit 1
          fi
          git cat-file -e "$TAG_TARGET^{commit}"
          echo "tagName=$TAG" >> "$GITHUB_OUTPUT"
          echo "apkName=wotbtools-android-v$REQUESTED_VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "stagingName=wotbtools-android-v$REQUESTED_VERSION.staging.json" >> "$GITHUB_OUTPUT"
          echo "tagTarget=$TAG_TARGET" >> "$GITHUB_OUTPUT"

          # 导出 tag target 的**源码**（staged 身份的唯一来源），后续每一步只读这份副本。
          git archive "$TAG_TARGET" -- \
            android/gradle.properties \
            contracts/android-native-bridge.json \
            deploy/agent/source.json \
            frontend/src/platform/nativeBridgeContract.js \
            frontend/src/platform/androidAuthProvider.js \
            android/app/src/main/java/com/wotbtools/app/NativeBridge.kt \
            android/app/src/main/java/com/wotbtools/app/MainActivity.kt \
            android/app/src/main/java/com/wotbtools/app/ReplayIntentHandler.kt \
            | tar -x -C "$RUNNER_TEMP"

          # 显式版本必须等于 staged 源码的版本：这是「不能按当前 main 猜候选」的强制点之一
          # （另一个是 tag 名推导）。任何 mismatch 都在这里 fail closed。
          WOTB_ROOT="$GITHUB_WORKSPACE" WOTB_TRIGGER=workflow_dispatch WOTB_TAG_NAME="" \
            WOTB_COMMIT="$TAG_TARGET" \
            WOTB_STAGED_REF="$TAG_TARGET" \
            WOTB_STAGED_PROPERTIES="$RUNNER_TEMP/android/gradle.properties" \
            WOTB_REQUESTED_VERSION="$REQUESTED_VERSION" \
            bash scripts/android-release/resolve-staged-version.sh >> "$GITHUB_OUTPUT"
          grep -Fxq "tagName=$TAG" "$GITHUB_OUTPUT" || {
            echo "::error::Staged source resolved a tag that differs from the requested version $REQUESTED_VERSION" >&2
            exit 1
          }
          echo "Resolved $TAG -> $TAG_TARGET"

      - name: Validate the staged release source identity (tag target is authoritative)
        id: stagedversion
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          TAG_TARGET: ${{ steps.stagedref.outputs.tagTarget }}
        run: |
          set -euo pipefail
          # staged 源码自己的 contract 必须自洽（gradle bridge == staged contract bridge == staged frontend）。
          # 注意：这里用的全是 $RUNNER_TEMP 下的 tag target 副本，工作区文件不参与候选身份。
          python3 scripts/android-release/android_contract.py validate \
            --contract "$RUNNER_TEMP/contracts/android-native-bridge.json" \
            --gradle-properties "$RUNNER_TEMP/android/gradle.properties" \
            --frontend "$RUNNER_TEMP/frontend/src/platform/nativeBridgeContract.js" \
            --native-source "$RUNNER_TEMP/android/app/src/main/java/com/wotbtools/app/NativeBridge.kt" \
            --native-source "$RUNNER_TEMP/android/app/src/main/java/com/wotbtools/app/MainActivity.kt" \
            --native-source "$RUNNER_TEMP/android/app/src/main/java/com/wotbtools/app/ReplayIntentHandler.kt" \
            --frontend-source "$RUNNER_TEMP/frontend/src/platform/nativeBridgeContract.js" \
            --frontend-source "$RUNNER_TEMP/frontend/src/platform/androidAuthProvider.js"
          # 当前 main 的 contract 若与 staged 源码不一致，说明 bridge 已前进：这不是本候选的身份，
          # 必须显式失败，而不是悄悄用当前 main 的 bridge 去校验一个历史 APK。
          cmp -s "$RUNNER_TEMP/contracts/android-native-bridge.json" contracts/android-native-bridge.json || {
            echo "::error::Current main's Native Bridge contract differs from the staged release source; publish the staged version with the workflow that staged it." >&2
            exit 1
          }
          echo "Staged source identity for $REQUESTED_VERSION: tag=${{ steps.stagedref.outputs.tagName }} versionCode=${{ steps.stagedref.outputs.versionCode }} bridge=${{ steps.stagedref.outputs.nativeBridgeVersion }} source=$TAG_TARGET"

      - name: Android contract and committed version gate (current main policy)
        shell: bash
        run: |
          set -euo pipefail
          # 当前策略面：当前 main 的 contract + 当前 main 的 committed version 必须自洽
          # （stage 同样跑这一段）。候选身份由前面的 staged 步骤单独证明。
          python3 scripts/android-release/android_contract.py validate \
            --contract contracts/android-native-bridge.json \
            --gradle-properties android/gradle.properties \
            --frontend frontend/src/platform/nativeBridgeContract.js \
            --native-source android/app/src/main/java/com/wotbtools/app/NativeBridge.kt \
            --native-source android/app/src/main/java/com/wotbtools/app/MainActivity.kt \
            --native-source android/app/src/main/java/com/wotbtools/app/ReplayIntentHandler.kt \
            --frontend-source frontend/src/platform/nativeBridgeContract.js \
            --frontend-source frontend/src/platform/androidAuthProvider.js

      - name: Resolve the staged release identity from the immutable tag (no rebuild)
        id: staged
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          TAG_TARGET: ${{ steps.stagedref.outputs.tagTarget }}
        run: |
          set -euo pipefail
          . scripts/android-release/check-release-guards.sh

          # 发布权威 = 已 staged 的 release 身份（显式版本 → tag target → staging evidence → APK 字节）。
          # 真机验证期间 main 可能已经前进（A → B）：那**不能**作废一个已经 staged + 验证过的
          # Android 版本（Android 版本/tag/APK 身份都是 immutable，无法从 B 重新 staged 同一版本）。
          APK_NAME="${{ steps.stagedref.outputs.apkName }}"
          STAGING_NAME="${{ steps.stagedref.outputs.stagingName }}"
          TAG="${{ steps.stagedref.outputs.tagName }}"
          BASE="https://wotbtools.com/download/android"

          STAGING="$RUNNER_TEMP/staging.json"
          if ! curl -fsSL -o "$STAGING" "$BASE/$STAGING_NAME"; then
            echo "::error::No staging evidence at $BASE/$STAGING_NAME; stage version $REQUESTED_VERSION first." >&2
            exit 1
          fi
          git show "$TAG_TARGET:contracts/android-native-bridge.json" > "$RUNNER_TEMP/staged-contract.json"
          git show "$TAG_TARGET:deploy/agent/source.json" > "$RUNNER_TEMP/staged-agent.json"
          # staged 源码的 gradle.properties 已在 stagedref 步骤导出到 $RUNNER_TEMP（git archive），
          # 这里断言它的版本就是请求的版本；工作区的 android/gradle.properties 不参与候选身份。
          grep -Fxq "wotbVersion=$REQUESTED_VERSION" "$RUNNER_TEMP/android/gradle.properties"
          # staged 源码的 bridge 必须等于 staged 源码自己声明的 bridge（同样来自 tag target）。
          STAGED_BRIDGE="$(jq -r '.bridgeVersion' "$RUNNER_TEMP/staged-contract.json")"
          grep -Fxq "wotbNativeBridgeVersion=$STAGED_BRIDGE" "$RUNNER_TEMP/android/gradle.properties"
          curl -fsSL -o "$RUNNER_TEMP/staged.apk" "$BASE/$APK_NAME"
          test -s "$RUNNER_TEMP/staged.apk" || { echo "::error::Staged APK is empty" >&2; exit 1; }
          ACTUAL_APK_SHA="$(sha256sum "$RUNNER_TEMP/staged.apk" | awk '{print $1}')"

          guard_staged_release_identity \
            "$TAG_TARGET" "$TAG_TARGET" "$(jq -r '.sourceSha' "$STAGING")" \
            "$(jq -r '.sha256' "$STAGING")" "$ACTUAL_APK_SHA"

          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$RUNNER_TEMP/staged.apk" > "$RUNNER_TEMP/apk-badging.txt"
          # APK badging 的 versionCode/versionName 必须等于 **staged 源码**的 versionCode/versionName，
          # 而不是当前 main 的 committed 版本（android_contract.py bundle 内部会断言 badging 版本；
          # 这里再显式比对 staged versionCode，避免只看名字不看数字）。
          python3 - "$RUNNER_TEMP/apk-badging.txt" "$RUNNER_TEMP/android/gradle.properties" <<'PY'
          import re
          import sys

          sys.path.insert(0, "scripts/android-release")
          from android_contract import parse_version, properties, version_code

          badging = open(sys.argv[1], encoding="utf-8").read()
          expected = version_code(parse_version(properties(open(sys.argv[2], encoding="utf-8").read())["wotbVersion"]))
          match = re.search(r"versionCode='([0-9]+)'", badging)
          if not match:
              raise SystemExit("APK badging has no versionCode")
          if int(match.group(1)) != expected:
              raise SystemExit(f"Staged APK versionCode {match.group(1)} does not match the staged source versionCode {expected}")
          print(f"Staged APK versionCode matches the staged source: {expected}")
          PY
          python3 scripts/android-release/android_contract.py bundle \
            --badging "$RUNNER_TEMP/apk-badging.txt" --apk "$RUNNER_TEMP/staged.apk" --contract "$RUNNER_TEMP/staged-contract.json" \
            --pin "$RUNNER_TEMP/staged-agent.json" --source "$TAG_TARGET" \
            --version "$REQUESTED_VERSION" --evidence "$STAGING"
          git merge-base --is-ancestor "$TAG_TARGET" origin/main || {
            echo "::error::The staged Android source is outside current main history" >&2
            exit 1
          }
          echo "Staged release identity verified: $APK_NAME tag=$TAG source=$TAG_TARGET sha256=$ACTUAL_APK_SHA"
          echo "versionName=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$expected" >> "$GITHUB_OUTPUT"
          echo "nativeBridgeVersion=$STAGED_BRIDGE" >> "$GITHUB_OUTPUT"
          echo "stagedSource=$TAG_TARGET" >> "$GITHUB_OUTPUT"
          echo "apkSha=$ACTUAL_APK_SHA" >> "$GITHUB_OUTPUT"

      - name: Preflight publication state and cutover guards (idempotent)
        id: pubpreflight
        shell: bash
        run: |
          set -euo pipefail
          . scripts/android-release/check-release-guards.sh
          # 候选身份全部来自 staged 步骤（= 显式版本的 tag target），没有一项来自当前 main 的版本。
          VERSION_CODE="${{ steps.staged.outputs.versionCode }}"
          VERSION_NAME="${{ steps.staged.outputs.versionName }}"
          APK_NAME="${{ steps.stagedref.outputs.apkName }}"
          BRIDGE_VERSION="${{ steps.staged.outputs.nativeBridgeVersion }}"
          # version.json 的 sourceSha 记录的是 **APK 的 source**（= staged release source），
          # 不是当前 main HEAD：两者在真机验证期间完全可能不同，而 immutable 的只有前者。
          SOURCE_SHA="${{ steps.staged.outputs.stagedSource }}"
          PROD_JSON="$RUNNER_TEMP/prod-version.json"
          URL="https://wotbtools.com/download/android/version.json"
          CODE="$(curl -s -o "$PROD_JSON" -w '%{http_code}' "$URL")"
          PROD_BRIDGE=""
          case "$CODE" in
            404)
              echo "No published Android manifest yet."
              PROD_STATE="prod_absent"
              ;;
            200)
              PROD_BRIDGE="$(jq -r '.nativeBridgeVersion // empty' "$PROD_JSON" 2>/dev/null || true)"
              classify_prod "$PROD_JSON" "$VERSION_CODE" "$VERSION_NAME" "$APK_NAME" \
                "$ANDROID_MIN_SUPPORTED_VERSION_CODE" "$BRIDGE_VERSION" "$SOURCE_SHA"
              ;;
            *)
              echo "::error::Unexpected HTTP $CODE fetching production version.json" >&2
              exit 1
              ;;
          esac

          # 强制更新门槛：只有真的覆盖了 breaking bridge cutover 才允许广播 manifest。
          guard_min_supported "$ANDROID_MIN_SUPPORTED_VERSION_CODE" "$VERSION_CODE"
          guard_local_first_cutover "$ANDROID_MIN_SUPPORTED_VERSION_CODE" "$VERSION_CODE"
          FE_VERSIONS="$(python3 - <<'PY'
          import re
          text = open('frontend/src/platform/nativeBridgeContract.js', encoding='utf-8').read()
          match = re.search(r'SUPPORTED_NATIVE_BRIDGE_VERSIONS\s*=\s*Object\.freeze\(\[([^\]]*)\]\)', text)
          print(','.join(re.findall(r'\b[0-9]+\b', match.group(1))) if match else '')
          PY
          )"
          guard_bridge_covered "$PROD_BRIDGE" "$BRIDGE_VERSION" "$FE_VERSIONS" \
            "$ANDROID_MIN_SUPPORTED_VERSION_CODE" "$VERSION_CODE"
          echo "minSupported=$ANDROID_MIN_SUPPORTED_VERSION_CODE prodBridge=${PROD_BRIDGE:-none} frontendBridges=${FE_VERSIONS:-none}"

          case "$PROD_STATE" in
            prod_absent|prod_older)
              echo "publishAction=publish" >> "$GITHUB_OUTPUT"
              ;;
            prod_equal_ok)
              # 同一版本的 manifest 已经发布且元数据一致：验证过 immutable APK 后安全 no-op。
              PUBLISHED_SHA="$(jq -r '.sha256' "$PROD_JSON")"
              if [ "$PUBLISHED_SHA" != "${{ steps.staged.outputs.apkSha }}" ]; then
                echo "::error::Published manifest sha256=$PUBLISHED_SHA does not match the staged APK; refusing." >&2
                exit 1
              fi
              echo "This version is already published with identical metadata and APK SHA; no-op success."
              echo "publishAction=already-published" >> "$GITHUB_OUTPUT"
              ;;
            prod_equal_conflict)
              echo "::error::Production version.json for the same versionCode does not match release metadata." >&2
              exit 1
              ;;
            prod_newer)
              echo "::error::Android release rollback rejected: production latestVersionCode is newer than this version." >&2
              exit 1
              ;;
            *)
              echo "::error::Unclassified production state: $PROD_STATE" >&2
              exit 1
              ;;
          esac

      - name: Verify the wotbtools-android runtime client (readiness, rerun)
        if: steps.pubpreflight.outputs.publishAction == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          # version.json 是发布的 commit point：一旦它指向 2.x，旧客户端就会被强制更新到一个新
          # 客户端。因此广播之前必须证明 Keycloak 侧的 wotbtools-android 已经可用。
          # 探测是只读 GET：客户端存在且 redirect URI 已注册时 Keycloak 返回 200 登录页；
          # 客户端不存在返回 Client not found，redirect 未注册返回 Invalid parameter:
          # redirect_uri，因此断言「200 且不含错误页标记」同时覆盖这两条契约。
          AUTH_ENDPOINT="https://auth.wotbtools.com/realms/wotbtools/protocol/openid-connect/auth"
          STATE="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          NONCE="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          CHALLENGE="$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=' | cut -c1-43)"
          PROBE_URL="$AUTH_ENDPOINT?client_id=wotbtools-android&response_type=code&scope=openid"
          PROBE_URL="$PROBE_URL&redirect_uri=com.wotbtools.app%3A%2Foauth2redirect"
          PROBE_URL="$PROBE_URL&code_challenge=$CHALLENGE&code_challenge_method=S256"
          PROBE_URL="$PROBE_URL&state=$STATE&nonce=$NONCE"
          attempts=8
          for attempt in $(seq 1 "$attempts"); do
            code="$(curl -sS -o "$RUNNER_TEMP/android-client-probe.html" -w '%{http_code}' \
              --connect-timeout 5 --max-time 15 "$PROBE_URL" || true)"
            if [ "$code" = "200" ] && ! grep -qiE 'Client not found|Invalid parameter: redirect_uri|invalid_client|We are sorry' \
              "$RUNNER_TEMP/android-client-probe.html"; then
              echo "wotbtools-android runtime client verified (attempt $attempt)."
              exit 0
            fi
            echo "wotbtools-android not usable yet (attempt $attempt/$attempts, http=$code)."
            sleep 15
          done
          echo "::error::wotbtools-android is not a usable Keycloak client (client missing or its redirect URI is not registered). Refusing to publish version.json: the mandatory update must not point clients at an auth path that is not live." >&2
          exit 1

      - name: Verify production API and asset exact-origin CORS readiness
        if: steps.pubpreflight.outputs.publishAction == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/staging.json"
          ORIGIN="$(jq -r '.runtimeOrigin' "$STAGING")"
          API="$(jq -r '.apiOrigin' "$STAGING")"
          ASSETS="$(jq -r '.assetOrigin' "$STAGING")"
          # Stable authenticated profile route; OPTIONS never needs a token.
          STATUS="$(curl -sS --connect-timeout 5 --max-time 20 -o /dev/null \
            -D "$RUNNER_TEMP/api-preflight.headers" -w '%{http_code}' -X OPTIONS \
            -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,content-type,content-encoding,accept' \
            "$API/api/users/profile")"
          python3 scripts/android-release/android_contract.py cors \
            --headers "$RUNNER_TEMP/api-preflight.headers" --status "$STATUS" --origin "$ORIGIN" \
            --methods GET,POST,PUT,PATCH,DELETE,OPTIONS --request-headers authorization,content-type,content-encoding,accept
          # An unauthenticated read must reach the real protected backend (401),
          # not merely a gateway-generated OPTIONS response while the backend is down.
          STATUS="$(curl -sS --connect-timeout 5 --max-time 20 -o /dev/null \
            -D "$RUNNER_TEMP/api-read.headers" -w '%{http_code}' -H "Origin: $ORIGIN" "$API/api/users/profile")"
          python3 scripts/android-release/android_contract.py cors \
            --headers "$RUNNER_TEMP/api-read.headers" --status "$STATUS" --expected-status 401 --origin "$ORIGIN"
          # The reviewed fixed-upstream gateway is a real Android 3D dependency.
          STATUS="$(curl -sS --connect-timeout 5 --max-time 20 -o "$RUNNER_TEMP/asset-index.json" \
            -D "$RUNNER_TEMP/asset.headers" -w '%{http_code}' -H "Origin: $ORIGIN" "$ASSETS/index.json")"
          python3 scripts/android-release/android_contract.py cors \
            --headers "$RUNNER_TEMP/asset.headers" --status "$STATUS" --origin "$ORIGIN"
          jq -e 'type == "object"' "$RUNNER_TEMP/asset-index.json" >/dev/null

      - name: Write version.json (commit point, LAST)
        if: steps.pubpreflight.outputs.publishAction == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          printf '{\n  "schemaVersion": 1,\n  "latestVersionCode": %s,\n  "latestVersionName": "%s",\n  "minSupportedVersionCode": %s,\n  "nativeBridgeVersion": %s,\n  "sourceSha": "%s",\n  "apkUrl": "https://wotbtools.com/download/android/%s",\n  "sha256": "%s",\n  "publishedAt": "%s",\n  "releaseNotes": ""\n}\n' \
            "${{ steps.staged.outputs.versionCode }}" \
            "${{ steps.staged.outputs.versionName }}" \
            "$ANDROID_MIN_SUPPORTED_VERSION_CODE" \
            "${{ steps.staged.outputs.nativeBridgeVersion }}" \
            "${{ steps.staged.outputs.stagedSource }}" \
            "${{ steps.stagedref.outputs.apkName }}" \
            "${{ steps.staged.outputs.apkSha }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "release-staging/version.json"
          cat "release-staging/version.json"

      - name: Upload version.json to TX (LAST)
        if: steps.pubpreflight.outputs.publishAction == 'publish'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: release-staging/version.json
          target: /opt/wotb-tx/android-release
          strip_components: 1

      - name: Verify production version.json matches the staged artifact
        if: steps.pubpreflight.outputs.publishAction == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          URL="https://wotbtools.com/download/android/version.json"
          TMP_JSON="$RUNNER_TEMP/prod-version-verify.json"
          curl -fsSL -H 'Cache-Control: no-cache' -o "$TMP_JSON" "$URL?cb=$(date +%s%N)"
          jq -e --argjson code "${{ steps.staged.outputs.versionCode }}" \
                --arg name "${{ steps.staged.outputs.versionName }}" \
                --argjson min "$ANDROID_MIN_SUPPORTED_VERSION_CODE" \
                --arg url "https://wotbtools.com/download/android/${{ steps.stagedref.outputs.apkName }}" \
                --arg sha "${{ steps.staged.outputs.apkSha }}" \
                --argjson bridge "${{ steps.staged.outputs.nativeBridgeVersion }}" \
                --arg source "${{ steps.staged.outputs.stagedSource }}" \
            '.schemaVersion == 1 and .latestVersionCode == $code and .latestVersionName == $name
             and .minSupportedVersionCode == $min and .nativeBridgeVersion == $bridge
             and .sourceSha == $source and .apkUrl == $url and .sha256 == $sha' "$TMP_JSON" \
            || { echo "::error::Production version.json content does not match the staged artifact" >&2; exit 1; }
          echo "Production version.json verified; mandatory update to ${{ steps.staged.outputs.versionName }} is live."

      - name: Write publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Android Release (publish) ${{ steps.staged.outputs.versionName || inputs.version }}"
            echo ""
            echo "Status: ${{ job.status }}"
            echo "Publish Action: ${{ steps.pubpreflight.outputs.publishAction || 'n/a' }}"
            echo ""
            echo "Requested Version: ${{ inputs.version }}"
            echo "Version Code: ${{ steps.staged.outputs.versionCode }}"
            echo "Native Bridge: ${{ steps.staged.outputs.nativeBridgeVersion }}"
            echo "Staged APK SHA-256: ${{ steps.staged.outputs.apkSha }}"
            echo "minSupportedVersionCode: $ANDROID_MIN_SUPPORTED_VERSION_CODE"
            echo "Tag: ${{ steps.stagedref.outputs.tagName }}"
            echo "Staged Source Commit: ${{ steps.staged.outputs.stagedSource }}"
          } >> "$GITHUB_STEP_SUMMARY"
