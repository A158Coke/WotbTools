name: PR589 review hotfix

on:
  push:
    branches:
      - feat/tread-slot-model
    paths:
      - .github/workflows/pr589-review-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tread-slot-model
          fetch-depth: 0

      - name: Apply ownership fix and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          scene_path = Path('frontend/src/scene/playbackScene.js')
          scene = scene_path.read_text()
          old = """      } else {
                hideQuads(col0);
              }
            }
            geo.setDrawRange(0, TRAIL_SLOTS * 6);"""
          new = """      } else if (openActive || st.total < TRAIL_CAP_PER_SIDE) {
                // ownership 三态：active 已激活但几何无效，或环未满且无 active 时，这个 write 槽
                // 不属于历史 committed，必须隐藏；环已满 + open==null 时 write 槽仍由最老
                // committed 占有，不能在这里清零（review 七轮 P2）。
                hideQuads(col0);
              }
            }
            geo.setDrawRange(0, TRAIL_SLOTS * 6);"""
          if scene.count(old) != 1:
              raise SystemExit(f'playbackScene target count={scene.count(old)}, expected 1')
          scene_path.write_text(scene.replace(old, new, 1))

          test_path = Path('frontend/src/scene/playbackScene.test.js')
          tests = test_path.read_text()
          start_marker = "    it('环满边界：ownership 切换点 = 激活而非提交完成（review 五轮 P2 复现）'"
          end_marker = "    it('alpha 量化门控：时钟不变的重复 tick 不再标脏重传（review P3 2026-10-11）'"
          start = tests.find(start_marker)
          end = tests.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'test block markers not found: start={start}, end={end}')
          replacement = """    it('环满边界：open 未激活时 write 槽继续显示最老 committed（review 七轮 P2）', async () => {
              // 12 m/s：0.1 s 网格片走 1.2 m（子步 0.6 m），每片落 1 戳；5.0 s 恰好 50 戳。
              // 此时最老戳 age≈4.9 s < 5.45 s，alpha 必须仍为满值——避免旧测试在 5 m/s 下
              // oldest 已 >7.62 s、正确自然淡出和错误 hideQuads 都等于 0 的假绿。
              const n = 580
              const pos = new Array(n * 3)
              for (let i = 0; i < n; i++) {
                pos[i * 3] = i * 1.2
                pos[i * 3 + 1] = 0
                pos[i * 3 + 2] = 0
              }
              const { api, v } = await setupTrail({ n, pos, yaw: Math.PI / 2 })
              const alphaAt = (slot) => v.treadMesh.geometry.getAttribute('color').array[slot * 32 + 3]
              const freshAlpha = () => Math.fround(v.tread.texScale || 1)

              // 第 50 次提交后：ring 满、下一 active 尚未激活，slot0 仍属于最老 committed。
              api.seekTime(42 + 5.0)
              expect(v.trail.L.total).toBe(50)
              expect(v.trail.L.open).toBeNull()
              expect(alphaAt(0)).toBe(freshAlpha())

              // 不足完整 0.1 s 网格片：状态不推进，ownership 也不能提前切走。
              api.seekTime(42 + 5.05)
              expect(v.trail.L.total).toBe(50)
              expect(v.trail.L.open).toBeNull()
              expect(alphaAt(0)).toBe(freshAlpha())

              // 下一完整网格片内 active 先激活、随后第 51 次落锚；落锚后 write=slot1、open=null。
              // slot1 此时是新的最老 committed，必须继续显示；旧实现的尾部 else hideQuads
              // 会把它清成 0，正好由这一断言抓住。
              api.seekTime(42 + 5.1)
              expect(v.trail.L.total).toBe(51)
              expect(v.trail.L.open).toBeNull()
              expect(alphaAt(1)).toBe(freshAlpha())
            })

"""
          test_path.write_text(tests[:start] + replacement + tests[end:])
          PY

      - name: Run focused frontend tests
        working-directory: frontend
        run: |
          npm ci
          npx vitest run src/scene/playbackScene.test.js src/scene/treadMarks.test.js

      - name: Commit hotfix and remove helper workflow
        run: |
          rm .github/workflows/pr589-review-hotfix.yml
          git config user.name "chatgpt-review"
          git config user.email "noreply@openai.com"
          git add frontend/src/scene/playbackScene.js frontend/src/scene/playbackScene.test.js .github/workflows/pr589-review-hotfix.yml
          git commit -m "fix(playback): preserve committed tread ownership before activation"
          git push origin HEAD:feat/tread-slot-model
