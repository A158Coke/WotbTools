name: PR589 review hotfix

on:
  push:
    branches:
      - feat/tread-slot-model
    paths:
      - .github/workflows/pr589-review-hotfix.yml
      - scripts/pr589_review_hotfix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/tread-slot-model
          fetch-depth: 0

      - name: Apply review hotfix
        run: python3 scripts/pr589_review_hotfix.py

      - name: Run focused frontend tests
        working-directory: frontend
        run: |
          npm ci
          npx vitest run src/scene/playbackScene.test.js src/scene/treadMarks.test.js

      - name: Commit hotfix
        run: |
          rm .github/workflows/pr589-review-hotfix.yml scripts/pr589_review_hotfix.py
          git config user.name "chatgpt-review"
          git config user.email "noreply@openai.com"
          git add frontend/src/scene/playbackScene.js frontend/src/scene/playbackScene.test.js .github/workflows/pr589-review-hotfix.yml scripts/pr589_review_hotfix.py
          git commit -m "fix(playback): preserve committed tread ownership before activation"
          git push origin HEAD:feat/tread-slot-model
