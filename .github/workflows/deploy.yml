name: Deploy
# 生产 Grafana MCP 已下线（2026-08-11）：不再传递 GRAFANA_MCP_TOKEN。
run-name: Deploy ${{ github.event_name == 'workflow_dispatch' && format('manual {0} {1}', inputs.target, github.run_number) || github.event.workflow_run.head_sha }} by @${{ github.actor }}

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
  workflow_dispatch:
    inputs:
      target:
        description: Explicit production deployment target
        required: true
        default: tx
        type: choice
        options:
          - tx
          - minio
          - parser-worker
      tx_services:
        description: TX service (used only when target=tx)
        required: true
        default: business-api
        type: choice
        options:
          - business-api
          - rabbitmq
          - business-postgres
          - keycloak
          - keycloak-postgres
          - wotb-frontend
          - caddy
          - all

permissions:
  contents: read

concurrency:
  # Serialize every production Compose/OpenTofu mutation, including MinIO.
  group: production-maintenance
  cancel-in-progress: false

jobs:
  changes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha: ${{ steps.manifest.outputs.release_sha }}
      release_tag: ${{ steps.manifest.outputs.release_tag }}
      build_run_number: ${{ steps.manifest.outputs.build_run_number }}
      backend_migration_max_version: ${{ steps.manifest.outputs.backend_migration_max_version }}
      deploy_services: ${{ steps.manifest.outputs.deploy_services }}
      image_services: ${{ steps.manifest.outputs.image_services }}
      yecao_services: ${{ steps.manifest.outputs.yecao_services }}
      tx_services: ${{ steps.manifest.outputs.tx_services }}
      yecao_image_services: ${{ steps.manifest.outputs.yecao_image_services }}
      tx_image_services: ${{ steps.manifest.outputs.tx_image_services }}
      deploy_display_name: ${{ steps.manifest.outputs.deploy_display_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}
      - name: Download triggering Build manifest
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v5
        with:
          name: deployment-manifest
          path: release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate deployment manifest
        id: manifest
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_TARGET: ${{ inputs.target }}
          TX_SERVICES_INPUT: ${{ inputs.tx_services }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "${GITHUB_REF:-}" != refs/heads/main ]; then
              echo "::error::Manual TX deploy must be dispatched from the main branch." >&2
              exit 1
            fi
            git fetch origin main --depth=1
            source_sha="$(git rev-parse HEAD)"
            main_sha="$(git rev-parse origin/main)"
            if [ "$source_sha" != "$main_sha" ]; then
              echo "::error::Manual TX deploy must run from the current main HEAD." >&2
              exit 1
            fi
            if [ "$MANUAL_TARGET" = minio ] || [ "$MANUAL_TARGET" = parser-worker ]; then
              metadata="$(python3 deploy/release_plan.py manual \
                --service "$MANUAL_TARGET" \
                --commit-sha "$main_sha" \
                --build-run-id "$GITHUB_RUN_ID" \
                --build-run-number "$GITHUB_RUN_NUMBER")"
              python3 - "$metadata" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          manifest = json.loads(sys.argv[1])
          targets = manifest["targetServices"]
          images = set(manifest["imageServices"])
          service = manifest["deployServices"][0]
          label = "MinIO" if service == "minio" else "Parser Worker"
          print(f"release_sha={manifest['commitSha']}")
          print(f"release_tag={manifest['imageTag']}")
          print(f"build_run_number={manifest['buildRunNumber']}")
          print("backend_migration_max_version=")
          print(f"deploy_services={','.join(manifest['deployServices'])}")
          print(f"image_services={','.join(manifest['imageServices'])}")
          print(f"yecao_services={','.join(targets.get('yecao', []))}")
          print(f"tx_services={','.join(targets.get('tx', []))}")
          print(f"yecao_image_services={','.join(s for s in targets.get('yecao', []) if s in images)}")
          print(f"tx_image_services={','.join(s for s in targets.get('tx', []) if s in images)}")
          print(f"deploy_display_name=Manual {label}")
          PY
              exit 0
            fi
            python3 - "$MANUAL_TARGET" "$TX_SERVICES_INPUT" "$main_sha" "$GITHUB_RUN_NUMBER" <<'PY' >> "$GITHUB_OUTPUT"
          import sys

          target = sys.argv[1]
          commit_sha = sys.argv[3]
          run_number = sys.argv[4]
          if target != "tx":
              raise SystemExit("target must be tx, minio, or parser-worker")
          # The manual selector is a dropdown, but a workflow_dispatch payload can still
          # carry an arbitrary string, so the selection stays explicitly validated here.
          TX_SERVICES = (
              "keycloak-postgres",
              "business-postgres",
              "rabbitmq",
              "keycloak",
              "wotb-frontend",
              "business-api",
          )
          # ``all`` is the one-keystroke "whole TX runtime" selector. It expands to the same
          # service set deploy/tx/deploy.sh already owns for its own ``all`` selection; the
          # literal value never reaches WOTB_DEPLOY_SERVICES. Caddy stays an explicit-only
          # selector: it is refreshed by the selected proxied services, and adding it here
          # would newly require Caddy credentials for a whole-runtime deploy.
          if sys.argv[2] == "all":
              requested = list(TX_SERVICES)
          elif sys.argv[2] in (*TX_SERVICES, "caddy"):
              requested = [sys.argv[2]]
          else:
              raise SystemExit("tx_services must be one of: all, caddy, " + ", ".join(TX_SERVICES))
          print(f"release_sha={commit_sha}")
          print(f"release_tag=sha-{commit_sha[:12]}")
          print(f"build_run_number={run_number}")
          print("backend_migration_max_version=")
          print(f"deploy_services={','.join(requested)}")
          image_services = [service for service in requested if service in {"keycloak", "wotb-frontend", "business-api"}]
          print(f"image_services={','.join(image_services)}")
          print("yecao_services=")
          print(f"tx_services={','.join(requested)}")
          print("yecao_image_services=")
          print(f"tx_image_services={','.join(image_services)}")
          print("deploy_display_name=Manual TX")
          PY
            exit 0
          fi
          manifest_path=release-artifact/deployment-manifest.json
          [ -f "$manifest_path" ] || {
            echo "deployment manifest artifact is missing" >&2
            exit 1
          }
          metadata="$(python3 deploy/release_plan.py validate \
            --manifest "$manifest_path" --expected-sha "$EXPECTED_SHA")"
          python3 - "$metadata" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          manifest = json.loads(sys.argv[1])
          print(f"release_sha={manifest['commitSha']}")
          print(f"release_tag={manifest['imageTag']}")
          print(f"build_run_number={manifest['buildRunNumber']}")
          print(f"backend_migration_max_version={manifest['backendMigrationMaxVersion']}")
          print(f"deploy_services={','.join(manifest['deployServices'])}")
          print(f"image_services={','.join(manifest['imageServices'])}")
          targets = manifest["targetServices"]
          print(f"yecao_services={','.join(targets.get('yecao', []))}")
          print(f"tx_services={','.join(targets.get('tx', []))}")
          images = set(manifest["imageServices"])
          print(f"yecao_image_services={','.join(s for s in targets.get('yecao', []) if s in images)}")
          print(f"tx_image_services={','.join(s for s in targets.get('tx', []) if s in images)}")
          labels = []
          if "all" in manifest["deployServices"]:
              labels.append("All")
          else:
              if "wotb-backend" in manifest["deployServices"]:
                  labels.append("Backend")
              if "business-api" in manifest["deployServices"]:
                  labels.append("Business API")
              if "wotb-frontend" in manifest["deployServices"]:
                  labels.append("Frontend")
              if "keycloak" in manifest["deployServices"]:
                  labels.append("Keycloak")
              if "parser-worker" in manifest["deployServices"]:
                  labels.append("Parser Worker")
              if any(service in {"postgres", "node-exporter", "prometheus", "loki", "alloy", "grafana"}
                     for service in manifest["deployServices"]):
                  labels.append("Observability")
          print(f"deploy_display_name={' + '.join(labels) or 'No-op'}")
          PY

  image_existence:
    needs: [changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.image_services != ''
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: needs.changes.outputs.tx_image_services != ''
        with:
          registry: ${{ vars.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Verify required application images exist
        env:
          IMAGE_SERVICES: ${{ needs.changes.outputs.image_services }}
          TX_IMAGE_SERVICES: ${{ needs.changes.outputs.tx_image_services }}
          RELEASE_TAG: ${{ needs.changes.outputs.release_tag }}
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail
          tcr_image_prefix="$TCR_REGISTRY/$TCR_NAMESPACE"
          contains_tx_image_service() {
            local wanted="$1" service
            IFS=',' read -r -a services <<< "$TX_IMAGE_SERVICES"
            for service in "${services[@]}"; do
              [ "$service" = "$wanted" ] && return 0
            done
            return 1
          }
          IFS=',' read -r -a services <<< "$IMAGE_SERVICES"
          for service in "${services[@]}"; do
            case "$service" in
              wotb-backend) image=ghcr.io/a158coke/wotbtools-backend ;;
              business-api) image_name=wotbtools-backend ;;
              wotb-frontend) image_name=wotbtools-frontend ;;
              keycloak) image_name=wotbtools-keycloak ;;
              minio) image=ghcr.io/a158coke/wotbtools-minio; remediation="MinIO immutable image for current main does not exist. Run Build workflow manually with service=minio first, then deploy the resulting release." ;;
              parser-worker) image=ghcr.io/a158coke/wotbtools-parser-worker; remediation="Parser Worker immutable image for current main does not exist. Run Build workflow manually with service=parser-worker first, then deploy the resulting release." ;;
              *) echo "unsupported image service: $service" >&2; exit 1 ;;
            esac
            if [ -n "${image_name:-}" ]; then
              if contains_tx_image_service "$service"; then
                image="$tcr_image_prefix/$image_name"
              else
                image="ghcr.io/a158coke/$image_name"
              fi
              unset image_name
            fi
            if [ "$service" != minio ] && [ "$service" != parser-worker ]; then
              remediation="Required immutable deploy image does not exist for $service: $image:$RELEASE_TAG"
            fi
            docker manifest inspect "$image:$RELEASE_TAG" >/dev/null || {
              echo "::error::$remediation" >&2
              exit 1
            }
          done

  deploy:
    needs: [changes, image_existence]
    if: >-
      always() &&
       needs.changes.result == 'success' &&
       needs.changes.outputs.yecao_services != 'minio' &&
       (needs.image_existence.result == 'success' ||
       (needs.changes.outputs.image_services == '' && needs.image_existence.result == 'skipped'))
    name: Deploy ${{ needs.changes.outputs.deploy_display_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: No-op release
        if: needs.changes.outputs.deploy_services == ''
        run: echo "No deployable runtime changes in ${{ needs.changes.outputs.release_sha }}"
      - uses: actions/checkout@v5
        if: needs.changes.outputs.yecao_services != ''
        with:
          ref: ${{ needs.changes.outputs.release_sha }}
      - name: Prepare deployment directory
        if: needs.changes.outputs.yecao_services != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            WOTB_DIR=/opt/wotb
            mkdir -p "$WOTB_DIR"
            rm -rf -- "$WOTB_DIR/deploy.incoming"
            mkdir -p "$WOTB_DIR/deploy.incoming"
      - name: Install deployment scripts
        if: needs.changes.outputs.yecao_services != ''
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy
          target: /opt/wotb/deploy.incoming
          overwrite: true
      - name: Deploy exact release services via SSH
        if: needs.changes.outputs.yecao_services != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 35m
          envs: TAG,RELEASE_SHA,RELEASE_RUN_NUMBER,WOTB_BACKEND_MIGRATION_MAX_VERSION,WOTB_DEPLOY_SERVICES,WOTB_DEPLOY_IMAGE_SERVICES,DB_PASSWORD,KC_ADMIN_PASSWORD,WG_APPLICATION_ID,KEYCLOAK_ADMIN_CLIENT_SECRET,AI_API_KEY,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD,BOOST_AUTO_CONFIRM_HOURS,BOOST_AUTO_CONFIRM_SCAN_MS,AI_BASE_URL,AI_MODEL,AI_CONNECT_TIMEOUT_SEC,AI_TIMEOUT_SEC,AI_CALL_TIMEOUT_SEC,AI_RETRY_MAX_ATTEMPTS,AI_RETRY_INITIAL_BACKOFF_MS,AI_RETRY_MAX_BACKOFF_MS,AI_RETRY_BACKOFF_MULTIPLIER,AI_CONTEXT_WINDOW_TOKENS,AI_SINGLE_REPLAY_MAX_INPUT_TOKENS,AI_MAX_OUTPUT_TOKENS,AI_PROMPT_SAFETY_MARGIN_TOKENS,AI_THINKING_ENABLED,AI_THINKING_ENABLED_CALL2,AI_REASONING_EFFORT,AI_REVIEW_WORKER_MAX_CONCURRENT,AI_REVIEW_WORKER_QUEUE_CAPACITY,AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC,REPLAY_COORDINATE_HALF_EXTENT,REPLAY_COORDINATE_CLAMP_TOLERANCE,GRAFANA_ROOT_URL,OBSERVABILITY_ENVIRONMENT,TX_RABBITMQ_PARSER_WORKER_PASSWORD,YECAO_MINIO_WORKER_ACCESS_KEY,YECAO_MINIO_WORKER_SECRET_KEY
          script: bash /opt/wotb/deploy.incoming/deploy/deploy.sh
        env:
          TAG: ${{ needs.changes.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          RELEASE_RUN_NUMBER: ${{ needs.changes.outputs.build_run_number }}
          WOTB_BACKEND_MIGRATION_MAX_VERSION: ${{ needs.changes.outputs.backend_migration_max_version }}
          WOTB_DEPLOY_SERVICES: ${{ needs.changes.outputs.yecao_services }}
          WOTB_DEPLOY_IMAGE_SERVICES: ${{ needs.changes.outputs.yecao_image_services }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          BOOST_AUTO_CONFIRM_HOURS: ${{ vars.BOOST_AUTO_CONFIRM_HOURS || '72' }}
          BOOST_AUTO_CONFIRM_SCAN_MS: ${{ vars.BOOST_AUTO_CONFIRM_SCAN_MS || '300000' }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-v4-flash' }}
          AI_CONNECT_TIMEOUT_SEC: ${{ vars.AI_CONNECT_TIMEOUT_SEC || '10' }}
          AI_TIMEOUT_SEC: ${{ vars.AI_TIMEOUT_SEC || '300' }}
          AI_CALL_TIMEOUT_SEC: ${{ vars.AI_CALL_TIMEOUT_SEC || '315' }}
          AI_RETRY_MAX_ATTEMPTS: ${{ vars.AI_RETRY_MAX_ATTEMPTS || '3' }}
          AI_RETRY_INITIAL_BACKOFF_MS: ${{ vars.AI_RETRY_INITIAL_BACKOFF_MS || '1000' }}
          AI_RETRY_MAX_BACKOFF_MS: ${{ vars.AI_RETRY_MAX_BACKOFF_MS || '8000' }}
          AI_RETRY_BACKOFF_MULTIPLIER: ${{ vars.AI_RETRY_BACKOFF_MULTIPLIER || '2.0' }}
          AI_CONTEXT_WINDOW_TOKENS: ${{ vars.AI_CONTEXT_WINDOW_TOKENS || '1000000' }}
          AI_SINGLE_REPLAY_MAX_INPUT_TOKENS: ${{ vars.AI_SINGLE_REPLAY_MAX_INPUT_TOKENS || '940000' }}
          AI_MAX_OUTPUT_TOKENS: ${{ vars.AI_MAX_OUTPUT_TOKENS || '32768' }}
          AI_PROMPT_SAFETY_MARGIN_TOKENS: ${{ vars.AI_PROMPT_SAFETY_MARGIN_TOKENS || '16384' }}
          AI_THINKING_ENABLED: ${{ vars.AI_THINKING_ENABLED || 'true' }}
          AI_THINKING_ENABLED_CALL2: ${{ vars.AI_THINKING_ENABLED_CALL2 || 'false' }}
          AI_REASONING_EFFORT: ${{ vars.AI_REASONING_EFFORT || 'max' }}
          AI_REVIEW_WORKER_MAX_CONCURRENT: ${{ vars.AI_REVIEW_WORKER_MAX_CONCURRENT || '4' }}
          AI_REVIEW_WORKER_QUEUE_CAPACITY: ${{ vars.AI_REVIEW_WORKER_QUEUE_CAPACITY || '4' }}
          AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC: '1100'
          REPLAY_COORDINATE_HALF_EXTENT: ${{ vars.REPLAY_COORDINATE_HALF_EXTENT || '250' }}
          REPLAY_COORDINATE_CLAMP_TOLERANCE: ${{ vars.REPLAY_COORDINATE_CLAMP_TOLERANCE || '12.5' }}
          GRAFANA_ROOT_URL: ${{ vars.GRAFANA_ROOT_URL || 'https://monitor.wotbtools.com' }}
          OBSERVABILITY_ENVIRONMENT: ${{ vars.OBSERVABILITY_ENVIRONMENT || 'production' }}
          TX_RABBITMQ_PARSER_WORKER_PASSWORD: ${{ secrets.TX_RABBITMQ_PARSER_WORKER_PASSWORD }}
          YECAO_MINIO_WORKER_ACCESS_KEY: ${{ secrets.YECAO_MINIO_WORKER_ACCESS_KEY }}
          YECAO_MINIO_WORKER_SECRET_KEY: ${{ secrets.YECAO_MINIO_WORKER_SECRET_KEY }}

  deploy_minio:
    needs: [changes, image_existence]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.yecao_services == 'minio' &&
      needs.image_existence.result == 'success'
    name: Deploy MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.release_sha }}
      - name: Prepare explicit MinIO deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            root="/opt/wotb/minio.incoming/${{ needs.changes.outputs.release_sha }}"
            rm -rf -- "$root"
            mkdir -p "$root"
      - name: Install explicit MinIO deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.minio.yml,deploy/minio-deploy.sh,deploy/minio,infra/tofu/minio
          target: /opt/wotb/minio.incoming/${{ needs.changes.outputs.release_sha }}
          overwrite: true
      - name: Deploy and provision MinIO via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 35m
          envs: TAG,RELEASE_SHA,RELEASE_RUN_NUMBER,YECAO_MINIO_ROOT_USER,YECAO_MINIO_ROOT_PASSWORD,YECAO_MINIO_WORKER_ACCESS_KEY,YECAO_MINIO_WORKER_SECRET_KEY,YECAO_MINIO_CONTROL_API_ACCESS_KEY,YECAO_MINIO_CONTROL_API_SECRET_KEY
          script: bash /opt/wotb/minio.incoming/${{ needs.changes.outputs.release_sha }}/deploy/minio-deploy.sh /opt/wotb/minio.incoming/${{ needs.changes.outputs.release_sha }}
        env:
          TAG: ${{ needs.changes.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          RELEASE_RUN_NUMBER: ${{ needs.changes.outputs.build_run_number }}
          YECAO_MINIO_ROOT_USER: ${{ secrets.YECAO_MINIO_ROOT_USER }}
          YECAO_MINIO_ROOT_PASSWORD: ${{ secrets.YECAO_MINIO_ROOT_PASSWORD }}
          YECAO_MINIO_WORKER_ACCESS_KEY: ${{ secrets.YECAO_MINIO_WORKER_ACCESS_KEY }}
          YECAO_MINIO_WORKER_SECRET_KEY: ${{ secrets.YECAO_MINIO_WORKER_SECRET_KEY }}
          YECAO_MINIO_CONTROL_API_ACCESS_KEY: ${{ secrets.YECAO_MINIO_CONTROL_API_ACCESS_KEY }}
          YECAO_MINIO_CONTROL_API_SECRET_KEY: ${{ secrets.YECAO_MINIO_CONTROL_API_SECRET_KEY }}

  deploy_tx:
    needs: [changes, image_existence]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.tx_services != '' &&
      (needs.image_existence.result == 'success' ||
       (needs.changes.outputs.image_services == '' && needs.image_existence.result == 'skipped'))
    name: Deploy TX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tx-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.release_sha }}
      - name: Prepare TX deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          script: |
            set -eu
            WOTB_DIR=/opt/wotb-tx
            mkdir -p "$WOTB_DIR/deploy.incoming" "$WOTB_DIR/e2e"
            rm -rf -- "$WOTB_DIR/deploy.incoming/deploy/tx"
      - name: Install TX deployment configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tx
          target: /opt/wotb-tx/deploy.incoming
          overwrite: true
      # The cutover E2E gate uploads one staged replay through the
      # deployment-owned health-probe container; the fixtures are already
      # committed test samples and never contain production user data.
      - name: Install TX cutover E2E replay fixtures
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: common/fixtures/replays
          target: /opt/wotb-tx/e2e
          strip_components: 3
          overwrite: true
      - name: Bootstrap TX Keycloak PostgreSQL before OpenTofu
        if: contains(needs.changes.outputs.tx_services, 'keycloak-postgres')
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 15m
