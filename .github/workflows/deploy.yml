name: Deploy
# 生产 Grafana MCP 已下线（2026-08-11）：不再传递 GRAFANA_MCP_TOKEN。
run-name: Deploy ${{ inputs.service || github.event.workflow_run.head_sha || github.sha }} by @${{ github.actor }}

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
  workflow_dispatch:
    inputs:
      service:
        description: Application to deploy; All republishes Backend, Frontend and Keycloak
        required: true
        type: choice
        default: all
        options:
          - all
          - backend
          - frontend
          - keycloak

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  changes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha: ${{ steps.manifest.outputs.release_sha }}
      release_tag: ${{ steps.manifest.outputs.release_tag }}
      build_run_number: ${{ steps.manifest.outputs.build_run_number }}
      deploy_services: ${{ steps.manifest.outputs.deploy_services }}
      image_services: ${{ steps.manifest.outputs.image_services }}
      deploy_display_name: ${{ steps.manifest.outputs.deploy_display_name }}
      stale_release_guard: ${{ steps.manifest.outputs.stale_release_guard }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Download triggering Build manifest
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v5
        with:
          name: deployment-manifest
          path: release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate manual source is current main HEAD
        if: github.event_name == 'workflow_dispatch'
        id: manual_identity
        env:
          REQUESTED_SERVICE: ${{ inputs.service }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          source_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "$source_sha" != "$main_sha" ]; then
            echo "::error::Manual Deploy must run from the current main HEAD." >&2
            exit 1
          fi
          echo "release_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Validate deployment manifest
        id: manifest
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || steps.manual_identity.outputs.release_sha }}
          MANUAL_SERVICE: ${{ inputs.service || '' }}
          MANUAL_SHA: ${{ steps.manual_identity.outputs.release_sha || '' }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || 'manual' }}
          BUILD_RUN_NUMBER: ${{ github.event.workflow_run.run_number || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_run ]; then
            manifest_path=release-artifact/deployment-manifest.json
            [ -f "$manifest_path" ] || {
              echo "deployment manifest artifact is missing" >&2
              exit 1
            }
            metadata="$(python3 deploy/release_plan.py validate \
              --manifest "$manifest_path" --expected-sha "$EXPECTED_SHA")"
            stale_release_guard=1
          else
            python3 deploy/release_plan.py manual \
              --service "$MANUAL_SERVICE" \
              --commit-sha "$MANUAL_SHA" \
              --build-run-id "$BUILD_RUN_ID" \
              --build-run-number "$BUILD_RUN_NUMBER" > deployment-manifest.json
            metadata="$(python3 deploy/release_plan.py validate \
              --manifest deployment-manifest.json --expected-sha "$MANUAL_SHA" --allow-latest)"
            stale_release_guard=0
          fi
          python3 - "$metadata" "$stale_release_guard" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          manifest = json.loads(sys.argv[1])
          print(f"release_sha={manifest['commitSha']}")
          print(f"release_tag={manifest['imageTag']}")
          print(f"build_run_number={manifest['buildRunNumber']}")
          print(f"deploy_services={','.join(manifest['deployServices'])}")
          print(f"image_services={','.join(manifest['imageServices'])}")
          labels = []
          if "all" in manifest["deployServices"]:
              labels.append("All")
          else:
              if "wotb-backend" in manifest["deployServices"]:
                  labels.append("Backend")
              if "wotb-frontend" in manifest["deployServices"]:
                  labels.append("Frontend")
              if "keycloak" in manifest["deployServices"]:
                  labels.append("Keycloak")
              if any(service in {"postgres", "node-exporter", "prometheus", "loki", "alloy", "grafana"}
                     for service in manifest["deployServices"]):
                  labels.append("Observability")
          print(f"deploy_display_name={' + '.join(labels) or 'No-op'}")
          print(f"stale_release_guard={sys.argv[2]}")
          PY

  image_existence:
    needs: [changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.image_services != ''
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify required application images exist
        env:
          IMAGE_SERVICES: ${{ needs.changes.outputs.image_services }}
          RELEASE_TAG: ${{ needs.changes.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a services <<< "$IMAGE_SERVICES"
          for service in "${services[@]}"; do
            case "$service" in
              wotb-backend) image=ghcr.io/a158coke/wotbtools-backend ;;
              wotb-frontend) image=ghcr.io/a158coke/wotbtools-frontend ;;
              keycloak) image=ghcr.io/a158coke/wotbtools-keycloak ;;
              *) echo "unsupported image service: $service" >&2; exit 1 ;;
            esac
            if ! docker manifest inspect "$image:$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Required deploy image does not exist for $service: $image:$RELEASE_TAG" >&2
              echo "Build the corresponding application image first, then rerun Deploy." >&2
              exit 1
            fi
          done

  deploy:
    needs: [changes, image_existence]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.image_existence.result == 'success' ||
       (needs.changes.outputs.image_services == '' && needs.image_existence.result == 'skipped'))
    name: Deploy ${{ needs.changes.outputs.deploy_display_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: No-op release
        if: needs.changes.outputs.deploy_services == ''
        run: echo "No deployable runtime changes in ${{ needs.changes.outputs.release_sha }}"
      - uses: actions/checkout@v5
        if: needs.changes.outputs.deploy_services != ''
        with:
          ref: ${{ needs.changes.outputs.release_sha }}
      - name: Prepare deployment directory
        if: needs.changes.outputs.deploy_services != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            WOTB_DIR=/opt/wotb
            mkdir -p "$WOTB_DIR"
            rm -rf -- "$WOTB_DIR/deploy.incoming"
            mkdir -p "$WOTB_DIR/deploy.incoming"
      - name: Install deployment scripts
        if: needs.changes.outputs.deploy_services != ''
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy
          target: /opt/wotb/deploy.incoming
          overwrite: true
      - name: Deploy exact release services via SSH
        if: needs.changes.outputs.deploy_services != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 35m
          envs: TAG,RELEASE_SHA,RELEASE_RUN_NUMBER,WOTB_STALE_RELEASE_GUARD,WOTB_DEPLOY_SERVICES,WOTB_DEPLOY_IMAGE_SERVICES,DB_PASSWORD,KC_ADMIN_PASSWORD,WG_APPLICATION_ID,KEYCLOAK_ADMIN_CLIENT_SECRET,AI_API_KEY,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD,BOOST_AUTO_CONFIRM_HOURS,BOOST_AUTO_CONFIRM_SCAN_MS,AI_BASE_URL,AI_MODEL,AI_CONNECT_TIMEOUT_SEC,AI_TIMEOUT_SEC,AI_CALL_TIMEOUT_SEC,AI_RETRY_MAX_ATTEMPTS,AI_RETRY_INITIAL_BACKOFF_MS,AI_RETRY_MAX_BACKOFF_MS,AI_RETRY_BACKOFF_MULTIPLIER,AI_CONTEXT_WINDOW_TOKENS,AI_SINGLE_REPLAY_MAX_INPUT_TOKENS,AI_MAX_OUTPUT_TOKENS,AI_PROMPT_SAFETY_MARGIN_TOKENS,AI_THINKING_ENABLED,AI_THINKING_ENABLED_CALL2,AI_REASONING_EFFORT,AI_REVIEW_WORKER_MAX_CONCURRENT,AI_REVIEW_WORKER_QUEUE_CAPACITY,AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC,REPLAY_COORDINATE_HALF_EXTENT,REPLAY_COORDINATE_CLAMP_TOLERANCE,GRAFANA_ROOT_URL,OBSERVABILITY_ENVIRONMENT
          script: bash /opt/wotb/deploy.incoming/deploy/deploy.sh
        env:
          TAG: ${{ needs.changes.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          RELEASE_RUN_NUMBER: ${{ needs.changes.outputs.build_run_number }}
          WOTB_STALE_RELEASE_GUARD: ${{ needs.changes.outputs.stale_release_guard }}
          WOTB_DEPLOY_SERVICES: ${{ needs.changes.outputs.deploy_services }}
          WOTB_DEPLOY_IMAGE_SERVICES: ${{ needs.changes.outputs.image_services }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          BOOST_AUTO_CONFIRM_HOURS: ${{ vars.BOOST_AUTO_CONFIRM_HOURS || '72' }}
          BOOST_AUTO_CONFIRM_SCAN_MS: ${{ vars.BOOST_AUTO_CONFIRM_SCAN_MS || '300000' }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-v4-flash' }}
          AI_CONNECT_TIMEOUT_SEC: ${{ vars.AI_CONNECT_TIMEOUT_SEC || '10' }}
          AI_TIMEOUT_SEC: ${{ vars.AI_TIMEOUT_SEC || '300' }}
          AI_CALL_TIMEOUT_SEC: ${{ vars.AI_CALL_TIMEOUT_SEC || '315' }}
          AI_RETRY_MAX_ATTEMPTS: ${{ vars.AI_RETRY_MAX_ATTEMPTS || '3' }}
          AI_RETRY_INITIAL_BACKOFF_MS: ${{ vars.AI_RETRY_INITIAL_BACKOFF_MS || '1000' }}
          AI_RETRY_MAX_BACKOFF_MS: ${{ vars.AI_RETRY_MAX_BACKOFF_MS || '8000' }}
          AI_RETRY_BACKOFF_MULTIPLIER: ${{ vars.AI_RETRY_BACKOFF_MULTIPLIER || '2.0' }}
          AI_CONTEXT_WINDOW_TOKENS: ${{ vars.AI_CONTEXT_WINDOW_TOKENS || '1000000' }}
          AI_SINGLE_REPLAY_MAX_INPUT_TOKENS: ${{ vars.AI_SINGLE_REPLAY_MAX_INPUT_TOKENS || '940000' }}
          AI_MAX_OUTPUT_TOKENS: ${{ vars.AI_MAX_OUTPUT_TOKENS || '32768' }}
          AI_PROMPT_SAFETY_MARGIN_TOKENS: ${{ vars.AI_PROMPT_SAFETY_MARGIN_TOKENS || '16384' }}
          AI_THINKING_ENABLED: ${{ vars.AI_THINKING_ENABLED || 'true' }}
          AI_THINKING_ENABLED_CALL2: ${{ vars.AI_THINKING_ENABLED_CALL2 || 'false' }}
          AI_REASONING_EFFORT: ${{ vars.AI_REASONING_EFFORT || 'max' }}
          AI_REVIEW_WORKER_MAX_CONCURRENT: ${{ vars.AI_REVIEW_WORKER_MAX_CONCURRENT || '4' }}
          AI_REVIEW_WORKER_QUEUE_CAPACITY: ${{ vars.AI_REVIEW_WORKER_QUEUE_CAPACITY || '4' }}
          AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC: '1100'
          REPLAY_COORDINATE_HALF_EXTENT: ${{ vars.REPLAY_COORDINATE_HALF_EXTENT || '250' }}
          REPLAY_COORDINATE_CLAMP_TOLERANCE: ${{ vars.REPLAY_COORDINATE_CLAMP_TOLERANCE || '12.5' }}
          GRAFANA_ROOT_URL: ${{ vars.GRAFANA_ROOT_URL || 'https://monitor.wotbtools.com' }}
          OBSERVABILITY_ENVIRONMENT: ${{ vars.OBSERVABILITY_ENVIRONMENT || 'production' }}
