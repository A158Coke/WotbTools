name: Deploy
run-name: Deploy ${{ inputs.service }} by @${{ github.actor }}

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      image:
        type: string
        required: false
        default: ''
      digest:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      service:
        description: One production service
        required: true
        type: choice
        options:
          - business-api
          - frontend
          - keycloak
          - parser-worker
          - minio
          - caddy
          - rabbitmq
          - business-postgres
          - keycloak-postgres
          - node-exporter
          - prometheus
          - loki
          - alloy
          - grafana

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      service: ${{ steps.source.outputs.service }}
      config_sha: ${{ steps.source.outputs.config_sha }}
      image: ${{ steps.select.outputs.image }}
      image_commit_sha: ${{ steps.select.outputs.image_commit_sha }}
      host: ${{ steps.source.outputs.host }}
      repository: ${{ steps.source.outputs.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Freeze one trusted main service
        id: source
        env:
          SERVICE: ${{ inputs.service }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source SHA must be full and lowercase" >&2; exit 1; }
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ] || { echo "::error::checkout/source mismatch" >&2; exit 1; }
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [ "$REF_NAME" = refs/heads/main ] || { echo "::error::Manual Deploy must dispatch from main" >&2; exit 1; }
          fi
          git fetch origin main
          [ "$SOURCE_SHA" = "$(git rev-parse origin/main)" ] || { echo "::error::stale Deploy source; use current main" >&2; exit 1; }
          case "$SERVICE" in
            business-api|frontend|keycloak)
              case "$TCR_REGISTRY" in *.tencentyun.com) ;; *) echo "::error::TX registry must be Tencent TCR" >&2; exit 1 ;; esac
              [ -n "$TCR_NAMESPACE" ] || { echo "::error::TCR_NAMESPACE is required" >&2; exit 1; }
              host=tx
              repository="$TCR_REGISTRY/$TCR_NAMESPACE/wotbtools-$SERVICE"
              ;;
            parser-worker|minio)
              host=yecao
              repository="ghcr.io/a158coke/wotbtools-$SERVICE"
              ;;
            caddy|rabbitmq|business-postgres|keycloak-postgres)
              host=tx
              repository=''
              ;;
            node-exporter|prometheus|loki|alloy|grafana)
              host=yecao
              repository=''
              ;;
            *) echo "::error::unsupported service: $SERVICE" >&2; exit 1 ;;
          esac
          {
            echo "service=$SERVICE"
            echo "config_sha=$SOURCE_SHA"
            echo "host=$host"
            echo "repository=$repository"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: steps.source.outputs.repository != '' && steps.source.outputs.host == 'tx' && (github.event_name == 'workflow_dispatch' || inputs.image != '')
        with:
          registry: ${{ vars.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - uses: docker/login-action@v4
        if: steps.source.outputs.repository != '' && steps.source.outputs.host == 'yecao' && (github.event_name == 'workflow_dispatch' || inputs.image != '')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-crane@v0.7
        if: steps.source.outputs.repository != '' && (github.event_name == 'workflow_dispatch' || inputs.image != '')
      - name: Select immutable image or keep production metadata identity
        id: select
        env:
          SOURCE_SHA: ${{ steps.source.outputs.config_sha }}
          REPOSITORY: ${{ steps.source.outputs.repository }}
          REQUESTED_IMAGE: ${{ inputs.image || '' }}
          REQUESTED_DIGEST: ${{ inputs.digest || '' }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$REPOSITORY" ]; then
            [ -z "$REQUESTED_IMAGE$REQUESTED_DIGEST" ] || { echo "::error::fixed-image service does not accept image identity" >&2; exit 1; }
            echo "image=" >> "$GITHUB_OUTPUT"
            echo "image_commit_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [ -z "$REQUESTED_IMAGE$REQUESTED_DIGEST" ] || { echo "::error::manual Deploy has no image input" >&2; exit 1; }
            tags="$(crane ls "$REPOSITORY")"
            selected_sha=''
            while read -r commit_sha; do
              candidate="sha-${commit_sha:0:12}"
              if grep -Fxq "$candidate" <<< "$tags"; then
                selected_sha="$commit_sha"
                REQUESTED_IMAGE="$REPOSITORY:$candidate"
                break
              fi
            done < <(git rev-list --first-parent origin/main)
            [ -n "$selected_sha" ] || { echo "::error::no successfully pushed immutable main image" >&2; exit 1; }
            image_commit_sha="$selected_sha"
          elif [ -n "$REQUESTED_IMAGE" ]; then
            expected="$REPOSITORY:sha-${SOURCE_SHA:0:12}"
            [ "$REQUESTED_IMAGE" = "$expected" ] || { echo "::error::automatic image must be this source SHA and service registry" >&2; exit 1; }
            image_commit_sha="$SOURCE_SHA"
          else
            [ -z "$REQUESTED_DIGEST" ] || { echo "::error::digest without image" >&2; exit 1; }
            echo "image=" >> "$GITHUB_OUTPUT"
            echo "image_commit_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          resolved_digest="$(crane digest "$REQUESTED_IMAGE")"
          [[ "$resolved_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid registry digest" >&2; exit 1; }
          if [ -n "$REQUESTED_DIGEST" ]; then
            [ "$resolved_digest" = "$REQUESTED_DIGEST" ] || { echo "::error::image digest differs from Build output" >&2; exit 1; }
          fi
          echo "image=$REQUESTED_IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_commit_sha=$image_commit_sha" >> "$GITHUB_OUTPUT"
          echo "verified $REQUESTED_IMAGE at $resolved_digest"

  deploy_yecao:
    needs: [identity]
    if: needs.identity.outputs.host == 'yecao' && needs.identity.outputs.service != 'minio'
    name: Deploy Yecao / ${{ needs.identity.outputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.identity.outputs.config_sha }}
      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            WOTB_DIR=/opt/wotb
            mkdir -p "$WOTB_DIR"
            rm -rf -- "$WOTB_DIR/deploy.incoming"
            mkdir -p "$WOTB_DIR/deploy.incoming"
      - name: Install deployment scripts
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy
          target: /opt/wotb/deploy.incoming
          overwrite: true

      - name: Deploy exact release services via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 35m
          envs: WOTB_DEPLOY_SERVICE,WOTB_DEPLOY_CONFIG_SHA,WOTB_DEPLOY_IMAGE_TAG,WOTB_DEPLOY_IMAGE_COMMIT_SHA,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD,GRAFANA_ROOT_URL,OBSERVABILITY_ENVIRONMENT,TX_RABBITMQ_PARSER_WORKER_PASSWORD,YECAO_MINIO_WORKER_ACCESS_KEY,YECAO_MINIO_WORKER_SECRET_KEY
          script: bash /opt/wotb/deploy.incoming/deploy/deploy.sh
        env:
          WOTB_DEPLOY_SERVICE: ${{ needs.identity.outputs.service }}
          WOTB_DEPLOY_CONFIG_SHA: ${{ needs.identity.outputs.config_sha }}
          WOTB_DEPLOY_IMAGE_TAG: ${{ needs.identity.outputs.image }}
          WOTB_DEPLOY_IMAGE_COMMIT_SHA: ${{ needs.identity.outputs.image_commit_sha }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GRAFANA_ROOT_URL: ${{ vars.GRAFANA_ROOT_URL || 'https://monitor.wotbtools.com' }}
          OBSERVABILITY_ENVIRONMENT: ${{ vars.OBSERVABILITY_ENVIRONMENT || 'production' }}
          # The only Yecao application service left is the execution plane: it consumes the TX
          # broker and reads/writes Yecao MinIO with its own least-privilege identity. Every variable
          # the retired Yecao application runtime consumed (database, Keycloak admin, AI Review,
          # Boost and Replay tuning) is deliberately no longer passed to this host.
          TX_RABBITMQ_PARSER_WORKER_PASSWORD: ${{ secrets.TX_RABBITMQ_PARSER_WORKER_PASSWORD }}
          YECAO_MINIO_WORKER_ACCESS_KEY: ${{ secrets.YECAO_MINIO_WORKER_ACCESS_KEY }}
          YECAO_MINIO_WORKER_SECRET_KEY: ${{ secrets.YECAO_MINIO_WORKER_SECRET_KEY }}
  deploy_minio:
    needs: [identity]
    if: needs.identity.outputs.service == 'minio'
    name: Deploy MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.identity.outputs.config_sha }}
      - name: Prepare explicit MinIO deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            root="/opt/wotb/minio.incoming/${{ needs.identity.outputs.config_sha }}"
            rm -rf -- "$root"
            mkdir -p "$root"
      - name: Install explicit MinIO deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.minio.yml,deploy/minio-deploy.sh,deploy/release-metadata.py,deploy/minio
          target: /opt/wotb/minio.incoming/${{ needs.identity.outputs.config_sha }}
          overwrite: true
      - name: Deploy and provision MinIO via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 35m
          envs: WOTB_DEPLOY_SERVICE,WOTB_DEPLOY_CONFIG_SHA,WOTB_DEPLOY_IMAGE_TAG,WOTB_DEPLOY_IMAGE_COMMIT_SHA,YECAO_MINIO_ROOT_USER,YECAO_MINIO_ROOT_PASSWORD,YECAO_MINIO_WORKER_ACCESS_KEY,YECAO_MINIO_WORKER_SECRET_KEY,YECAO_MINIO_CONTROL_API_ACCESS_KEY,YECAO_MINIO_CONTROL_API_SECRET_KEY
          script: bash /opt/wotb/minio.incoming/${{ needs.identity.outputs.config_sha }}/deploy/minio-deploy.sh /opt/wotb/minio.incoming/${{ needs.identity.outputs.config_sha }}
        env:
          WOTB_DEPLOY_SERVICE: ${{ needs.identity.outputs.service }}
          WOTB_DEPLOY_CONFIG_SHA: ${{ needs.identity.outputs.config_sha }}
          WOTB_DEPLOY_IMAGE_TAG: ${{ needs.identity.outputs.image }}
          WOTB_DEPLOY_IMAGE_COMMIT_SHA: ${{ needs.identity.outputs.image_commit_sha }}
          YECAO_MINIO_ROOT_USER: ${{ secrets.YECAO_MINIO_ROOT_USER }}
          YECAO_MINIO_ROOT_PASSWORD: ${{ secrets.YECAO_MINIO_ROOT_PASSWORD }}
          YECAO_MINIO_WORKER_ACCESS_KEY: ${{ secrets.YECAO_MINIO_WORKER_ACCESS_KEY }}
          YECAO_MINIO_WORKER_SECRET_KEY: ${{ secrets.YECAO_MINIO_WORKER_SECRET_KEY }}
          YECAO_MINIO_CONTROL_API_ACCESS_KEY: ${{ secrets.YECAO_MINIO_CONTROL_API_ACCESS_KEY }}
          YECAO_MINIO_CONTROL_API_SECRET_KEY: ${{ secrets.YECAO_MINIO_CONTROL_API_SECRET_KEY }}
  deploy_tx:
    needs: [identity]
    if: needs.identity.outputs.host == 'tx'
    name: Deploy TX / ${{ needs.identity.outputs.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tx-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.identity.outputs.config_sha }}
      - name: Prepare TX deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          script: |
            set -eu
            WOTB_DIR=/opt/wotb-tx
            mkdir -p "$WOTB_DIR/deploy.incoming" "$WOTB_DIR/e2e"
            rm -rf -- "$WOTB_DIR/deploy.incoming/deploy/tx"
      - name: Install TX deployment configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tx,deploy/release-metadata.py
          target: /opt/wotb-tx/deploy.incoming
          overwrite: true
      - name: Install TX cutover E2E replay fixtures
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: common/fixtures/replays
          target: /opt/wotb-tx/e2e
          strip_components: 3
          overwrite: true
      - name: Deploy exact TX services via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 35m
          envs: WOTB_DEPLOY_SERVICE,WOTB_DEPLOY_CONFIG_SHA,WOTB_DEPLOY_IMAGE_TAG,WOTB_DEPLOY_IMAGE_COMMIT_SHA,TX_IMAGE_REGISTRY_PREFIX,KC_POSTGRES_ADMIN_USER,KC_POSTGRES_ADMIN_PASSWORD,KC_BOOTSTRAP_ADMIN_PASSWORD,KC_DB_USERNAME,KC_DB_PASSWORD,WG_APPLICATION_ID,CADDY_ACME_EMAIL,TX_RABBITMQ_ADMIN_USER,TX_RABBITMQ_ADMIN_PASSWORD,TX_RABBITMQ_CONTROL_API_PASSWORD,TX_RABBITMQ_PARSER_WORKER_PASSWORD,TX_BUSINESS_POSTGRES_ADMIN_USER,TX_BUSINESS_POSTGRES_ADMIN_PASSWORD,TX_BUSINESS_DB_NAME,TX_BUSINESS_DB_USERNAME,TX_BUSINESS_DB_PASSWORD,TX_BUSINESS_DB_PASSWORD_VERSION,KEYCLOAK_ADMIN_CLIENT_SECRET,AI_API_KEY,AI_BASE_URL,AI_MODEL,AI_CONNECT_TIMEOUT_SEC,AI_TIMEOUT_SEC,AI_CALL_TIMEOUT_SEC,AI_RETRY_MAX_ATTEMPTS,AI_RETRY_INITIAL_BACKOFF_MS,AI_RETRY_MAX_BACKOFF_MS,AI_RETRY_BACKOFF_MULTIPLIER,AI_CONTEXT_WINDOW_TOKENS,AI_SINGLE_REPLAY_MAX_INPUT_TOKENS,AI_MAX_OUTPUT_TOKENS,AI_PROMPT_SAFETY_MARGIN_TOKENS,AI_THINKING_ENABLED,AI_THINKING_ENABLED_CALL2,AI_REASONING_EFFORT,AI_REVIEW_WORKER_MAX_CONCURRENT,AI_REVIEW_WORKER_QUEUE_CAPACITY,AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC,REPLAY_COORDINATE_HALF_EXTENT,REPLAY_COORDINATE_CLAMP_TOLERANCE,BOOST_AUTO_CONFIRM_HOURS,BOOST_AUTO_CONFIRM_SCAN_MS,YECAO_MINIO_CONTROL_API_ACCESS_KEY,YECAO_MINIO_CONTROL_API_SECRET_KEY
          script: bash /opt/wotb-tx/deploy.incoming/deploy/tx/deploy.sh
        env:
          WOTB_DEPLOY_SERVICE: ${{ needs.identity.outputs.service }}
          WOTB_DEPLOY_CONFIG_SHA: ${{ needs.identity.outputs.config_sha }}
          WOTB_DEPLOY_IMAGE_TAG: ${{ needs.identity.outputs.image }}
          WOTB_DEPLOY_IMAGE_COMMIT_SHA: ${{ needs.identity.outputs.image_commit_sha }}
          TX_IMAGE_REGISTRY_PREFIX: ${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}
          KC_POSTGRES_ADMIN_USER: kc_admin
          KC_POSTGRES_ADMIN_PASSWORD: ${{ secrets.TX_KC_POSTGRES_ADMIN_PASSWORD }}
          KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.TX_KC_BOOTSTRAP_ADMIN_PASSWORD }}
          KC_DB_USERNAME: keycloak
          KC_DB_PASSWORD: ${{ secrets.TX_KC_DB_PASSWORD }}
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
          CADDY_ACME_EMAIL: ${{ vars.CADDY_ACME_EMAIL }}
          TX_RABBITMQ_ADMIN_USER: ${{ vars.TX_RABBITMQ_ADMIN_USER }}
          TX_RABBITMQ_ADMIN_PASSWORD: ${{ secrets.TX_RABBITMQ_ADMIN_PASSWORD }}
          TX_RABBITMQ_CONTROL_API_PASSWORD: ${{ secrets.TX_RABBITMQ_CONTROL_API_PASSWORD }}
          TX_RABBITMQ_PARSER_WORKER_PASSWORD: ${{ secrets.TX_RABBITMQ_PARSER_WORKER_PASSWORD }}
          TX_BUSINESS_POSTGRES_ADMIN_USER: ${{ vars.TX_BUSINESS_POSTGRES_ADMIN_USER }}
          TX_BUSINESS_POSTGRES_ADMIN_PASSWORD: ${{ secrets.TX_BUSINESS_POSTGRES_ADMIN_PASSWORD }}
          TX_BUSINESS_DB_NAME: ${{ vars.TX_BUSINESS_DB_NAME }}
          TX_BUSINESS_DB_USERNAME: ${{ vars.TX_BUSINESS_DB_USERNAME }}
          TX_BUSINESS_DB_PASSWORD: ${{ secrets.TX_BUSINESS_DB_PASSWORD }}
          TX_BUSINESS_DB_PASSWORD_VERSION: ${{ vars.TX_BUSINESS_DB_PASSWORD_VERSION || '1' }}
          # TX business runtime (`business-api`): Keycloak Admin API client,
          # AI Review, and the MinIO control-plane identity. The RabbitMQ
          # control-api password and the business application role are passed
          # above because both the broker provisioning and the runtime need them.
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-v4-flash' }}
          AI_CONNECT_TIMEOUT_SEC: ${{ vars.AI_CONNECT_TIMEOUT_SEC || '10' }}
          AI_TIMEOUT_SEC: ${{ vars.AI_TIMEOUT_SEC || '300' }}
          AI_CALL_TIMEOUT_SEC: ${{ vars.AI_CALL_TIMEOUT_SEC || '315' }}
          AI_RETRY_MAX_ATTEMPTS: ${{ vars.AI_RETRY_MAX_ATTEMPTS || '3' }}
          AI_RETRY_INITIAL_BACKOFF_MS: ${{ vars.AI_RETRY_INITIAL_BACKOFF_MS || '1000' }}
          AI_RETRY_MAX_BACKOFF_MS: ${{ vars.AI_RETRY_MAX_BACKOFF_MS || '8000' }}
          AI_RETRY_BACKOFF_MULTIPLIER: ${{ vars.AI_RETRY_BACKOFF_MULTIPLIER || '2.0' }}
          AI_CONTEXT_WINDOW_TOKENS: ${{ vars.AI_CONTEXT_WINDOW_TOKENS || '1000000' }}
          AI_SINGLE_REPLAY_MAX_INPUT_TOKENS: ${{ vars.AI_SINGLE_REPLAY_MAX_INPUT_TOKENS || '940000' }}
          AI_MAX_OUTPUT_TOKENS: ${{ vars.AI_MAX_OUTPUT_TOKENS || '32768' }}
          AI_PROMPT_SAFETY_MARGIN_TOKENS: ${{ vars.AI_PROMPT_SAFETY_MARGIN_TOKENS || '16384' }}
          AI_THINKING_ENABLED: ${{ vars.AI_THINKING_ENABLED || 'true' }}
          AI_THINKING_ENABLED_CALL2: ${{ vars.AI_THINKING_ENABLED_CALL2 || 'false' }}
          AI_REASONING_EFFORT: ${{ vars.AI_REASONING_EFFORT || 'max' }}
          AI_REVIEW_WORKER_MAX_CONCURRENT: ${{ vars.AI_REVIEW_WORKER_MAX_CONCURRENT || '4' }}
          AI_REVIEW_WORKER_QUEUE_CAPACITY: ${{ vars.AI_REVIEW_WORKER_QUEUE_CAPACITY || '4' }}
          AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC: '1100'
          REPLAY_COORDINATE_HALF_EXTENT: ${{ vars.REPLAY_COORDINATE_HALF_EXTENT || '250' }}
          REPLAY_COORDINATE_CLAMP_TOLERANCE: ${{ vars.REPLAY_COORDINATE_CLAMP_TOLERANCE || '12.5' }}
          BOOST_AUTO_CONFIRM_HOURS: ${{ vars.BOOST_AUTO_CONFIRM_HOURS || '72' }}
          BOOST_AUTO_CONFIRM_SCAN_MS: ${{ vars.BOOST_AUTO_CONFIRM_SCAN_MS || '300000' }}
          YECAO_MINIO_CONTROL_API_ACCESS_KEY: ${{ secrets.YECAO_MINIO_CONTROL_API_ACCESS_KEY }}
          YECAO_MINIO_CONTROL_API_SECRET_KEY: ${{ secrets.YECAO_MINIO_CONTROL_API_SECRET_KEY }}
