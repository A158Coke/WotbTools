name: Deploy
# 生产 Grafana MCP 已下线（2026-08-11）：不再传递 GRAFANA_MCP_TOKEN。
run-name: Deploy ${{ github.event.workflow_run.head_sha }} by @${{ github.actor }}

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed

permissions:
  contents: read

concurrency:
  # Deploy is the sole TX postgres-keycloak apply path.
  group: production-maintenance
  cancel-in-progress: false

jobs:
  changes:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha: ${{ steps.manifest.outputs.release_sha }}
      release_tag: ${{ steps.manifest.outputs.release_tag }}
      build_run_number: ${{ steps.manifest.outputs.build_run_number }}
      backend_migration_max_version: ${{ steps.manifest.outputs.backend_migration_max_version }}
      deploy_services: ${{ steps.manifest.outputs.deploy_services }}
      image_services: ${{ steps.manifest.outputs.image_services }}
      yecao_services: ${{ steps.manifest.outputs.yecao_services }}
      tx_services: ${{ steps.manifest.outputs.tx_services }}
      yecao_image_services: ${{ steps.manifest.outputs.yecao_image_services }}
      tx_image_services: ${{ steps.manifest.outputs.tx_image_services }}
      deploy_display_name: ${{ steps.manifest.outputs.deploy_display_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download triggering Build manifest
        uses: actions/download-artifact@v5
        with:
          name: deployment-manifest
          path: release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate deployment manifest
        id: manifest
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_path=release-artifact/deployment-manifest.json
          [ -f "$manifest_path" ] || {
            echo "deployment manifest artifact is missing" >&2
            exit 1
          }
          metadata="$(python3 deploy/release_plan.py validate \
            --manifest "$manifest_path" --expected-sha "$EXPECTED_SHA")"
          python3 - "$metadata" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          manifest = json.loads(sys.argv[1])
          print(f"release_sha={manifest['commitSha']}")
          print(f"release_tag={manifest['imageTag']}")
          print(f"build_run_number={manifest['buildRunNumber']}")
          print(f"backend_migration_max_version={manifest['backendMigrationMaxVersion']}")
          print(f"deploy_services={','.join(manifest['deployServices'])}")
          print(f"image_services={','.join(manifest['imageServices'])}")
          targets = manifest["targetServices"]
          print(f"yecao_services={','.join(targets.get('yecao', []))}")
          print(f"tx_services={','.join(targets.get('tx', []))}")
          images = set(manifest["imageServices"])
          print(f"yecao_image_services={','.join(s for s in targets.get('yecao', []) if s in images)}")
          print(f"tx_image_services={','.join(s for s in targets.get('tx', []) if s in images)}")
          labels = []
          if "all" in manifest["deployServices"]:
              labels.append("All")
          else:
              if "wotb-backend" in manifest["deployServices"]:
                  labels.append("Backend")
              if "wotb-frontend" in manifest["deployServices"]:
                  labels.append("Frontend")
              if "keycloak" in manifest["deployServices"]:
                  labels.append("Keycloak")
              if any(service in {"postgres", "node-exporter", "prometheus", "loki", "alloy", "grafana"}
                     for service in manifest["deployServices"]):
                  labels.append("Observability")
          print(f"deploy_display_name={' + '.join(labels) or 'No-op'}")
          PY

  image_existence:
    needs: [changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.image_services != ''
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify required application images exist
        env:
          IMAGE_SERVICES: ${{ needs.changes.outputs.image_services }}
          RELEASE_TAG: ${{ needs.changes.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a services <<< "$IMAGE_SERVICES"
          for service in "${services[@]}"; do
            case "$service" in
              wotb-backend) image=ghcr.io/a158coke/wotbtools-backend ;;
              wotb-frontend) image=ghcr.io/a158coke/wotbtools-frontend ;;
              keycloak) image=ghcr.io/a158coke/wotbtools-keycloak ;;
              *) echo "unsupported image service: $service" >&2; exit 1 ;;
            esac
            docker manifest inspect "$image:$RELEASE_TAG" >/dev/null || {
              echo "::error::Required immutable deploy image does not exist for $service: $image:$RELEASE_TAG" >&2
              exit 1
            }
          done

  deploy:
    needs: [changes, image_existence]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.image_existence.result == 'success' ||
       (needs.changes.outputs.image_services == '' && needs.image_existence.result == 'skipped'))
    name: Deploy ${{ needs.changes.outputs.deploy_display_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: No-op release
        if: needs.changes.outputs.deploy_services == ''
        run: echo "No deployable runtime changes in ${{ needs.changes.outputs.release_sha }}"
      - uses: actions/checkout@v5
        if: needs.changes.outputs.yecao_services != ''
        with:
          ref: ${{ needs.changes.outputs.release_sha }}
      - name: Prepare deployment directory
        if: needs.changes.outputs.yecao_services != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            WOTB_DIR=/opt/wotb
            mkdir -p "$WOTB_DIR"
            rm -rf -- "$WOTB_DIR/deploy.incoming"
            mkdir -p "$WOTB_DIR/deploy.incoming"
      - name: Install deployment scripts
        if: needs.changes.outputs.yecao_services != ''
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy
          target: /opt/wotb/deploy.incoming
          overwrite: true
      - name: Deploy exact release services via SSH
        if: needs.changes.outputs.yecao_services != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 35m
          envs: TAG,RELEASE_SHA,RELEASE_RUN_NUMBER,WOTB_BACKEND_MIGRATION_MAX_VERSION,WOTB_DEPLOY_SERVICES,WOTB_DEPLOY_IMAGE_SERVICES,DB_PASSWORD,KC_ADMIN_PASSWORD,WG_APPLICATION_ID,KEYCLOAK_ADMIN_CLIENT_SECRET,AI_API_KEY,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD,BOOST_AUTO_CONFIRM_HOURS,BOOST_AUTO_CONFIRM_SCAN_MS,AI_BASE_URL,AI_MODEL,AI_CONNECT_TIMEOUT_SEC,AI_TIMEOUT_SEC,AI_CALL_TIMEOUT_SEC,AI_RETRY_MAX_ATTEMPTS,AI_RETRY_INITIAL_BACKOFF_MS,AI_RETRY_MAX_BACKOFF_MS,AI_RETRY_BACKOFF_MULTIPLIER,AI_CONTEXT_WINDOW_TOKENS,AI_SINGLE_REPLAY_MAX_INPUT_TOKENS,AI_MAX_OUTPUT_TOKENS,AI_PROMPT_SAFETY_MARGIN_TOKENS,AI_THINKING_ENABLED,AI_THINKING_ENABLED_CALL2,AI_REASONING_EFFORT,AI_REVIEW_WORKER_MAX_CONCURRENT,AI_REVIEW_WORKER_QUEUE_CAPACITY,AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC,REPLAY_COORDINATE_HALF_EXTENT,REPLAY_COORDINATE_CLAMP_TOLERANCE,GRAFANA_ROOT_URL,OBSERVABILITY_ENVIRONMENT
          script: bash /opt/wotb/deploy.incoming/deploy/deploy.sh
        env:
          TAG: ${{ needs.changes.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          RELEASE_RUN_NUMBER: ${{ needs.changes.outputs.build_run_number }}
          WOTB_BACKEND_MIGRATION_MAX_VERSION: ${{ needs.changes.outputs.backend_migration_max_version }}
          WOTB_DEPLOY_SERVICES: ${{ needs.changes.outputs.yecao_services }}
          WOTB_DEPLOY_IMAGE_SERVICES: ${{ needs.changes.outputs.yecao_image_services }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          BOOST_AUTO_CONFIRM_HOURS: ${{ vars.BOOST_AUTO_CONFIRM_HOURS || '72' }}
          BOOST_AUTO_CONFIRM_SCAN_MS: ${{ vars.BOOST_AUTO_CONFIRM_SCAN_MS || '300000' }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-v4-flash' }}
          AI_CONNECT_TIMEOUT_SEC: ${{ vars.AI_CONNECT_TIMEOUT_SEC || '10' }}
          AI_TIMEOUT_SEC: ${{ vars.AI_TIMEOUT_SEC || '300' }}
          AI_CALL_TIMEOUT_SEC: ${{ vars.AI_CALL_TIMEOUT_SEC || '315' }}
          AI_RETRY_MAX_ATTEMPTS: ${{ vars.AI_RETRY_MAX_ATTEMPTS || '3' }}
          AI_RETRY_INITIAL_BACKOFF_MS: ${{ vars.AI_RETRY_INITIAL_BACKOFF_MS || '1000' }}
          AI_RETRY_MAX_BACKOFF_MS: ${{ vars.AI_RETRY_MAX_BACKOFF_MS || '8000' }}
          AI_RETRY_BACKOFF_MULTIPLIER: ${{ vars.AI_RETRY_BACKOFF_MULTIPLIER || '2.0' }}
          AI_CONTEXT_WINDOW_TOKENS: ${{ vars.AI_CONTEXT_WINDOW_TOKENS || '1000000' }}
          AI_SINGLE_REPLAY_MAX_INPUT_TOKENS: ${{ vars.AI_SINGLE_REPLAY_MAX_INPUT_TOKENS || '940000' }}
          AI_MAX_OUTPUT_TOKENS: ${{ vars.AI_MAX_OUTPUT_TOKENS || '32768' }}
          AI_PROMPT_SAFETY_MARGIN_TOKENS: ${{ vars.AI_PROMPT_SAFETY_MARGIN_TOKENS || '16384' }}
          AI_THINKING_ENABLED: ${{ vars.AI_THINKING_ENABLED || 'true' }}
          AI_THINKING_ENABLED_CALL2: ${{ vars.AI_THINKING_ENABLED_CALL2 || 'false' }}
          AI_REASONING_EFFORT: ${{ vars.AI_REASONING_EFFORT || 'max' }}
          AI_REVIEW_WORKER_MAX_CONCURRENT: ${{ vars.AI_REVIEW_WORKER_MAX_CONCURRENT || '4' }}
          AI_REVIEW_WORKER_QUEUE_CAPACITY: ${{ vars.AI_REVIEW_WORKER_QUEUE_CAPACITY || '4' }}
          AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC: '1100'
          REPLAY_COORDINATE_HALF_EXTENT: ${{ vars.REPLAY_COORDINATE_HALF_EXTENT || '250' }}
          REPLAY_COORDINATE_CLAMP_TOLERANCE: ${{ vars.REPLAY_COORDINATE_CLAMP_TOLERANCE || '12.5' }}
          GRAFANA_ROOT_URL: ${{ vars.GRAFANA_ROOT_URL || 'https://monitor.wotbtools.com' }}
          OBSERVABILITY_ENVIRONMENT: ${{ vars.OBSERVABILITY_ENVIRONMENT || 'production' }}

  deploy_tx:
    needs: [changes, image_existence]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.tx_services != '' &&
      (needs.image_existence.result == 'success' ||
       (needs.changes.outputs.image_services == '' && needs.image_existence.result == 'skipped'))
    name: Deploy TX Frontend + Keycloak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tx-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.release_sha }}
      - name: Prepare TX deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          script: |
            set -eu
            WOTB_DIR=/opt/wotb-tx
            mkdir -p "$WOTB_DIR/deploy.incoming"
            rm -rf -- "$WOTB_DIR/deploy.incoming/tx"
      - name: Install TX deployment configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tx
          target: /opt/wotb-tx/deploy.incoming
          overwrite: true
      - name: Bootstrap TX Keycloak PostgreSQL before OpenTofu
        if: contains(needs.changes.outputs.tx_services, 'keycloak-postgres')
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 15m
          envs: TAG,RELEASE_SHA,RELEASE_RUN_NUMBER,WOTB_DEPLOY_SERVICES,WOTB_DEPLOY_IMAGE_SERVICES,KC_POSTGRES_ADMIN_USER,KC_POSTGRES_ADMIN_PASSWORD,KC_BOOTSTRAP_ADMIN_PASSWORD,KC_DB_USERNAME,KC_DB_PASSWORD,WG_APPLICATION_ID,CADDY_ACME_EMAIL
          script: bash /opt/wotb-tx/deploy.incoming/tx/deploy.sh
        env:
          TAG: ${{ needs.changes.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          RELEASE_RUN_NUMBER: ${{ needs.changes.outputs.build_run_number }}
          WOTB_DEPLOY_SERVICES: keycloak-postgres
          WOTB_DEPLOY_IMAGE_SERVICES: ''
          KC_POSTGRES_ADMIN_USER: kc_admin
          KC_POSTGRES_ADMIN_PASSWORD: ${{ secrets.TX_KC_POSTGRES_ADMIN_PASSWORD }}
          KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.TX_KC_BOOTSTRAP_ADMIN_PASSWORD }}
          KC_DB_USERNAME: keycloak
          KC_DB_PASSWORD: ${{ secrets.TX_KC_DB_PASSWORD }}
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
          CADDY_ACME_EMAIL: ${{ vars.CADDY_ACME_EMAIL }}
      - name: Install Keycloak PostgreSQL OpenTofu root on TX
        if: contains(needs.changes.outputs.tx_services, 'keycloak-postgres')
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: infra/tofu/postgres-keycloak
          target: /opt/wotb-tx/tofu.incoming/${{ needs.changes.outputs.release_sha }}
          overwrite: true
      - name: Apply Keycloak PostgreSQL OpenTofu on TX localhost
        if: contains(needs.changes.outputs.tx_services, 'keycloak-postgres')
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 15m
          envs: TF_VAR_postgresql_admin_username,TF_VAR_postgresql_admin_password,TF_VAR_keycloak_role_password,TF_VAR_keycloak_role_password_version,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            set -euo pipefail
            command -v tofu >/dev/null 2>&1 || { echo "tofu is required on TX" >&2; exit 1; }
            root="/opt/wotb-tx/tofu.incoming/${{ needs.changes.outputs.release_sha }}/infra/tofu/postgres-keycloak"
            test -d "$root"
            cd "$root"
            trap 'rm -f plan.tfplan' EXIT
            tofu init -reconfigure -input=false
            tofu validate
            tofu plan -input=false -no-color -out=plan.tfplan
            bash ./validate-plan.sh plan.tfplan
            tofu apply -input=false -auto-approve plan.tfplan
            install -d -m 700 /opt/wotb-tx
            printf '%s\n' tx-local-opentofu > /opt/wotb-tx/keycloak-postgres.tofu-provisioned
            chmod 600 /opt/wotb-tx/keycloak-postgres.tofu-provisioned
        env:
          TF_VAR_postgresql_admin_username: kc_admin
          TF_VAR_postgresql_admin_password: ${{ secrets.TX_KC_POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_keycloak_role_password: ${{ secrets.TX_KC_DB_PASSWORD }}
          TF_VAR_keycloak_role_password_version: ${{ vars.TX_KC_DB_PASSWORD_VERSION || '1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
      - name: Deploy exact TX services via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 35m
          envs: TAG,RELEASE_SHA,RELEASE_RUN_NUMBER,WOTB_DEPLOY_SERVICES,WOTB_DEPLOY_IMAGE_SERVICES,KC_POSTGRES_ADMIN_USER,KC_POSTGRES_ADMIN_PASSWORD,KC_BOOTSTRAP_ADMIN_PASSWORD,KC_DB_USERNAME,KC_DB_PASSWORD,WG_APPLICATION_ID,CADDY_ACME_EMAIL
          script: bash /opt/wotb-tx/deploy.incoming/tx/deploy.sh
        env:
          TAG: ${{ needs.changes.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.changes.outputs.release_sha }}
          RELEASE_RUN_NUMBER: ${{ needs.changes.outputs.build_run_number }}
          WOTB_DEPLOY_SERVICES: ${{ needs.changes.outputs.tx_services }}
          WOTB_DEPLOY_IMAGE_SERVICES: ${{ needs.changes.outputs.tx_image_services }}
          KC_POSTGRES_ADMIN_USER: kc_admin
          KC_POSTGRES_ADMIN_PASSWORD: ${{ secrets.TX_KC_POSTGRES_ADMIN_PASSWORD }}
          KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.TX_KC_BOOTSTRAP_ADMIN_PASSWORD }}
          KC_DB_USERNAME: keycloak
          KC_DB_PASSWORD: ${{ secrets.TX_KC_DB_PASSWORD }}
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
          CADDY_ACME_EMAIL: ${{ vars.CADDY_ACME_EMAIL }}
