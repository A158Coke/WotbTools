name: Deploy
# 生产 Grafana MCP 已下线（2026-08-11）：不再传递 GRAFANA_MCP_TOKEN，
# 宿主 Caddy /mcp 路由与 Grafana MCP Service Account 由人工清理。
run-name: Deploy ${{ inputs.service || 'all' }} from ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: Compose service to deploy; all performs the full validated release
        required: true
        type: choice
        default: all
        options:
          - all
          - postgres
          - node-exporter
          - prometheus
          - loki
          - alloy
          - grafana
          - keycloak
          - wotb-backend
          - wotb-frontend
      image_tag:
        description: Immutable sha-... image tag from an independent Build run; required for all/application services
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      service: ${{ steps.service.outputs.service }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Compute deployment identity
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          REQUESTED_SERVICE: ${{ inputs.service }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUESTED_SERVICE" in
            all|keycloak|wotb-backend|wotb-frontend)
              [[ "$REQUESTED_TAG" =~ ^sha-[0-9a-f]{7,40}$ ]] || {
                echo "image_tag must be an immutable sha-<commit> tag for $REQUESTED_SERVICE" >&2
                exit 1
              }
              ;;
            *)
              if [ -n "$REQUESTED_TAG" ] && [[ ! "$REQUESTED_TAG" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
                echo "image_tag must be an immutable sha-<commit> tag when provided" >&2
                exit 1
              fi
              ;;
          esac
          tag="${REQUESTED_TAG:-sha-dispatch}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Resolve deployment service
        id: service
        env:
          REQUESTED_SERVICE: ${{ inputs.service }}
        run: echo "service=$REQUESTED_SERVICE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [changes]
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            WOTB_DIR=/opt/wotb
            mkdir -p "$WOTB_DIR"
            rm -rf -- "$WOTB_DIR/deploy.incoming"
            mkdir -p "$WOTB_DIR/deploy.incoming"
      - name: Install deployment scripts
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy
          target: /opt/wotb/deploy.incoming
          overwrite: true
      - name: Deploy selected service via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 35m
          envs: TAG,WOTB_DEPLOY_SERVICE,DB_PASSWORD,KC_ADMIN_PASSWORD,WG_APPLICATION_ID,KEYCLOAK_ADMIN_CLIENT_SECRET,AI_API_KEY,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD,BOOST_AUTO_CONFIRM_HOURS,BOOST_AUTO_CONFIRM_SCAN_MS,AI_BASE_URL,AI_MODEL,AI_CONNECT_TIMEOUT_SEC,AI_TIMEOUT_SEC,AI_CALL_TIMEOUT_SEC,AI_RETRY_MAX_ATTEMPTS,AI_RETRY_INITIAL_BACKOFF_MS,AI_RETRY_MAX_BACKOFF_MS,AI_RETRY_BACKOFF_MULTIPLIER,AI_CONTEXT_WINDOW_TOKENS,AI_SINGLE_REPLAY_MAX_INPUT_TOKENS,AI_MAX_OUTPUT_TOKENS,AI_PROMPT_SAFETY_MARGIN_TOKENS,AI_THINKING_ENABLED,AI_THINKING_ENABLED_CALL2,AI_REASONING_EFFORT,AI_REVIEW_WORKER_MAX_CONCURRENT,AI_REVIEW_WORKER_QUEUE_CAPACITY,AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC,REPLAY_COORDINATE_HALF_EXTENT,REPLAY_COORDINATE_CLAMP_TOLERANCE,GRAFANA_ROOT_URL,OBSERVABILITY_ENVIRONMENT
          script: bash /opt/wotb/deploy.incoming/deploy/deploy.sh
        env:
          TAG: ${{ needs.changes.outputs.tag }}
          WOTB_DEPLOY_SERVICE: ${{ needs.changes.outputs.service }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_ADMIN_PASSWORD }}
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          BOOST_AUTO_CONFIRM_HOURS: ${{ vars.BOOST_AUTO_CONFIRM_HOURS || '72' }}
          BOOST_AUTO_CONFIRM_SCAN_MS: ${{ vars.BOOST_AUTO_CONFIRM_SCAN_MS || '300000' }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-v4-flash' }}
          AI_CONNECT_TIMEOUT_SEC: ${{ vars.AI_CONNECT_TIMEOUT_SEC || '10' }}
          AI_TIMEOUT_SEC: ${{ vars.AI_TIMEOUT_SEC || '300' }}
          AI_CALL_TIMEOUT_SEC: ${{ vars.AI_CALL_TIMEOUT_SEC || '315' }}
          AI_RETRY_MAX_ATTEMPTS: ${{ vars.AI_RETRY_MAX_ATTEMPTS || '3' }}
          AI_RETRY_INITIAL_BACKOFF_MS: ${{ vars.AI_RETRY_INITIAL_BACKOFF_MS || '1000' }}
          AI_RETRY_MAX_BACKOFF_MS: ${{ vars.AI_RETRY_MAX_BACKOFF_MS || '8000' }}
          AI_RETRY_BACKOFF_MULTIPLIER: ${{ vars.AI_RETRY_BACKOFF_MULTIPLIER || '2.0' }}
          AI_CONTEXT_WINDOW_TOKENS: ${{ vars.AI_CONTEXT_WINDOW_TOKENS || '1000000' }}
          AI_SINGLE_REPLAY_MAX_INPUT_TOKENS: ${{ vars.AI_SINGLE_REPLAY_MAX_INPUT_TOKENS || '940000' }}
          AI_MAX_OUTPUT_TOKENS: ${{ vars.AI_MAX_OUTPUT_TOKENS || '32768' }}
          AI_PROMPT_SAFETY_MARGIN_TOKENS: ${{ vars.AI_PROMPT_SAFETY_MARGIN_TOKENS || '16384' }}
          AI_THINKING_ENABLED: ${{ vars.AI_THINKING_ENABLED || 'true' }}
          AI_THINKING_ENABLED_CALL2: ${{ vars.AI_THINKING_ENABLED_CALL2 || 'false' }}
          AI_REASONING_EFFORT: ${{ vars.AI_REASONING_EFFORT || 'max' }}
          AI_REVIEW_WORKER_MAX_CONCURRENT: ${{ vars.AI_REVIEW_WORKER_MAX_CONCURRENT || '4' }}
          AI_REVIEW_WORKER_QUEUE_CAPACITY: ${{ vars.AI_REVIEW_WORKER_QUEUE_CAPACITY || '4' }}
          AI_REVIEW_WORKER_OVERALL_DEADLINE_SEC: '1100'
          REPLAY_COORDINATE_HALF_EXTENT: ${{ vars.REPLAY_COORDINATE_HALF_EXTENT || '250' }}
          REPLAY_COORDINATE_CLAMP_TOLERANCE: ${{ vars.REPLAY_COORDINATE_CLAMP_TOLERANCE || '12.5' }}
          GRAFANA_ROOT_URL: ${{ vars.GRAFANA_ROOT_URL || 'https://monitor.wotbtools.com' }}
          OBSERVABILITY_ENVIRONMENT: ${{ vars.OBSERVABILITY_ENVIRONMENT || 'production' }}
