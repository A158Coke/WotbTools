# PoC benchmark: can a GitHub-hosted Actions runner publish the REAL Backend image
# directly to Tencent TCR, at acceptable speed and reliability?
#
# The network path under test is exactly one hop, with nothing else in the middle:
#
#   GitHub-hosted Actions Runner --(registry protocol)--> Tencent TCR
#
# This workflow is deliberately isolated from production, so it stays safe to run on its
# own while `transfer-oci-to-tx.sh` / `publish-loaded-image-to-tcr.sh` and the GHCR
# publication path remain the untouched production fallback:
#
#   * `workflow_dispatch` only: no `push`, no `pull_request`, no `workflow_run`, so it can
#     never trigger Deploy and never upload a `deployment-manifest`;
#   * it builds the real docker/Dockerfile.backend exactly once into the runner's local
#     Docker daemon, then publishes that same image to TCR with one raw `docker push`. No
#     GHCR publication, no OCI archive, no rsync/scp of image data, no SSH to TX, no
#     `publish-loaded-image-to-tcr.sh`, no production Compose or runtime mutation;
#   * the tag is `benchmark-<run id>`, which is not a release identity: it is neither
#     `latest` nor `sha-<12>`, and production Deploy only ever resolves those two;
#   * no cache and no retries: a first run has to show the raw behaviour of this path, and a
#     twenty-minute broken connection must not hide behind repeated attempts;
#   * BUILD and TCR UPLOAD are measured as two separate stages, which is the whole point of
#     the experiment. The production BuildKit registry exporter is not used here because it
#     streams blobs while it builds and would merge the two numbers.
#
# The benchmark builds once and then publishes that same image, so the future production
# architecture stays available: commit -> immutable image -> registry digest -> deployment.
name: Benchmark TCR direct publication
run-name: Benchmark runner to TCR direct publication by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A dedicated group: the benchmark must never queue behind, or block, a production Build
  # (`production-build`), and two concurrent benchmark runs must not share TCR throughput
  # and distort each other's timings.
  group: tcr-direct-publication-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Benchmark runner to TCR direct publication
    runs-on: ubuntu-latest
    # The same budget as the production `Build Backend` job (build.yml). This job only
    # builds and publishes, so exhausting it is a finding rather than a missing budget.
    timeout-minutes: 80
    steps:
      - name: Checkout the benchmark source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve the benchmark identity from the current main HEAD
        id: identity
        shell: bash
        env:
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
        run: |
          set -euo pipefail
          git fetch origin main
          source_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "$source_sha" != "$main_sha" ]; then
            echo "::error::The TCR benchmark must run from the current main HEAD." >&2
            exit 1
          fi
          # TCR is the only registry this benchmark may touch, and it reuses the production
          # repository name so the measured path is the real one, not a lookalike.
          case "$TCR_REGISTRY" in
            *.tencentyun.com) ;;
            *)
              echo "::error::The TCR benchmark only publishes to a Tencent Cloud registry." >&2
              exit 1
              ;;
          esac
          [ -n "$TCR_NAMESPACE" ] || {
            echo "::error::TCR_NAMESPACE is not configured." >&2
            exit 1
          }
          benchmark_tag="benchmark-$GITHUB_RUN_ID"
          target_image="$TCR_REGISTRY/$TCR_NAMESPACE/wotbtools-backend:$benchmark_tag"
          {
            echo "commit_sha=$source_sha"
            echo "benchmark_tag=$benchmark_tag"
            echo "target_image=$target_image"
          } >> "$GITHUB_OUTPUT"
          printf 'stage=benchmark-identity\ncomponent=backend\nbenchmark_tag=%s\ntcr_target=%s\ncommit_sha=%s\n' \
            "$benchmark_tag" "$target_image" "$source_sha"

      - name: Record benchmark start
        shell: bash
        run: |
          set -euo pipefail
          started_epoch="$(date -u +%s)"
          printf 'stage=benchmark-start\nstarted_epoch=%s\n' "$started_epoch"
          echo "BENCHMARK_START_EPOCH=$started_epoch" >> "$GITHUB_ENV"

      # TCR credentials are repository-scoped (`TCR_USERNAME` / `TCR_PASSWORD`, the same
      # pair `deploy.yml` logs in with). This job deliberately attaches no `environment:`,
      # so a benchmark can never record a production deployment or wait on a protection
      # rule it does not need.
      - name: Log in to the Tencent TCR registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Record build start
        shell: bash
        run: |
          set -euo pipefail
          build_started_epoch="$(date -u +%s)"
          printf 'stage=build-start\nstarted_epoch=%s\n' "$build_started_epoch"
          echo "BUILD_START_EPOCH=$build_started_epoch" >> "$GITHUB_ENV"

      # One build of the real Backend image, into the runner's local Docker daemon, never
      # pushed from here. The registry exporter is deliberately not used: BuildKit streams
      # blobs to the registry while it is still building, which folds BUILD latency and TCR
      # UPLOAD latency into one number - exactly the two numbers this PoC has to report
      # separately. Loading instead of exporting keeps build and publication independently
      # measurable, and the publication stage never rebuilds anything.
      - name: Build the real Backend image once into the runner Docker daemon
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend
          tags: ${{ steps.identity.outputs.target_image }}
          # `load: true` is the local Docker exporter, so the published image carries Docker
          # media types - the same shape the TCR repository already holds.
          load: true
          build-args: BUILD_COMMIT=${{ steps.identity.outputs.commit_sha }}
          provenance: false
          sbom: false

      - name: Report build duration
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          ended_epoch="$(date -u +%s)"
          started_epoch="${BUILD_START_EPOCH:-$ended_epoch}"
          printf 'stage=build\nduration_seconds=%s\nresult=%s\n' \
            "$((ended_epoch - started_epoch))" "${BUILD_OUTCOME:-unknown}"

      # The publication stage under test: one raw `docker push` from the runner to TCR. No
      # retry, no timeout wrapper and no output rewriting - the registry's own failure text
      # (DNS, TCP, TLS, auth, registry API, blob upload, manifest publication, timeout,
      # connection reset, rate limit) reaches the log exactly as docker printed it, together
      # with how long the attempt took before it failed.
      - name: Push the benchmark image directly to TCR
        if: steps.build.outcome == 'success'
        id: push
        shell: bash
        env:
          TARGET_IMAGE: ${{ steps.identity.outputs.target_image }}
        run: |
          set -euo pipefail
          push_started_epoch="$(date -u +%s)"
          push_result=0
          docker push "$TARGET_IMAGE" || push_result=$?
          push_ended_epoch="$(date -u +%s)"
          if [ "$push_result" -eq 0 ]; then push_state=PASS; else push_state=FAIL; fi
          printf 'stage=tcr-push\nduration_seconds=%s\nresult=%s\n' \
            "$((push_ended_epoch - push_started_epoch))" "$push_state"
          [ "$push_result" -eq 0 ]

      # Manifest read-back only: the benchmark must never pull the image back. The push stage
      # created the registry manifest, so the gate is that TCR serves a well-formed manifest
      # descriptor for the benchmark tag.
      - name: Verify the published benchmark tag in TCR
        if: steps.push.outcome == 'success'
        shell: bash
        env:
          TARGET_IMAGE: ${{ steps.identity.outputs.target_image }}
          BENCHMARK_TAG: ${{ steps.identity.outputs.benchmark_tag }}
        run: |
          set -euo pipefail
          verify_started_epoch="$(date -u +%s)"
          readback_result=0
          registry_digest="$(docker buildx imagetools inspect \
            --format '{{.Manifest.Digest}}' "$TARGET_IMAGE")" || readback_result=$?
          verify_ended_epoch="$(date -u +%s)"
          if [ "$readback_result" -eq 0 ]; then readback_state=PASS; else readback_state=FAIL; fi
          printf 'stage=tcr-verify\nduration_seconds=%s\nresult=%s\n' \
            "$((verify_ended_epoch - verify_started_epoch))" "$readback_state"
          [ "$readback_result" -eq 0 ] || {
            echo "::error::TCR manifest read-back failed for $TARGET_IMAGE; that is a publication result, not a runner build result." >&2
            exit 1
          }
          [[ "$registry_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::TCR returned '${registry_digest}' for $TARGET_IMAGE instead of a manifest descriptor; that is a publication/identity result, not a network result." >&2
            exit 1
          }
          printf 'TCR_TARGET=%s\nTCR_TAG=%s\nTCR_DIGEST=%s\nTCR_PUBLICATION=PASS\n' \
            "$TARGET_IMAGE" "$BENCHMARK_TAG" "$registry_digest"

      - name: Report benchmark total duration
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          set -euo pipefail
          ended_epoch="$(date -u +%s)"
          benchmark_started_epoch="${BENCHMARK_START_EPOCH:-$ended_epoch}"
          printf 'stage=benchmark-end\nbuild_result=%s\npush_result=%s\n' \
            "${BUILD_OUTCOME:-unknown}" "${PUSH_OUTCOME:-unknown}"
          printf 'stage=benchmark-total\nduration_seconds=%s\n' \
            "$((ended_epoch - benchmark_started_epoch))"
