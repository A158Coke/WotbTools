name: PR 248 browser gate syntax fix

on:
  push:
    branches:
      - fix/playback-fullscreen-hud-position

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/playback-fullscreen-hud-position
          fetch-depth: 0
      - name: Fix template-literal comment syntax
        shell: python
        run: |
          from pathlib import Path
          path = Path('frontend/scripts/browser-playback-layout.mjs')
          src = path.read_text(encoding='utf-8')
          old1 = '// This module script is deferred by HTML and `load` waits for its module graph to finish.'
          old2 = '// Publish the geometry result synchronously during module evaluation so Chrome `--dump-dom`'
          new1 = "// This module script is deferred by HTML and the load event waits for its module graph to finish."
          new2 = "// Publish the geometry result synchronously during module evaluation so Chrome --dump-dom"
          if src.count(old1) != 1 or src.count(old2) != 1:
              raise SystemExit('expected template-literal comments not found')
          src = src.replace(old1, new1, 1).replace(old2, new2, 1)
          path.write_text(src, encoding='utf-8')
          Path('.github/workflows/pr248-browser-gate-syntax-fix.yml').unlink()
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/scripts/browser-playback-layout.mjs
          git add -u .github/workflows/pr248-browser-gate-syntax-fix.yml
          git diff --cached --check
          git commit -m "test(playback): fix browser gate template syntax"
          git push origin HEAD:fix/playback-fullscreen-hud-position
