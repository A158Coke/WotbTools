name: Data / Equipment Update
run-name: Sync equipment from BlitzKit by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-equipment
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Sync equipment catalog from stable BlitzKit data
        run: |
          set -euo pipefail
          python3 common/python/sync_equipment_snapshot.py

      - name: Validate catalog and generators
        run: |
          set -euo pipefail
          python3 -m json.tool common/wotb-item-catalog-json/equipment.json >/dev/null
          python3 -m unittest discover -s common/python/tests -p 'test_*.py'
          git diff --check

      - name: Commit data branch and open/update PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/update-equipment
        run: |
          set -euo pipefail
          cat > /tmp/equipment-pr-body.md <<'BODY'
          Automated equipment update from current BlitzKit data.

          - Accepts new WoTB builds and changed protobuf snapshots when existing parsers can fully understand them
          - Imports supported metadata/value changes into the generated catalog
          - Allows preset/layout changes without assuming one universal equipment grid
          - Fails closed for newly referenced equipment IDs until a complete local effect model exists
          - Fails closed when a partially modeled locked item changes
          - Calculation-source changes are accepted only while strict extraction patterns still match
          - Uses stable-snapshot reads and records upstream hashes in logs
          - Avoids rewriting the catalog when generated semantics are unchanged
          - Explicitly dispatches normal CI for this automation branch
          - Never auto-merges
          BODY
          bash scripts/ci/publish-data-update.sh \
            --branch "$BRANCH" \
            --commit-message "chore(data): sync BlitzKit equipment values" \
            --pr-title "chore(data): sync BlitzKit equipment values" \
            --pr-body-file /tmp/equipment-pr-body.md \
            --path common/wotb-item-catalog-json/equipment.json
