name: Ops / TX Runtime Check
run-name: Ops / TX runtime check by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false
  queue: max

env:
  PRODUCTION_INPUT_PATHS: |
    .github/workflows/tx-runtime-check.yml
    deploy/check-production-freshness.sh
    deploy/tx/runtime-check.sh
    deploy/tx/runtime-check-lib.sh
    deploy/tx/deploy.sh
    deploy/tx/with-deploy-lock.sh

jobs:
  runtime_check:
    name: TX_RUNTIME_READY
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: tx-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Freeze exact current main
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash deploy/check-production-freshness.sh "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"

      - name: Stage exact-SHA verifier bundle
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tx/runtime-check.sh,deploy/tx/runtime-check-lib.sh,deploy/tx/deploy.sh,deploy/tx/with-deploy-lock.sh
          target: /tmp/wotb-tx-runtime-check-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 2
          overwrite: true

      - name: Reject stale main before runtime check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash deploy/check-production-freshness.sh "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"

      - name: Run exact-SHA read-only TX runtime gate
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 12m
          envs: VERIFIER_DIR,WOTB_TX_DIR,TX_RUNTIME_ROOT,TX_IMAGE_REGISTRY_PREFIX,KC_POSTGRES_ADMIN_USER,KC_POSTGRES_ADMIN_PASSWORD,KC_BOOTSTRAP_ADMIN_PASSWORD,KC_DB_USERNAME,KC_DB_PASSWORD,TX_KEYCLOAK_DB_HOST,TX_KEYCLOAK_DB_PORT,WG_APPLICATION_ID,CADDY_ACME_EMAIL,CADDY_FRONTEND_UPSTREAM,CADDY_KEYCLOAK_UPSTREAM,TX_BUSINESS_POSTGRES_ADMIN_USER,TX_BUSINESS_POSTGRES_ADMIN_PASSWORD,TX_BUSINESS_DB_NAME,TX_BUSINESS_DB_USERNAME,TX_BUSINESS_DB_PASSWORD,TX_BUSINESS_DB_HOST,TX_BUSINESS_DB_PORT,TX_KEYCLOAK_ADMIN_SERVER_URL,TX_BACKEND_UPSTREAM,TX_AI_UPSTREAM,KEYCLOAK_ADMIN_CLIENT_SECRET,KEYCLOAK_E2E_CLIENT_SECRET
          script: |
            set -Eeuo pipefail
            case "$VERIFIER_DIR" in
              /tmp/wotb-tx-runtime-check-*) ;;
              *) echo "Unsafe verifier directory: $VERIFIER_DIR" >&2; exit 2 ;;
            esac
            test -d "$VERIFIER_DIR"
            test ! -L "$VERIFIER_DIR"

            runtime="$VERIFIER_DIR/runtime-check.sh"
            lock_wrapper="$VERIFIER_DIR/with-deploy-lock.sh"
            deploy_helper="$VERIFIER_DIR/deploy.sh"
            runtime_lib="$VERIFIER_DIR/runtime-check-lib.sh"
            for file in "$runtime" "$lock_wrapper" "$deploy_helper" "$runtime_lib"; do
              test -f "$file"
              test ! -L "$file"
            done

            running_image() {
              local service="$1" id
              id="$(docker ps --filter label=com.docker.compose.project=deploy --filter "label=com.docker.compose.service=$service" --format '{{.ID}}' | head -n 1)"
              [ -n "$id" ] || { echo "TX runtime service is not running: $service" >&2; return 1; }
              docker inspect --format '{{.Config.Image}}' "$id"
            }

            export TX_FRONTEND_IMAGE_REF="$(running_image wotb-frontend)"
            export TX_BUSINESS_API_IMAGE_REF="$(running_image business-api)"

            assert_digest_image() {
              local actual="$1" repository="$2" digest
              case "$actual" in
                "$TX_IMAGE_REGISTRY_PREFIX/$repository@sha256:"*) ;;
                *) echo "Running image is not the expected TCR digest-pinned image: $repository" >&2; return 1 ;;
              esac
              digest="$(printf '%s' "$actual" | sed -n 's/^.*@sha256://p')"
              [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || {
                echo "Running image has an invalid sha256 digest: $repository" >&2
                return 1
              }
            }
            assert_digest_image "$TX_FRONTEND_IMAGE_REF" wotbtools-frontend
            assert_digest_image "$TX_BUSINESS_API_IMAGE_REF" wotbtools-business-api

            set +e
            output="$(bash "$lock_wrapper" bash "$runtime" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            [ "$status" -eq 0 ] || exit "$status"
            grep -Fxq 'TX_RUNTIME_READY' <<< "$output"
        env:
          VERIFIER_DIR: /tmp/wotb-tx-runtime-check-${{ github.run_id }}-${{ github.run_attempt }}
          WOTB_TX_DIR: /opt/wotb-tx
          TX_RUNTIME_ROOT: /opt/wotb-tx
          TX_IMAGE_REGISTRY_PREFIX: ${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}
          KC_POSTGRES_ADMIN_USER: kc_admin
          KC_POSTGRES_ADMIN_PASSWORD: ${{ secrets.TX_KC_POSTGRES_ADMIN_PASSWORD }}
          KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.TX_KC_BOOTSTRAP_ADMIN_PASSWORD }}
          KC_DB_USERNAME: keycloak
          KC_DB_PASSWORD: ${{ secrets.TX_KC_DB_PASSWORD }}
          TX_KEYCLOAK_DB_HOST: keycloak-postgres
          TX_KEYCLOAK_DB_PORT: '5432'
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
          CADDY_ACME_EMAIL: ${{ vars.CADDY_ACME_EMAIL }}
          CADDY_FRONTEND_UPSTREAM: wotb-frontend:80
          CADDY_KEYCLOAK_UPSTREAM: keycloak:8080
          TX_BUSINESS_POSTGRES_ADMIN_USER: ${{ vars.TX_BUSINESS_POSTGRES_ADMIN_USER }}
          TX_BUSINESS_POSTGRES_ADMIN_PASSWORD: ${{ secrets.TX_BUSINESS_POSTGRES_ADMIN_PASSWORD }}
          TX_BUSINESS_DB_NAME: ${{ vars.TX_BUSINESS_DB_NAME }}
          TX_BUSINESS_DB_USERNAME: ${{ vars.TX_BUSINESS_DB_USERNAME }}
          TX_BUSINESS_DB_PASSWORD: ${{ secrets.TX_BUSINESS_DB_PASSWORD }}
          # The gate validates the active K6B-1 Docker-local placement. K6B-2
          # updates each value with the corresponding consumer cutover.
          TX_BUSINESS_DB_HOST: business-postgres
          TX_BUSINESS_DB_PORT: '5432'
          TX_KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
          TX_BACKEND_UPSTREAM: http://business-api:8087
          TX_AI_UPSTREAM: http://10.20.0.2:8089
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          KEYCLOAK_E2E_CLIENT_SECRET: ${{ secrets.KEYCLOAK_E2E_CLIENT_SECRET }}

      - name: Clean up exact-SHA verifier bundle
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          envs: VERIFIER_DIR
          script: |
            set -euo pipefail
            case "$VERIFIER_DIR" in
              /tmp/wotb-tx-runtime-check-*) ;;
              *) echo "Unsafe verifier directory: $VERIFIER_DIR" >&2; exit 2 ;;
            esac
            if [ -d "$VERIFIER_DIR" ] && [ ! -L "$VERIFIER_DIR" ]; then
              rm -f --                 "$VERIFIER_DIR/runtime-check.sh"                 "$VERIFIER_DIR/runtime-check-lib.sh"                 "$VERIFIER_DIR/deploy.sh"                 "$VERIFIER_DIR/with-deploy-lock.sh"
              rmdir -- "$VERIFIER_DIR"
            fi
        env:
          VERIFIER_DIR: /tmp/wotb-tx-runtime-check-${{ github.run_id }}-${{ github.run_attempt }}
