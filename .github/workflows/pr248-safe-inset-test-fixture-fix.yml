name: PR 248 safe inset test fixture fix

on:
  push:
    branches:
      - fix/playback-fullscreen-hud-position

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/playback-fullscreen-hud-position
          fetch-depth: 0
      - name: Apply staged patch
        run: python .github/pr248_patch.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/components/BattlePlayback.integration.test.js frontend/src/components/BattlePlayback.vue
          git add -u .github/workflows/pr248-safe-inset-test-fixture-fix.yml .github/pr248_patch.py
          git diff --cached --check
          git commit -m "test(playback): model mobile overlay occupied geometry"
          git push origin HEAD:fix/playback-fullscreen-hud-position
