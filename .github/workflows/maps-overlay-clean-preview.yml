name: Preview map overlay cleanup

on:
  push:
    branches:
      - feat/maps-hd-assets
    paths:
      - .github/workflows/maps-overlay-clean-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow opencv-python-headless numpy
      - name: Build cleaned previews from main originals
        run: |
          git checkout origin/main -- frontend/src/assets/maps
          mkdir -p /tmp/cleaned /tmp/preview
          python - <<'PY'
          from pathlib import Path
          import math
          import cv2
          import numpy as np
          from PIL import Image, ImageDraw

          src = Path('frontend/src/assets/maps')
          cleaned = Path('/tmp/cleaned')
          preview = Path('/tmp/preview')
          skip = {'winter-malinovka.png','desert-sands.png','canal.png','oasis-palms.png'}

          def spawn_mask(img):
              hsv = cv2.cvtColor(img, cv2.COLOR_BGR2HSV)
              h,s,v = cv2.split(hsv)
              # saturated WG-style red/green spawn diamonds only
              red = (((h < 15) | (h > 165)) & (s > 125) & (v > 80))
              green = ((h > 35) & (h < 95) & (s > 125) & (v > 80))
              raw = ((red | green).astype(np.uint8) * 255)
              n, labels, stats, cent = cv2.connectedComponentsWithStats(raw, 8)
              mask = np.zeros(raw.shape, np.uint8)
              H,W = raw.shape
              for i in range(1,n):
                  x,y,w,h,area = stats[i]
                  # spawn icon components are medium blobs, not tiny terrain pixels / giant regions
                  if 18 <= area <= 4500 and 5 <= w <= W*0.18 and 5 <= h <= H*0.18:
                      pad = max(5, int(max(w,h)*0.32))
                      x0=max(0,x-pad); y0=max(0,y-pad); x1=min(W,x+w+pad); y1=min(H,y+h+pad)
                      mask[y0:y1,x0:x1] = cv2.bitwise_or(mask[y0:y1,x0:x1], (labels[y0:y1,x0:x1]==i).astype(np.uint8)*255)
              mask = cv2.dilate(mask, np.ones((9,9),np.uint8), iterations=2)
              return mask

          def base_circle_mask(img, expected=3):
              gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)
              hsv = cv2.cvtColor(img, cv2.COLOR_BGR2HSV)
              Hh,S,V = cv2.split(hsv)
              blur = cv2.GaussianBlur(gray,(5,5),1)
              H,W = gray.shape
              minr=max(10,int(min(H,W)*0.015)); maxr=max(minr+3,int(min(H,W)*0.04))
              circles = cv2.HoughCircles(blur, cv2.HOUGH_GRADIENT, dp=1.0,
                  minDist=max(30,int(min(H,W)*0.07)), param1=110, param2=19,
                  minRadius=minr, maxRadius=maxr)
              if circles is None:
                  return np.zeros(gray.shape,np.uint8), []
              yy,xx=np.mgrid[0:H,0:W]
              white=(S<75)&(V>170)
              scored=[]
              for x,y,r in np.round(circles[0]).astype(int):
                  dist=np.sqrt((xx-x)**2+(yy-y)**2)
                  ring=(dist>=r-3)&(dist<=r+3)
                  inner=dist<max(2,r-5)
                  if not ring.any(): continue
                  ring_white=float(white[ring].mean())
                  ring_bright=float((V[ring]>155).mean())
                  center_white=float(white[inner].mean()) if inner.any() else 0
                  score=ring_white*2.0 + ring_bright*0.45 + center_white*0.35
                  # UI bases are not at extreme 2% border
                  if x < W*0.025 or x > W*0.975 or y < H*0.025 or y > H*0.975:
                      score -= 0.5
                  scored.append((score,x,y,r))
              scored.sort(reverse=True)
              # Most current baked maps use A/B/C. Canal is skipped because user supplied replacement has A-D.
              picked=scored[:expected]
              mask=np.zeros(gray.shape,np.uint8)
              for score,x,y,r in picked:
                  rr=int(r*1.42)
                  cv2.circle(mask,(x,y),rr,255,-1)
              return mask,picked

          def long_line_mask(img):
              H,W=img.shape[:2]
              mask=np.zeros((H,W),np.uint8)
              # Detect straight overlay lines; only near-horizontal/vertical and very long.
              gray=cv2.cvtColor(img,cv2.COLOR_BGR2GRAY)
              edges=cv2.Canny(gray,60,150)
              lines=cv2.HoughLinesP(edges,1,np.pi/180,threshold=max(80,int(min(H,W)*0.18)),
                  minLineLength=int(min(H,W)*0.48),maxLineGap=16)
              if lines is not None:
                  for l in lines[:,0]:
                      x1,y1,x2,y2=map(int,l)
                      dx=abs(x2-x1); dy=abs(y2-y1)
                      if dx > W*0.45 and dy <= max(3,H*0.01):
                          cv2.line(mask,(x1,y1),(x2,y2),255,max(3,int(H*0.007)))
                      elif dy > H*0.45 and dx <= max(3,W*0.01):
                          cv2.line(mask,(x1,y1),(x2,y2),255,max(3,int(W*0.007)))
              # Detect saturated red straight inner boundary/grid overlays without masking spawn blobs broadly.
              hsv=cv2.cvtColor(img,cv2.COLOR_BGR2HSV)
              h,s,v=cv2.split(hsv)
              red=((((h<12)|(h>170))&(s>90)&(v>90)).astype(np.uint8)*255)
              red_lines=cv2.HoughLinesP(red,1,np.pi/180,threshold=max(45,int(min(H,W)*0.1)),
                  minLineLength=int(min(H,W)*0.35),maxLineGap=12)
              if red_lines is not None:
                  for l in red_lines[:,0]:
                      x1,y1,x2,y2=map(int,l); dx=abs(x2-x1); dy=abs(y2-y1)
                      if (dx>W*0.33 and dy<=max(4,H*0.012)) or (dy>H*0.33 and dx<=max(4,W*0.012)):
                          cv2.line(mask,(x1,y1),(x2,y2),255,max(4,int(min(H,W)*0.009)))
              return cv2.dilate(mask,np.ones((5,5),np.uint8),iterations=1)

          records=[]
          for p in sorted(src.glob('*.png')):
              if p.name in skip:
                  continue
              img=cv2.imread(str(p),cv2.IMREAD_COLOR)
              if img is None: raise RuntimeError(p)
              sm=spawn_mask(img)
              bm,picked=base_circle_mask(img,3)
              lm=long_line_mask(img)
              mask=cv2.bitwise_or(sm,bm)
              mask=cv2.bitwise_or(mask,lm)
              # NS is less prone than Telea to starburst artifacts on thin grid/icon masks.
              out=cv2.inpaint(img,mask,5,cv2.INPAINT_NS)
              cv2.imwrite(str(cleaned/p.name),out,[cv2.IMWRITE_PNG_COMPRESSION,9])
              cv2.imwrite(str(preview/(p.stem+'-mask.png')),mask)
              records.append((p.name,picked))

          # Contact sheet of cleaned maps.
          thumbs=[]
          for p in sorted(cleaned.glob('*.png')):
              with Image.open(p) as im:
                  im=im.convert('RGB'); im.thumbnail((420,420),Image.Resampling.LANCZOS)
                  c=Image.new('RGB',(440,460),'black')
                  c.paste(im,((440-im.width)//2,10+(420-im.height)//2))
                  ImageDraw.Draw(c).text((10,435),p.name,fill='white')
                  thumbs.append(c)
          cols=4; rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*440,rows*460),'black')
          for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*440,(i//cols)*460))
          sheet.save(preview/'cleaned-contact-sheet.jpg',quality=92)
          (preview/'base-candidates.txt').write_text('\n'.join(f'{n}: {c}' for n,c in records),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: maps-overlay-clean-preview
          path: |
            /tmp/preview
            /tmp/cleaned
          retention-days: 1
