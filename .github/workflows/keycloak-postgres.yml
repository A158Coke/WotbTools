name: Keycloak PostgreSQL

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/keycloak-postgres.yml
      - deploy/tx/keycloak-postgres.compose.yml
      - deploy/tx/runtime-check-lib.sh
      - infra/tofu/postgres-keycloak/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false
  queue: max

env:
  PRODUCTION_INPUT_PATHS: |
    .github/workflows/keycloak-postgres.yml
    deploy/tx/keycloak-postgres.compose.yml
    deploy/tx/runtime-check-lib.sh
    infra/tofu/postgres-keycloak/**

jobs:
  keycloak_postgres:
    name: Reconcile Keycloak PostgreSQL on TX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tx-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Freeze current main
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REF" == refs/heads/main ]] || { echo 'Keycloak PostgreSQL workflow requires main.' >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'The event SHA must be a full lowercase commit SHA.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo 'Checkout SHA differs from the event SHA.' >&2; exit 1; }
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh"  "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Stage Keycloak PostgreSQL runtime and OpenTofu root
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tx/keycloak-postgres.compose.yml,deploy/tx/runtime-check-lib.sh,infra/tofu/postgres-keycloak
          target: /opt/wotb-tx/tofu.incoming/${{ steps.source.outputs.source_sha }}
          overwrite: true

      - name: Reject stale main before TX mutation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh"  "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"

      - name: Reconcile runtime, apply exact Keycloak PostgreSQL plan, and verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 35m
          envs: SOURCE_SHA,WOTB_DEPLOY_CONFIG_SHA,KC_POSTGRES_ADMIN_USER,KC_POSTGRES_ADMIN_PASSWORD,KC_DB_PASSWORD,KC_DB_PASSWORD_VERSION
          script: |
            set -Eeuo pipefail
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$WOTB_DEPLOY_CONFIG_SHA" == "$SOURCE_SHA" ]]

            stage="/opt/wotb-tx/tofu.incoming/$SOURCE_SHA"
            root="$stage/infra/tofu/postgres-keycloak"
            compose="$stage/deploy/tx/keycloak-postgres.compose.yml"
            validator="$stage/deploy/tx/runtime-check-lib.sh"
            test -d "$root"
            test -f "$compose"
            test -f "$validator"

            state_dir=/opt/wotb-tx/postgres-keycloak-tofu-state
            state_file="$state_dir/terraform.tfstate"
            state_marker="$state_dir/bootstrap-complete"
            [[ -d "$state_dir" && ! -L "$state_dir" && -f "$state_file" && -s "$state_file" && ! -L "$state_file"  && -f "$state_marker" && -s "$state_marker" && ! -L "$state_marker" ]]  && grep -qx 'local-tofu-state-bootstrap-v1' "$state_marker" || {
              echo 'Local OpenTofu state is not bootstrapped or is unsafe; refusing to initialize an empty production state.' >&2
              exit 1
            }

            test -f /opt/wotb-tx/tofurc
            for name in KC_POSTGRES_ADMIN_USER KC_POSTGRES_ADMIN_PASSWORD KC_DB_PASSWORD KC_DB_PASSWORD_VERSION; do
              test -n "$(printenv "$name")" || { echo "$name is required." >&2; exit 2; }
            done
            command -v docker >/dev/null
            docker compose version >/dev/null
            command -v flock >/dev/null
            command -v tofu >/dev/null
            command -v jq >/dev/null
            command -v python3 >/dev/null
            command -v ip >/dev/null

            exec 9>/opt/wotb-tx/.deploy.lock
            flock -n 9 || { echo 'Another TX production mutation is running.' >&2; exit 1; }

            ip link show wg0 >/dev/null
            ip -4 addr show dev wg0 | grep -Eq 'inet 10\.20\.0\.1/24([[:space:]]|$)' || {
              echo 'wg0 must have 10.20.0.1/24.' >&2
              exit 1
            }
            ip route get 10.20.0.2 >/dev/null

            source "$validator"
            compose_json="$(KC_POSTGRES_ADMIN_USER="$KC_POSTGRES_ADMIN_USER" \
              KC_POSTGRES_ADMIN_PASSWORD="$KC_POSTGRES_ADMIN_PASSWORD" \
              docker compose -p deploy -f "$compose" config --format json)"
            assert_tx_service_ports keycloak-postgres <<< "$compose_json" || {
              echo 'Keycloak PostgreSQL service bindings are invalid; live runtime was not changed.' >&2
              exit 1
            }
            jq -e '
              .name == "deploy" and
              .volumes.keycloak_postgres_data.name == "deploy_keycloak_postgres_data" and
              .networks.default.name == "wotb_tx_internal" and
              any(.services["keycloak-postgres"].volumes[]?;
                .source == "keycloak_postgres_data" and .target == "/var/lib/postgresql")
            ' <<< "$compose_json" >/dev/null || {
              echo 'Keycloak PostgreSQL Compose project, network, or persistent volume identity changed.' >&2
              exit 1
            }
            docker volume inspect deploy_keycloak_postgres_data >/dev/null || {
              echo 'Expected Keycloak PostgreSQL data volume is missing; refusing to create a new volume.' >&2
              exit 1
            }
            volume_project="$(docker volume inspect --format '{{ index .Labels "com.docker.compose.project" }}' deploy_keycloak_postgres_data)"
            volume_key="$(docker volume inspect --format '{{ index .Labels "com.docker.compose.volume" }}' deploy_keycloak_postgres_data)"
            [[ "$volume_project" == deploy && "$volume_key" == keycloak_postgres_data ]] || {
              echo 'Keycloak PostgreSQL volume labels do not match the existing Compose identity.' >&2
              exit 1
            }
            docker network inspect wotb_tx_internal >/dev/null || {
              echo 'Expected TX runtime network is missing; refusing to create a separate network.' >&2
              exit 1
            }
            existing_container="$(docker compose -p deploy -f "$compose" ps -aq keycloak-postgres)"
            if [ -n "$existing_container" ]; then
              mounted_volume="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql"}}{{.Name}}{{end}}{{end}}' "$existing_container")"
              [[ "$mounted_volume" == deploy_keycloak_postgres_data ]] || {
                echo 'Existing Keycloak PostgreSQL container is attached to another volume; refusing recreation.' >&2
                exit 1
              }
            fi

            live_compose=/opt/wotb-tx/deploy/keycloak-postgres.compose.yml
            install -m 600 "$compose" "$live_compose.next.$SOURCE_SHA"
            mv -f -- "$live_compose.next.$SOURCE_SHA" "$live_compose"
            docker compose -p deploy -f "$live_compose" pull keycloak-postgres
            docker compose -p deploy -f "$live_compose" up -d --no-deps --force-recreate keycloak-postgres

            runtime_ready=false
            for attempt in $(seq 1 30); do
              if docker compose -p deploy -f "$live_compose" exec -T keycloak-postgres pg_isready -U "$KC_POSTGRES_ADMIN_USER" -d postgres >/dev/null 2>&1; then
                runtime_ready=true
                break
              fi
              [ "$attempt" -lt 30 ] && sleep 2
            done
            [ "$runtime_ready" = true ] || {
              echo 'Keycloak PostgreSQL runtime did not become ready.' >&2
              docker compose -p deploy -f "$live_compose" ps -a keycloak-postgres >&2 || true
              docker compose -p deploy -f "$live_compose" logs --tail 120 keycloak-postgres >&2 || true
              exit 1
            }

            export TF_CLI_CONFIG_FILE=/opt/wotb-tx/tofurc
            export TF_VAR_postgresql_admin_username="$KC_POSTGRES_ADMIN_USER"
            export TF_VAR_postgresql_admin_password="$KC_POSTGRES_ADMIN_PASSWORD"
            export TF_VAR_keycloak_role_password="$KC_DB_PASSWORD"
            export TF_VAR_keycloak_role_password_version="$KC_DB_PASSWORD_VERSION"

            umask 077
            cd "$root"
            trap 'rm -f -- plan.tfplan second-plan.tfplan' EXIT
            tofu fmt -check -recursive
            tofu init -reconfigure -input=false
            tofu validate
            tofu plan -input=false -no-color -out=plan.tfplan
            bash ./validate-plan.sh plan.tfplan
            tofu apply -input=false -auto-approve plan.tfplan
            tofu plan -input=false -no-color -out=second-plan.tfplan
            second_json="$(tofu show -json second-plan.tfplan)"
            if ! jq -e 'type == "object" and (.resource_changes | type == "array") and all(.resource_changes[]; ((.change.actions // []) == ["no-op"]))' <<< "$second_json" >/dev/null; then
              echo 'Keycloak PostgreSQL second plan is malformed or not clean.' >&2
              exit 1
            fi

            docker compose -p deploy -f "$live_compose" exec -T keycloak-postgres pg_isready -U "$KC_POSTGRES_ADMIN_USER" -d keycloak

        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          WOTB_DEPLOY_CONFIG_SHA: ${{ steps.source.outputs.source_sha }}
          KC_POSTGRES_ADMIN_USER: kc_admin
          KC_POSTGRES_ADMIN_PASSWORD: ${{ secrets.TX_KC_POSTGRES_ADMIN_PASSWORD }}
          KC_DB_PASSWORD: ${{ secrets.TX_KC_DB_PASSWORD }}
          KC_DB_PASSWORD_VERSION: ${{ vars.TX_KC_DB_PASSWORD_VERSION || '1' }}
