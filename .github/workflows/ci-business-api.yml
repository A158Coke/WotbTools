name: CI / business-api
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: docker/setup-buildx-action@v4
      - name: Build Business API image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.business-api
          push: false
          build-args: BUILD_COMMIT=${{ inputs.head_sha }}
  backend:
    name: Business API modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v4
        with:
          path: java/.m2repo
          key: ${{ runner.os }}-maven-${{ hashFiles('java/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Maven test for Business API and dependencies
        working-directory: java
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -s settings-ci.xml -Dmaven.repo.local=.m2repo -pl wotb-web -am test
  http_contract:
    name: HTTP contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend contract tooling
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Validate OpenAPI and local refs
        working-directory: frontend
        run: npm run api:lint
      - name: Verify generated frontend contract is current
        working-directory: frontend
        run: npm run api:check
      - name: Validate shared Playback fixture
        working-directory: frontend
        run: npm run api:fixture
      - name: Runtime contract tests
        working-directory: frontend
        run: npx vitest run src/api/contract-runtime.test.ts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Backend Playback serialization contract tests
        working-directory: java
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -s settings-ci.xml -Dmaven.repo.local=.m2repo -pl wotb-web -am -DskipTests install
          mvn --batch-mode --no-transfer-progress -s settings-ci.xml -Dmaven.repo.local=.m2repo -pl wotb-web -Dtest=BattlePlaybackDatasetTest,BattlePlaybackProjectorTest,ReplayArtifactWriterTest -Dsurefire.failIfNoSpecifiedTests=true test
