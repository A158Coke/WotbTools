name: CI / business-api
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      # 保守默认 false：未显式证明 Frontend 已承担完整 HTTP 契约检查时，
      # Business API 仍执行原有 http_contract。
      frontend_affected:
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: wotb
          POSTGRES_USER: wotb
          POSTGRES_PASSWORD: smoke-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wotb -d wotb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Business API image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.business-api
          push: false
          load: true
          tags: business-api:ci
          build-args: BUILD_COMMIT=${{ inputs.head_sha }}
      - name: Smoke test Business API startup
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          trap 'docker logs business-api-smoke; docker rm -f business-api-smoke' EXIT
          test "$(docker image inspect business-api:ci --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^BUILD_COMMIT=')" = "BUILD_COMMIT=$EXPECTED_COMMIT"
          # Fixture endpoints avoid contacting production Keycloak.
          docker run -d --name business-api-smoke --network host \
            -e POSTGRES_PASSWORD=smoke-only \
            -e KEYCLOAK_ADMIN_CLIENT_SECRET=smoke-only \
            -e KEYCLOAK_ADMIN_SERVER_URL=http://127.0.0.1:18080 \
            -e KEYCLOAK_ISSUER_URI=http://127.0.0.1:18080/realms/smoke \
            -e SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://127.0.0.1:18080/realms/smoke/certs \
            business-api:ci
          curl --fail --silent --show-error --retry 60 --retry-connrefused \
            --retry-delay 2 --retry-max-time 120 --max-time 5 \
            http://127.0.0.1:8088/actuator/health/readiness | jq -e '.status == "UP"'
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8087/api/health
  backend:
    name: Business API modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: java/.m2repo
          key: ${{ runner.os }}-maven-${{ hashFiles('java/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Maven verify for Business API and dependencies
        working-directory: java
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -s settings-ci.xml -Dmaven.repo.local=.m2repo -pl wotb-web -am verify
  http_contract:
    name: HTTP contract
    # Frontend 与 Business API 同时受影响时，完整 HTTP 契约检查由 Frontend owner
    # 承担（见 ci-frontend.yml），此处跳过；其余情况本 job 仍是唯一执行位置。
    if: ${{ !inputs.frontend_affected }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend contract tooling
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Validate OpenAPI and local refs
        working-directory: frontend
        run: pnpm run api:lint
      - name: Verify generated frontend contract is current
        working-directory: frontend
        run: pnpm run api:check
      - name: Validate shared Playback fixture
        working-directory: frontend
        run: pnpm run api:fixture
      - name: Runtime contract tests
        working-directory: frontend
        run: pnpm exec vitest run src/api/contract-runtime.test.ts
