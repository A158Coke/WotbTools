name: CI / komodo-periphery

# Pull-request validation for the Komodo Periphery owner (K3.1+). This workflow
# never reads production secrets, never SSHes a production host, never touches
# production state, and never downloads or executes the Periphery artifact.
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: Komodo Periphery contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - name: Bash syntax
        run: |
          set -euo pipefail
          for script in deploy/periphery/*.sh; do
            bash -n "$script"
          done
      # The owner's existing fixture entrypoint: staging-root path safety, the
      # release/config/unit contract, the onboarding-credential lifecycle driven
      # through the real install.sh, and a real ":8120 has no listener" probe.
      - name: Validate the shared Periphery lifecycle and safety fixtures
        run: bash deploy/periphery/test-periphery.sh
      - name: Validate Alibaba asset target profile
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/ali-target.out"
          bash deploy/periphery/read-target-profile.sh ali-sh-asset-01 "$out"
          grep -Fxq 'connect_as=ali-sh-asset-01' "$out"
          grep -Fxq 'lock_root=/opt/wotb-asset' "$out"
          grep -Fxq 'staging_root=/opt/wotb-asset/periphery' "$out"
          grep -Fxq 'privilege=sudo' "$out"

          config=deploy/periphery/targets/ali-sh-asset-01/periphery.config.toml
          grep -Fxq 'root_directory = "/etc/komodo"' "$config"
          grep -Fxq 'core_addresses = ["https://komodo.wotbtools.com"]' "$config"
          grep -Fxq 'connect_as = "ali-sh-asset-01"' "$config"
          grep -Fxq 'server_enabled = false' "$config"
          grep -Fxq 'PERIPHERY_CORE_PORT=443' deploy/periphery/targets/ali-sh-asset-01/target.env
          ! grep -Eq 'onboarding_key|passkeys|(^|[[:space:]])port[[:space:]]*=[[:space:]]*8120' "$config"

          # Exercise the shared connection verifier with the reviewed public Core
          # port. The PID must still match, so an unrelated :443 connection cannot
          # satisfy the lifecycle proof.
          stub="$RUNNER_TEMP/ali-bin"
          mkdir -p "$stub"
          cat > "$stub/ss" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' 'ESTAB 0 0 172.24.21.88:40000 1.2.3.4:443 users:(("periphery",pid=4242,fd=9))'
          EOF
          chmod +x "$stub/ss"
          PATH="$stub:$PATH" bash -c '
            source deploy/periphery/lib.sh
            load_target_profile ali-sh-asset-01 deploy/periphery
            [[ "$periphery_core_port" == 443 ]]
            [[ -n "$(established_core_connections 4242)" ]]
            [[ -z "$(established_core_connections 9999)" ]]
          '
      - name: Validate Alibaba transport workflow contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/komodo-periphery-ali.yml')
          doc = yaml.load(path.read_text(encoding='utf-8'), Loader=yaml.BaseLoader)
          events = doc.get('on', doc.get(True, {}))
          expected_paths = [
              '.github/workflows/komodo-periphery-ali.yml',
              'deploy/check-production-freshness.sh',
              'deploy/periphery/**',
          ]
          assert events['push']['branches'] == ['main']
          assert events['push']['paths'] == expected_paths
          assert doc['env']['PRODUCTION_INPUT_PATHS'].splitlines() == expected_paths
          assert doc['concurrency'] == {
              'group': 'production-maintenance',
              'cancel-in-progress': 'false',
              'queue': 'max',
          }
          assert set(doc['jobs']) == {'reconcile_ali_asset'}
          job = doc['jobs']['reconcile_ali_asset']
          steps = {step.get('name'): step for step in job['steps']}
          assert steps['Read the Alibaba asset target profile']['env']['TARGET'] == 'ali-sh-asset-01'
          stage = steps['Stage exact Periphery inputs on Alibaba asset host']['with']['source']
          staged = {p for p in ''.join(stage.split()).split(',') if p}
          assert staged == {
              'deploy/periphery/lib.sh',
              'deploy/periphery/staging-root.sh',
              'deploy/periphery/install.sh',
              'deploy/periphery/verify.sh',
              'deploy/periphery/reconcile.sh',
              'deploy/periphery/periphery.release',
              'deploy/periphery/periphery.service',
              'deploy/periphery/targets/ali-sh-asset-01/target.env',
              'deploy/periphery/targets/ali-sh-asset-01/periphery.config.toml',
              'periphery-x86_64',
          }, sorted(staged)
          text = json.dumps(doc, ensure_ascii=False)
          for secret in ('ALI_ASSET_VPS_HOST', 'ALI_ASSET_VPS_USER', 'ALI_ASSET_VPS_PORT', 'ALI_ASSET_VPS_SSH_KEY'):
              assert f'secrets.{secret}' in text, secret
          assert 'ONBOARDING_KEY' not in text, 'adopted Alibaba lifecycle must be credential-free'
          reconcile = steps['Reconcile Alibaba asset Periphery under the host lock']
          assert reconcile['env']['PERIPHERY_TARGET'] == 'ali-sh-asset-01'
          assert 'deploy/periphery/reconcile.sh' in reconcile['with']['script']
          assert steps['Cleanup staged Alibaba asset inputs']['if'] == 'always()'
          PY
