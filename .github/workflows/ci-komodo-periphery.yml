name: CI / komodo-periphery

# Pull-request validation for the Komodo Periphery owner. This workflow never
# reads production secrets, never SSHes a production host, never touches
# production state, and never downloads or executes the Periphery artifact.
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: Komodo Periphery contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}

      - name: Bash and Python syntax
        run: |
          set -euo pipefail
          for script in deploy/periphery/*.sh; do
            bash -n "$script"
          done
          python3 -m py_compile deploy/periphery/validate-adoption-config.py

      # One CI fixture step owns the lifecycle contract. The adoption helper is a
      # subordinate fixture, not another test-*.sh entrypoint.
      - name: Validate the shared Periphery lifecycle and safety fixtures
        run: |
          set -euo pipefail
          bash deploy/periphery/test-periphery.sh
          bash deploy/periphery/adopt-existing-fixture.sh

      - name: Validate Alibaba asset target and adoption identity
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/ali-target.out"
          bash deploy/periphery/read-target-profile.sh ali-sh-asset-01 "$out"
          grep -Fxq 'connect_as=ali-sh-asset-01' "$out"
          grep -Fxq 'lock_root=/opt/wotb-asset' "$out"
          grep -Fxq 'staging_root=/opt/wotb-asset/periphery' "$out"
          grep -Fxq 'privilege=sudo' "$out"

          target_env=deploy/periphery/targets/ali-sh-asset-01/target.env
          config=deploy/periphery/targets/ali-sh-asset-01/periphery.config.toml
          grep -Fxq 'root_directory = "/etc/komodo"' "$config"
          grep -Fxq 'core_addresses = ["https://komodo.wotbtools.com"]' "$config"
          grep -Fxq 'connect_as = "ali-sh-asset-01"' "$config"
          grep -Fxq 'server_enabled = false' "$config"
          grep -Fxq 'private_key = "file:/etc/komodo/keys/periphery.key"' "$config"
          grep -Fxq 'core_public_keys = ["file:/etc/komodo/keys/core.pub"]' "$config"
          grep -Fxq 'PERIPHERY_CORE_PORT=443' "$target_env"
          grep -Fxq 'PERIPHERY_CORE_PEER_MATCH=:443' "$target_env"
          ! grep -Eq 'onboarding_key|passkeys|(^|[[:space:]])port[[:space:]]*=[[:space:]]*8120' "$config"

          # The live manually installed file uses singular core_address and
          # implicit defaults. Those are accepted only when they resolve to the
          # exact reviewed identity, trust, operator, and Core semantics.
          valid="$RUNNER_TEMP/ali-installed-valid.toml"
          cat > "$valid" <<'EOF'
          root_directory = "/etc/komodo"
          core_address = "https://komodo.wotbtools.com"
          connect_as = "ali-sh-asset-01"
          EOF
          python3 deploy/periphery/validate-adoption-config.py "$valid" "$config" ali-sh-asset-01

          reject_config() {
            local label="$1" path="$2"
            if python3 deploy/periphery/validate-adoption-config.py "$path" "$config" ali-sh-asset-01; then
              echo "$label was accepted for existing-host adoption" >&2
              exit 1
            fi
          }

          wrong_core="$RUNNER_TEMP/ali-installed-wrong-core.toml"
          sed 's#https://komodo.wotbtools.com#https://wrong-core.invalid:4430#' "$valid" > "$wrong_core"
          reject_config 'wrong Core address' "$wrong_core"

          wrong_as="$RUNNER_TEMP/ali-installed-wrong-connect-as.toml"
          sed 's/connect_as = "ali-sh-asset-01"/connect_as = "wrong-server"/' "$valid" > "$wrong_as"
          reject_config 'wrong connect_as' "$wrong_as"

          insecure="$RUNNER_TEMP/ali-installed-insecure.toml"
          cp "$valid" "$insecure"
          printf '%s\n' 'core_tls_insecure_skip_verify = true' >> "$insecure"
          reject_config 'TLS-insecure Core config' "$insecure"

          wrong_root="$RUNNER_TEMP/ali-installed-wrong-root.toml"
          sed 's#root_directory = "/etc/komodo"#root_directory = "/opt/other-komodo"#' "$valid" > "$wrong_root"
          reject_config 'wrong root_directory' "$wrong_root"

          wrong_key="$RUNNER_TEMP/ali-installed-wrong-key.toml"
          cp "$valid" "$wrong_key"
          printf '%s\n' 'private_key = "file:/tmp/unreviewed-periphery.key"' >> "$wrong_key"
          reject_config 'wrong private_key' "$wrong_key"

          wrong_trust="$RUNNER_TEMP/ali-installed-wrong-trust.toml"
          cp "$valid" "$wrong_trust"
          printf '%s\n' 'core_public_keys = ["file:/tmp/unreviewed-core.pub"]' >> "$wrong_trust"
          reject_config 'wrong core_public_keys' "$wrong_trust"

          extra_semantic="$RUNNER_TEMP/ali-installed-extra-semantic.toml"
          cp "$valid" "$extra_semantic"
          printf '%s\n' 'disable_terminals = true' >> "$extra_semantic"
          reject_config 'extra semantic delta' "$extra_semantic"

          # Exercise the shared socket proof using only ss's remote Peer field.
          stub="$RUNNER_TEMP/ali-bin"
          mkdir -p "$stub"
          cat > "$stub/ss" <<'EOF'
          #!/usr/bin/env bash
          cat "${SS_FIXTURE:?}"
          EOF
          chmod +x "$stub/ss"

          printf '%s\n' 'ESTAB 0 0 172.24.21.88:40000 1.2.3.4:443 users:(("periphery",pid=4242,fd=9))' > "$RUNNER_TEMP/peer-valid"
          printf '%s\n' 'ESTAB 0 0 172.24.21.88:44321 1.2.3.4:80 users:(("periphery",pid=4242,fd=9))' > "$RUNNER_TEMP/peer-local-443xx"
          printf '%s\n' 'ESTAB 0 0 172.24.21.88:40000 1.2.3.4:4430 users:(("periphery",pid=4242,fd=9))' > "$RUNNER_TEMP/peer-4430"
          printf '%s\n' 'ESTAB 0 0 172.24.21.88:40000 1.2.3.4:443 users:(("periphery",pid=9999,fd=9))' > "$RUNNER_TEMP/peer-wrong-pid"

          PATH="$stub:$PATH" SS_FIXTURE="$RUNNER_TEMP/peer-valid" bash -c '
            source deploy/periphery/lib.sh
            load_target_profile ali-sh-asset-01 deploy/periphery
            [[ "$periphery_core_peer_match" == :443 ]]
            [[ -n "$(established_core_connections 4242)" ]]
          '
          for fixture in peer-local-443xx peer-4430 peer-wrong-pid; do
            PATH="$stub:$PATH" SS_FIXTURE="$RUNNER_TEMP/$fixture" bash -c '
              source deploy/periphery/lib.sh
              load_target_profile ali-sh-asset-01 deploy/periphery
              [[ -z "$(established_core_connections 4242)" ]]
            '
          done

          printf '%s\n' 'ESTAB 0 0 10.20.0.3:40000 10.20.0.2:9120 users:(("periphery",pid=4242,fd=9))' > "$RUNNER_TEMP/wg-valid"
          printf '%s\n' 'ESTAB 0 0 10.20.0.3:40000 10.20.0.20:9120 users:(("periphery",pid=4242,fd=9))' > "$RUNNER_TEMP/wg-wrong-peer"
          PATH="$stub:$PATH" SS_FIXTURE="$RUNNER_TEMP/wg-valid" bash -c '
            source deploy/periphery/lib.sh
            load_target_profile tx2 deploy/periphery
            [[ "$periphery_core_peer_match" == 10.20.0.2:9120 ]]
            [[ -n "$(established_core_connections 4242)" ]]
          '
          PATH="$stub:$PATH" SS_FIXTURE="$RUNNER_TEMP/wg-wrong-peer" bash -c '
            source deploy/periphery/lib.sh
            load_target_profile tx2 deploy/periphery
            [[ -z "$(established_core_connections 4242)" ]]
          '

      - name: Validate single-owner Alibaba dependency-chain contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          import yaml

          main_path = Path('.github/workflows/komodo-periphery.yml')
          main = yaml.load(main_path.read_text(encoding='utf-8'), Loader=yaml.BaseLoader)
          main_events = main.get('on', main.get(True, {}))
          expected_paths = [
              '.github/workflows/komodo-periphery.yml',
              '.github/workflows/komodo-periphery-ali.yml',
              'deploy/check-production-freshness.sh',
              'deploy/periphery/**',
          ]
          assert main_events['push']['branches'] == ['main']
          assert main_events['push']['paths'] == expected_paths
          assert main['env']['PRODUCTION_INPUT_PATHS'].splitlines() == expected_paths
          assert main['concurrency'] == {
              'group': 'production-maintenance',
              'cancel-in-progress': 'false',
              'queue': 'max',
          }
          jobs = main['jobs']
          assert jobs['reconcile_tx1']['needs'] == ['reconcile_yecao']
          assert jobs['reconcile_tx2']['needs'] == ['reconcile_tx1']
          ali_call = jobs['reconcile_ali_asset']
          assert ali_call['needs'] == ['reconcile_tx2']
          assert ali_call['uses'] == './.github/workflows/komodo-periphery-ali.yml'
          # Only the five declared Alibaba secrets are handed to the reusable
          # transport; inheriting the whole repository secret set is forbidden.
          # The expression is assembled from parts so this run block never holds
          # a literal Actions secret expression (the engine would interpolate it).
          def secret_ref(name):
              return '$' + '{{ secrets.' + name + ' }}'

          ali_secret_names = (
              'ALI_ASSET_VPS_HOST',
              'ALI_ASSET_VPS_USER',
              'ALI_ASSET_VPS_PORT',
              'ALI_ASSET_VPS_SSH_KEY',
              'KOMODO_ALI_ASSET_ONBOARDING_KEY',
          )
          ali_secrets = {name: secret_ref(name) for name in ali_secret_names}
          assert ali_call['secrets'] == ali_secrets, ali_call['secrets']
          assert set(ali_call) == {'name', 'needs', 'uses', 'secrets'}, sorted(ali_call)
          assert 'secrets: inherit' not in main_path.read_text(encoding='utf-8')

          reusable_path = Path('.github/workflows/komodo-periphery-ali.yml')
          reusable_text = reusable_path.read_text(encoding='utf-8')
          reusable = yaml.load(reusable_text, Loader=yaml.BaseLoader)
          reusable_events = reusable.get('on', reusable.get(True, {}))
          assert set(reusable_events) == {'workflow_call'}, reusable_events
          call_interface = reusable_events['workflow_call']
          assert set(call_interface) == {'secrets'}, sorted(call_interface)
          assert set(call_interface['secrets']) == set(ali_secrets), sorted(call_interface['secrets'])
          assert {name: spec['required'] for name, spec in call_interface['secrets'].items()} == {
              'ALI_ASSET_VPS_HOST': 'true',
              'ALI_ASSET_VPS_USER': 'true',
              'ALI_ASSET_VPS_PORT': 'true',
              'ALI_ASSET_VPS_SSH_KEY': 'true',
              'KOMODO_ALI_ASSET_ONBOARDING_KEY': 'false',
          }, call_interface['secrets']
          assert set(re.findall(r'secrets\.([A-Za-z0-9_]+)', reusable_text)) == set(ali_secrets), \
              sorted(set(re.findall(r'secrets\.([A-Za-z0-9_]+)', reusable_text)))
          assert 'concurrency' not in reusable
          assert set(reusable['jobs']) == {'reconcile'}
          job = reusable['jobs']['reconcile']
          steps = {step.get('name'): step for step in job['steps']}
          assert steps['Read the Alibaba asset target profile']['env']['TARGET'] == 'ali-sh-asset-01'
          stage = steps['Stage exact Periphery inputs on Alibaba asset host']['with']['source']
          staged = {p for p in ''.join(stage.split()).split(',') if p}
          assert staged == {
              'deploy/periphery/lib.sh',
              'deploy/periphery/staging-root.sh',
              'deploy/periphery/adopt-existing.sh',
              'deploy/periphery/validate-adoption-config.py',
              'deploy/periphery/install.sh',
              'deploy/periphery/verify.sh',
              'deploy/periphery/reconcile.sh',
              'deploy/periphery/periphery.release',
              'deploy/periphery/periphery.service',
              'deploy/periphery/targets/ali-sh-asset-01/target.env',
              'deploy/periphery/targets/ali-sh-asset-01/periphery.config.toml',
              'periphery-x86_64',
          }, sorted(staged)
          text = json.dumps(reusable, ensure_ascii=False)
          for secret in ('ALI_ASSET_VPS_HOST', 'ALI_ASSET_VPS_USER', 'ALI_ASSET_VPS_PORT', 'ALI_ASSET_VPS_SSH_KEY'):
              assert f'secrets.{secret}' in text, secret
          adopt = steps['Adopt already-onboarded Alibaba agent if present']
          assert 'sudo -n bash "$stage/deploy/periphery/adopt-existing.sh" "$PERIPHERY_TARGET"' in adopt['with']['script']
          assert adopt['env']['PERIPHERY_TARGET'] == 'ali-sh-asset-01'
          reconcile = steps['Reconcile Alibaba asset Periphery under the host lock']
          assert reconcile['env']['PERIPHERY_TARGET'] == 'ali-sh-asset-01'
          onboarding_ref = reconcile['env']['KOMODO_PERIPHERY_ONBOARDING_KEY']
          assert 'secrets.' in onboarding_ref and 'KOMODO_ALI_ASSET_ONBOARDING_KEY' in onboarding_ref, onboarding_ref
          assert 'KOMODO_PERIPHERY_ONBOARDING_KEY' in reconcile['with']['envs'].split(',')
          assert 'deploy/periphery/reconcile.sh' in reconcile['with']['script']
          assert steps['Cleanup staged Alibaba asset inputs']['if'] == 'always()'

          # Alibaba mutates the host twice after one freeze. Adoption can take
          # minutes, so the shared freshness gate must run again immediately before
          # the reconcile mutation and keep the originally frozen SOURCE_SHA.
          names = [step.get('name') for step in job['steps']]
          first_gate = names.index('Reject stale main before Alibaba asset mutation')
          adopt_index = names.index('Adopt already-onboarded Alibaba agent if present')
          second_gate = names.index('Reject stale main again immediately before the Alibaba reconcile')
          reconcile_index = names.index('Reconcile Alibaba asset Periphery under the host lock')
          assert first_gate < adopt_index < second_gate < reconcile_index, names
          assert second_gate + 1 == reconcile_index, names
          for gate_index in (first_gate, second_gate):
              gate = job['steps'][gate_index]
              assert 'deploy/check-production-freshness.sh' in gate['run'], gate
              assert gate['env']['SOURCE_SHA'] == '$' + '{{ steps.source.outputs.source_sha }}', gate
              assert gate['env']['EVENT_SHA'] == '$' + '{{ github.sha }}', gate
          assert reconcile['env']['SOURCE_SHA'] == '$' + '{{ steps.source.outputs.source_sha }}'
          PY
