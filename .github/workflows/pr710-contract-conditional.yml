name: PR710 contract conditional regenerate

on:
  push:
    branches:
      - fix/android-download-click-observability
    paths:
      - .github/workflows/pr710-contract-conditional.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/android-download-click-observability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Encode Android download click event invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('contracts/http/openapi.yaml')
          text = path.read_text()
          anchor = "        error_id:\n          type: string\n          format: uuid\n          description: Allowed only for failed replay_parse.\n    TournamentEvent:\n"
          replacement = (
              "        error_id:\n"
              "          type: string\n"
              "          format: uuid\n"
              "          description: Allowed only for failed replay_parse.\n"
              "      allOf:\n"
              "        - if:\n"
              "            properties:\n"
              "              event:\n"
              "                const: android_download_click\n"
              "            required: [event]\n"
              "          then:\n"
              "            properties:\n"
              "              platform:\n"
              "                const: web\n"
              "              feature:\n"
              "                const: android_download\n"
              "            not:\n"
              "              anyOf:\n"
              "                - required: [operation_id]\n"
              "                - required: [outcome]\n"
              "                - required: [error_code]\n"
              "                - required: [error_id]\n"
              "    TournamentEvent:\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one ObservabilityEvent anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, replacement, 1))
          PY
      - name: Regenerate and validate HTTP contract
        working-directory: frontend
        run: |
          npm ci
          npm run api:generate
          npm run api:lint
          npm run api:check
          npm run api:fixture
      - name: Verify conditional generated contract
        shell: bash
        run: |
          grep -Fq 'android_download_click' contracts/http/openapi.yaml
          grep -Fq 'const: android_download_click' contracts/http/openapi.yaml
          grep -Fq 'android_download_click' frontend/src/api/generated/http-contract.ts
          grep -Fq 'android_download_click' frontend/src/api/generated/playback-v2.schema.ts
          grep -Fq 'android_download_click' frontend/src/api/generated/contract-validators.js
      - name: Commit generated contract and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/pr710-contract-conditional.yml
          git add contracts/http/openapi.yaml \
            frontend/src/api/generated/http-contract.ts \
            frontend/src/api/generated/playback-v2.schema.ts \
            frontend/src/api/generated/contract-validators.js \
            frontend/src/api/generated/api-error-codes.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(observability): constrain Android download click contract'
          git push origin HEAD:fix/android-download-click-observability
