name: Verify exact WGC minimap source

on:
  push:
    branches:
      - feat/maps-hd-assets
    paths:
      - .github/workflows/map-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install range/DVPL tools
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Monstrofil/wgc-download.git /tmp/wgc-download
          python -m pip install /tmp/wgc-download lz4 Pillow

      - name: Extract mountain MiniMapSmall@2x from current client
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p probe
          cat > /tmp/extract.py <<'PY'
          import io, struct, urllib.request, hashlib, zlib
          from pathlib import Path
          import lz4.block
          from PIL import Image
          from wgc_download.api import USER_AGENT
          from wgc_download.remote7z import parse_archive_index, decompress_entry
          BASE='https://dl-wotb-gc.wargaming.net/wotb.ww.production/wds_default/patches/11.20.0.6254/wotb_11.20.0.6254_client.wgpkg.'
          TARGET='Data/Gfx/UI/BattleScreenHUD/minimap/mountain/MiniMapSmall@2x.packed.webp.dvpl'
          class M(io.RawIOBase):
              BLOCK=256*1024
              def __init__(self):
                  super().__init__(); self.urls=[]; self.sizes=[]; self.starts=[]; total=0
                  for i in range(1,20):
                      u=BASE+f'{i:03d}'
                      try:
                          r=urllib.request.urlopen(urllib.request.Request(u,method='HEAD',headers={'User-Agent':USER_AGENT}),timeout=20); z=int(r.headers['Content-Length'])
                      except Exception: break
                      self.urls.append(u); self.sizes.append(z); self.starts.append(total); total+=z
                  self._size=total; self._pos=0; self._cache={}; print('VOLUMES',len(self.urls),'TOTAL',total)
              def readable(self): return True
              def seekable(self): return True
              def tell(self): return self._pos
              def seek(self,o,w=0): self._pos=o if w==0 else self._pos+o if w==1 else self._size+o; return self._pos
              def _fetch(self,s,n):
                  out=bytearray(); p=s
                  while n:
                      i=max(j for j,x in enumerate(self.starts) if x<=p); local=p-self.starts[i]; take=min(n,self.sizes[i]-local)
                      q=urllib.request.Request(self.urls[i],headers={'User-Agent':USER_AGENT,'Range':f'bytes={local}-{local+take-1}'})
                      d=urllib.request.urlopen(q,timeout=120).read(); assert len(d)==take,(i,local,take,len(d)); out+=d; p+=take; n-=take
                  return bytes(out)
              def read(self,n=-1):
                  if n<0: n=self._size-self._pos
                  end=min(self._size,self._pos+n); out=bytearray()
                  while self._pos<end:
                      k=self._pos//self.BLOCK
                      if k not in self._cache:
                          s=k*self.BLOCK; self._cache[k]=self._fetch(s,min(self.BLOCK,self._size-s))
                      d=self._cache[k]; off=self._pos-k*self.BLOCK; take=min(len(d)-off,end-self._pos); out+=d[off:off+take]; self._pos+=take
                  return bytes(out)
              def readinto(self,b): d=self.read(len(b)); b[:len(d)]=d; return len(d)
              def fetch_range(self,s,n): return self._fetch(s,n)
          def dvpl_decode(b):
              assert b[-4:]==b'DVPL'; orig,comp,crc,typ=struct.unpack('<IIII',b[-20:-4]); data=b[:-20]
              assert len(data)==comp; assert (zlib.crc32(data)&0xffffffff)==crc
              if typ==0: out=data
              elif typ in (1,2): out=lz4.block.decompress(data,uncompressed_size=orig)
              else: raise RuntimeError(f'DVPL type {typ}')
              assert len(out)==orig; return out
          rf=M(); entries=parse_archive_index(rf); by={e['filename']:e for e in entries if not e['is_dir']}
          e=by[TARGET]; print('ENTRY',e['compressed_size'],e['uncompressed_size'],e['offset'])
          dvpl=decompress_entry(rf.fetch_range(e['offset'],e['compressed_size']),e['filters'],e['uncompressed_size'])
          webp=dvpl_decode(dvpl); Path('probe/mountain.webp').write_bytes(webp)
          print('SIZE',len(webp)); print('SHA256',hashlib.sha256(webp).hexdigest()); print('IMAGE',Image.open(io.BytesIO(webp)).size)
          PY
          python /tmp/extract.py | tee probe/result.txt
          sha256sum probe/mountain.webp
          file probe/mountain.webp

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-mountain-client-source
          path: probe
          retention-days: 1
