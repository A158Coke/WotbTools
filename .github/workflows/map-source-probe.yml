name: Probe Steam client map assets

on:
  push:
    branches:
      - feat/maps-hd-assets
    paths:
      - .github/workflows/map-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Build DepotDownloader
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/SteamRE/DepotDownloader.git /tmp/DepotDownloader
          dotnet publish /tmp/DepotDownloader/DepotDownloader/DepotDownloader.csproj -c Release -o /tmp/depot

      - name: Inspect current WotB Windows depot
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p probe/steam
          dotnet /tmp/depot/DepotDownloader.dll -app 444200 -depot 444202 -manifest-only -dir probe/steam 2>&1 | tee probe/depot.log
          find probe -maxdepth 4 -type f -print
          grep -RniE 'mountain|21_mountain|colormap|minimap' probe/steam probe/depot.log | head -200 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-steam-source-probe
          path: probe
          if-no-files-found: error
          retention-days: 1
