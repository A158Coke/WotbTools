name: Inspect WGC map package

on:
  push:
    branches:
      - feat/maps-hd-assets
    paths:
      - .github/workflows/map-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current client archive headers
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p probe
          URL='https://dl-wotb-gc.wargaming.net/wotb.ww.production/wds_default/patches/11.20.0.6254/wotb_11.20.0.6254_client.wgpkg.001'
          curl -fsSLI "$URL" | tee probe/headers.txt
          curl -fsSL -H 'Range: bytes=0-1023' "$URL" -o probe/head.bin
          echo 'FIRST 128 BYTES:' | tee probe/hexdump.txt
          xxd -l 128 probe/head.bin | tee -a probe/hexdump.txt
          file probe/head.bin | tee -a probe/hexdump.txt
          wc -c probe/head.bin | tee -a probe/hexdump.txt
          python - <<'PY' | tee -a probe/hexdump.txt
          from pathlib import Path
          b=Path('probe/head.bin').read_bytes()
          print('magic', b[:32])
          for sig in (b'7z\xbc\xaf\x27\x1c', b'PK\x03\x04', b'DVPL'):
              print(sig, b.find(sig))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wgc-package-probe
          path: probe
          retention-days: 1
