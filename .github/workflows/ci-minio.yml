name: CI / minio
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: docker/setup-buildx-action@v4
      - name: Build MinIO image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.minio
          push: false
          build-args: BUILD_COMMIT=${{ inputs.head_sha }}
  compose_config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - name: Validate MinIO Compose
        env:
          YECAO_MINIO_ROOT_USER: ci-root-user
          YECAO_MINIO_ROOT_PASSWORD: ci-root-password
        run: docker compose -f deploy/docker-compose.minio.yml config --quiet
  tofu_plans:
    name: OpenTofu validation / minio
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # PR OpenTofu work is local validation only: fmt, init without a backend,
    # validate, and root-specific safety fixtures. No production plan or credentials
    # are available to this workflow.
    env:
      TF_IN_AUTOMATION: "true"
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Format, initialize without production state, and validate
        env:
          ROOT_DIR: infra/tofu/minio
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT_DIR"
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate
      - name: Validate local-root safety policy fixtures
        run: |
          set -euo pipefail
          bash infra/tofu/minio/test-validate-plan.sh
