name: Frontend Replica

on:
  workflow_run:
    workflows: [Frontend]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Frontend source SHA already published to TCR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  replicate:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: tx-production
    steps:
      - name: Resolve published Frontend artifact
        id: artifact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SOURCE_SHA: ${{ inputs.source_sha }}
          ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_run ]; then
            source_sha="$WORKFLOW_SOURCE_SHA"
          else
            source_sha="$MANUAL_SOURCE_SHA"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid Frontend source SHA: $source_sha" >&2
            exit 1
          }
          [ -n "$ASSET_BASE_URL" ] || { echo 'ASSET_BASE_URL is required.' >&2; exit 1; }
          case "$TCR_REGISTRY" in *.tencentyun.com) ;; *) echo 'TCR_REGISTRY must be a Tencent TCR host.' >&2; exit 1 ;; esac
          [[ "$TCR_NAMESPACE" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo 'TCR_NAMESPACE is invalid.' >&2; exit 1; }

          identity="$(printf '%s\n%s' "$source_sha" "$ASSET_BASE_URL" | sha256sum | cut -c1-12)"
          immutable_ref="$TCR_REGISTRY/$TCR_NAMESPACE/wotbtools-frontend:sha-$identity"
          {
            echo "source_sha=$source_sha"
            echo "immutable_ref=$immutable_ref"
          } >> "$GITHUB_OUTPUT"
          echo "TX2 will pull the Frontend artifact directly from TCR: $immutable_ref"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.artifact.outputs.source_sha }}
          fetch-depth: 1

      - name: Configure TX2 SSH
        shell: bash
        env:
          TX2_HOST: ${{ secrets.TX2_VPS_HOST }}
          TX2_PORT: ${{ secrets.TX2_VPS_PORT }}
          TX2_KEY: ${{ secrets.TX2_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${TX2_HOST:?TX2_VPS_HOST is required}"
          : "${TX2_PORT:?TX2_VPS_PORT is required}"
          : "${TX2_KEY:?TX2_VPS_SSH_KEY is required}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TX2_KEY" | tr -d '\r' > ~/.ssh/tx2-frontend-replica
          chmod 600 ~/.ssh/tx2-frontend-replica
          ssh-keyscan -T 15 -p "$TX2_PORT" "$TX2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare TX2 replica staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX2_VPS_HOST }}
          username: ${{ secrets.TX2_VPS_USER }}
          port: ${{ secrets.TX2_VPS_PORT }}
          key: ${{ secrets.TX2_VPS_SSH_KEY }}
          script: |
            set -eu
            root=/opt/wotb-tx2/frontend-replica.incoming
            rm -rf -- "$root"
            mkdir -p "$root/deploy/tx"

      - name: Stage TX2 frontend replica inputs
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX2_VPS_HOST }}
          username: ${{ secrets.TX2_VPS_USER }}
          port: ${{ secrets.TX2_VPS_PORT }}
          key: ${{ secrets.TX2_VPS_SSH_KEY }}
          source: deploy/tx/frontend-shadow.compose.yml,deploy/tx/nginx/frontend.conf.template,deploy/tx/k7c-sync-runtime-content.sh
          target: /opt/wotb-tx2/frontend-replica.incoming
          overwrite: true

      - name: Pull TCR artifact and reconcile TX2
        shell: bash
        env:
          TX2_HOST: ${{ secrets.TX2_VPS_HOST }}
          TX2_USER: ${{ secrets.TX2_VPS_USER }}
          TX2_PORT: ${{ secrets.TX2_VPS_PORT }}
          IMMUTABLE_REF: ${{ steps.artifact.outputs.immutable_ref }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/tx2-frontend-replica -p "$TX2_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            "$TX2_USER@$TX2_HOST" "IMMUTABLE_REF='$IMMUTABLE_REF' bash -s" <<'REMOTE'
          set -euo pipefail
          exec 9>/opt/wotb-tx2/.deploy.lock
          flock -n 9 || { echo 'Another TX2 production deployment is running.' >&2; exit 1; }

          incoming=/opt/wotb-tx2/frontend-replica.incoming/deploy/tx
          stable=/opt/wotb-tx2/frontend-replica/deploy/tx
          [ -f "$incoming/frontend-shadow.compose.yml" ]
          [ -f "$incoming/nginx/frontend.conf.template" ]
          [ -f "$incoming/k7c-sync-runtime-content.sh" ]

          # Runtime content is part of the frontend surface. Refresh sponsor assets,
          # Android manifest and the currently published APK before the replica enters service.
          bash "$incoming/k7c-sync-runtime-content.sh"

          rm -rf -- /opt/wotb-tx2/frontend-replica.next
          mkdir -p /opt/wotb-tx2/frontend-replica.next/deploy
          cp -a /opt/wotb-tx2/frontend-replica.incoming/deploy/tx \
            /opt/wotb-tx2/frontend-replica.next/deploy/tx
          rm -rf -- /opt/wotb-tx2/frontend-replica
          mv /opt/wotb-tx2/frontend-replica.next /opt/wotb-tx2/frontend-replica

          docker_cmd() {
            if docker info >/dev/null 2>&1; then
              docker "$@"
              return
            fi
            if sudo -n docker info >/dev/null 2>&1; then
              sudo -n docker "$@"
              return
            fi
            echo 'TX2 deploy user cannot access Docker directly or through passwordless sudo.' >&2
            exit 1
          }

          # TCR is the release-artifact source of truth. TX2 never derives its image
          # from TX1 runtime state; it pulls the immutable tag published by TX1's build.
          docker_cmd pull "$IMMUTABLE_REF"
          image_ref="$(docker_cmd image inspect "$IMMUTABLE_REF" --format '{{index .RepoDigests 0}}')"
          case "$image_ref" in
            *@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "TCR pull did not resolve an immutable digest: $image_ref" >&2; exit 1 ;;
          esac

          cd "$stable"
          export TX_FRONTEND_IMAGE_REF="$image_ref"
          docker_cmd compose -p wotbtools-frontend-shadow -f frontend-shadow.compose.yml \
            up -d --pull never --remove-orphans

          ready=false
          for attempt in $(seq 1 30); do
            if docker_cmd run --rm --network host curlimages/curl:8.12.1 \
                --fail --silent --show-error --max-time 10 \
                http://10.20.0.3:8081/version.json >/dev/null; then
              ready=true
              break
            fi
            [ "$attempt" -lt 30 ] && sleep 2
          done
          [ "$ready" = true ] || { echo 'TX2 frontend replica did not become ready.' >&2; exit 1; }

          replica_id="$(docker_cmd ps --filter label=com.docker.compose.project=wotbtools-frontend-shadow \
            --filter label=com.docker.compose.service=frontend --format '{{.ID}}' | head -n1)"
          [ -n "$replica_id" ] || { echo 'TX2 frontend replica container is missing.' >&2; exit 1; }
          actual_ref="$(docker_cmd inspect "$replica_id" --format '{{.Config.Image}}')"
          [ "$actual_ref" = "$image_ref" ] || {
            echo "TX2 frontend image drift: expected $image_ref, got $actual_ref" >&2
            exit 1
          }

          tx1_version="$(docker_cmd run --rm --network host curlimages/curl:8.12.1 \
            --fail --silent --show-error --max-time 10 http://10.20.0.1:8081/version.json)"
          tx2_version="$(docker_cmd run --rm --network host curlimages/curl:8.12.1 \
            --fail --silent --show-error --max-time 10 http://10.20.0.3:8081/version.json)"
          [ "$tx1_version" = "$tx2_version" ] || {
            echo 'TX1/TX2 version.json parity failed after TX2 deployment.' >&2
            printf 'TX1: %s\nTX2: %s\n' "$tx1_version" "$tx2_version" >&2
            exit 1
          }
          echo "TX2_FRONTEND_REPLICA_READY=PASS image=$image_ref"
          REMOTE
