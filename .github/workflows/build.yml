name: Build
run-name: Build main by @${{ github.actor }}

on:
  push:
    branches: [main]
    paths:
      - "java/**"
      - "frontend/**"
      - "common/**"
      - ".dockerignore"
      - "docker/Dockerfile.backend"
      - "docker/Dockerfile.frontend"
      - "docker/Dockerfile.keycloak"
      - "docker/keycloak/**"
      - "keycloak-juhe-qq-provider/**"
      - "keycloak-wargaming-provider/**"
      - "deploy/docker-compose.prod.yml"
      - "deploy/nginx/**"
      - "deploy/observability/prometheus/**"
      - "deploy/observability/loki/**"
      - "deploy/observability/alloy/**"
      # Grafana dashboard JSON is reconciled by OpenTofu; runtime provisioning
      # remains a production deploy concern, so the dashboard path is omitted.
      - "deploy/observability/grafana/provisioning/**"
      - "deploy/deploy.sh"
      - "deploy/verify-observability.sh"
      - "deploy/validate-alloy-config.sh"
      - "deploy/grafana-api-request.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      service:
        description: Image set to build; choose one service for an independent build
        required: true
        type: choice
        default: all
        options:
          - all
          - backend
          - frontend
          - keycloak

permissions:
  contents: read

concurrency:
  group: production-build
  cancel-in-progress: false

env:
  GHCR_IMAGE_PREFIX: ghcr.io/a158coke/wotbtools

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.tag.outputs.commit_sha }}
      tag: ${{ steps.tag.outputs.tag }}
      service: ${{ steps.service.outputs.service }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Freeze main build identity
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short "$commit_sha")"
          {
            echo "commit_sha=$commit_sha"
            echo "tag=sha-$short_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve build service
        id: service
        env:
          REQUESTED_SERVICE: ${{ github.event_name == 'workflow_dispatch' && inputs.service || 'all' }}
        run: echo "service=$REQUESTED_SERVICE" >> "$GITHUB_OUTPUT"

  build-backend:
    needs: [changes]
    if: >-
      needs.changes.result == 'success' &&
      (needs.changes.outputs.service == 'all' || needs.changes.outputs.service == 'backend')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ needs.changes.outputs.tag }}
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  build-frontend:
    needs: [changes]
    if: >-
      needs.changes.result == 'success' &&
      (needs.changes.outputs.service == 'all' || needs.changes.outputs.service == 'frontend')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ needs.changes.outputs.tag }}
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:latest
          build-args: |
            BUILD_COMMIT=${{ needs.changes.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  build-keycloak:
    needs: [changes]
    if: >-
      needs.changes.result == 'success' &&
      (needs.changes.outputs.service == 'all' || needs.changes.outputs.service == 'keycloak')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.keycloak
          push: true
          tags: |
            ${{ env.GHCR_IMAGE_PREFIX }}-keycloak:${{ needs.changes.outputs.tag }}
            ${{ env.GHCR_IMAGE_PREFIX }}-keycloak:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
        env:
          KEYCLOAK_BUILD_FILE: ${{ github.workspace }}/keycloak-juhe-qq-provider
