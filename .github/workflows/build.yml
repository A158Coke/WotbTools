name: Build
run-name: Build ${{ inputs.service || github.sha }} by @${{ github.actor }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Image set to build; choose one service for an independent build
        required: true
        type: choice
        default: all
        options:
          - all
          - backend
          - frontend
          - keycloak
          - minio
          - parser-worker

permissions:
  contents: read

concurrency:
  group: production-build
  cancel-in-progress: false

env:
  GHCR_IMAGE_PREFIX: ghcr.io/a158coke/wotbtools

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      tag: ${{ steps.identity.outputs.tag }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      keycloak: ${{ steps.plan.outputs.keycloak }}
      minio: ${{ steps.plan.outputs.minio }}
      parserWorker: ${{ steps.plan.outputs.parser-worker }}
      deploy_config: ${{ steps.plan.outputs.deploy_config }}
      deploy_services: ${{ steps.plan.outputs.deploy_services }}
      image_services: ${{ steps.plan.outputs.image_services }}
      target_services: ${{ steps.plan.outputs.target_services }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Freeze release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          short_sha="${commit_sha:0:12}"
          {
            echo "commit_sha=$commit_sha"
            echo "tag=sha-$short_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Detect changed release targets
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SERVICE: ${{ inputs.service || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python3 deploy/release_plan.py detect --manual-service "$REQUESTED_SERVICE" > release-plan.json
          else
            if [ -n "$BEFORE_SHA" ] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > changed-files.txt
            else
              git diff-tree --root --no-commit-id --name-only -r "$HEAD_SHA" > changed-files.txt
            fi
            python3 deploy/release_plan.py detect --paths-file changed-files.txt > release-plan.json
          fi
          python3 - release-plan.json <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          for image in ("backend", "frontend", "keycloak", "minio", "parser-worker"):
              print(f"{image}={str(plan['images'][image]).lower()}")
          print(f"deploy_config={str(plan['deployConfig']).lower()}")
          print(f"deploy_services={','.join(plan['deployServices'])}")
          print(f"image_services={','.join(plan['imageServices'])}")
          print(f"target_services={json.dumps(plan['targetServices'], separators=(',', ':'))}")
          PY
      - name: Validate manual source is current main HEAD
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          source_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [ "$source_sha" != "$main_sha" ]; then
            echo "::error::Manual Build must run from the current main HEAD." >&2
            exit 1
          fi

  build_backend:
    needs: [changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.backend == 'true'
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build Backend once, publish GHCR, and export OCI
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend
          tags: |
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ needs.changes.outputs.tag }}
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:latest
          outputs: |
            type=oci,dest=${{ runner.temp }}/backend.oci.tar,name=wotb-transfer/backend:${{ needs.changes.outputs.tag }}
            type=image,push=true,oci-mediatypes=true
          build-args: BUILD_COMMIT=${{ needs.changes.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Verify authoritative Backend GHCR immutable digest
        id: digest
        shell: bash
        env:
          IMAGE: ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ needs.changes.outputs.tag }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          registry_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE")"
          [ "$registry_digest" = "$BUILD_DIGEST" ]
          printf 'EXPECTED_DIGEST=%s\n' "$BUILD_DIGEST" >> "$GITHUB_ENV"
      - name: Set up native TX SSH
        shell: bash
        env:
          TX_VPS_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_VPS_USER: ${{ secrets.TX_VPS_USER }}
          TX_VPS_PORT: ${{ secrets.TX_VPS_PORT }}
          TX_VPS_SSH_KEY: ${{ secrets.TX_VPS_SSH_KEY }}
        run: bash scripts/ci/setup-tx-ssh.sh
      - name: Install TX loaded-image publication helper
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/run-with-network-retry.sh 'prepare TX image publication' \
            ssh -F "$TX_SSH_DIR/config" tx-image-publication \
            'mkdir -p /opt/wotb-tx/replication.incoming'
          bash scripts/ci/run-with-network-retry.sh 'install TX image publication helper' \
            scp -F "$TX_SSH_DIR/config" deploy/tx/publish-loaded-image-to-tcr.sh \
            tx-image-publication:/opt/wotb-tx/replication.incoming/publish-loaded-image-to-tcr.sh
      - name: Transfer Backend OCI archive to TX
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/transfer-oci-to-tx.sh transfer backend '${{ needs.changes.outputs.tag }}' "${{ github.run_id }}" "$RUNNER_TEMP/backend.oci.tar"
      - name: Import Backend OCI image on TX
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/transfer-oci-to-tx.sh import backend '${{ needs.changes.outputs.tag }}' "${{ github.run_id }}" "$RUNNER_TEMP/backend.oci.tar"
      - name: Publish Backend loaded image to TCR
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=30s 3300s ssh -F "$TX_SSH_DIR/config" tx-image-publication \
            "mkdir -p /opt/wotb-tx/replication.incoming && flock -w 1800 /opt/wotb-tx/replication.incoming/tcr-publication.lock bash /opt/wotb-tx/replication.incoming/publish-loaded-image-to-tcr.sh backend '${{ needs.changes.outputs.tag }}' '$EXPECTED_DIGEST'"
      - name: Remove Backend remote transfer material
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/transfer-oci-to-tx.sh cleanup backend '${{ needs.changes.outputs.tag }}' "${{ github.run_id }}"
      - name: Remove Backend temporary transfer material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/backend.oci.tar" "${TX_SSH_DIR:-}"

  build_frontend:
    needs: [changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build Frontend once, publish GHCR, and export OCI
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.frontend
          tags: |
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ needs.changes.outputs.tag }}
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:latest
          outputs: |
            type=oci,dest=${{ runner.temp }}/frontend.oci.tar,name=wotb-transfer/frontend:${{ needs.changes.outputs.tag }}
            type=image,push=true,oci-mediatypes=true
          build-args: BUILD_COMMIT=${{ needs.changes.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Verify authoritative Frontend GHCR immutable digest
        id: digest
        shell: bash
        env:
          IMAGE: ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ needs.changes.outputs.tag }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          registry_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE")"
          [ "$registry_digest" = "$BUILD_DIGEST" ]
          printf 'EXPECTED_DIGEST=%s\n' "$BUILD_DIGEST" >> "$GITHUB_ENV"
      - name: Set up native TX SSH
        shell: bash
        env:
          TX_VPS_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_VPS_USER: ${{ secrets.TX_VPS_USER }}
          TX_VPS_PORT: ${{ secrets.TX_VPS_PORT }}
          TX_VPS_SSH_KEY: ${{ secrets.TX_VPS_SSH_KEY }}
        run: bash scripts/ci/setup-tx-ssh.sh
      - name: Install TX loaded-image publication helper
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/run-with-network-retry.sh 'prepare TX image publication' \
            ssh -F "$TX_SSH_DIR/config" tx-image-publication \
            'mkdir -p /opt/wotb-tx/replication.incoming'
          bash scripts/ci/run-with-network-retry.sh 'install TX image publication helper' \
            scp -F "$TX_SSH_DIR/config" deploy/tx/publish-loaded-image-to-tcr.sh \
            tx-image-publication:/opt/wotb-tx/replication.incoming/publish-loaded-image-to-tcr.sh
      - name: Transfer Frontend OCI archive to TX
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/transfer-oci-to-tx.sh transfer frontend '${{ needs.changes.outputs.tag }}' "${{ github.run_id }}" "$RUNNER_TEMP/frontend.oci.tar"
      - name: Import Frontend OCI image on TX
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/transfer-oci-to-tx.sh import frontend '${{ needs.changes.outputs.tag }}' "${{ github.run_id }}" "$RUNNER_TEMP/frontend.oci.tar"
      - name: Publish Frontend loaded image to TCR
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=30s 3300s ssh -F "$TX_SSH_DIR/config" tx-image-publication \
            "mkdir -p /opt/wotb-tx/replication.incoming && flock -w 1800 /opt/wotb-tx/replication.incoming/tcr-publication.lock bash /opt/wotb-tx/replication.incoming/publish-loaded-image-to-tcr.sh frontend '${{ needs.changes.outputs.tag }}' '$EXPECTED_DIGEST'"
      - name: Remove Frontend remote transfer material
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/transfer-oci-to-tx.sh cleanup frontend '${{ needs.changes.outputs.tag }}' "${{ github.run_id }}"
      - name: Remove Frontend temporary transfer material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/frontend.oci.tar" "${TX_SSH_DIR:-}"

  build_keycloak:
    needs: [changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.keycloak == 'true'
    name: Build Keycloak
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build Keycloak once, publish GHCR, and export OCI
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.keycloak
          tags: |
            ${{ env.GHCR_IMAGE_PREFIX }}-keycloak:${{ needs.changes.outputs.tag }}
            ${{ env.GHCR_IMAGE_PREFIX }}-keycloak:latest
          outputs: |
            type=oci,dest=${{ runner.temp }}/keycloak.oci.tar,name=wotb-transfer/keycloak:${{ needs.changes.outputs.tag }}
            type=image,push=true,oci-mediatypes=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: BUILD_COMMIT=${{ needs.changes.outputs.commit_sha }}
          provenance: false
          sbom: false
      - name: Verify authoritative Keycloak GHCR immutable digest
        id: digest
        shell: bash
        env:
          IMAGE: ${{ env.GHCR_IMAGE_PREFIX }}-keycloak:${{ needs.changes.outputs.tag }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          registry_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE")"
          [ "$registry_digest" = "$BUILD_DIGEST" ]
          printf 'EXPECTED_DIGEST=%s\n' "$BUILD_DIGEST" >> "$GITHUB_ENV"
      - name: Set up native TX SSH
        shell: bash
        env:
          TX_VPS_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_VPS_USER: ${{ secrets.TX_VPS_USER }}
          TX_VPS_PORT: ${{ secrets.TX_VPS_PORT }}
          TX_VPS_SSH_KEY: ${{ secrets.TX_VPS_SSH_KEY }}
        run: bash scripts/ci/setup-tx-ssh.sh
      - name: Install TX loaded-image publication helper
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/run-with-network-retry.sh 'prepare TX image publication' \
            ssh -F "$TX_SSH_DIR/config" tx-image-publication \
            'mkdir -p /opt/wotb-tx/replication.incoming'
          bash scripts/ci/run-with-network-retry.sh 'install TX image publication helper' \
            scp -F "$TX_SSH_DIR/config" deploy/tx/publish-loaded-image-to-tcr.sh \
            tx-image-publication:/opt/wotb-tx/replication.incoming/publish-loaded-image-to-tcr.sh
      - name: Transfer Keycloak OCI archive to TX
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/transfer-oci-to-tx.sh transfer keycloak '${{ needs.changes.outputs.tag }}' "${{ github.run_id }}" "$RUNNER_TEMP/keycloak.oci.tar"
      - name: Import Keycloak OCI image on TX
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/transfer-oci-to-tx.sh import keycloak '${{ needs.changes.outputs.tag }}' "${{ github.run_id }}" "$RUNNER_TEMP/keycloak.oci.tar"
      - name: Publish Keycloak loaded image to TCR
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=30s 3300s ssh -F "$TX_SSH_DIR/config" tx-image-publication \
            "mkdir -p /opt/wotb-tx/replication.incoming && flock -w 1800 /opt/wotb-tx/replication.incoming/tcr-publication.lock bash /opt/wotb-tx/replication.incoming/publish-loaded-image-to-tcr.sh keycloak '${{ needs.changes.outputs.tag }}' '$EXPECTED_DIGEST'"
      - name: Remove Keycloak remote transfer material
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/transfer-oci-to-tx.sh cleanup keycloak '${{ needs.changes.outputs.tag }}' "${{ github.run_id }}"
      - name: Remove Keycloak temporary transfer material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/keycloak.oci.tar" "${TX_SSH_DIR:-}"

  build_minio:
    needs: [changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.minio == 'true'
    name: Build MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.minio
          push: true
          tags: |
            ${{ env.GHCR_IMAGE_PREFIX }}-minio:${{ needs.changes.outputs.tag }}
            ${{ env.GHCR_IMAGE_PREFIX }}-minio:latest
          build-args: BUILD_COMMIT=${{ needs.changes.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  build_parser_worker:
    needs: [changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.parserWorker == 'true'
    name: Build Parser Worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.parser-worker
          push: true
          tags: |
            ${{ env.GHCR_IMAGE_PREFIX }}-parser-worker:${{ needs.changes.outputs.tag }}
            ${{ env.GHCR_IMAGE_PREFIX }}-parser-worker:latest
          build-args: BUILD_COMMIT=${{ needs.changes.outputs.commit_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  manifest:
    needs: [changes, build_backend, build_frontend, build_keycloak, build_minio, build_parser_worker]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.backend != 'true' || needs.build_backend.result == 'success') &&
       (needs.changes.outputs.frontend != 'true' || needs.build_frontend.result == 'success') &&
       (needs.changes.outputs.keycloak != 'true' || needs.build_keycloak.result == 'success') &&
       (needs.changes.outputs.minio != 'true' || needs.build_minio.result == 'success') &&
       (needs.changes.outputs.parserWorker != 'true' || needs.build_parser_worker.result == 'success')
    name: Build deployment manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.changes.outputs.commit_sha }}
      - name: Create authoritative deployment manifest
        env:
          COMMIT_SHA: ${{ needs.changes.outputs.commit_sha }}
          IMAGE_TAG: ${{ needs.changes.outputs.tag }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_NUMBER: ${{ github.run_number }}
          BACKEND: ${{ needs.changes.outputs.backend }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          KEYCLOAK: ${{ needs.changes.outputs.keycloak }}
          MINIO: ${{ needs.changes.outputs.minio }}
          PARSER_WORKER: ${{ needs.changes.outputs.parserWorker }}
          DEPLOY_SERVICES: ${{ needs.changes.outputs.deploy_services }}
          IMAGE_SERVICES: ${{ needs.changes.outputs.image_services }}
          TARGET_SERVICES: ${{ needs.changes.outputs.target_services }}
        shell: bash
        run: |
          set -euo pipefail
          backend_migration_max_version="$(python3 - <<'PY'
          import re
          from pathlib import Path

          versions = []
          root = Path("java/wotb-web/src/main/resources/db/migration")
          for path in root.glob("V*.sql"):
              match = re.fullmatch(r"V([0-9]+)__.*[.]sql", path.name)
              if match:
                  versions.append(int(match.group(1)))
          print(max(versions, default=0))
          PY
          )"
          export BACKEND_MIGRATION_MAX_VERSION="$backend_migration_max_version"
          python3 - deploy/release_plan.py <<'PY' > plan.json
          import json
          import os
          import sys

          images = {
              "backend": os.environ["BACKEND"] == "true",
              "frontend": os.environ["FRONTEND"] == "true",
              "keycloak": os.environ["KEYCLOAK"] == "true",
              "minio": os.environ["MINIO"] == "true",
              "parser-worker": os.environ["PARSER_WORKER"] == "true",
          }
          backend_migration_max_version = int(os.environ.get("BACKEND_MIGRATION_MAX_VERSION", "0"))
          json.dump({
              "images": images,
              "buildServices": [s for s in os.environ["IMAGE_SERVICES"].split(",") if s],
              "imageServices": [s for s in os.environ["IMAGE_SERVICES"].split(",") if s],
              "backendMigrationMaxVersion": backend_migration_max_version,
              "deployConfig": False,
              "deployServices": [s for s in os.environ["DEPLOY_SERVICES"].split(",") if s],
              "targetServices": json.loads(os.environ["TARGET_SERVICES"]),
          }, sys.stdout)
          PY
          python3 deploy/release_plan.py manifest \
            --commit-sha "$COMMIT_SHA" \
            --image-tag "$IMAGE_TAG" \
            --build-run-id "$BUILD_RUN_ID" \
            --build-run-number "$BUILD_RUN_NUMBER" \
            --plan plan.json > deployment-manifest.json
          python3 deploy/release_plan.py validate --manifest deployment-manifest.json --expected-sha "$COMMIT_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: deployment-manifest.json
          if-no-files-found: error
