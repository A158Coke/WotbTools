name: Build
run-name: Build ${{ inputs.component }} by @${{ github.actor }}

on:
  workflow_call:
    inputs:
      component:
        type: string
        required: true
      source_sha:
        type: string
        required: true
    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}
      tag:
        value: ${{ jobs.build.outputs.tag }}
      commit_sha:
        value: ${{ jobs.build.outputs.commit_sha }}
      digest:
        value: ${{ jobs.build.outputs.digest }}
  workflow_dispatch:
    inputs:
      component:
        description: One production image
        required: true
        type: choice
        options:
          - business-api
          - frontend
          - keycloak
          - parser-worker
          - minio

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.identity.outputs.image }}
      tag: ${{ steps.identity.outputs.tag }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Freeze trusted main source and image identity
        id: identity
        env:
          COMPONENT: ${{ inputs.component }}
          REQUESTED_SHA: ${{ inputs.source_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a full commit SHA" >&2; exit 1; }
          [ "$(git rev-parse HEAD)" = "$REQUESTED_SHA" ] || { echo "::error::checkout does not match requested source SHA" >&2; exit 1; }
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [ "$REF_NAME" = refs/heads/main ] || { echo "::error::Manual Build must dispatch from main" >&2; exit 1; }
          fi
          git fetch origin main
          [ "$REQUESTED_SHA" = "$(git rev-parse origin/main)" ] || { echo "::error::Build source is no longer the current main HEAD" >&2; exit 1; }
          case "$COMPONENT" in
            business-api|frontend|keycloak)
              case "$TCR_REGISTRY" in *.tencentyun.com) ;; *) echo "::error::TX registry must be Tencent TCR" >&2; exit 1 ;; esac
              [ -n "$TCR_NAMESPACE" ] || { echo "::error::TCR_NAMESPACE is required" >&2; exit 1; }
              repository="$TCR_REGISTRY/$TCR_NAMESPACE/wotbtools-$COMPONENT"
              ;;
            parser-worker|minio)
              repository="ghcr.io/a158coke/wotbtools-$COMPONENT"
              ;;
            *) echo "::error::unsupported component: $COMPONENT" >&2; exit 1 ;;
          esac
          tag="sha-${REQUESTED_SHA:0:12}"
          {
            echo "commit_sha=$REQUESTED_SHA"
            echo "tag=$tag"
            echo "image=$repository:$tag"
            echo "dockerfile=docker/Dockerfile.$COMPONENT"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: inputs.component == 'business-api' || inputs.component == 'frontend' || inputs.component == 'keycloak'
        with:
          registry: ${{ vars.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - uses: docker/login-action@v4
        if: inputs.component == 'parser-worker' || inputs.component == 'minio'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build once and publish immutable image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.identity.outputs.dockerfile }}
          push: true
          tags: ${{ steps.identity.outputs.image }}
          build-args: BUILD_COMMIT=${{ steps.identity.outputs.commit_sha }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
          provenance: false
          sbom: false
      - name: Verify registry manifest matches this build
        id: verify
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid BuildKit digest" >&2; exit 1; }
          registry_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE")"
          [ "$registry_digest" = "$BUILD_DIGEST" ] || { echo "::error::registry digest mismatch" >&2; exit 1; }
          echo "digest=$registry_digest" >> "$GITHUB_OUTPUT"
          echo "verified $IMAGE at $registry_digest"
