name: Migrate OpenTofu states to PostgreSQL

on:
  workflow_dispatch:
    inputs:
      postgres_keycloak_old_state_sha:
        description: Full main-ancestor SHA with the COS backend config for postgres-keycloak
        required: true
        type: string
      keycloak_old_state_sha:
        description: Full main-ancestor SHA with the COS backend config for keycloak
        required: true
        type: string
      grafana_old_state_sha:
        description: Full main-ancestor SHA with the COS backend config for grafana
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  migrate:
    name: Migrate roots serially on their owner hosts
    if: github.ref == 'refs/heads/main' && vars.TOFU_STATE_BACKEND_READY != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: tx-production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate exact main source and prepare historical backend configs
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          POSTGRES_KEYCLOAK_OLD_SHA: ${{ inputs.postgres_keycloak_old_state_sha }}
          KEYCLOAK_OLD_SHA: ${{ inputs.keycloak_old_state_sha }}
          GRAFANA_OLD_SHA: ${{ inputs.grafana_old_state_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          bash deploy/check-production-freshness.sh "$SOURCE_SHA" workflow_dispatch refs/heads/main "$SOURCE_SHA"
          mkdir -m 700 migration-input
          prepare_backend() {
            local name="$1" root="$2" sha="$3" key="$4"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$sha" "$SOURCE_SHA"
            mkdir -m 700 "migration-input/$name"
            git show "$sha:$root/backend.tf" > "migration-input/$name/backend.tf"
            grep -Fq 'backend "s3"' "migration-input/$name/backend.tf"
            grep -Fq "key    = \"$key\"" "migration-input/$name/backend.tf"
          }
          prepare_backend postgres-keycloak infra/tofu/postgres-keycloak "$POSTGRES_KEYCLOAK_OLD_SHA" wotbtools/prod/postgres-keycloak.tfstate
          prepare_backend keycloak infra/tofu/keycloak "$KEYCLOAK_OLD_SHA" wotbtools/prod/keycloak.tfstate
          prepare_backend grafana infra/tofu/grafana "$GRAFANA_OLD_SHA" wotbtools/prod/grafana.tfstate
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Stage postgres-keycloak migration inputs on TX
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: infra/tofu/postgres-keycloak,migration-input/postgres-keycloak,deploy/tofu-state-migrate.sh
          target: /opt/wotb-tx/tofu-migration.incoming/${{ steps.source.outputs.source_sha }}
          overwrite: true

      - name: Migrate postgres-keycloak and require zero changes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 35m
          envs: SOURCE_SHA,TOFU_STATE_BACKEND_READY,PGDATABASE,PGUSER,PGPASSWORD,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,TF_VAR_postgresql_admin_username,TF_VAR_postgresql_admin_password,TF_VAR_keycloak_role_password,TF_VAR_keycloak_role_password_version
          script: |
            set -Eeuo pipefail
            stage="/opt/wotb-tx/tofu-migration.incoming/$SOURCE_SHA"
            root="$stage/infra/tofu/postgres-keycloak"
            old="$stage/migration-input/postgres-keycloak/backend.tf"
            trap 'rm -rf -- "$root" "$stage/migration-input/postgres-keycloak" "$stage/deploy/tofu-state-migrate.sh"' EXIT
            [[ "${TOFU_STATE_BACKEND_READY:-}" != true ]]
            exec 9>/opt/wotb-tx/.deploy.lock
            flock -n 9 || { echo 'Another production mutation is running.' >&2; exit 1; }
            test -d "$root" && test -f "$old" && test -f "$stage/deploy/tofu-state-migrate.sh"
            test -f /opt/wotb-tx/tofurc
            export TF_CLI_CONFIG_FILE=/opt/wotb-tx/tofurc PGHOST=127.0.0.1 PGPORT=25432 PGDATABASE=tofu_state PGUSER=tofu_state
            for name in PGPASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_VAR_postgresql_admin_password TF_VAR_keycloak_role_password; do
              test -n "$(printenv "$name")" || { echo "$name is required." >&2; exit 2; }
            done
            bash "$stage/deploy/tofu-state-migrate.sh" "$root" "$old" tofu_keycloak_postgres wotbtools/prod/postgres-keycloak.tfstate /opt/wotb-tx
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TOFU_STATE_BACKEND_READY: ${{ vars.TOFU_STATE_BACKEND_READY }}
          PGDATABASE: tofu_state
          PGUSER: tofu_state
          PGPASSWORD: ${{ secrets.TX_TOFU_STATE_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TF_VAR_postgresql_admin_username: kc_admin
          TF_VAR_postgresql_admin_password: ${{ secrets.TX_KC_POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_keycloak_role_password: ${{ secrets.TX_KC_DB_PASSWORD }}
          TF_VAR_keycloak_role_password_version: ${{ vars.TX_KC_DB_PASSWORD_VERSION || '1' }}

      - name: Stage keycloak migration inputs on TX
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: infra/tofu/keycloak,migration-input/keycloak,deploy/tofu-state-migrate.sh
          target: /opt/wotb-tx/tofu-migration.incoming/${{ steps.source.outputs.source_sha }}
          overwrite: true

      - name: Migrate keycloak and require zero changes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 35m
          envs: SOURCE_SHA,TOFU_STATE_BACKEND_READY,PGDATABASE,PGUSER,PGPASSWORD,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,TF_VAR_keycloak_admin_username,TF_VAR_keycloak_admin_password,TF_VAR_keycloak_admin_client_secret,TF_VAR_keycloak_admin_client_secret_version,TF_VAR_e2e_client_secret,TF_VAR_e2e_client_secret_version,TF_VAR_wargaming_application_id,TF_VAR_qq_client_id,TF_VAR_qq_client_secret
          script: |
            set -Eeuo pipefail
            stage="/opt/wotb-tx/tofu-migration.incoming/$SOURCE_SHA"
            root="$stage/infra/tofu/keycloak"
            old="$stage/migration-input/keycloak/backend.tf"
            trap 'rm -rf -- "$root" "$stage/migration-input/keycloak" "$stage/deploy/tofu-state-migrate.sh"' EXIT
            [[ "${TOFU_STATE_BACKEND_READY:-}" != true ]]
            exec 9>/opt/wotb-tx/.deploy.lock
            flock -n 9 || { echo 'Another production mutation is running.' >&2; exit 1; }
            test -d "$root" && test -f "$old" && test -f "$stage/deploy/tofu-state-migrate.sh"
            test -f /opt/wotb-tx/tofurc
            export TF_CLI_CONFIG_FILE=/opt/wotb-tx/tofurc PGHOST=127.0.0.1 PGPORT=25432 PGDATABASE=tofu_state PGUSER=tofu_state
            for name in PGPASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_VAR_keycloak_admin_username TF_VAR_keycloak_admin_password TF_VAR_keycloak_admin_client_secret TF_VAR_keycloak_admin_client_secret_version TF_VAR_e2e_client_secret TF_VAR_e2e_client_secret_version TF_VAR_wargaming_application_id TF_VAR_qq_client_id TF_VAR_qq_client_secret; do
              test -n "$(printenv "$name")" || { echo "$name is required." >&2; exit 2; }
            done
            bash "$stage/deploy/tofu-state-migrate.sh" "$root" "$old" tofu_keycloak wotbtools/prod/keycloak.tfstate /opt/wotb-tx
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TOFU_STATE_BACKEND_READY: ${{ vars.TOFU_STATE_BACKEND_READY }}
          PGDATABASE: tofu_state
          PGUSER: tofu_state
          PGPASSWORD: ${{ secrets.TX_TOFU_STATE_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TF_VAR_keycloak_admin_username: admin
          TF_VAR_keycloak_admin_password: ${{ secrets.TX_KC_BOOTSTRAP_ADMIN_PASSWORD }}
          TF_VAR_keycloak_admin_client_secret: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          TF_VAR_keycloak_admin_client_secret_version: ${{ vars.KEYCLOAK_ADMIN_CLIENT_SECRET_VERSION || '1' }}
          TF_VAR_e2e_client_secret: ${{ secrets.KEYCLOAK_E2E_CLIENT_SECRET }}
          TF_VAR_e2e_client_secret_version: ${{ vars.KEYCLOAK_E2E_CLIENT_SECRET_VERSION || '1' }}
          TF_VAR_wargaming_application_id: ${{ secrets.WG_APPLICATION_ID }}
          TF_VAR_qq_client_id: ${{ vars.TX_QQ_CLIENT_ID }}
          TF_VAR_qq_client_secret: ${{ secrets.TX_QQ_CLIENT_SECRET }}

      - name: Stage grafana migration inputs on Yecao
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: infra/tofu/grafana,migration-input/grafana,deploy/tofu-state-migrate.sh
          target: /opt/wotb/tofu-migration.incoming/${{ steps.source.outputs.source_sha }}
          overwrite: true

      - name: Migrate grafana and require zero changes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 35m
          envs: SOURCE_SHA,TOFU_STATE_BACKEND_READY,PGDATABASE,PGUSER,PGPASSWORD,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,TF_VAR_grafana_auth
          script: |
            set -Eeuo pipefail
            stage="/opt/wotb/tofu-migration.incoming/$SOURCE_SHA"
            root="$stage/infra/tofu/grafana"
            old="$stage/migration-input/grafana/backend.tf"
            trap 'rm -rf -- "$root" "$stage/migration-input/grafana" "$stage/deploy/tofu-state-migrate.sh"' EXIT
            [[ "${TOFU_STATE_BACKEND_READY:-}" != true ]]
            exec 9>/opt/wotb/.deploy.lock
            flock -n 9 || { echo 'Another production mutation is running.' >&2; exit 1; }
            test -d "$root" && test -f "$old" && test -f "$stage/deploy/tofu-state-migrate.sh"
            unset TF_CLI_CONFIG_FILE
            export PGHOST=10.20.0.1 PGPORT=25432 PGDATABASE=tofu_state PGUSER=tofu_state
            for name in PGPASSWORD AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_VAR_grafana_auth; do
              test -n "$(printenv "$name")" || { echo "$name is required." >&2; exit 2; }
            done
            bash "$stage/deploy/tofu-state-migrate.sh" "$root" "$old" tofu_grafana wotbtools/prod/grafana.tfstate /opt/wotb
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TOFU_STATE_BACKEND_READY: ${{ vars.TOFU_STATE_BACKEND_READY }}
          PGDATABASE: tofu_state
          PGUSER: tofu_state
          PGPASSWORD: ${{ secrets.TX_TOFU_STATE_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_PAT }}

      - name: Remove runner-side migration inputs
        if: always()
        shell: bash
        run: rm -rf -- migration-input

      - name: Report migration boundary
        if: success()
        shell: bash
        run: |
          {
            echo '### OpenTofu state migration'
            echo
            echo 'All three roots migrated in plan order and passed an immediate zero-change plan. State and plans were not uploaded.'
            echo 'Enable `TOFU_STATE_BACKEND_READY` only after the separate backup and recovery checks pass.'
          } >> "$GITHUB_STEP_SUMMARY"
