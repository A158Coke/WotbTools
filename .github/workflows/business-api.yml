name: Business API

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/business-api.yml
      - .dockerignore
      - docker/Dockerfile.business-api
      - common/tankopedia-tier7.json
      - common/tankopedia-tier8.json
      - common/tankopedia-tier9.json
      - common/tankopedia-tier10.json
      - common/map_names.json
      - common/tank_tactical_profiles.json
      - common/map-semantics/**
      - java/pom.xml
      - java/**/pom.xml
      - java/settings-docker.xml
      - java/wotb-core/**
      - java/wotb-ai/**
      - java/wotb-web/**
      - contracts/http/**
      - deploy/dependency-readiness.sh
      - deploy/dependency-readiness.py
      - deploy/tx/business-api.compose.yml
      - deploy/tx/build-business-api-from-gitee.sh
      - deploy/tx/deploy.sh
      - deploy/tx/common.compose.yml
      - deploy/tx/docker-compose.yml
  workflow_dispatch:

permissions:
  contents: read


env:
  PRODUCTION_INPUT_PATHS: |
    .github/workflows/business-api.yml
    .dockerignore
    docker/Dockerfile.business-api
    common/tankopedia-tier7.json
    common/tankopedia-tier8.json
    common/tankopedia-tier9.json
    common/tankopedia-tier10.json
    common/map_names.json
    common/tank_tactical_profiles.json
    common/map-semantics/**
    java/pom.xml
    java/**/pom.xml
    java/settings-docker.xml
    java/wotb-core/**
    java/wotb-ai/**
    java/wotb-web/**
    contracts/http/**
    deploy/dependency-readiness.sh
    deploy/dependency-readiness.py
    deploy/tx/business-api.compose.yml
    deploy/tx/build-business-api-from-gitee.sh
    deploy/tx/deploy.sh
    deploy/tx/common.compose.yml
    deploy/tx/docker-compose.yml
concurrency:
  group: deploy-business-api
  cancel-in-progress: true

jobs:
  mirror_gitee:
    name: Mirror exact GitHub source to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Reject non-main invocation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "Unsupported mirror event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          [ "$EVENT_REF" = refs/heads/main ] || {
            echo "Gitee production mirror must run from main." >&2
            exit 1
          }

      - name: Mirror WotbTools to Gitee
        uses: Yikun/hub-mirror-action@ec47170fa9d126a4bee5a1ab9359845bb1395248
        with:
          src: github/A158Coke
          dst: gitee/A158Coke
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          static_list: WotbTools
          account_type: user
          force_update: true
          timeout: 10m

  build:
    needs: [mirror_gitee]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: tx-production
    permissions:
      contents: read
    outputs:
      image: ${{ steps.remote_build.outputs.image }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      digest: ${{ steps.remote_build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Freeze current main and image identity
        id: identity
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [ "$REF_NAME" = refs/heads/main ] || { echo 'Manual deployment must dispatch from main.' >&2; exit 1; }
          fi
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
          case "$TCR_REGISTRY" in *.tencentyun.com) ;; *) echo 'TCR_REGISTRY must be a Tencent TCR host.' >&2; exit 1 ;; esac
          [[ "$TCR_NAMESPACE" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo 'TCR_NAMESPACE is invalid.' >&2; exit 1; }
          {
            echo "commit_sha=$SOURCE_SHA"
            echo "tag=sha-${SOURCE_SHA:0:12}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure TX SSH
        shell: bash
        env:
          TX_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_PORT: ${{ secrets.TX_VPS_PORT }}
          TX_KEY: ${{ secrets.TX_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${TX_HOST:?TX_VPS_HOST is required}"
          : "${TX_PORT:?TX_VPS_PORT is required}"
          : "${TX_KEY:?TX_VPS_SSH_KEY is required}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TX_KEY" | tr -d '\r' > ~/.ssh/tx-business-build
          chmod 600 ~/.ssh/tx-business-build
          ssh-keyscan -T 15 -p "$TX_PORT" "$TX_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage TX build publisher
        shell: bash
        env:
          TX_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_USER: ${{ secrets.TX_VPS_USER }}
          TX_PORT: ${{ secrets.TX_VPS_PORT }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          remote="/tmp/wotbtools-business-api-build-${RUN_ID}-${RUN_ATTEMPT}.sh"
          scp \
            -i ~/.ssh/tx-business-build \
            -P "$TX_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$GITHUB_WORKSPACE/deploy/tx/build-business-api-from-gitee.sh" \
            "$TX_USER@$TX_HOST:$remote"
          ssh \
            -i ~/.ssh/tx-business-build \
            -p "$TX_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$TX_USER@$TX_HOST" \
            "chmod 700 '$remote'"

      - name: Build and publish immutable image on TX
        id: remote_build
        shell: bash
        env:
          TX_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_USER: ${{ secrets.TX_VPS_USER }}
          TX_PORT: ${{ secrets.TX_VPS_PORT }}
          SOURCE_SHA: ${{ steps.identity.outputs.commit_sha }}
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          remote="/tmp/wotbtools-business-api-build-${RUN_ID}-${RUN_ATTEMPT}.sh"
          log="$RUNNER_TEMP/tx-business-build.log"

          ssh \
            -i ~/.ssh/tx-business-build \
            -p "$TX_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=6 \
            "$TX_USER@$TX_HOST" \
            "bash '$remote' build-publish '$SOURCE_SHA' '$TCR_REGISTRY' '$TCR_NAMESPACE'" \
            | tee "$log"

          python3 - "$log" >> "$GITHUB_OUTPUT" <<'PY'
          import pathlib
          import sys

          values = {}
          for line in pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines():
              if not line.startswith("RESULT "):
                  continue
              key, value = line[7:].split("=", 1)
              values[key] = value

          required = {"source_sha", "image", "digest", "reused", "build_commit_verified"}
          missing = required - values.keys()
          if missing:
              raise SystemExit(f"missing remote build outputs: {sorted(missing)}")
          if values["build_commit_verified"] != "true":
              raise SystemExit("remote build provenance was not verified")

          for key, value in values.items():
              print(f"{key}={value}")
          PY

      - name: Cleanup staged TX build publisher
        if: always()
        shell: bash
        env:
          TX_HOST: ${{ secrets.TX_VPS_HOST }}
          TX_USER: ${{ secrets.TX_VPS_USER }}
          TX_PORT: ${{ secrets.TX_VPS_PORT }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -u
          remote="/tmp/wotbtools-business-api-build-${RUN_ID}-${RUN_ATTEMPT}.sh"
          if ! ssh \
            -i ~/.ssh/tx-business-build \
            -p "$TX_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$TX_USER@$TX_HOST" \
            "rm -f -- '$remote'"; then
            echo "WARNING: failed to remove staged TX build publisher: $remote"
          fi


  deploy:
    concurrency:
      group: production-maintenance
      cancel-in-progress: false
      queue: max
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tx-production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit_sha }}
      - name: Reject stale main before staging production inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.build.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
      - name: Prepare TX staging directories
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          script: |
            set -eu
            root=/opt/wotb-tx
            mkdir -p "$root/deploy.incoming/deploy" "$root/deploy.incoming/deploy/tx"
            rm -rf -- "$root/deploy.incoming/deploy/tx"
            mkdir -p "$root/deploy.incoming/deploy/tx"
      - name: Stage TX runtime files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          source: deploy/tx,deploy/dependency-readiness.sh,deploy/dependency-readiness.py
          target: /opt/wotb-tx/deploy.incoming
          overwrite: true
      - name: Reject stale main before TX mutation
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.build.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/deploy/check-production-freshness.sh" \
            "$SOURCE_SHA" "$EVENT_NAME" "$EVENT_REF" "$EVENT_SHA"
      - name: Read dependencies and deploy Business API under one host lock
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TX_VPS_HOST }}
          username: ${{ secrets.TX_VPS_USER }}
          port: ${{ secrets.TX_VPS_PORT }}
          key: ${{ secrets.TX_VPS_SSH_KEY }}
          command_timeout: 35m
          envs: WOTB_DEPLOY_SERVICE,WOTB_DEPLOY_CONFIG_SHA,TX_IMAGE_REGISTRY_PREFIX,TX_BUSINESS_API_IMAGE_REF,TX_BUSINESS_DB_NAME,TX_BUSINESS_DB_USERNAME,TX_BUSINESS_DB_PASSWORD,TX_BUSINESS_DB_PASSWORD_VERSION,KEYCLOAK_ADMIN_CLIENT_SECRET,BOOST_AUTO_CONFIRM_HOURS,BOOST_AUTO_CONFIRM_SCAN_MS
          script: |
            set -euo pipefail
            exec 9>/opt/wotb-tx/.deploy.lock
            flock -n 9 || { echo 'Another TX production deployment is running.' >&2; exit 1; }
            export WOTB_DEPLOY_LOCK_FD=9
            export WOTB_DEPLOY_SERVICE=business-api
            export WOTB_DEPLOY_CONFIG_SHA='${{ needs.build.outputs.commit_sha }}'
            export TX_IMAGE_REGISTRY_PREFIX='${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}'
            bash /opt/wotb-tx/deploy.incoming/deploy/dependency-readiness.sh business-api
            bash /opt/wotb-tx/deploy.incoming/deploy/tx/deploy.sh
        env:
          WOTB_DEPLOY_SERVICE: business-api
          WOTB_DEPLOY_CONFIG_SHA: ${{ needs.build.outputs.commit_sha }}
          TX_IMAGE_REGISTRY_PREFIX: ${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}
          TX_BUSINESS_API_IMAGE_REF: ${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}/wotbtools-business-api@${{ needs.build.outputs.digest }}
          TX_BUSINESS_DB_NAME: ${{ vars.TX_BUSINESS_DB_NAME }}
          TX_BUSINESS_DB_USERNAME: ${{ vars.TX_BUSINESS_DB_USERNAME }}
          TX_BUSINESS_DB_PASSWORD: ${{ secrets.TX_BUSINESS_DB_PASSWORD }}
          TX_BUSINESS_DB_PASSWORD_VERSION: ${{ vars.TX_BUSINESS_DB_PASSWORD_VERSION || '1' }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          BOOST_AUTO_CONFIRM_HOURS: ${{ vars.BOOST_AUTO_CONFIRM_HOURS || '72' }}
          BOOST_AUTO_CONFIRM_SCAN_MS: ${{ vars.BOOST_AUTO_CONFIRM_SCAN_MS || '300000' }}
