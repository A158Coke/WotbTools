name: CI / ai-service
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  image:
    name: AI Service image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: docker/setup-buildx-action@v4
      - name: Build AI Service image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ai-service
          push: false
          build-args: BUILD_COMMIT=${{ inputs.head_sha }}
