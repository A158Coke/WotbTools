name: CI / ai-service
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    name: AI Service modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: java/.m2repo
          key: ${{ runner.os }}-maven-${{ hashFiles('java/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      # AI Review 生产链（client canonical projection → gzip HTTP → ClientAiProjectionAdapter → AI）的
      # 契约 / parity 测试只在 wotb-ai 里：wotb-web 不依赖 wotb-ai，Business API job 的 -am 拉不到它。
      - name: Maven verify for AI Service and dependencies
        working-directory: java
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -s settings-ci.xml -Dmaven.repo.local=.m2repo -pl wotb-ai -am verify
  image:
    name: AI Service image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build AI Service image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.ai-service
          push: false
          build-args: BUILD_COMMIT=${{ inputs.head_sha }}
          # 只读 main 的镜像缓存：PR 不写共享 scope，依赖层命中时不用再访问 Maven Central
          cache-from: type=gha,scope=ai-service
