# 开发者本地构建：从源码编译镜像并启动八服务（业务四件套 + 观测四件套）。
# 用法：
#   cd docker/online && docker compose up -d --build
# Log rotation: 20MB per file, max 3 files (shared by all services)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wotb
      POSTGRES_USER: wotb
      POSTGRES_PASSWORD: wotb
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../../deploy/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wotb -d wotb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  keycloak:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      WG_APPLICATION_ID: ${WG_APPLICATION_ID:-}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: wotb
      KC_DB_PASSWORD: wotb
    volumes:
      - ../keycloak/wotbtools-realm.json:/opt/keycloak/data/import/wotbtools-realm.json
    command: start --import-realm --hostname-strict=false --http-enabled=true --http-port=8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    logging: *default-logging

  wotb-backend:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: wotb
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/wotbtools
      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: wotbtools
      KEYCLOAK_ADMIN_CLIENT_ID: wotbtools-admin-api
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      BOOST_AUTO_CONFIRM_HOURS: ${BOOST_AUTO_CONFIRM_HOURS:-72}
      BOOST_AUTO_CONFIRM_SCAN_MS: ${BOOST_AUTO_CONFIRM_SCAN_MS:-300000}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      AI_TIMEOUT_SEC: ${AI_TIMEOUT_SEC:-300}
      AI_CONNECT_TIMEOUT_SEC: ${AI_CONNECT_TIMEOUT_SEC:-10}
      AI_CALL_TIMEOUT_SEC: ${AI_CALL_TIMEOUT_SEC:-315}
      AI_RETRY_MAX_ATTEMPTS: ${AI_RETRY_MAX_ATTEMPTS:-3}
      AI_RETRY_INITIAL_BACKOFF_MS: ${AI_RETRY_INITIAL_BACKOFF_MS:-1000}
      AI_RETRY_MAX_BACKOFF_MS: ${AI_RETRY_MAX_BACKOFF_MS:-8000}
      AI_RETRY_BACKOFF_MULTIPLIER: ${AI_RETRY_BACKOFF_MULTIPLIER:-2.0}
      AI_CONTEXT_WINDOW_TOKENS: ${AI_CONTEXT_WINDOW_TOKENS:-1000000}
      AI_SINGLE_REPLAY_MAX_INPUT_TOKENS: ${AI_SINGLE_REPLAY_MAX_INPUT_TOKENS:-940000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-32768}
      AI_PROMPT_SAFETY_MARGIN_TOKENS: ${AI_PROMPT_SAFETY_MARGIN_TOKENS:-16384}
      AI_THINKING_ENABLED: ${AI_THINKING_ENABLED:-true}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-high}
      AI_REVIEW_WORKER_MAX_CONCURRENT: ${AI_REVIEW_WORKER_MAX_CONCURRENT:-4}
      AI_REVIEW_WORKER_QUEUE_CAPACITY: ${AI_REVIEW_WORKER_QUEUE_CAPACITY:-4}
      REPLAY_COORDINATE_HALF_EXTENT: ${REPLAY_COORDINATE_HALF_EXTENT:-250}
      REPLAY_COORDINATE_CLAMP_TOLERANCE: ${REPLAY_COORDINATE_CLAMP_TOLERANCE:-12.5}
    restart: unless-stopped
    logging: *default-logging

  wotb-frontend:
    build:
      context: ../../
      dockerfile: docker/Dockerfile.frontend
    volumes:
      - ../../deploy/sponsor-config.example.json:/usr/share/nginx/html/sponsor-config.json:ro
      - ../../deploy/sponsor-assets:/usr/share/nginx/html/sponsor-assets:ro
    ports:
      - "8088:80"
    depends_on:
      - wotb-backend
      - keycloak
    restart: unless-stopped
    logging: *default-logging

  # Observability stack: Prometheus / Loki / Alloy / Grafana (docker-internal only)
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=168h
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ../../deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - wotb-backend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../../deploy/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m

  alloy:
    image: grafana/alloy:v1.4.2
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - loki
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m

  grafana:
    image: grafana/grafana:11.6.16
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://monitor.wotbtools.com}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-production}
    volumes:
      - ../../deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m

  # Grafana MCP server（opencode / Claude 等 AI 客户端经 Caddy 反代公网 /mcp 访问）
  # 本地运行需设置 GRAFANA_MCP_TOKEN_FILE 指向 Service Account Token 文件；未设置时服务不启动。
  mcp-grafana:
    image: grafana/mcp-grafana:latest
    command:
      - --transport=sse
      - --address=0.0.0.0:8000
      - -t
      - streamable-http
      - -allowed-hosts
      - ${GRAFANA_MCP_ALLOWED_HOST:-localhost,127.0.0.1}
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: /token
    volumes:
      - ${GRAFANA_MCP_TOKEN_FILE:-/dev/null}:/token:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - grafana
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:
