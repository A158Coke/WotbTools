/api/admin/tournament-broadcasts/seasons:
  post:
    operationId: "createBroadcastSeason"
    summary: "create Broadcast Season"
    security:
      -
        bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/BroadcastSeasonCreate"
    responses:
      "200":
        description: "Public broadcast directory data"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/BroadcastSeasonView"
      "400":
        description: "Invalid input"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "404":
        description: "Not found"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "409":
        description: "The season changed or the root already exists"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "401":
        description: "Authentication required"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "403":
        description: "Real site administrator required"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
