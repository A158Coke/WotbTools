    operationId: "deleteBroadcastSeason"
    summary: "delete Broadcast Season"
    security:
      -
        bearerAuth: []
    parameters:
      -
        name: "seasonId"
        in: "path"
        required: true
        schema:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
      -
        name: "expectedVersion"
        in: "query"
        required: true
        schema:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
      -
        name: "confirm"
        in: "query"
        required: true
        schema:
          type: "boolean"
          const: true
