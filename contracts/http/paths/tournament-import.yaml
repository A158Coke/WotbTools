/api/admin/tournaments/{eventId}/historical-import:
  get:
    operationId: getTournamentHistoricalState
    summary: getTournamentHistoricalState
    description: Historical capability and committed import state are separate from the deployed day response. Previous backends return 404; clients then keep ordinary administration available and disable historical import.
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: roundNumber
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 5
      - name: dayNumber
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 3
    responses:
      "200":
        description: Historical import state
        content:
          application/json:
