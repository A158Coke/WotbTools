/api/admin/tournaments/{eventId}/rounds/{roundNumber}/days/{dayNumber}/recognition-permits:
  post:
    operationId: createTournamentRecognitionPermit
    summary: createTournamentRecognitionPermit
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: roundNumber
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: dayNumber
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    responses:
      "200":
        description: Tournament result
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/TournamentRecognitionPermit"
      "400":
        description: Invalid input
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "403":
        description: Administrator required
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "404":
        description: Not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "409":
        description: Conflict
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required:
              - image
              - expectedEventVersion
              - expectedDayVersion
              - expectedRulesVersion
            properties:
              image:
                type: string
                format: binary
              expectedEventVersion:
                type: integer
                format: int64
                minimum: 0
              expectedDayVersion:
                type: integer
                format: int64
                minimum: 0
              expectedRulesVersion:
                type: integer
                format: int64
                minimum: 0
