      - { name: tankId, in: query, required: false, schema: { type: integer, format: int64 } }
      - { name: nation, in: query, required: false, schema: { type: string } }
      - { name: vehicleType, in: query, required: false, schema: { type: string } }
      - { name: tier, in: query, required: false, schema: { type: integer } }
      - { name: nickname, in: query, required: false, schema: { type: string } }
      - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
      - { name: size, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
    responses:
      '200':
        description: Hall of Fame page
        content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/HallOfFamePage' } } }
