/api/ai-review-feedback:
  post:
    operationId: createAiReviewFeedback
    summary: Submit feedback on a final AI review
    description: JSON request bodies are limited to 3 MiB; larger or malformed requests return 400.
    security: [{ bearerAuth: [] }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/CreateAiReviewFeedbackRequest' } } } }
    responses:
      '201': { description: Created, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/CreateAiReviewFeedbackResponse' } } } }
      '400': { description: Invalid request, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
      '401': { description: Authentication required, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
/api/admin/ai-review-feedback:
  get:
    operationId: listAdminAiReviewFeedback
    summary: List AI review feedback for site administrators
    security: [{ bearerAuth: [] }]
    parameters:
      - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      - { name: reason, in: query, schema: { $ref: '../openapi.yaml#/components/schemas/AiReviewFeedbackReason' } }
    responses:
      '200': { description: Feedback page, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/AdminAiReviewFeedbackPage' } } } }
      '400': { description: Invalid filter or page, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
      '401': { description: Authentication required, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
      '403': { description: Administrator required, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
/api/admin/ai-review-feedback/{id}:
  parameters:
    - { name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
  get:
    operationId: getAdminAiReviewFeedback
    security: [{ bearerAuth: [] }]
    responses:
      '200': { description: Feedback detail, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/AdminAiReviewFeedbackDetail' } } } }
      '400': { description: Invalid id, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
      '401': { description: Authentication required, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
      '403': { description: Administrator required, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
      '404': { description: Feedback not found, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
  delete:
    operationId: deleteAdminAiReviewFeedback
    security: [{ bearerAuth: [] }]
    responses:
      '204': { description: Deleted }
      '400': { description: Invalid id, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
      '401': { description: Authentication required, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
      '403': { description: Administrator required, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
      '404': { description: Feedback not found, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
/api/admin/ai-review-feedback/{id}/status:
  parameters:
    - { name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
  patch:
    operationId: updateAdminAiReviewFeedbackStatus
    summary: Update the status of an AI review feedback record
    security: [{ bearerAuth: [] }]
    requestBody: { required: true, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/UpdateFeedbackStatusRequest' } } } }
    responses:
      '204': { description: Status updated }
      '400': { description: Invalid id or status, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
      '401': { description: Authentication required, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
      '403': { description: Administrator required, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
      '404': { description: Feedback not found, content: { application/json: { schema: { $ref: '../openapi.yaml#/components/schemas/ApiError' } } } }
