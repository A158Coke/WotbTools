/api/recommendations/categories:
  get:
    operationId: listRecommendationCategories
    summary: listRecommendationCategories
    description: Returns populated categories of both types, ordered by ID. Each category has at least one recommendation of its own type. The public snapshot is identical for all roles; administrators use typed metadata for complete dictionaries. An empty array means both directories are empty.
    security: []
    responses:
      "200":
        description: Recommendation result
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/RecommendationCategory"
      "400":
        description: Invalid input
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "404":
        description: Not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "409":
        description: Configuration or resource conflict
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
/api/admin/recommendations/metadata:
  get:
    operationId: getRecommendationMetadata
    summary: Get typed recommendation dictionaries and image upload availability
    description: Returns the complete category dictionary of the required type, including empty categories. UP includes strength levels; VIDEO has an empty levels array. Image upload availability is shared.
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Recommendation management metadata
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/RecommendationMetadata"
      "400":
        description: Missing or invalid recommendation type
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "403":
        description: Tournament administrator required
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
    parameters:
      - name: type
        in: query
        required: true
        schema:
          $ref: "../openapi.yaml#/components/schemas/RecommendationType"
/api/admin/recommendations/categories:
  post:
    operationId: createRecommendationCategory
    summary: createRecommendationCategory
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/RecommendationCategoryRequest"
    responses:
      "201":
        description: Recommendation result
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/RecommendationCategory"
      "400":
        description: Invalid input
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "404":
        description: Not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "409":
        description: Configuration or resource conflict
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
    description: Create a category of the required type. Category type is immutable.
/api/admin/recommendations/categories/{id}:
  delete:
    operationId: deleteRecommendationCategory
    summary: deleteRecommendationCategory
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: type
        in: query
        required: true
        schema:
          $ref: "../openapi.yaml#/components/schemas/RecommendationType"
    responses:
      "204":
        description: Completed
      "400":
        description: Invalid input
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "404":
        description: Not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "409":
        description: Configuration or resource conflict
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
    description: Delete only a category of the required type. Referenced categories are rejected with CREATOR_CATEGORY_IN_USE.
/api/creators/avatars/{avatarId}:
  get:
    operationId: getCreatorAvatar
    summary: Read an attached recommendation image
    security: []
    parameters:
      - name: avatarId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Creator avatar bytes
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      "400":
        description: Invalid input
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "404":
        description: Not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "503":
        description: Avatar storage unavailable
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
