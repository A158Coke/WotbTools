"/api/admin/tournament-broadcasts/categories/{categoryId}/nodes":
  post:
    operationId: "createBroadcastNode"
    summary: "create Broadcast Node"
    security:
      -
        bearerAuth: []
    parameters:
      -
        name: "categoryId"
        in: "path"
        required: true
        schema:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/BroadcastNodeCreate"
    responses:
      "200":
        description: "Public broadcast directory data"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/BroadcastTimedCategoryView"
      "400":
        description: "Invalid input"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "404":
        description: "Not found"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "409":
        description: "The season changed or the root already exists"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "401":
        description: "Authentication required"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "403":
        description: "Real site administrator required"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
