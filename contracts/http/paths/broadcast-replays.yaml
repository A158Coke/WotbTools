"/api/admin/tournament-broadcasts/replays/{replayId}":
  put:
    operationId: "updateBroadcastReplay"
    summary: "update Broadcast Replay"
    security:
      -
        bearerAuth: []
    parameters:
      -
        name: "replayId"
        in: "path"
        required: true
        schema:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: "object"
            required: ["payload"]
            properties:
              payload:
                $ref: "../openapi.yaml#/components/schemas/BroadcastTimedReplaySave"
              cover:
                type: "string"
                format: "binary"
          encoding:
            payload:
              contentType: "application/json"
    responses:
      "200":
        description: "Public broadcast directory data"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/BroadcastTimedCategoryView"
      "400":
        description: "Invalid input"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "404":
        description: "Not found"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "409":
        description: "The season changed or the root already exists"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "401":
        description: "Authentication required"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "403":
        description: "Real site administrator required"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "413":
        description: "Upload too large"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "502":
        description: "Cover storage request failed"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "503":
        description: "Cover storage is not configured"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
  delete:
    operationId: "deleteBroadcastReplay"
    summary: "delete Broadcast Replay"
    security:
      -
        bearerAuth: []
    parameters:
      -
        name: "replayId"
        in: "path"
        required: true
        schema:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
      -
        name: "expectedVersion"
        in: "query"
        required: true
        schema:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
      -
        name: "confirm"
        in: "query"
        required: true
        schema:
          type: "boolean"
          const: true
    responses:
      "204":
        description: "Deleted"
      "400":
        description: "Invalid input"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "404":
        description: "Not found"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "409":
        description: "The season changed or the root already exists"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "401":
        description: "Authentication required"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "403":
        description: "Real site administrator required"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
