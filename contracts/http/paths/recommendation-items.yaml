/api/recommendations:
  get:
    operationId: listRecommendations
    summary: listRecommendations
    security: []
    parameters:
      - name: categoryId
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: type
        in: query
        required: true
        schema:
          $ref: "../openapi.yaml#/components/schemas/RecommendationType"
    responses:
      "200":
        description: Recommendation result
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/RecommendationCard"
      "400":
        description: Invalid input
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "404":
        description: Not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "409":
        description: Configuration or resource conflict
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
    description: Returns only the required type, ordered by score, creation time and ID descending. categoryId must belong to the requested type. Requires recommendations-v1 capability.
/api/admin/recommendations:
  post:
    operationId: createRecommendation
    summary: createRecommendation
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required:
              - payload
            properties:
              payload:
                $ref: "../openapi.yaml#/components/schemas/RecommendationSaveRequest"
              image:
                type: string
                format: binary
                description: One PNG/JPEG file, at most 10 MiB; required only for REPLACE. The server stores a thumbnail with longest edge at most 256px.
          encoding:
            payload:
              contentType: application/json
    responses:
      "201":
        description: Recommendation result
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/RecommendationDetail"
      "400":
        description: Invalid input
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "401":
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "403":
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "404":
        description: Not found
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "409":
        description: Configuration or resource conflict
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "413":
        description: "FILE_TOO_LARGE: image input exceeds the configured limits"
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
      "503":
        description: Avatar storage unavailable
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ApiError"
    description: Requires content-admin. Type is required and immutable on update; categories must have the same type. UP identifiers are normalized positive decimal UIDs. VIDEO identifiers are trimmed case-sensitive BV identifiers and levelId must be null. KEEP and REMOVE require no image; REPLACE requires exactly one PNG/JPEG image. expectedVersion is null on creation and the loaded version on update. Stale writes return CREATOR_CONFIG_CONFLICT; duplicate VIDEO identifiers return RECOMMENDATION_ID_ALREADY_EXISTS. Unknown payload fields are rejected.
