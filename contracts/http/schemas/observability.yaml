ObservabilityEventsRequest:
  type: object
  additionalProperties: false
  required: [events]
  properties:
    events:
      type: array
      minItems: 1
      maxItems: 20
      items:
        $ref: "../openapi.yaml#/components/schemas/ObservabilityEvent"
ObservabilityEvent:
  description: Event-family discriminated union. Android download clicks use an exact tuple and cannot carry replay-parse-only fields.
  oneOf:
    - $ref: "../openapi.yaml#/components/schemas/GenericObservabilityEvent"
    - $ref: "../openapi.yaml#/components/schemas/AndroidDownloadClickEvent"
GenericObservabilityEvent:
  description: All product telemetry except the dedicated Android download click event.
  type: object
  additionalProperties: false
  required: [event_id, event, platform, feature, occurred_at]
  properties:
    event_id:
      type: string
      format: uuid
    event:
      type: string
      enum: [active_user, feature_open, replay_parse]
    platform:
      type: string
      enum: [web, android]
    feature:
      type: string
      enum: [home, replay_parse, replay_2d, replay_3d, replay_shots, ai_review, tankopedia, armor, hall_of_fame, tournament, android_download, sponsor, profile]
    occurred_at:
      type: string
      format: date-time
    operation_id:
      type: string
      format: uuid
      description: Required for replay_parse; one ID per file attempt shared by start and terminal.
    outcome:
      type: string
      enum: [start, success, failure, cancelled]
      description: Required only for replay_parse.
    error_code:
      type: string
      enum: [PARSE_FAILED, UNSUPPORTED_REPLAY, INVALID_REPLAY, RESOURCE_UNAVAILABLE, UNKNOWN]
      description: Allowed only for failed replay_parse. Never raw exception text.
    error_id:
      type: string
      format: uuid
      description: Allowed only for failed replay_parse.
AndroidDownloadClickEvent:
  description: One click on the final "下载 APK" button on /download/android. Intent only; never implies a completed transfer or installation.
  type: object
  additionalProperties: false
  required: [event_id, event, platform, feature, occurred_at]
  properties:
    event_id:
      type: string
      format: uuid
    event:
      type: string
      enum: [android_download_click]
    platform:
      type: string
      enum: [web]
    feature:
      type: string
      enum: [android_download]
    occurred_at:
      type: string
      format: date-time
