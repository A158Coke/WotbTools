AiReviewFeedbackReason:
  type: string
  enum: [FACT_ERROR, BAD_JUDGMENT, MISSED_KEY_POINT, TOO_AI_LIKE, TOO_VAGUE, TOO_VERBOSE, UNHELPFUL_ADVICE, OTHER]
CreateAiReviewFeedbackRequest:
  type: object
  additionalProperties: false
  required: [reasonCodes, aiResponseText]
  properties:
    reasonCodes: { type: array, maxItems: 8, uniqueItems: true, items: { $ref: '../openapi.yaml#/components/schemas/AiReviewFeedbackReason' } }
    feedbackText: { type: [string, 'null'], maxLength: 4000 }
    aiResponseText: { type: string, minLength: 1, maxLength: 200000 }
    model: { type: [string, 'null'], maxLength: 128 }
  description: At least one reason or non-blank feedback text is required; AI response must be non-blank. Text is stored without modification. NUL and unpaired surrogates are invalid because they cannot round-trip through PostgreSQL UTF-8 text.
CreateAiReviewFeedbackResponse:
  type: object
  additionalProperties: false
  required: [id, createdAt]
  properties:
    id: { type: string, pattern: '^[1-9][0-9]*$' }
    createdAt: { type: string, format: date-time }
FeedbackStatus:
  type: string
  enum: [PENDING, FIXED]
UpdateFeedbackStatusRequest:
  type: object
  additionalProperties: false
  required: [status]
  properties:
    status: { $ref: '../openapi.yaml#/components/schemas/FeedbackStatus' }
AdminAiReviewFeedbackListItem:
  type: object
  additionalProperties: false
  required: [id, reasonCodes, feedbackText, model, createdAt, status]
  properties:
    id: { type: string, pattern: '^[1-9][0-9]*$' }
    reasonCodes: { type: array, maxItems: 8, uniqueItems: true, items: { $ref: '../openapi.yaml#/components/schemas/AiReviewFeedbackReason' } }
    feedbackText: { type: [string, 'null'] }
    model: { type: [string, 'null'] }
    createdAt: { type: string, format: date-time }
    status: { $ref: '../openapi.yaml#/components/schemas/FeedbackStatus' }
AdminAiReviewFeedbackDetail:
  type: object
  additionalProperties: false
  required: [id, reasonCodes, feedbackText, aiResponseText, model, createdAt, status]
  properties:
    id: { type: string, pattern: '^[1-9][0-9]*$' }
    reasonCodes: { type: array, maxItems: 8, uniqueItems: true, items: { $ref: '../openapi.yaml#/components/schemas/AiReviewFeedbackReason' } }
    feedbackText: { type: [string, 'null'] }
    aiResponseText: { type: string }
    model: { type: [string, 'null'] }
    createdAt: { type: string, format: date-time }
    status: { $ref: '../openapi.yaml#/components/schemas/FeedbackStatus' }
AdminAiReviewFeedbackPage:
  type: object
  additionalProperties: false
  required: [items, page, size, totalItems, totalPages]
  properties:
    items: { type: array, items: { $ref: '../openapi.yaml#/components/schemas/AdminAiReviewFeedbackListItem' } }
    page: { type: integer, minimum: 0 }
    size: { type: integer, minimum: 1, maximum: 100 }
    totalItems: { type: integer, minimum: 0 }
    totalPages: { type: integer, minimum: 0 }
SiteFeedbackReason:
  type: string
  enum: [BUG, FEATURE_REQUEST, DATA_ERROR, USABILITY, OTHER]
CreateSiteFeedbackRequest:
  type: object
  additionalProperties: false
  required: [reasonCodes]
  properties:
    reasonCodes: { type: array, maxItems: 5, uniqueItems: true, items: { $ref: '../openapi.yaml#/components/schemas/SiteFeedbackReason' } }
    feedbackText: { type: [string, 'null'], maxLength: 4000 }
    pageView: { type: [string, 'null'], pattern: '^[a-z0-9-]{1,64}$' }
  description: At least one reason or non-blank feedback text is required. Text is stored without modification. NUL and unpaired surrogates are invalid because they cannot round-trip through PostgreSQL UTF-8 text.
CreateSiteFeedbackResponse:
  type: object
  additionalProperties: false
  required: [id, createdAt]
  properties:
    id: { type: string, pattern: '^[1-9][0-9]*$' }
    createdAt: { type: string, format: date-time }
AdminSiteFeedbackListItem:
  type: object
  additionalProperties: false
  required: [id, reasonCodes, feedbackText, pageView, createdAt, status]
  properties:
    id: { type: string, pattern: '^[1-9][0-9]*$' }
    reasonCodes: { type: array, maxItems: 5, uniqueItems: true, items: { $ref: '../openapi.yaml#/components/schemas/SiteFeedbackReason' } }
    feedbackText: { type: [string, 'null'] }
    pageView: { type: [string, 'null'] }
    createdAt: { type: string, format: date-time }
    status: { $ref: '../openapi.yaml#/components/schemas/FeedbackStatus' }
AdminSiteFeedbackDetail:
  type: object
  additionalProperties: false
  required: [id, reasonCodes, feedbackText, pageView, createdAt, status]
  properties:
    id: { type: string, pattern: '^[1-9][0-9]*$' }
    reasonCodes: { type: array, maxItems: 5, uniqueItems: true, items: { $ref: '../openapi.yaml#/components/schemas/SiteFeedbackReason' } }
    feedbackText: { type: [string, 'null'] }
    pageView: { type: [string, 'null'] }
    createdAt: { type: string, format: date-time }
    status: { $ref: '../openapi.yaml#/components/schemas/FeedbackStatus' }
AdminSiteFeedbackPage:
  type: object
  additionalProperties: false
  required: [items, page, size, totalItems, totalPages]
  properties:
    items: { type: array, items: { $ref: '../openapi.yaml#/components/schemas/AdminSiteFeedbackListItem' } }
    page: { type: integer, minimum: 0 }
    size: { type: integer, minimum: 1, maximum: 100 }
    totalItems: { type: integer, minimum: 0 }
    totalPages: { type: integer, minimum: 0 }
