components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RecommendationType:
      type: string
      enum:
        - UP
        - VIDEO
    RecommendationCategory:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - name
      properties:
        type:
          $ref: "#/components/schemas/RecommendationType"
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
    RecommendationCard:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - externalId
        - name
        - description
        - targetUrl
        - imageUrl
        - categories
        - level
        - score
        - createdAt
        - version
      properties:
        type:
          $ref: "#/components/schemas/RecommendationType"
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type:
            - string
            - "null"
          maxLength: 2000
        categories:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationCategory"
          minItems: 1
        level:
          oneOf:
            - $ref: "#/components/schemas/CreatorLevel"
            - type: "null"
        score:
          type: integer
          enum:
            - 2
            - 4
            - 6
            - 8
            - 10
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
        externalId:
          type: string
          description: "UP: positive decimal UID. VIDEO: case-sensitive BV identifier. See type-specific constraints."
        targetUrl:
          type: string
          format: uri
        imageUrl:
          type:
            - string
            - "null"
      allOf:
        - if:
            properties:
              type:
                const: UP
          then:
            properties:
              externalId:
                type: string
                pattern: ^[1-9][0-9]{0,19}$
                maxLength: 20
              targetUrl:
                type: string
                format: uri
                pattern: ^https://space\.bilibili\.com/[1-9][0-9]{0,19}$
                maxLength: 47
              categories:
                items:
                  properties:
                    type:
                      const: UP
          else:
            properties:
              externalId:
                type: string
                pattern: ^BV[A-Za-z0-9]{10}$
                description: Case-sensitive BV identifier. Only surrounding ECMAScript whitespace is trimmed; structural validation does not verify video existence.
              level:
                type: "null"
              targetUrl:
                type: string
                format: uri
                pattern: ^https://www\.bilibili\.com/video/BV[A-Za-z0-9]{10}$
              categories:
                items:
                  properties:
                    type:
                      const: VIDEO
    RecommendationDetail:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - externalId
        - name
        - description
        - categoryIds
        - levelId
        - stars
        - imageUrl
        - version
      properties:
        type:
          $ref: "#/components/schemas/RecommendationType"
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type:
            - string
            - "null"
          maxLength: 2000
        categoryIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
        levelId:
          type:
            - integer
            - "null"
          minimum: 1
        stars:
          type: integer
          minimum: 1
          maximum: 5
        version:
          type: integer
          minimum: 0
        externalId:
          type: string
          description: "UP: positive decimal UID. VIDEO: case-sensitive BV identifier. See type-specific constraints."
        imageUrl:
          type:
            - string
            - "null"
      allOf:
        - if:
            properties:
              type:
                const: UP
          then:
            properties:
              externalId:
                type: string
                pattern: ^[1-9][0-9]{0,19}$
                maxLength: 20
          else:
            properties:
              externalId:
                type: string
                pattern: ^BV[A-Za-z0-9]{10}$
                description: Case-sensitive BV identifier. Only surrounding ECMAScript whitespace is trimmed; structural validation does not verify video existence.
              levelId:
                type: "null"
    RecommendationSaveRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - externalId
        - name
        - description
        - categoryIds
        - levelId
        - stars
        - imageAction
        - expectedVersion
      properties:
        type:
          $ref: "#/components/schemas/RecommendationType"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type:
            - string
            - "null"
          maxLength: 2000
        categoryIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
        levelId:
          type:
            - integer
            - "null"
          minimum: 1
        stars:
          type: integer
          minimum: 1
          maximum: 5
        expectedVersion:
          type:
            - integer
            - "null"
          minimum: 0
        externalId:
          type: string
          description: "UP: positive decimal UID. VIDEO: case-sensitive BV identifier. See type-specific constraints."
        imageAction:
          type: string
          enum:
            - KEEP
            - REPLACE
            - REMOVE
      allOf:
        - if:
            properties:
              type:
                const: UP
          then:
            properties:
              externalId:
                type: string
                pattern: ^\s*(?=0*[1-9])[0-9]{1,20}\s*$
                description: Positive decimal UID of at most 20 digits; surrounding whitespace and leading zeros are normalized by the server.
          else:
            properties:
              externalId:
                type: string
                pattern: ^\s*BV[A-Za-z0-9]{10}\s*$
                description: Case-sensitive BV identifier. Only surrounding ECMAScript whitespace is trimmed; structural validation does not verify video existence.
              levelId:
                type: "null"
    RecommendationMetadata:
      type: object
      additionalProperties: false
      required:
        - type
        - categories
        - levels
        - imageUploadsAvailable
      properties:
        type:
          $ref: "#/components/schemas/RecommendationType"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationCategory"
        levels:
          type: array
          items:
            $ref: "#/components/schemas/CreatorLevel"
        imageUploadsAvailable:
          type: boolean
      allOf:
        - if:
            properties:
              type:
                const: VIDEO
          then:
            properties:
              levels:
                maxItems: 0
              categories:
                items:
                  properties:
                    type:
                      const: VIDEO
          else:
            properties:
              categories:
                items:
                  properties:
                    type:
                      const: UP
    RecommendationCategoryRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - name
      properties:
        type:
          $ref: "#/components/schemas/RecommendationType"
        name:
          type: string
          minLength: 1
          maxLength: 100
    CreatorLevel:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
    CreatorNameRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    BackendHealth:
      type: object
      additionalProperties: true
      required:
        - status
        - tanks
      properties:
        status:
          type: string
        tanks:
          type: integer
          minimum: 0
        capabilities:
          description: >-
            recommendations-v1 enables the UP/VIDEO recommendation APIs and their populated
            public categories. Technical capability markers are independent of directory
            contents and read without querying the database; clients fetch public categories
            to decide which recommendation types have content. broadcast-season-contents-v1
            enables the consistent season contents endpoint and version-confirmed category
            deletion; frontend deployment requires this marker before replacing live containers.
          type: array
          items:
            type: string
    BroadcastServer:
      type: "string"
      enum: ["CN", "ASIA", "NA", "EU", "LESTA"]
    BroadcastCategoryType:
      type: "string"
      enum: ["POINTS", "QUARTER_FINALS", "SEMI_FINALS"]
    BroadcastFormat:
      type: "string"
      enum: ["ROUND_ROBIN", "KNOCKOUT"]
    BroadcastPerspective:
      type: "string"
      enum: ["POV", "OBSERVER"]
    BroadcastBracket:
      type: "string"
      enum: ["DEFAULT", "WINNERS", "LOSERS"]
    BroadcastSeason:
      type: "object"
      additionalProperties: false
      required: ["id", "server", "year", "nameZh", "nameEn", "nameRu", "startDate", "createdAt", "version", "rootCount", "replayCount"]
      properties:
        id:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
        server:
          $ref: "#/components/schemas/BroadcastServer"
        year:
          type: "integer"
          minimum: 1
          maximum: 9999
        nameZh:
          type: "string"
          minLength: 1
          maxLength: 100
        nameEn:
          type: "string"
          minLength: 1
          maxLength: 100
        nameRu:
          type: ["string", "null"]
          maxLength: 100
        startDate:
          type: ["string", "null"]
          format: "date"
        createdAt:
          type: "string"
          format: "date-time"
        version:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        rootCount:
          type: "integer"
          minimum: 0
          maximum: 2147483647
        replayCount:
          type: "integer"
          minimum: 0
          maximum: 2147483647
    BroadcastCategory:
      type: "object"
      additionalProperties: false
      required: ["id", "seasonId", "type"]
      properties:
        id:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
        seasonId:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
        type:
          $ref: "#/components/schemas/BroadcastCategoryType"
    BroadcastReplay:
      type: "object"
      additionalProperties: false
      required: ["id", "nodeId", "title", "url", "matchDate", "dayNumber", "groupNumber", "bracket", "teams", "perspective", "coverId"]
      properties:
        id:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
        nodeId:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
        title:
          type: "string"
          minLength: 1
          maxLength: 200
        url:
          type: "string"
          minLength: 1
          maxLength: 2048
          pattern: "^[hH][tT][tT][pP][sS]?://[^\\s]+$"
        matchDate:
          type: "string"
          format: "date"
        dayNumber:
          type: "integer"
          minimum: 1
          maximum: 2147483647
        groupNumber:
          type: ["integer", "null"]
          minimum: 1
          maximum: 2147483647
        bracket:
          anyOf:
            -
              $ref: "#/components/schemas/BroadcastBracket"
            -
              type: "null"
        teams:
          type: "array"
          minItems: 2
          maxItems: 4
          items:
            type: "string"
            minLength: 1
            maxLength: 100
        perspective:
          $ref: "#/components/schemas/BroadcastPerspective"
        coverId:
          type: ["string", "null"]
          format: "uuid"
    BroadcastNode:
      type: "object"
      additionalProperties: false
      required: ["id", "categoryId", "roundNumber", "format", "replays"]
      properties:
        id:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
        categoryId:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
        roundNumber:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5
        format:
          anyOf:
            -
              $ref: "#/components/schemas/BroadcastFormat"
            -
              type: "null"
        replays:
          type: "array"
          items:
            $ref: "#/components/schemas/BroadcastReplay"
    BroadcastIndex:
      type: "object"
      additionalProperties: false
      required: ["servers", "seasons", "coverUploadAvailable"]
      properties:
        servers:
          type: "array"
          minItems: 5
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "#/components/schemas/BroadcastServer"
        seasons:
          type: "array"
          items:
            $ref: "#/components/schemas/BroadcastSeason"
        coverUploadAvailable:
          type: "boolean"
    BroadcastSeasonView:
      type: "object"
      additionalProperties: false
      required: ["season", "categories", "coverUploadAvailable"]
      properties:
        season:
          $ref: "#/components/schemas/BroadcastSeason"
        categories:
          type: "array"
          items:
            $ref: "#/components/schemas/BroadcastCategory"
        coverUploadAvailable:
          type: "boolean"
    BroadcastTimeZone:
      type: string
      enum:
        - Asia/Shanghai
        - America/Los_Angeles
        - Europe/Berlin
        - Europe/Moscow
    BroadcastReplayStart:
      type: object
      additionalProperties: false
      required:
        - replayId
        - startsAt
      properties:
        replayId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        startsAt:
          type: string
          format: date-time
    BroadcastSeasonContents:
      type: object
      additionalProperties: false
      required:
        - season
        - categories
        - nodes
        - defaultTimeZone
        - replayStarts
        - coverUploadAvailable
      properties:
        season:
          $ref: "#/components/schemas/BroadcastSeason"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/BroadcastCategory"
        coverUploadAvailable:
          type: boolean
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/BroadcastNode"
        defaultTimeZone:
          $ref: "#/components/schemas/BroadcastTimeZone"
        replayStarts:
          type: array
          description: Only replays with a known start instant are included.
          items:
            $ref: "#/components/schemas/BroadcastReplayStart"
    BroadcastTimedCategoryView:
      type: object
      additionalProperties: false
      required:
        - data
        - defaultTimeZone
        - replayStarts
      properties:
        data:
          $ref: "#/components/schemas/BroadcastCategoryView"
        defaultTimeZone:
          $ref: "#/components/schemas/BroadcastTimeZone"
        replayStarts:
          type: array
          description: Only replays with a known start instant are included.
          items:
            $ref: "#/components/schemas/BroadcastReplayStart"
    BroadcastTimedReplaySave:
      type: object
      additionalProperties: false
      required: [replay, startsAt]
      properties:
        replay:
          $ref: "#/components/schemas/BroadcastReplaySave"
        startsAt:
          type: [string, 'null']
          format: date-time
          description: Explicit null clears the time. When present, its date in the server tournament timezone must equal replay.matchDate.
    BroadcastCategoryView:
      type: "object"
      additionalProperties: false
      required: ["season", "category", "nodes", "coverUploadAvailable"]
      properties:
        season:
          $ref: "#/components/schemas/BroadcastSeason"
        category:
          $ref: "#/components/schemas/BroadcastCategory"
        nodes:
          type: "array"
          items:
            $ref: "#/components/schemas/BroadcastNode"
        coverUploadAvailable:
          type: "boolean"
    BroadcastDeletionPreview:
