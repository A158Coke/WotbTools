openapi: 3.1.0
info:
  title: WotBTools HTTP Contract
  version: 1.0.0
  description: FE ↔ BE wire contract. Domain models and Control/Worker contracts are separate authorities.
paths:
  /api/recommendations:
    get:
      operationId: listRecommendations
      summary: listRecommendations
      security: []
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/RecommendationType"
      responses:
        "200":
          description: Recommendation result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecommendationCard"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Configuration or resource conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: Returns only the required type, ordered by score, creation time and ID descending. categoryId must belong to the requested type. Requires recommendations-v1 capability.
  /api/recommendations/categories:
    get:
      operationId: listRecommendationCategories
      summary: listRecommendationCategories
      description: Returns populated categories of both types, ordered by ID. Each category has at least one recommendation of its own type. The public snapshot is identical for all roles; administrators use typed metadata for complete dictionaries. An empty array means both directories are empty.
      security: []
      responses:
        "200":
          description: Recommendation result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecommendationCategory"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Configuration or resource conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/recommendations:
    post:
      operationId: createRecommendation
      summary: createRecommendation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - payload
              properties:
                payload:
                  $ref: "#/components/schemas/RecommendationSaveRequest"
                image:
                  type: string
                  format: binary
                  description: One PNG/JPEG file, at most 10 MiB; required only for REPLACE. The server stores a thumbnail with longest edge at most 256px.
            encoding:
              payload:
                contentType: application/json
      responses:
        "201":
          description: Recommendation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Configuration or resource conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: "FILE_TOO_LARGE: image input exceeds the configured limits"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Avatar storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: Requires content-admin. Type is required and immutable on update; categories must have the same type. UP identifiers are normalized positive decimal UIDs. VIDEO identifiers are trimmed case-sensitive BV identifiers and levelId must be null. KEEP and REMOVE require no image; REPLACE requires exactly one PNG/JPEG image. expectedVersion is null on creation and the loaded version on update. Stale writes return CREATOR_CONFIG_CONFLICT; duplicate VIDEO identifiers return RECOMMENDATION_ID_ALREADY_EXISTS. Unknown payload fields are rejected.
  /api/admin/recommendations/{id}:
    get:
      operationId: getRecommendationDetail
      summary: getRecommendationDetail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/RecommendationType"
      responses:
        "200":
          description: Recommendation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Configuration or resource conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateRecommendation
      summary: updateRecommendation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - payload
              properties:
                payload:
                  $ref: "#/components/schemas/RecommendationSaveRequest"
                image:
                  type: string
                  format: binary
                  description: One PNG/JPEG file, at most 10 MiB; required only for REPLACE. The server stores a thumbnail with longest edge at most 256px.
            encoding:
              payload:
                contentType: application/json
      responses:
        "200":
          description: Recommendation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Configuration or resource conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: "FILE_TOO_LARGE: image input exceeds the configured limits"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Avatar storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: Requires content-admin. Type is required and immutable on update; categories must have the same type. UP identifiers are normalized positive decimal UIDs. VIDEO identifiers are trimmed case-sensitive BV identifiers and levelId must be null. KEEP and REMOVE require no image; REPLACE requires exactly one PNG/JPEG image. expectedVersion is null on creation and the loaded version on update. Stale writes return CREATOR_CONFIG_CONFLICT; duplicate VIDEO identifiers return RECOMMENDATION_ID_ALREADY_EXISTS. Unknown payload fields are rejected.
    delete:
      operationId: deleteRecommendation
      summary: deleteRecommendation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: expectedVersion
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
          description: The version from the public card captured before confirming removal; stale versions return CREATOR_CONFIG_CONFLICT.
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/RecommendationType"
      responses:
        "204":
          description: Completed
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Configuration or resource conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/recommendations/metadata:
    get:
      operationId: getRecommendationMetadata
      summary: Get typed recommendation dictionaries and image upload availability
      description: Returns the complete category dictionary of the required type, including empty categories. UP includes strength levels; VIDEO has an empty levels array. Image upload availability is shared.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recommendation management metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationMetadata"
        "400":
          description: Missing or invalid recommendation type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Tournament administrator required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/RecommendationType"
  /api/admin/recommendations/categories:
    post:
      operationId: createRecommendationCategory
      summary: createRecommendationCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationCategoryRequest"
      responses:
        "201":
          description: Recommendation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationCategory"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Configuration or resource conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: Create a category of the required type. Category type is immutable.
  /api/admin/recommendations/categories/{id}:
    delete:
      operationId: deleteRecommendationCategory
      summary: deleteRecommendationCategory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/RecommendationType"
      responses:
        "204":
          description: Completed
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Configuration or resource conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      description: Delete only a category of the required type. Referenced categories are rejected with CREATOR_CATEGORY_IN_USE.
  /api/creators/avatars/{avatarId}:
    get:
      operationId: getCreatorAvatar
      summary: Read an attached recommendation image
      security: []
      parameters:
        - name: avatarId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Creator avatar bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Avatar storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/recommendations/levels:
    post:
      operationId: createCreatorLevel
      summary: createCreatorLevel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorNameRequest"
      responses:
        "201":
          description: Creator result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorLevel"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Configuration or resource conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/recommendations/levels/{id}:
    delete:
      operationId: deleteCreatorLevel
      summary: deleteCreatorLevel
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Completed
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Configuration or resource conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/health:
    get:
      operationId: getBackendHealth
      summary: Check backend health and additive product capabilities
      security: []
      responses:
        "200":
          description: Legacy health bodies may omit capabilities; clients must not assume product support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendHealth"
  /api/observability/events:
    post:
      operationId: recordObservabilityEvents
      summary: Record bounded, best-effort product telemetry
      description: Maximum 16384 bytes. Anonymous feature events allowed; active_user requires a valid bearer token. No arbitrary text or account identity accepted. Times must be within the past 24 hours and at most five minutes ahead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservabilityEventsRequest"
      responses:
        "204":
          description: Events accepted
        "400":
          description: Invalid telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Active-user hashing not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/tournaments:
    get:
      operationId: listTournamentEvents
      summary: listTournamentEvents
      responses:
        "200":
          description: Tournament result
          headers:
            X-Tournament-Csv-Import:
              description: Version 1 supports recurring CSV imports and public data-source metadata.
              schema:
                type: string
                enum: ["1"]
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentEvent"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/tournaments/{eventId}/data-source:
    get:
      operationId: getTournamentDataSource
      summary: Get the persistent CSV data-source attribution for an event
      description: Probe the existing public event-list route for X-Tournament-Csv-Import before calling this endpoint on a rolling deployment. Once a CSV import succeeds, attribution remains associated with the event.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Event data-source metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDataSource"
        "400":
          description: Invalid event identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/tournaments/{eventId}/standings:
    get:
      operationId: getTournamentStandings
      summary: getTournamentStandings
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Tournament result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentStandings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/tournaments:
    head:
      operationId: getTournamentCapabilities
      summary: Check tournament capabilities without changing the existing event-list body
      description: Requires the tournament-admin role. Older backends return 200 without capability headers; clients must probe this existing route before requesting default-rule or CSV-import endpoints.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Event-list headers
          headers:
            X-Tournament-Default-Rules:
              description: Version 1 supports global default rule operations, including direct configuration.
              schema:
                type: string
                enum: ["1"]
            X-Tournament-Csv-Import:
              description: Version 1 supports recurring CSV imports and public data-source metadata.
              schema:
                type: string
                enum: ["1"]
        "401":
          description: Authentication required
        "403":
          description: Tournament administrator required
    get:
      operationId: listAdminTournamentEvents
      summary: listAdminTournamentEvents
      responses:
        "200":
          description: Tournament result
          headers:
            X-Tournament-Default-Rules:
              description: Version 1 supports global default rule operations, including direct configuration.
              schema:
                type: string
                enum: ["1"]
            X-Tournament-Csv-Import:
              description: Version 1 supports recurring CSV imports and public data-source metadata.
              schema:
                type: string
                enum: ["1"]
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentEvent"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
        - bearerAuth: []
    post:
      operationId: createTournament
      summary: createTournament
      responses:
        "200":
          description: Tournament result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentConfig"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentCreateRequest"
  /api/admin/tournaments/rules/default:
    get:
      operationId: getTournamentDefaultRules
      summary: Read the global default rule snapshot
      description: Requires the tournament-admin role. The singleton version remains available when no default is active.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current global default state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDefaultRules"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Tournament administrator required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: setTournamentDefaultRules
      summary: Publish a saved event rule set as the global default
      description: Requires the tournament-admin role. Atomically replaces the full snapshot after checking both versions. Replacing an active default requires confirm=true. Ordinary event edits do not change the published snapshot.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentSetDefaultRulesRequest"
      responses:
        "200":
          description: Updated global default state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDefaultRules"
        "400":
          description: INVALID_ARGUMENT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
