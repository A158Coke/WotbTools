openapi: 3.1.0
info:
  title: WotBTools HTTP Contract
  version: 1.0.0
  description: FE ↔ BE wire contract. Domain models and Control/Worker contracts are separate authorities.
paths:
  /api/hof/hundred:
    get:
      operationId: listHundredLeaderboard
      summary: List the public Hundred Battles leaderboard
      parameters:
        - { name: vehicleId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: nation, in: query, required: false, schema: { type: string } }
        - { name: vehicleType, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Hundred leaderboard page
          content: { application/json: { schema: { $ref: '#/components/schemas/HundredLeaderboardPage' } } }
        '400': { description: Invalid filter, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/hof/hundred/submissions:
    post:
      operationId: createHundredSubmission
      summary: Create a manual Hundred Battles submission
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [vehicleId, averageDamage, battleCount, screenshot, replays]
              properties:
                vehicleId: { type: integer, format: int64 }
                averageDamage: { type: integer, minimum: 1 }
                battleCount: { type: integer, minimum: 1 }
                screenshot: { type: string, description: Base64 image data URL }
                replays: { type: array, minItems: 5, maxItems: 5, items: { type: string, format: binary } }
      responses:
        '200': { description: Pending submission, content: { application/json: { schema: { $ref: '#/components/schemas/HundredCreateResult' } } } }
        '400': { description: Invalid submission, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/hof/hundred/submissions/{id}/cancel:
    post:
      operationId: cancelHundredSubmission
      summary: Cancel the authenticated user's pending submission
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Cancelled submission, content: { application/json: { schema: { $ref: '#/components/schemas/HundredSubmissionSummary' } } } }
        '403': { description: Not the submission owner, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/users/hundred/status:
    get:
      operationId: getHundredUserStatus
      summary: Read the authenticated user's Hundred submission status
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User Hundred status, content: { application/json: { schema: { $ref: '#/components/schemas/HundredUserStatus' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/users/profile:
    get:
      operationId: getCurrentUserProfile
      summary: Read the authenticated user's WotBTools business profile
      description: >-
        user_profile is the WotBTools business-user projection of the Keycloak identity. Every
        authenticated user that reaches the SPA is provisioned by the global business bootstrap,
        so 404 PROFILE_NOT_FOUND now only means provisioning has not succeeded yet.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user profile, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Profile not provisioned yet, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    put:
      operationId: ensureCurrentUserProfile
      summary: Idempotently ensure the authenticated user's WotBTools business profile
      description: >-
        This is ensure, not create. An existing profile is returned unchanged: wotbServer,
        wotbAccountId, wotbNickname, wotbAccountSource and wotbAccountVerifiedAt are never
        overwritten. A missing profile is created with the canonical provisioning semantics
        (trusted Wargaming claims create that region with source WARGAMING; otherwise CN with
        source MANUAL). Concurrent calls for the same subject both succeed and leave exactly one
        row: the loser of the keycloak_user_id unique race reloads the winner's profile instead of
        reporting an already-exists conflict. A real WotB ownership collision is never swallowed
        and still returns 409 WOTB_ACCOUNT_ALREADY_USED. Identity comes solely from the bearer
        token and no request body is accepted, so a caller cannot impersonate another user.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Existing or newly provisioned profile, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: The WotB account is already bound to another user, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '500': { description: Profile bootstrap invariant violated, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/admin/hof/hundred/submissions:
    get:
      operationId: listHundredAdminSubmissions
      summary: List Hundred submissions for moderation
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: nation, in: query, required: false, schema: { type: string } }
        - { name: vehicleType, in: query, required: false, schema: { type: string } }
        - { name: vehicleId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Moderation page, content: { application/json: { schema: { $ref: '#/components/schemas/HundredAdminPage' } } } }
  /api/admin/hof/hundred/submissions/{id}:
    get:
      operationId: getHundredAdminSubmission
      summary: Read one Hundred submission for moderation
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Submission detail, content: { application/json: { schema: { $ref: '#/components/schemas/HundredAdminDetail' } } } }
  /api/admin/hof/hundred/submissions/{id}/replays:
    get:
      operationId: listHundredReplayEvidence
      summary: List replay evidence metadata for moderation
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Replay evidence metadata, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HundredReplayEvidence' } } } } }
  /api/admin/hof/hundred/submissions/{submissionId}/replays/{replayId}:
    get:
      operationId: downloadHundredReplayEvidence
      summary: Download one replay evidence file
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: replayId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Original replay file, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /api/admin/hof/hundred/submissions/{id}/approve:
    post:
      operationId: approveHundredSubmission
      summary: Approve a manual Hundred submission
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Current submission, content: { application/json: { schema: { $ref: '#/components/schemas/HundredSubmissionSummary' } } } }
  /api/admin/hof/hundred/submissions/{id}/reject:
    post:
      operationId: rejectHundredSubmission
      summary: Reject a manual Hundred submission
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HundredRejectRequest' } } } }
      responses:
        '200': { description: Rejected submission, content: { application/json: { schema: { $ref: '#/components/schemas/HundredSubmissionSummary' } } } }
  /api/admin/hof/hundred/submissions/{id}/delete:
    post:
      operationId: deleteHundredSubmission
      summary: Delete a current Hundred submission
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HundredDeleteRequest' } } } }
      responses:
        '200': { description: Deleted submission, content: { application/json: { schema: { $ref: '#/components/schemas/HundredSubmissionSummary' } } } }
  /api/admin/hof/hundred/submissions/bulk-delete:
    post:
      operationId: bulkDeleteHundredSubmissions
      summary: Delete several current Hundred submissions in one request
      description: >-
        Each id repeats the authoritative single-record delete semantics in its own transaction,
        so the batch allows partial success. Ids that are not CURRENT fail individually with
        HUNDRED_NOT_CURRENT / HUNDRED_SUBMISSION_NOT_FOUND and never block the others.
        More than 100 ids in one request is rejected with 400 BULK_LIMIT_EXCEEDED.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BulkDeleteModerationRequest' } } } }
      responses:
        '200': { description: Per-id bulk delete result, content: { application/json: { schema: { $ref: '#/components/schemas/BulkDeleteResult' } } } }
        '400': { description: Invalid reason or too many ids, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/admin/hof/records/bulk-delete:
    post:
      operationId: bulkDeleteHofRecords
      summary: Delete several Hall of Fame records in one request
      description: >-
        Single-record deletion in this domain is a hard delete without delete-reason semantics,
        so this request deliberately carries no reason field. Each id repeats the authoritative
        single-record delete semantics in its own transaction, so the batch allows partial
        success: an unknown id fails individually with HOF_ENTRY_NOT_FOUND and never blocks the
        others. More than 100 ids in one request is rejected with 400 BULK_LIMIT_EXCEEDED.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BulkDeleteRecordsRequest' } } } }
      responses:
        '200': { description: Per-id bulk delete result, content: { application/json: { schema: { $ref: '#/components/schemas/BulkDeleteResult' } } } }
        '400': { description: Too many ids, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/admin/hof/mark3/submissions/bulk-delete:
    post:
      operationId: bulkDeleteMark3Submissions
      summary: Delete several current Mark3 submissions in one request
      description: >-
        Each id repeats the authoritative single-record delete semantics in its own transaction,
        so the batch allows partial success. Ids that are not CURRENT fail individually with
        MARK3_NOT_CURRENT / MARK3_SUBMISSION_NOT_FOUND and never block the others.
        More than 100 ids in one request is rejected with 400 BULK_LIMIT_EXCEEDED.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BulkDeleteModerationRequest' } } } }
      responses:
        '200': { description: Per-id bulk delete result, content: { application/json: { schema: { $ref: '#/components/schemas/BulkDeleteResult' } } } }
        '400': { description: Invalid reason or too many ids, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/admin/users:
    get:
      operationId: searchAdminUsers
      summary: Search Keycloak and local-profile users for the admin console
      description: >-
        Server-side pagination over a merged view, never a fetched page filtered in memory.
        segment=keycloak (default) reads realm users and can surface Keycloak-only users;
        segment=local reads local user_profile rows and exposes orphan bindings whose Keycloak
        user no longer exists (keycloakUserMissing=true).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: segment, in: query, required: false, schema: { type: string, enum: [keycloak, local] } }
        - { name: idpAlias, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Paged merged user list, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserPage' } } } }
        '400': { description: Unknown segment, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    delete:
      operationId: deleteAdminUsers
      summary: Delete users by an id list
      description: >-
        The request body is a JSON array of Keycloak subs; deleting a single user is simply an
        array of length one, so there is no separate single-user endpoint and no bulk-delete
        endpoint. Each id repeats the authoritative delete semantics in its own transaction, so
        the call allows partial success and reports a per-user errorCode. confirm is required
        (missing or false rejects the whole request with 400 CONFIRMATION_REQUIRED before
        anything is deleted). More than 100 ids is rejected with 400 BULK_LIMIT_EXCEEDED.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: confirm, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { type: string }, maxItems: 100 }
      responses:
        '200': { description: Per-user delete result, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteUsersResponse' } } } }
        '400': { description: Missing confirmation or too many ids, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/ai/reviews:
    post:
      operationId: createAiReview
      summary: Stream an AI replay review
      security: [{ bearerAuth: [] }]
      description: >-
        The request carries the client canonical AI projection (the server has no replay parser).
        Clients SHOULD send the JSON body with `Content-Encoding: gzip`; the server inflates it with a
        16 MiB decompressed-size limit (exceeding the transport or the inflated limit → 413).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiReviewRequest' }
      responses:
        '200':
          description: SSE stream. Stage events have empty payloads; call2_token carries delta; done carries the review result; error carries a stable error code.
          content:
            text/event-stream:
              schema: { type: string }
          x-sse-events:
            call1_start: { $ref: '#/components/schemas/AiReviewStageEventPayload' }
            call1_done: { $ref: '#/components/schemas/AiReviewStageEventPayload' }
            evidence_done: { $ref: '#/components/schemas/AiReviewStageEventPayload' }
            call2_token: { $ref: '#/components/schemas/AiReviewTokenEventPayload' }
            done: { $ref: '#/components/schemas/AiReviewDonePayload' }
            error: { $ref: '#/components/schemas/AiReviewErrorEventPayload' }
        '400':
          description: Invalid request envelope or unsupported schema/locale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: AI review role required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Duplicate correlation ID, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '413': { description: Request (transport or gzip-inflated) exceeds the 16 MiB limit, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Unsupported battle category, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: Bounded AI worker queue is full, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/ai/reviews/{correlationId}/cancel:
    post:
      operationId: cancelAiReview
      summary: Cancel an in-flight AI review
      security: [{ bearerAuth: [] }]
      parameters:
        - name: correlationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Cancellation accepted }
        '400': { description: Invalid correlation ID, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: AI review role required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: No active review for this correlation ID, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HundredCreateResult:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING] }
    HundredSubmissionSummary:
      type: object
      additionalProperties: false
      required: [id, vehicleId, vehicleName, status, claimedAverageDamage, claimedBattleCount]
      properties:
        id: { type: integer, format: int64 }
        vehicleId: { type: integer, format: int64 }
        vehicleName: { type: string }
        status: { type: string, enum: [PENDING, CURRENT, SUPERSEDED, REJECTED, CANCELLED, DELETED] }
        claimedAverageDamage: { type: integer }
        claimedBattleCount: { type: integer }
        approvedAverageDamage: { type: [integer, 'null'] }
        approvedBattleCount: { type: [integer, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
        rejectReason: { type: [string, 'null'] }
        rejectReasonText: { type: [string, 'null'] }
    HundredUserStatus:
      type: object
      additionalProperties: false
      required: [current, pending, rejected]
      properties:
        current: { type: array, items: { $ref: '#/components/schemas/HundredSubmissionSummary' } }
        pending: { type: array, items: { $ref: '#/components/schemas/HundredSubmissionSummary' } }
        rejected: { type: array, items: { $ref: '#/components/schemas/HundredSubmissionSummary' } }
    HundredLeaderboardItem:
      type: object
      additionalProperties: false
      required: [id, rank, vehicleId, vehicleName, nickname, approvedAverageDamage, approvedBattleCount]
      properties:
        id: { type: integer, format: int64 }
        rank: { type: [integer, 'null'] }
        vehicleId: { type: integer, format: int64 }
        vehicleName: { type: string }
        nickname: { type: string }
        approvedAverageDamage: { type: integer }
        approvedBattleCount: { type: integer }
        approvedAt: { type: [string, 'null'], format: date-time }
    HundredLeaderboardPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages]
      properties:
        vehicleId: { type: [integer, 'null'], format: int64 }
        vehicleName: { type: [string, 'null'] }
        items: { type: array, items: { $ref: '#/components/schemas/HundredLeaderboardItem' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    HundredAdminListItem:
      type: object
      additionalProperties: false
      required: [id, status, vehicleId, vehicleName, wotbServer, wotbAccountId, nicknameSnapshot]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string }
        vehicleId: { type: integer, format: int64 }
        vehicleName: { type: string }
        wotbServer: { type: string, enum: [CN, ASIA, EU, NA] }
        wotbAccountId: { type: integer, format: int64 }
        nicknameSnapshot: { type: string }
        approvedAverageDamage: { type: [integer, 'null'] }
        approvedBattleCount: { type: [integer, 'null'] }
        replayParseOk: { type: boolean }
        replayGameIdMatch: { type: boolean }
        replayVehicleMatch: { type: boolean }
        replayDistinctBattles: { type: boolean }
        submittedAt: { type: [string, 'null'], format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
        rejectReason: { type: [string, 'null'] }
        deleteReason: { type: [string, 'null'] }
    HundredAdminPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HundredAdminListItem' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    HundredAdminDetail:
      type: object
      additionalProperties: false
      required: [id, status, vehicleId, vehicleName, wotbServer, wotbAccountId, nicknameSnapshot,
                 claimedAverageDamage, claimedBattleCount, replayParseOk, replayGameIdMatch,
                 replayVehicleMatch, replayDistinctBattles]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, CURRENT, SUPERSEDED, REJECTED, CANCELLED, DELETED] }
        vehicleId: { type: integer, format: int64 }
        vehicleName: { type: string }
        wotbServer: { type: string, enum: [CN, ASIA, EU, NA] }
        wotbAccountId: { type: integer, format: int64 }
        nicknameSnapshot: { type: string }
        claimedAverageDamage: { type: integer }
        claimedBattleCount: { type: integer }
        approvedAverageDamage: { type: [integer, 'null'] }
        approvedBattleCount: { type: [integer, 'null'] }
        proofScreenshot: { type: [string, 'null'] }
        replayParseOk: { type: boolean }
        replayGameIdMatch: { type: boolean }
        replayVehicleMatch: { type: boolean }
        replayDistinctBattles: { type: boolean }
        submittedAt: { type: [string, 'null'], format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
        approvedBy: { type: [string, 'null'] }
        rejectedAt: { type: [string, 'null'], format: date-time }
        rejectedBy: { type: [string, 'null'] }
        rejectReason: { type: [string, 'null'] }
        rejectReasonText: { type: [string, 'null'] }
        cancelledAt: { type: [string, 'null'], format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }
        deletedBy: { type: [string, 'null'] }
        deleteReason: { type: [string, 'null'] }
        deleteReasonText: { type: [string, 'null'] }
    HundredReplayEvidence:
      type: object
      additionalProperties: false
      required: [id, slot, originalFilename, fileSize, arenaId, sha256, createdAt]
      properties:
        id: { type: integer, format: int64 }
        slot: { type: integer, minimum: 1, maximum: 5 }
        originalFilename: { type: string }
        fileSize: { type: integer, format: int64 }
        arenaId: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdAt: { type: [string, 'null'], format: date-time }
    HundredRejectRequest:
      type: object
      additionalProperties: false
      required: [rejectReason]
      properties:
        rejectReason: { type: string }
        rejectReasonText: { type: [string, 'null'] }
    HundredDeleteRequest:
      type: object
      additionalProperties: false
      required: [deleteReason]
      properties:
        deleteReason: { type: string }
        deleteReasonText: { type: [string, 'null'] }
    BulkDeleteModerationRequest:
      type: object
      additionalProperties: false
      required: [ids, reason]
      properties:
        ids: { type: array, items: { type: integer, format: int64 }, maxItems: 100 }
        reason: { type: string }
        reasonText: { type: [string, 'null'] }
    BulkDeleteRecordsRequest:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids: { type: array, items: { type: integer, format: int64 }, maxItems: 100 }
    BulkDeleteItemResult:
      type: object
      additionalProperties: false
      required: [id, deleted]
      properties:
        id: { type: integer, format: int64 }
        deleted: { type: boolean }
        errorCode: { type: [string, 'null'] }
    BulkDeleteResult:
      type: object
      additionalProperties: false
      required: [requested, deleted, failed, results]
      properties:
        requested: { type: integer }
        deleted: { type: integer }
        failed: { type: integer }
        results: { type: array, items: { $ref: '#/components/schemas/BulkDeleteItemResult' } }
    UserProfile:
      type: object
      additionalProperties: false
