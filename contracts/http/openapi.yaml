    DamageLoss:
      type: object
      additionalProperties: false
      required: [fromSec, toSec, hpLoss, attackerAccountId, attackerReliable, damageEventCount, fromHp, toHp, displayCapacityHp, transientAllowed]
      properties:
        fromSec: { type: number, minimum: 0 }
        toSec: { type: number, minimum: 0 }
        hpLoss: { type: integer, minimum: 0 }
        attackerAccountId: { type: [integer, 'null'] }
        attackerReliable: { type: boolean }
        damageEventCount: { type: integer, minimum: 0 }
        fromHp: { type: [integer, 'null'], minimum: 0 }
        toHp: { type: [integer, 'null'], minimum: 0 }
        displayCapacityHp: { type: [integer, 'null'], minimum: 0 }
        transientAllowed: { type: boolean }
    BattleEvent:
      type: object
      additionalProperties: false
      required: [type, timeSec, accountId, targetAccountId, observedHpLoss]
      properties:
        type: { type: string }
        timeSec: { type: number, minimum: 0 }
        accountId: { type: [integer, 'null'] }
        targetAccountId: { type: [integer, 'null'] }
        observedHpLoss: { type: [integer, 'null'], minimum: 0 }
    PointsSample:
      type: object
      additionalProperties: false
      required: [timeSec, team, points]
      properties:
        timeSec: { type: number, minimum: 0 }
        team: { type: integer }
        points: { type: integer, minimum: 0 }
    BaseStateTransition:
      type: object
      additionalProperties: false
      required: [timeSec, baseId, ownerTeam, capturingTeam, captureProgress]
      properties:
        timeSec: { type: number, minimum: 0 }
        baseId:
          type: string
          enum: [A, B, C, D, BASE]
          description: Supremacy uses A-D; Assault single-base uses BASE.
        ownerTeam: { type: [integer, 'null'], enum: [1, 2, null] }
        capturingTeam: { type: [integer, 'null'], enum: [1, 2, null] }
        captureProgress:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Supremacy canonical states remain 0-99; Assault BASE may reach protocol value 100.
    ApiError:
      type: object
      additionalProperties: false
      required: [id, errorCode, errorMsg, status, retryable, details, timestamp]
      properties:
        id: { type: [string, 'null'] }
        errorCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Stable infrastructure code or a legacy uppercase domain code during the migration boundary.
        errorMsg: { type: [string, 'null'] }
        status: { type: integer, minimum: 400, maximum: 599 }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: true }
        timestamp: { type: [string, 'null'], format: date-time }
    ApiErrorCode:
      type: string
      enum:
        - AUTH_UNAUTHENTICATED
        - AUTH_FORBIDDEN
        - INVALID_ARGUMENT
        - MISSING_PARAM
        - INVALID_REQUEST
        - DATASET_REFERENCE_REQUIRED
        - UNSUPPORTED_MEDIA_TYPE
        - METHOD_NOT_ALLOWED
        - RESOURCE_NOT_FOUND
        - REPLAY_BUSY
        - PROCESSING_QUEUE_FULL
        - EXPORT_QUEUE_FULL
        - AI_REVIEW_BUSY
        - AI_REQUEST_TOO_LARGE
        - INVALID_AI_REQUEST
        - UNKNOWN_LOCALE
        - INVALID_CORRELATION_ID
        - DUPLICATE_CORRELATION_ID
        - UNSUPPORTED_BATTLE_CATEGORY
        - AI_QUEUE_FULL
        - AI_RATE_LIMITED
        - AI_UPSTREAM_TIMEOUT
        - AI_UPSTREAM_UNAVAILABLE
        - AI_TIMEOUT
        - AI_CANCELLED
        - AI_NOT_CONFIGURED
        - AI_INVALID_REQUEST
        - AI_AUTHENTICATION_ERROR
        - AI_CONTEXT_TOO_LARGE
        - AI_EMPTY_RESPONSE
        - AI_RESPONSE_INVALID
        - AI_REVIEW_SCHEMA_FAILED
        - AI_REVIEW_GROUNDING_FAILED
        - AI_TIMELINE_UNUSABLE
        - AI_PROMPT_MANDATORY_SECTION_TOO_LARGE
        - JOB_NOT_FOUND
        - SOURCE_NOT_FOUND
        - SOURCE_NOT_READY
        - SOURCE_PROCESSING_FAILED
        - DATASET_UNAVAILABLE
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - UPSTREAM_UNAVAILABLE
