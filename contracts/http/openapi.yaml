        settlementResultEntityId: { type: integer, format: int64 }
        settlementLifeTimeSec: { type: number }
        settlementKillerResultEntityId: { type: [integer, 'null'], format: int64 }
        settlementDeathReasonRaw: { type: [integer, 'null'] }
