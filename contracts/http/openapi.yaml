      type: string
      enum: [CURRENT, LAST_KNOWN]
    HealthKnowledge:
      type: string
      enum: [CURRENT, LAST_KNOWN]
    PlaybackLifeState:
      type: string
      enum: [ALIVE, DESTROYED]
    BattlePlaybackDataset:
      type: object
      additionalProperties: false
      required:
        - durationSec
        - mapCode
        - friendlyTeam
        - recorderAccountId
        - vehicles
        - events
        - pointsSamples
        - limitations
        - capability
        - arenaBonusType
      properties:
        durationSec:
          type: number
          minimum: 0
        mapCode:
          type: [string, 'null']
        friendlyTeam:
          type: [integer, 'null']
          enum: [1, 2, null]
        recorderAccountId:
          type: [integer, 'null']
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/VehiclePlaybackTrack'
        events:
          type: array
          items:
            $ref: '#/components/schemas/BattleEvent'
        pointsSamples:
          type: array
          items:
            $ref: '#/components/schemas/PointsSample'
        # Additive, backward-compatible wire field (PR #229 rolling deployment):
        # not required — the previous production contract omits it, and the frontend
        # contract boundary normalizes a missing value to [] so older responses still
        # validate. Newer producers MUST still emit baseStates: [] or real transitions.
        assaultObjectivePresent:
          type: boolean
          description: Proven single-base objective presence, independent of capture progress. Requires the objective family to emit fields beyond the bare initialization pair (1=1,2=1 + 1=2,2=1), which ordinary battles also broadcast. Missing on older artifacts means unknown (no static Assault objective rendering). Not derived from arenaBonusType.
        baseStates:
          type: array
          items:
            $ref: '#/components/schemas/BaseStateTransition'
        limitations:
          type: array
          items: { type: string }
        capability:
          $ref: '#/components/schemas/PlaybackCapability'
        arenaBonusType:
          type: [integer, 'null']
    VehiclePlaybackTrack:
      type: object
      additionalProperties: false
      required: [accountId, playerName, tankId, tankName, tankClass, tankTier, team, friendly, loadout, positionSegments, orientationSegments, healthTransitions, lifeTransitions, damageLosses, consumableTransitions, moduleCrewTransitions]
      properties:
        accountId: { type: integer }
        playerName: { type: string }
        tankId: { type: integer }
        tankName: { type: string }
        tankClass: { type: string }
        tankTier: { type: [integer, 'null'] }
        team: { type: integer }
        friendly: { type: [boolean, 'null'] }
        loadout:
          anyOf:
            - $ref: '#/components/schemas/VehicleBattleLoadout'
