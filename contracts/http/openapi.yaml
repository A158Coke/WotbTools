        settlementStartTime: { type: [integer, 'null'], format: int64 }
        settlementFinishReasonRaw: { type: [integer, 'null'] }
        settlementDurationSec: { type: [number, 'null'] }
        recorder: { type: string }
        recorderVehicle: { type: string }
