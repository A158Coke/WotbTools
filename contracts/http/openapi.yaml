        displayName: { type: [string, 'null'] }
        wotbAccountId: { type: [integer, 'null'], format: int64 }
        wotbNickname: { type: [string, 'null'] }
        wotbServer: { type: [string, 'null'] }
        profileCreatedAt: { type: [string, 'null'], format: date-time }
        hasLocalProfile: { type: boolean }
        keycloakUserMissing: { type: boolean }
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUserListItem' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    DeleteUserResult:
      type: object
      additionalProperties: false
      required: [userId, deleted]
      properties:
        userId: { type: string }
