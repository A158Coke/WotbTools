openapi: 3.1.0
info:
  title: WotBTools HTTP Contract
  version: 1.0.0
  description: FE ↔ BE wire contract. Domain models and Control/Worker contracts are separate authorities.
paths:
  /api/hof/hundred:
    get:
      operationId: listHundredLeaderboard
      summary: List the public Hundred Battles leaderboard
      parameters:
        - { name: vehicleId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: nation, in: query, required: false, schema: { type: string } }
        - { name: vehicleType, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Hundred leaderboard page
          content: { application/json: { schema: { $ref: '#/components/schemas/HundredLeaderboardPage' } } }
        '400': { description: Invalid filter, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/hof/hundred/submissions:
    post:
      operationId: createHundredSubmission
      summary: Create a manual Hundred Battles submission
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [vehicleId, averageDamage, battleCount, screenshot, replays]
              properties:
                vehicleId: { type: integer, format: int64 }
                averageDamage: { type: integer, minimum: 1 }
                battleCount: { type: integer, minimum: 1 }
                screenshot: { type: string, description: Base64 image data URL }
                replays: { type: array, minItems: 5, maxItems: 5, items: { type: string, format: binary } }
      responses:
        '200': { description: Pending submission, content: { application/json: { schema: { $ref: '#/components/schemas/HundredCreateResult' } } } }
        '400': { description: Invalid submission, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/hof/hundred/submissions/{id}/cancel:
    post:
      operationId: cancelHundredSubmission
      summary: Cancel the authenticated user's pending submission
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Cancelled submission, content: { application/json: { schema: { $ref: '#/components/schemas/HundredSubmissionSummary' } } } }
        '403': { description: Not the submission owner, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/users/hundred/status:
    get:
      operationId: getHundredUserStatus
      summary: Read the authenticated user's Hundred submission status
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User Hundred status, content: { application/json: { schema: { $ref: '#/components/schemas/HundredUserStatus' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/admin/hof/hundred/submissions:
    get:
      operationId: listHundredAdminSubmissions
      summary: List Hundred submissions for moderation
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: nation, in: query, required: false, schema: { type: string } }
        - { name: vehicleType, in: query, required: false, schema: { type: string } }
        - { name: vehicleId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Moderation page, content: { application/json: { schema: { $ref: '#/components/schemas/HundredAdminPage' } } } }
  /api/admin/hof/hundred/submissions/{id}:
    get:
      operationId: getHundredAdminSubmission
      summary: Read one Hundred submission for moderation
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Submission detail, content: { application/json: { schema: { $ref: '#/components/schemas/HundredAdminDetail' } } } }
  /api/admin/hof/hundred/submissions/{id}/replays:
    get:
      operationId: listHundredReplayEvidence
      summary: List replay evidence metadata for moderation
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Replay evidence metadata, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HundredReplayEvidence' } } } } }
  /api/admin/hof/hundred/submissions/{submissionId}/replays/{replayId}:
    get:
      operationId: downloadHundredReplayEvidence
      summary: Download one replay evidence file
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: replayId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Original replay file, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /api/admin/hof/hundred/submissions/{id}/approve:
    post:
      operationId: approveHundredSubmission
      summary: Approve a manual Hundred submission
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Current submission, content: { application/json: { schema: { $ref: '#/components/schemas/HundredSubmissionSummary' } } } }
  /api/admin/hof/hundred/submissions/{id}/reject:
    post:
      operationId: rejectHundredSubmission
      summary: Reject a manual Hundred submission
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HundredRejectRequest' } } } }
      responses:
        '200': { description: Rejected submission, content: { application/json: { schema: { $ref: '#/components/schemas/HundredSubmissionSummary' } } } }
  /api/admin/hof/hundred/submissions/{id}/delete:
    post:
      operationId: deleteHundredSubmission
      summary: Delete a current Hundred submission
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HundredDeleteRequest' } } } }
      responses:
        '200': { description: Deleted submission, content: { application/json: { schema: { $ref: '#/components/schemas/HundredSubmissionSummary' } } } }
  /api/replay/battle-playback-v2:
    post:
      operationId: getBattlePlaybackV2
      summary: Read the cached Battle Playback V2 dataset for a ready processing source
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetReference'
      responses:
        '200':
          description: Canonical sparse playback projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattlePlaybackDataset'
        '204':
          description: Playback capability unavailable for this source
        '400':
          description: Invalid dataset reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Processing job was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Source is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Dataset storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HundredCreateResult:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING] }
    HundredSubmissionSummary:
      type: object
      additionalProperties: false
      required: [id, vehicleId, vehicleName, status, claimedAverageDamage, claimedBattleCount]
      properties:
        id: { type: integer, format: int64 }
        vehicleId: { type: integer, format: int64 }
        vehicleName: { type: string }
        status: { type: string, enum: [PENDING, CURRENT, SUPERSEDED, REJECTED, CANCELLED, DELETED] }
        claimedAverageDamage: { type: integer }
        claimedBattleCount: { type: integer }
        approvedAverageDamage: { type: [integer, 'null'] }
        approvedBattleCount: { type: [integer, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
        rejectReason: { type: [string, 'null'] }
        rejectReasonText: { type: [string, 'null'] }
    HundredUserStatus:
      type: object
      additionalProperties: false
      required: [current, pending, rejected]
      properties:
        current: { type: array, items: { $ref: '#/components/schemas/HundredSubmissionSummary' } }
        pending: { type: array, items: { $ref: '#/components/schemas/HundredSubmissionSummary' } }
        rejected: { type: array, items: { $ref: '#/components/schemas/HundredSubmissionSummary' } }
    HundredLeaderboardItem:
      type: object
      additionalProperties: false
      required: [id, rank, vehicleId, vehicleName, nickname, approvedAverageDamage, approvedBattleCount]
      properties:
        id: { type: integer, format: int64 }
        rank: { type: [integer, 'null'] }
        vehicleId: { type: integer, format: int64 }
        vehicleName: { type: string }
        nickname: { type: string }
        approvedAverageDamage: { type: integer }
        approvedBattleCount: { type: integer }
        approvedAt: { type: [string, 'null'], format: date-time }
    HundredLeaderboardPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages]
      properties:
        vehicleId: { type: [integer, 'null'], format: int64 }
        vehicleName: { type: [string, 'null'] }
        items: { type: array, items: { $ref: '#/components/schemas/HundredLeaderboardItem' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    HundredAdminListItem:
      type: object
      additionalProperties: false
      required: [id, status, vehicleId, vehicleName, gameAccountIdSnapshot, nicknameSnapshot]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string }
        vehicleId: { type: integer, format: int64 }
        vehicleName: { type: string }
        gameAccountIdSnapshot: { type: integer, format: int64 }
        nicknameSnapshot: { type: string }
        approvedAverageDamage: { type: [integer, 'null'] }
        approvedBattleCount: { type: [integer, 'null'] }
        replayParseOk: { type: boolean }
        replayGameIdMatch: { type: boolean }
        replayVehicleMatch: { type: boolean }
        replayDistinctBattles: { type: boolean }
        submittedAt: { type: [string, 'null'], format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
        rejectReason: { type: [string, 'null'] }
        deleteReason: { type: [string, 'null'] }
    HundredAdminPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HundredAdminListItem' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    HundredAdminDetail:
      type: object
      additionalProperties: false
      required: [id, status, vehicleId, vehicleName, gameAccountIdSnapshot, nicknameSnapshot,
                 claimedAverageDamage, claimedBattleCount, replayParseOk, replayGameIdMatch,
                 replayVehicleMatch, replayDistinctBattles]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, CURRENT, SUPERSEDED, REJECTED, CANCELLED, DELETED] }
        vehicleId: { type: integer, format: int64 }
        vehicleName: { type: string }
        gameAccountIdSnapshot: { type: integer, format: int64 }
        nicknameSnapshot: { type: string }
        claimedAverageDamage: { type: integer }
        claimedBattleCount: { type: integer }
        approvedAverageDamage: { type: [integer, 'null'] }
        approvedBattleCount: { type: [integer, 'null'] }
        proofScreenshot: { type: [string, 'null'] }
        replayParseOk: { type: boolean }
        replayGameIdMatch: { type: boolean }
        replayVehicleMatch: { type: boolean }
        replayDistinctBattles: { type: boolean }
        submittedAt: { type: [string, 'null'], format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
        approvedBy: { type: [string, 'null'] }
        rejectedAt: { type: [string, 'null'], format: date-time }
        rejectedBy: { type: [string, 'null'] }
        rejectReason: { type: [string, 'null'] }
        rejectReasonText: { type: [string, 'null'] }
        cancelledAt: { type: [string, 'null'], format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }
        deletedBy: { type: [string, 'null'] }
        deleteReason: { type: [string, 'null'] }
        deleteReasonText: { type: [string, 'null'] }
    HundredReplayEvidence:
      type: object
      additionalProperties: false
      required: [id, slot, originalFilename, fileSize, arenaId, sha256, createdAt]
      properties:
        id: { type: integer, format: int64 }
        slot: { type: integer, minimum: 1, maximum: 5 }
        originalFilename: { type: string }
        fileSize: { type: integer, format: int64 }
        arenaId: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdAt: { type: [string, 'null'], format: date-time }
    HundredRejectRequest:
      type: object
      additionalProperties: false
      required: [rejectReason]
      properties:
        rejectReason: { type: string }
        rejectReasonText: { type: [string, 'null'] }
    HundredDeleteRequest:
      type: object
      additionalProperties: false
      required: [deleteReason]
      properties:
        deleteReason: { type: string }
        deleteReasonText: { type: [string, 'null'] }
    DatasetReference:
      type: object
      additionalProperties: false
      required: [processingJobId, sourceId]
      properties:
        processingJobId:
          type: string
          minLength: 1
        sourceId:
          type: string
          pattern: '^r[0-9]+$'
    PlaybackCapability:
      type: string
      enum: [FULL, PARTIAL]
    PlaybackConfidence:
      type: string
      enum: [HIGH, MEDIUM, LOW, UNKNOWN]
    PositionKnowledge:
      type: string
      enum: [OBSERVED, LAST_KNOWN]
    OrientationKnowledge:
      type: string
      enum: [CURRENT, LAST_KNOWN]
    HealthKnowledge:
      type: string
      enum: [CURRENT, LAST_KNOWN]
    PlaybackLifeState:
      type: string
      enum: [ALIVE, DESTROYED]
    BattlePlaybackDataset:
      type: object
      additionalProperties: false
      required:
        - durationSec
        - mapCode
        - friendlyTeam
        - recorderAccountId
        - vehicles
        - events
        - pointsSamples
        - limitations
        - capability
        - arenaBonusType
      properties:
        durationSec:
          type: number
          minimum: 0
        mapCode:
          type: [string, 'null']
        friendlyTeam:
          type: [integer, 'null']
          enum: [1, 2, null]
        recorderAccountId:
          type: [integer, 'null']
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/VehiclePlaybackTrack'
        events:
          type: array
          items:
            $ref: '#/components/schemas/BattleEvent'
        pointsSamples:
          type: array
          items:
            $ref: '#/components/schemas/PointsSample'
        limitations:
          type: array
          items: { type: string }
        capability:
          $ref: '#/components/schemas/PlaybackCapability'
        arenaBonusType:
          type: [integer, 'null']
    VehiclePlaybackTrack:
      type: object
      additionalProperties: false
      required: [accountId, playerName, tankId, tankName, tankClass, tankTier, team, friendly, loadout, positionSegments, orientationSegments, healthTransitions, lifeTransitions, damageLosses, consumableTransitions, moduleCrewTransitions]
      properties:
        accountId: { type: integer }
        playerName: { type: string }
        tankId: { type: integer }
        tankName: { type: string }
        tankClass: { type: string }
        tankTier: { type: [integer, 'null'] }
        team: { type: integer }
        friendly: { type: [boolean, 'null'] }
        loadout:
          anyOf:
            - $ref: '#/components/schemas/VehicleBattleLoadout'
            - type: 'null'
        positionSegments:
          type: array
          items: { $ref: '#/components/schemas/PositionSegment' }
        orientationSegments:
          type: array
          items: { $ref: '#/components/schemas/OrientationSegment' }
        healthTransitions:
          type: array
          items: { $ref: '#/components/schemas/HealthTransition' }
        lifeTransitions:
          type: array
          items: { $ref: '#/components/schemas/LifeTransition' }
        damageLosses:
          type: array
          items: { $ref: '#/components/schemas/DamageLoss' }
        consumableTransitions:
          type: array
          items: { $ref: '#/components/schemas/ConsumableTransition' }
        moduleCrewTransitions:
          type: array
          items: { $ref: '#/components/schemas/ModuleCrewTransition' }
    VehicleBattleLoadout:
      type: object
      additionalProperties: false
      required: [replayVersion, consumables, consumableWireCodes, provisions, provisionWireCodes, equipmentIds, confidence]
      properties:
        replayVersion: { type: [string, 'null'] }
        consumables:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: [string, 'null'] }
        consumableWireCodes:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: [integer, 'null'] }
        provisions:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: [string, 'null'] }
        provisionWireCodes:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: [integer, 'null'] }
        equipmentIds:
          type: array
          minItems: 9
          maxItems: 9
          items: { type: [integer, 'null'] }
        confidence: { $ref: '#/components/schemas/PlaybackConfidence' }
    PositionSegment:
      type: object
      additionalProperties: false
      required: [startSec, endSec, knowledge, interpolationAllowed, samples]
      properties:
        startSec: { type: number, minimum: 0 }
        endSec: { type: number, minimum: 0 }
        knowledge: { $ref: '#/components/schemas/PositionKnowledge' }
        interpolationAllowed: { type: boolean }
        samples:
          type: array
          items: { $ref: '#/components/schemas/PositionSample' }
    PositionSample:
      type: object
      additionalProperties: false
      required: [timeSec, x, y]
      properties:
        timeSec: { type: number, minimum: 0 }
        x: { type: number }
        y: { type: number }
    OrientationSegment:
      type: object
      additionalProperties: false
      required: [startSec, endSec, knowledge, samples]
      properties:
        startSec: { type: number, minimum: 0 }
        endSec: { type: number, minimum: 0 }
        knowledge: { $ref: '#/components/schemas/OrientationKnowledge' }
        samples:
          type: array
          items: { $ref: '#/components/schemas/OrientationSample' }
    OrientationSample:
      type: object
      additionalProperties: false
      required: [timeSec, hullYawDeg, turretRelativeYawDeg]
      properties:
        timeSec: { type: number, minimum: 0 }
        hullYawDeg: { type: [number, 'null'] }
        turretRelativeYawDeg: { type: [number, 'null'] }
    HealthTransition:
      type: object
      additionalProperties: false
      required: [timeSec, currentHp, knowledge, source, displayCapacityHp, relativeFull, confidence]
      properties:
        timeSec: { type: number, minimum: 0 }
        currentHp: { type: [integer, 'null'], minimum: 0 }
        knowledge: { type: [string, 'null'], enum: [CURRENT, LAST_KNOWN, null] }
        source: { type: [string, 'null'] }
        displayCapacityHp: { type: [integer, 'null'], minimum: 0 }
        relativeFull: { type: boolean }
        confidence: { $ref: '#/components/schemas/PlaybackConfidence' }
    LifeTransition:
      type: object
      additionalProperties: false
      required: [timeSec, lifeState, destroyedKnownAtSec]
      properties:
        timeSec: { type: number, minimum: 0 }
        lifeState: { $ref: '#/components/schemas/PlaybackLifeState' }
        destroyedKnownAtSec: { type: [number, 'null'], minimum: 0 }
    ConsumableTransition:
      type: object
      additionalProperties: false
      required: [timeSec, consumableSlot, logicalItemId, wireCode, state, invalidation, confidence]
      properties:
        timeSec: { type: number, minimum: 0 }
        consumableSlot: { type: [integer, 'null'], minimum: 0, maximum: 2 }
        logicalItemId: { type: [string, 'null'] }
        wireCode: { type: [integer, 'null'] }
        state: { type: string }
        invalidation: { type: boolean }
        confidence: { $ref: '#/components/schemas/PlaybackConfidence' }
    ModuleCrewTransition:
      type: object
      additionalProperties: false
      required: [timeSec, component, state, recorderVisible, confidence]
      properties:
        timeSec: { type: number, minimum: 0 }
        component: { type: string }
        state: { type: [string, 'null'] }
        recorderVisible: { type: boolean }
        confidence: { $ref: '#/components/schemas/PlaybackConfidence' }
    DamageLoss:
      type: object
      additionalProperties: false
      required: [fromSec, toSec, hpLoss, attackerAccountId, attackerReliable, damageEventCount, fromHp, toHp, displayCapacityHp, transientAllowed]
      properties:
        fromSec: { type: number, minimum: 0 }
        toSec: { type: number, minimum: 0 }
        hpLoss: { type: integer, minimum: 0 }
        attackerAccountId: { type: [integer, 'null'] }
        attackerReliable: { type: boolean }
        damageEventCount: { type: integer, minimum: 0 }
        fromHp: { type: [integer, 'null'], minimum: 0 }
        toHp: { type: [integer, 'null'], minimum: 0 }
        displayCapacityHp: { type: [integer, 'null'], minimum: 0 }
        transientAllowed: { type: boolean }
    BattleEvent:
      type: object
      additionalProperties: false
      required: [type, timeSec, accountId, targetAccountId, observedHpLoss]
      properties:
        type: { type: string }
        timeSec: { type: number, minimum: 0 }
        accountId: { type: [integer, 'null'] }
        targetAccountId: { type: [integer, 'null'] }
        observedHpLoss: { type: [integer, 'null'], minimum: 0 }
    PointsSample:
      type: object
      additionalProperties: false
      required: [timeSec, team, points]
      properties:
        timeSec: { type: number, minimum: 0 }
        team: { type: integer }
        points: { type: integer, minimum: 0 }
    ApiError:
      type: object
      additionalProperties: false
      required: [id, errorCode, errorMsg, status, retryable, details, timestamp]
      properties:
        id: { type: [string, 'null'] }
        errorCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Stable infrastructure code or a legacy uppercase domain code during the migration boundary.
        errorMsg: { type: [string, 'null'] }
        status: { type: integer, minimum: 400, maximum: 599 }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: true }
        timestamp: { type: [string, 'null'], format: date-time }
    ApiErrorCode:
      type: string
      enum:
        - AUTH_UNAUTHENTICATED
        - AUTH_FORBIDDEN
        - INVALID_ARGUMENT
        - MISSING_PARAM
        - INVALID_REQUEST
        - DATASET_REFERENCE_REQUIRED
        - UNSUPPORTED_MEDIA_TYPE
        - METHOD_NOT_ALLOWED
        - RESOURCE_NOT_FOUND
        - REPLAY_BUSY
        - PROCESSING_QUEUE_FULL
        - EXPORT_QUEUE_FULL
        - AI_REVIEW_BUSY
        - AI_QUEUE_FULL
        - AI_RATE_LIMITED
        - AI_UPSTREAM_TIMEOUT
        - AI_UPSTREAM_UNAVAILABLE
        - AI_TIMEOUT
        - AI_CANCELLED
        - AI_NOT_CONFIGURED
