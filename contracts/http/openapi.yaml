        reason: { type: string, minLength: 1, maxLength: 2000 }
    TeamAiPlayerIdentity:
      type: object
      additionalProperties: false
      required: [playerKey, displayName, tankName]
      properties:
        playerKey: { type: string, minLength: 1, maxLength: 64 }
        displayName: { type: string, maxLength: 240 }
        tankName: { type: string, maxLength: 240 }
    TeamAiReviewResult:
      type: object
      additionalProperties: false
      required: [summary, episodes, trainingSuggestions, reviewFocus, highContributors]
      properties:
        summary: { $ref: '#/components/schemas/TeamAiReviewSummary' }
        episodes:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/TeamAiReviewEpisode' }
        trainingSuggestions:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/TeamAiTrainingSuggestion' }
        reviewFocus:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/TeamAiReviewFocus' }
        highContributors:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/TeamAiHighContributor' }
    AiReviewDonePayload:
      type: object
      additionalProperties: false
      required: [analysis, preBattleSection, capability, teamReview, teamPlayers]
      properties:
        analysis: { type: [string, 'null'] }
        preBattleSection: { type: [string, 'null'] }
        capability: { type: [string, 'null'], enum: [AVAILABLE, AVAILABLE_WITH_LIMITED_TIMELINE, UNAVAILABLE, null] }
        teamReview: { oneOf: [{ $ref: '#/components/schemas/TeamAiReviewResult' }, { type: 'null' }] }
        teamPlayers:
          type: array
          items: { $ref: '#/components/schemas/TeamAiPlayerIdentity' }
    PlaybackCapability:
      type: string
      enum: [FULL, PARTIAL]
    PlaybackConfidence:
      type: string
      enum: [HIGH, MEDIUM, LOW, UNKNOWN]
    PositionKnowledge:
      type: string
      enum: [OBSERVED, LAST_KNOWN]
    OrientationKnowledge:
      type: string
      enum: [CURRENT, LAST_KNOWN]
    HealthKnowledge:
      type: string
      enum: [CURRENT, LAST_KNOWN]
    PlaybackLifeState:
      type: string
      enum: [ALIVE, DESTROYED]
    BattlePlaybackDataset:
      type: object
      additionalProperties: false
      required:
        - durationSec
        - mapCode
        - friendlyTeam
        - recorderAccountId
        - vehicles
        - events
        - pointsSamples
        - limitations
        - capability
        - arenaBonusType
      properties:
        durationSec:
          type: number
          minimum: 0
        mapCode:
          type: [string, 'null']
        friendlyTeam:
          type: [integer, 'null']
          enum: [1, 2, null]
        recorderAccountId:
          type: [integer, 'null']
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/VehiclePlaybackTrack'
        events:
          type: array
          items:
            $ref: '#/components/schemas/BattleEvent'
        pointsSamples:
          type: array
          items:
            $ref: '#/components/schemas/PointsSample'
        # Additive, backward-compatible wire field (PR #229 rolling deployment):
        # not required — the previous production contract omits it, and the frontend
        # contract boundary normalizes a missing value to [] so older responses still
        # validate. Newer producers MUST still emit baseStates: [] or real transitions.
        assaultObjectivePresent:
          type: boolean
          description: Proven single-base objective presence, independent of capture progress. Requires the objective family to emit fields beyond the bare initialization pair (1=1,2=1 + 1=2,2=1), which ordinary battles also broadcast. Missing on older artifacts means unknown (no static Assault objective rendering). Not derived from arenaBonusType.
        baseStates:
          type: array
          items:
            $ref: '#/components/schemas/BaseStateTransition'
        limitations:
          type: array
          items: { type: string }
        capability:
          $ref: '#/components/schemas/PlaybackCapability'
        arenaBonusType:
          type: [integer, 'null']
    VehiclePlaybackTrack:
      type: object
      additionalProperties: false
      required: [accountId, playerName, tankId, tankName, tankClass, tankTier, team, friendly, loadout, positionSegments, orientationSegments, healthTransitions, lifeTransitions, damageLosses, consumableTransitions, moduleCrewTransitions]
      properties:
        accountId: { type: integer }
        playerName: { type: string }
        tankId: { type: integer }
        tankName: { type: string }
        tankClass: { type: string }
        tankTier: { type: [integer, 'null'] }
        team: { type: integer }
        friendly: { type: [boolean, 'null'] }
        loadout:
          anyOf:
            - $ref: '#/components/schemas/VehicleBattleLoadout'
            - type: 'null'
        positionSegments:
          type: array
          items: { $ref: '#/components/schemas/PositionSegment' }
        orientationSegments:
          type: array
          items: { $ref: '#/components/schemas/OrientationSegment' }
        healthTransitions:
          type: array
          items: { $ref: '#/components/schemas/HealthTransition' }
        lifeTransitions:
          type: array
          items: { $ref: '#/components/schemas/LifeTransition' }
        damageLosses:
          type: array
          items: { $ref: '#/components/schemas/DamageLoss' }
        consumableTransitions:
          type: array
          items: { $ref: '#/components/schemas/ConsumableTransition' }
        moduleCrewTransitions:
          type: array
          items: { $ref: '#/components/schemas/ModuleCrewTransition' }
    VehicleBattleLoadout:
      type: object
      additionalProperties: false
      required: [replayVersion, consumables, consumableWireCodes, provisions, provisionWireCodes, equipmentIds, confidence]
      properties:
        replayVersion: { type: [string, 'null'] }
        consumables:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: [string, 'null'] }
        consumableWireCodes:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: [integer, 'null'] }
        provisions:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: [string, 'null'] }
        provisionWireCodes:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: [integer, 'null'] }
        equipmentIds:
          type: array
          minItems: 9
          maxItems: 9
          items: { type: [integer, 'null'] }
        confidence: { $ref: '#/components/schemas/PlaybackConfidence' }
    PositionSegment:
      type: object
      additionalProperties: false
      required: [startSec, endSec, knowledge, interpolationAllowed, samples]
      properties:
        startSec: { type: number, minimum: 0 }
        endSec: { type: number, minimum: 0 }
        knowledge: { $ref: '#/components/schemas/PositionKnowledge' }
        interpolationAllowed: { type: boolean }
        samples:
          type: array
          items: { $ref: '#/components/schemas/PositionSample' }
    PositionSample:
