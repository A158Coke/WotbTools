        positionSegments:
          type: array
          items: { $ref: '#/components/schemas/PositionSegment' }
        orientationSegments:
          type: array
          items: { $ref: '#/components/schemas/OrientationSegment' }
        healthTransitions:
          type: array
          items: { $ref: '#/components/schemas/HealthTransition' }
        lifeTransitions:
          type: array
          items: { $ref: '#/components/schemas/LifeTransition' }
        damageLosses:
          type: array
          items: { $ref: '#/components/schemas/DamageLoss' }
        damageDealtSamples:
          description: Optional recorded cumulative damage broadcasts. Absent in older datasets and on players without this evidence; never populated from final settlement totals.
          type: array
          items: { $ref: '#/components/schemas/DamageDealtSample' }
        consumableTransitions:
          type: array
          items: { $ref: '#/components/schemas/ConsumableTransition' }
        moduleCrewTransitions:
          type: array
          items: { $ref: '#/components/schemas/ModuleCrewTransition' }
