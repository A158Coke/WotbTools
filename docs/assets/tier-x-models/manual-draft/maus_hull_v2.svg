<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" fill="none">
  <!-- WotBTools / Maus / hull-only / semi-realistic top-down tactical asset
       Contract:
       - viewBox: 0 0 320 320
       - 0deg = nose up
       - hull rotation center = (160,160)
       - neutral colors only
       - no turret and no gun in this layer
       - turret ring intentionally rear-biased (Maus rear turret layout)
  -->

  <defs>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#666c71"/>
      <stop offset="100%" stop-color="#545a5f"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#858b90"/>
      <stop offset="100%" stop-color="#73797e"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#91979b"/>
      <stop offset="100%" stop-color="#7d8387"/>
    </linearGradient>
  </defs>

  <!-- left track -->
  <path d="M45 35
           Q45 28 51 26
           L77 26
           Q83 28 84 35
           L84 286
           Q83 293 77 295
           L51 295
           Q45 293 45 286 Z"
        fill="url(#trackGrad)" stroke="#2f3438" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- right track -->
  <path d="M236 35
           Q237 28 243 26
           L269 26
           Q275 28 275 35
           L275 286
           Q275 293 269 295
           L243 295
           Q237 293 236 286 Z"
        fill="url(#trackGrad)" stroke="#2f3438" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- sparse tread rhythm, realistic but not noisy -->
  <g stroke="#7c8388" stroke-width="2.6" stroke-linecap="round" opacity="0.9">
    <path d="M53 48H76 M53 64H76 M53 80H76 M53 96H76 M53 112H76 M53 128H76 M53 144H76 M53 160H76 M53 176H76 M53 192H76 M53 208H76 M53 224H76 M53 240H76 M53 256H76 M53 272H76"/>
    <path d="M244 48H267 M244 64H267 M244 80H267 M244 96H267 M244 112H267 M244 128H267 M244 144H267 M244 160H267 M244 176H267 M244 192H267 M244 208H267 M244 224H267 M244 240H267 M244 256H267 M244 272H267"/>
  </g>

  <!-- outer hull silhouette -->
  <path d="M86 42
           Q89 31 100 29
           H220
           Q231 31 234 42
           L234 278
           Q231 289 220 291
           H100
           Q89 289 86 278 Z"
        fill="url(#hullGrad)" stroke="#30353a" stroke-width="5.2" stroke-linejoin="round"/>

  <!-- sharply faceted front upper hull -->
  <path d="M91 43
           L109 34
           H211
           L229 43
           L219 82
           H101 Z"
        fill="url(#plateGrad)" stroke="#50565b" stroke-width="3.6" stroke-linejoin="round"/>

  <!-- front nose / glacis cue -->
  <path d="M109 34 L160 29 L211 34"
        stroke="#a7adb1" stroke-width="3.2" stroke-linecap="round" opacity="0.75"/>
  <path d="M104 58 H216" stroke="#b3b8bb" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>

  <!-- side shoulder plates: add realistic slab-sided mass -->
  <path d="M92 88 H228" stroke="#62686d" stroke-width="3" opacity="0.65"/>
  <path d="M92 110 H228" stroke="#62686d" stroke-width="3" opacity="0.55"/>

  <!-- rear-biased turret ring: Maus hallmark -->
  <circle cx="160" cy="188" r="41"
          fill="#6f757a" stroke="#44494e" stroke-width="3.8"/>
  <circle cx="160" cy="188" r="30"
          fill="none" stroke="#8e9498" stroke-width="2.4" opacity="0.5"/>

  <!-- engine deck block -->
  <path d="M103 213
           H217
           V270
           Q217 275 212 277
           H108
           Q103 275 103 270 Z"
        fill="#6d7378" stroke="#4b5156" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- engine deck panel splits -->
  <path d="M160 213V277" stroke="#51575c" stroke-width="3.2"/>
  <path d="M115 224H205" stroke="#8f9599" stroke-width="2.6" opacity="0.55"/>
  <path d="M115 246H205" stroke="#8f9599" stroke-width="2.2" opacity="0.4"/>

  <!-- twin cooling grilles -->
  <g>
    <rect x="112" y="228" width="34" height="25" rx="2.5"
          fill="#4a5054" stroke="#373c40" stroke-width="2.8"/>
    <rect x="174" y="228" width="34" height="25" rx="2.5"
          fill="#4a5054" stroke="#373c40" stroke-width="2.8"/>
    <g stroke="#798085" stroke-width="2.4" stroke-linecap="round">
      <path d="M118 235H140 M118 241H140 M118 247H140"/>
      <path d="M180 235H202 M180 241H202 M180 247H202"/>
    </g>
  </g>

  <!-- rear access plate -->
  <rect x="147" y="258" width="26" height="23" rx="1.5"
        fill="#787e83" stroke="#4e5459" stroke-width="2.6"/>

  <!-- subtle side deck seams to keep a more technical feel -->
  <path d="M102 145V206" stroke="#5e6469" stroke-width="2.8" opacity="0.55"/>
  <path d="M218 145V206" stroke="#5e6469" stroke-width="2.8" opacity="0.55"/>

  <!-- rear edge highlight -->
  <path d="M108 273H212" stroke="#a8adb1" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
</svg>
