<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支持 WoTBTools</title>
<link rel="icon" type="image/x-icon" href="/icon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/icon.png">
<style>
:root{color-scheme:dark;--surface:rgba(13,19,22,.91);--text:#e9e7e0;--muted:#a8aaa5;--heading:#f6f1e7;--border:#39444a;--accent:#f0a42b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:linear-gradient(rgba(4,8,10,.46),rgba(4,8,10,.76)),url('/sponsor-bg.png') center/cover no-repeat,#080c0f}
.topbar{position:fixed;inset:0 0 auto;z-index:100;height:52px;display:flex;align-items:center;gap:10px;padding:8px 20px;background:rgba(9,14,17,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}
.tb-brand{color:var(--heading);font-weight:800;text-decoration:none}
.tb-back,.lang-select{border:1px solid var(--border);border-radius:7px;background:#11191d;color:#d8d5cd;padding:6px 11px;font:inherit}
.tb-back{cursor:pointer}.tb-back:hover{border-color:var(--accent);color:var(--accent)}.tb-spacer{flex:1}
.page{width:min(980px,calc(100% - 32px));margin:0 auto;padding:96px 0 60px}
.hero{text-align:center;margin-bottom:26px}.eyebrow{color:var(--accent);font-size:.76rem;font-weight:800;letter-spacing:.16em}.hero h1{margin-top:8px;color:var(--heading);font-size:clamp(2rem,5vw,3.4rem)}.hero p{margin:10px auto 0;max-width:680px;color:var(--muted);line-height:1.7}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.9fr);gap:20px}
.card{border:1px solid rgba(217,143,24,.24);border-radius:14px;background:linear-gradient(145deg,rgba(15,21,25,.96),rgba(12,18,21,.89));box-shadow:0 24px 60px rgba(0,0,0,.34);backdrop-filter:blur(12px);padding:26px}.card h2{color:var(--heading);font-size:1.08rem;margin-bottom:14px}.card p{color:var(--muted);line-height:1.72;margin-bottom:12px}.note{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);color:#8f948d;font-size:.86rem;line-height:1.6}
.qr-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.qr-item{text-align:center}.qr-item img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:12px;background:#fff;padding:5px}.qr-item .label{margin-top:8px;color:#c9c5bb;font-size:.84rem}.unconfigured{padding:44px 0;text-align:center;color:var(--muted)}
footer{margin-top:auto;text-align:center;padding:20px;color:#717876;font-size:.78rem}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}
@media(max-width:760px){.topbar{padding-inline:12px}.page{padding-top:78px}.grid{grid-template-columns:1fr}.card{padding:20px}.qr-row{gap:10px}}
</style>
</head>
<body>
<nav class="topbar">
  <button type="button" class="tb-back" id="back-btn" data-i18n="back">返回</button>
  <a class="tb-brand" href="/">WoTBTools</a>
  <div class="tb-spacer"></div>
  <label class="sr-only" for="lang-select" data-i18n="language_label">语言</label>
  <select class="lang-select" id="lang-select"></select>
</nav>
<div class="page">
  <header class="hero">
    <div class="eyebrow">WOTBTOOLS · SUPPORT</div>
    <h1 data-i18n="sponsor_title">支持 WoTBTools</h1>
    <p data-i18n="sponsor_intro">如果这个项目对你有帮助，可以自愿支持服务器与维护成本。</p>
  </header>
  <main class="grid">
    <section class="card">
      <h2 data-i18n="about_title">关于赞助</h2>
      <p data-i18n="sponsor_desc1">WoTBTools 是个人维护的免费工具。如果这个项目帮到了你，可以自愿赞助，用于服务器和维护成本。</p>
      <p data-i18n="sponsor_desc2">赞助完全自愿，不设置固定金额，不影响任何功能使用，也不会解锁额外服务。</p>
      <div class="note" data-i18n="sponsor_note">请勿在付款备注中填写敏感个人信息。</div>
    </section>
    <section class="card">
      <h2 data-i18n="sponsor_qr">扫码赞助</h2>
      <p id="sponsor-unconfigured" class="unconfigured" role="status" data-i18n="sponsor_unconfigured">赞助方式暂未配置</p>
      <div id="sponsor-methods" class="qr-row" hidden></div>
    </section>
  </main>
</div>
<footer>WoTBTools © 2026</footer>
<script id="sponsor-i18n" type="application/json">
{"zh":{"title":"支持 WoTBTools","language_label":"语言","back":"返回","sponsor_title":"支持 WoTBTools","sponsor_intro":"如果这个项目对你有帮助，可以自愿支持服务器与维护成本。","about_title":"关于赞助","sponsor_desc1":"WoTBTools 是个人维护的免费工具。如果这个项目帮到了你，可以自愿赞助，用于服务器和维护成本。","sponsor_desc2":"赞助完全自愿，不设置固定金额，不影响任何功能使用，也不会解锁额外服务。","sponsor_note":"请勿在付款备注中填写敏感个人信息。","sponsor_qr":"扫码赞助","sponsor_unconfigured":"赞助方式暂未配置","sponsor_alipay":"支付宝","sponsor_wechat":"微信支付"},"en":{"title":"Support WoTBTools","language_label":"Language","back":"Back","sponsor_title":"Support WoTBTools","sponsor_intro":"If WoTBTools helps you, you can voluntarily support its server and maintenance costs.","about_title":"About sponsorship","sponsor_desc1":"WoTBTools is a free tool maintained by an individual. Voluntary sponsorship helps cover server and maintenance costs.","sponsor_desc2":"Sponsorship is completely voluntary. It does not unlock features or additional services.","sponsor_note":"Please do not include sensitive personal information in payment notes.","sponsor_qr":"Scan to Sponsor","sponsor_unconfigured":"Sponsorship methods are not configured yet","sponsor_alipay":"Alipay","sponsor_wechat":"WeChat Pay"},"ru":{"title":"Поддержать WoTBTools","language_label":"Язык","back":"Назад","sponsor_title":"Поддержать WoTBTools","sponsor_intro":"Если WoTBTools вам помогает, вы можете добровольно поддержать расходы на сервер и обслуживание.","about_title":"О поддержке","sponsor_desc1":"WoTBTools — бесплатный инструмент, поддерживаемый одним человеком. Добровольная поддержка помогает оплачивать сервер и обслуживание.","sponsor_desc2":"Поддержка полностью добровольная и не открывает дополнительные функции или услуги.","sponsor_note":"Не указывайте конфиденциальные данные в комментариях к платежу.","sponsor_qr":"Сканировать для поддержки","sponsor_unconfigured":"Способы поддержки пока не настроены","sponsor_alipay":"Alipay","sponsor_wechat":"WeChat Pay"}}
</script>
<script type="module">
import { loadSponsorMethods } from '/sponsor-config.js'

const dictionaries = JSON.parse(document.getElementById('sponsor-i18n').textContent)
const languageSelect = document.getElementById('lang-select')
const methodsElement = document.getElementById('sponsor-methods')
const unconfiguredElement = document.getElementById('sponsor-unconfigured')
const failedTypes = new Set()
let activeLanguage = readLanguage()
let sponsorMethods = []

function readLanguage() {
  try {
    const saved = localStorage.getItem('wotb-lang')
    return dictionaries[saved] ? saved : 'zh'
  } catch {
    return 'zh'
  }
}

function saveLanguage(value) {
  try { localStorage.setItem('wotb-lang', value) } catch { /* private/quota mode */ }
}

for (const code of Object.keys(dictionaries)) {
  const option = document.createElement('option')
  option.value = code
  option.textContent = code === 'zh' ? '中文' : code === 'en' ? 'English' : 'Русский'
  languageSelect.append(option)
}

function renderMethods() {
  const dictionary = dictionaries[activeLanguage]
  const visibleMethods = sponsorMethods.filter(method => !failedTypes.has(method.type))
  methodsElement.replaceChildren()

  for (const method of visibleMethods) {
    const item = document.createElement('div')
    item.className = 'qr-item'
    const image = document.createElement('img')
    image.src = method.image
    image.alt = dictionary['sponsor_' + method.type] || method.type
    image.loading = 'lazy'
    image.decoding = 'async'
    image.addEventListener('error', () => {
      failedTypes.add(method.type)
      renderMethods()
    }, { once: true })
    const label = document.createElement('div')
    label.className = 'label'
    label.textContent = dictionary['sponsor_' + method.type] || method.type
    item.append(image, label)
    methodsElement.append(item)
  }

  methodsElement.hidden = visibleMethods.length === 0
  unconfiguredElement.hidden = visibleMethods.length > 0
}

function applyLanguage() {
  const dictionary = dictionaries[activeLanguage]
  document.documentElement.lang = activeLanguage
  document.documentElement.dataset.theme = 'dark'
  languageSelect.value = activeLanguage
  document.title = dictionary.title
  document.querySelectorAll('[data-i18n]').forEach(element => {
    const text = dictionary[element.dataset.i18n]
    if (text) element.textContent = text
  })
  renderMethods()
}

languageSelect.addEventListener('change', () => {
  activeLanguage = dictionaries[languageSelect.value] ? languageSelect.value : 'zh'
  saveLanguage(activeLanguage)
  applyLanguage()
})
document.getElementById('back-btn').addEventListener('click', () => {
  if (window.history.length > 1) window.history.back()
  else window.location.href = '/'
})

sponsorMethods = await loadSponsorMethods()
applyLanguage()
</script>
</body>
</html>
