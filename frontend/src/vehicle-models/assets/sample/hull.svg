<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- sample contract hull — 中性俯视车体，仅验证契约，非真实车型 -->
  <g id="hull">
    <!-- 左右履带轮廓（neutral，不承担阵营色） -->
    <rect x="86" y="60" width="32" height="200" rx="16" fill="#3b403d"/>
    <rect x="202" y="60" width="32" height="200" rx="16" fill="#3b403d"/>
    <!-- 车体主体（neutral tone） -->
    <path d="M118 60 L202 60 L214 104 L214 224 L202 260 L118 260 L106 224 L106 104 Z" fill="#6d736f"/>
    <!-- 前装甲斜面（结构特征 1） -->
    <path d="M118 60 L202 60 L192 100 L128 100 Z" fill="#575d59"/>
    <!-- 后置引擎甲板（结构特征 2） -->
    <path d="M118 214 L202 214 L202 260 L118 260 Z" fill="#616763"/>
    <line x1="124" y1="222" x2="196" y2="222" stroke="#4a4f4c" stroke-width="3"/>
    <line x1="124" y1="236" x2="196" y2="236" stroke="#4a4f4c" stroke-width="3"/>
    <line x1="124" y1="250" x2="196" y2="250" stroke="#4a4f4c" stroke-width="3"/>
  </g>
</svg>
