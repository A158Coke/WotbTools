<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-ui-profile="summer">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/brand/wotbtools-app-icon.svg">
  <meta name="theme-color" content="#191304" />
  <title>WoTBTools</title>
  <style>
    /* 首屏 loader 只保留实际用到的变量；默认值取自已更新为金黄的盛夏主题（tokens/color.css）。
       每个 html[data-ui-profile] 块必须覆盖这 4 个变量，data-ui-profile 由下方脚本投影以避免 FOUC。 */
    :root{color-scheme:dark;--loader-bg:#191304;--loader-accent:#f7bd3c;--loader-text:#d9c7a0;--loader-ring:#4b3a1d}
    html[data-ui-profile="spring"]{--loader-bg:#08140f;--loader-accent:#f2b450;--loader-text:#a6bdb0;--loader-ring:#1f3a2e}
    html[data-ui-profile="summer"]{--loader-bg:#191304;--loader-accent:#f7bd3c;--loader-text:#d9c7a0;--loader-ring:#4b3a1d}
    html[data-ui-profile="autumn"]{--loader-bg:#160f08;--loader-accent:#ef8434;--loader-text:#d0bb9a;--loader-ring:#3d2c19}
    html[data-ui-profile="winter"]{color-scheme:light;--loader-bg:#eef3f8;--loader-accent:#1f6fd1;--loader-text:#3b5470;--loader-ring:#cbd8e6}
    /* 字体栈与 --type-body 同值，index.html 不能引用 token，所以写死。 */
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--loader-text);background:var(--loader-bg)}
    #app:has(.app-loader){display:flex;align-items:center;justify-content:center;min-height:100vh}
    .app-loader{display:flex;flex-direction:column;align-items:center;gap:16px}
    /* 与 src/app/ViewLoadingState.vue 的 .view-loading-spinner 同款：单层环，底色环 + 顶部强调色弧，线性匀速。 */
    .app-loader-spinner {
      display: block;
      box-sizing: border-box;
      width: 32px;
      height: 32px;
      border: 3px solid var(--loader-ring);
      border-block-start-color: var(--loader-accent);
      border-radius: 50%;
      corner-shape: round;
      animation: app-loader-spin 0.9s linear infinite;
    }
    @keyframes app-loader-spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){.app-loader-spinner{animation:none}}
    /* 次要文字色 + 与 --type-body 一致的 400 14px/20px。 */
    .loader-text{color:var(--loader-text);font-size:14px;font-weight:400;line-height:20px}
  </style>
  <script>
    (function () {
      // 首屏防 FOUC：在任何渲染前按 localStorage 投影 html[data-ui-profile] / data-theme / theme-color。
      // 与 src/composables/useUiProfile.js 的 key / 合法值 / 旧值映射 / 默认保持一致。
      var colors = { spring: '#08140f', summer: '#191304', autumn: '#160f08', winter: '#eef3f8' }
      var p = 'summer'
      try {
        var stored = localStorage.getItem('wotb-ui-profile')
        if (colors[stored]) p = stored
        else if (stored === 'showcase' || stored === 'classic' || stored === 'auto') localStorage.setItem('wotb-ui-profile', 'summer')
      } catch (e) {}
      document.documentElement.setAttribute('data-ui-profile', p)
      document.documentElement.setAttribute('data-theme', p === 'winter' ? 'light' : 'dark')
      var meta = document.querySelector('meta[name="theme-color"]')
      if (meta) meta.setAttribute('content', colors[p])
    })()
  </script>
</head>
<body>
  <div id="app">
    <div class="app-loader">
      <span class="app-loader-spinner" aria-hidden="true"></span>
      <span class="loader-text">WoTBTools</span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
