// Model definitions protobuf schema（BlitzKit 官方：packages/core/src/protos/model_definitions.proto）。
// 仅提取 extractor 需要的消息；字段号与 BlitzKit protoc 生成一致（勿改）。
syntax = "proto2";

package blitzkit;

message ModelDefinitions {
  map<uint32, ModelDefinition> models = 1;
}

message ModelDefinition {
  optional Armor                     armor                   = 1;
  optional Vector3                   turret_origin           = 2;
  optional InitialTurretRotation     initial_turret_rotation = 3;
  map<uint32, TurretModelDefinition> turrets                 = 4;
  map<uint32, TrackModelDefinition>  tracks                  = 5;
  optional BoundingBox               bounding_box            = 6;
}

message Armor {
  map<uint32, float> thickness = 1;
  repeated uint32    spaced    = 2;
}

message Vector3 {
  optional float x = 1;
  optional float y = 2;
  optional float z = 3;
}

message InitialTurretRotation {
  optional float yaw   = 1;
  optional float pitch = 2;
  optional float roll  = 3;
}

message TurretModelDefinition {
  optional BoundingBox            bounding_box = 1;
  optional Armor                  armor        = 2;
  optional uint32                 model_id     = 3;
  optional Vector3                gun_origin   = 4;
  map<uint32, GunModelDefinition> guns         = 5;
  optional YawLimits              yaw          = 6;
}

message YawLimits {
  optional float min = 1;
  optional float max = 2;
}

message BoundingBox {
  optional Vector3 min = 1;
  optional Vector3 max = 2;
}

message TrackModelDefinition {
  optional float   thickness = 1;
  optional Vector3 origin    = 2;
}

message GunModelDefinition {
  optional Armor       armor     = 1;
  optional float       thickness = 2;
  optional uint32      model_id  = 3;
  optional PitchLimits pitch     = 4;
  optional float       mask      = 5;
}

message PitchLimits {
  optional float              min        = 1;
  optional float              max        = 2;
  optional PitchLimitsExtrema front      = 3;
  optional PitchLimitsExtrema back       = 4;
  optional float              transition = 5;
}

message PitchLimitsExtrema {
  optional float min   = 1;
  optional float max   = 2;
  optional float range = 3;
}
