<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-ui-profile="summer">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><title>Replay3D HUD SegmentedControl 夹具</title></head>
<body>
<!-- #827 replay3d-hud-layout 门禁夹具：canonical SegmentedControl 在受限宽度容器里
     以 scrollable 单行模式渲染（Replay3DPane / ReplayCapabilityTabs 的 HUD 选项条同一组件）。
     布局几何（flex:none 不收缩、横向滚动、coarse 命中面积）由真实 computed style 验证。 -->
<div id="app"></div>
<script type="module">
  import { createApp, h, ref } from 'vue'
  import '../../src/styles/tokens/scale.css'
  import '../../src/styles/tokens/color.css'
  import '../../src/styles/tokens.css'
  import SegmentedControl from '../../src/components/SegmentedControl.vue'

  const options = Array.from({ length: 8 }, (_, index) => ({
    value: `cam-${index}`,
    label: `镜头 ${index + 1}`,
    testid: `hud-cam-${index}`,
  }))
  const model = ref('cam-0')
  createApp({
    setup: () => () => h('main', { style: { padding: '8px' }, 'data-testid': 'replay3d-hud-fixture' }, [
      // 受限宽度容器：强制单行溢出，flex 压缩与横向滚动在真实约束下才可观察。
      h('div', { style: { width: '240px', border: '1px solid var(--color-border-subtle)' } }, [
        h(SegmentedControl, {
          modelValue: model.value,
          options,
          ariaLabel: 'HUD 镜头切换',
          scrollable: true,
          'onUpdate:modelValue': value => { model.value = value },
        }),
      ]),
    ]),
  }).mount('#app')
</script>
</body>
</html>
